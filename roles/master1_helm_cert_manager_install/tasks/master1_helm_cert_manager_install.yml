---
- name: Add Rancher Helm repository
  command: helm repo add rancher-stable https://releases.rancher.com/server-charts/stable --force-update

# "kubectl create" su un namespace che c'e' gia' esce 1 con AlreadyExists, e
# senza questo il secondo run del playbook si fermava qui. Non si usa
# "kubectl apply" perche' un apply su un namespace creato in modo imperativo
# lascia un warning sulla annotazione last-applied-configuration mancante.
- name: Create cattle-system namespace
  command: kubectl create namespace cattle-system
  register: cattle_ns
  changed_when: cattle_ns.rc == 0
  failed_when:
    - cattle_ns.rc != 0
    - "'AlreadyExists' not in (cattle_ns.stderr | default(''))"

- name: Update Helm repositories
  command: helm repo update

- name: Set kube permission
  command: chmod 600 /root/.kube/config

- name: Copy fullchain.pem to remote host
  copy:
    src: "{{ fullchain_pem_file }}"
    dest: "{{ remote_cert_path }}/fullchain.pem"
    mode: '0644'

- name: Copy privkey.pem to remote host
  copy:
    src: "{{ privkey_pem_file }}"
    dest: "{{ remote_cert_path }}/privkey.pem"
    mode: '0600'

- name: Copy cacerts.pem to remote host
  copy:
    src: "{{ cacerts_pem_file }}"
    dest: "{{ remote_cert_path }}/cacerts.pem"
    mode: '0644'

# "create --dry-run=client -o yaml | apply -f -" invece di "create" e basta:
# create fallisce con AlreadyExists al secondo run, mentre questa forma crea il
# secret se manca e lo AGGIORNA se i .pem sono cambiati. E' l'unico modo per
# far arrivare un certificato rinnovato senza cancellare il secret a mano.
#
# Al primo apply su un secret nato imperativamente kubectl avvisa che manca
# l'annotazione last-applied-configuration e lo corregge da solo: succede una
# volta sola, sui cluster gia' installati prima di questa modifica.
- name: Create TLS secret for Rancher ingress
  shell: >-
    set -o pipefail;
    kubectl -n cattle-system create secret tls tls-rancher-ingress
    --cert={{ remote_cert_path }}/fullchain.pem
    --key={{ remote_cert_path }}/privkey.pem
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: tls_rancher_ingress
  changed_when: "'unchanged' not in (tls_rancher_ingress.stdout | default(''))"

- name: Create CA secret for Rancher
  shell: >-
    set -o pipefail;
    kubectl -n cattle-system create secret generic tls-ca
    --from-file={{ remote_cert_path }}/cacerts.pem
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: tls_ca
  changed_when: "'unchanged' not in (tls_ca.stdout | default(''))"

- name: Verify secrets creation
  command: kubectl get secret -n cattle-system

# Serve a due cose: decidere se questo run e' una prima installazione (e quindi
# se il task sotto va contato come changed) e, soprattutto, se passare
# bootstrapPassword. Quella password vale solo al primo avvio, quando l'utente
# admin non ha ancora fatto il setup: ripassarla a ogni upgrade non ha motivo e
# la rimetterebbe sulla riga di comando di helm per niente.
- name: Verifica se il release Rancher esiste gia'
  command: helm status rancher --namespace cattle-system
  register: rancher_release
  changed_when: false
  failed_when: false

# "upgrade --install" invece di "install": install fallisce con
# "cannot re-use a name that is still in use" al secondo run. upgrade --install
# installa se il release non c'e' e riconcilia se qualche valore e' cambiato.
# La versione resta fissata da rancher_version, quindi rilanciare il playbook
# non fa saltare Rancher a una release nuova.
# "--set ingress.ingressClassName" SOLO SE SI E' SCELTO L'INGRESS, e derivato
# dalla stessa variabile che lo sceglie (rancher_ingress_class deriva da
# rke2_ingress_controller in group_vars/all.yml). Le due cose non possono
# divergere, e prima divergevano: la riga c'era sempre e chiedeva la classe
# "traefik" a un cluster dove l'ingress controller era rke2-ingress-nginx.
# L'Ingress veniva creato e non lo serviva nessuno — console muta.
#
# Con la variabile vuota (default) la riga non c'e' e il chart crea l'Ingress
# senza classe esplicita: lo prende la IngressClass di default. E' la
# configurazione con cui la console risponde adesso.
- name: Install Rancher with Helm
  command: >
    helm upgrade --install rancher rancher-stable/rancher
    --namespace cattle-system
    --set hostname={{ rancher_domain }}
    {% if rancher_release.rc != 0 %}--set bootstrapPassword={{ rancher_password }}{% endif %}
    --version {{ rancher_version }}
    --set replicas={{ rancher_replicas }}
    --set ingress.tls.source=secret
    {% if rancher_ingress_class | default('') | trim | length > 0 %}--set ingress.ingressClassName={{ rancher_ingress_class | trim }}{% endif %}
    --set privateCA=true
    --set startupProbe.timeoutSeconds={{ rancher_startup_probe_timeout_seconds }}
    --set startupProbe.periodSeconds={{ rancher_startup_probe_period_seconds }}
    --set startupProbe.failureThreshold={{ rancher_startup_probe_failure_threshold }}
    --set livenessProbe.timeoutSeconds={{ rancher_liveness_probe_timeout_seconds }}
    --set livenessProbe.periodSeconds={{ rancher_liveness_probe_period_seconds }}
    --set livenessProbe.failureThreshold={{ rancher_liveness_probe_failure_threshold }}
    --set readinessProbe.timeoutSeconds={{ rancher_readiness_probe_timeout_seconds }}
    --set readinessProbe.periodSeconds={{ rancher_readiness_probe_period_seconds }}
    --set readinessProbe.failureThreshold={{ rancher_readiness_probe_failure_threshold }}
    {% for helm_set in rancher_extra_helm_set | default([]) %}
    --set {{ helm_set }}
    {% endfor %}
  register: rancher_helm
  changed_when: >-
    rancher_release.rc != 0
    or ('has been upgraded' in (rancher_helm.stdout | default('')))
  # bootstrapPassword finirebbe in chiaro in ansible.log, che ansible.cfg
  # scrive sempre. Per vedere l'output durante una diagnosi:
  #   -e rancher_hide_secrets=false
  no_log: "{{ rancher_hide_secrets | bool }}"

- name: Wait for Rancher to be ready
  block:
    # Si aspetta il deployment, non i pod scelti una volta sola dal selector:
    # durante un upgrade possono esistere pod vecchi in terminazione, mentre il
    # deployment e' l'oggetto che dice se Rancher ha davvero completato il
    # rollout. Se non diventa disponibile ci si ferma qui, perche' la fase
    # successiva parlerebbe con l'API Rancher e cadrebbe con un 503 generico.
    - name: Attendi il rollout del deployment Rancher
      command: >-
        kubectl -n cattle-system rollout status deployment/rancher
        --timeout={{ rancher_ready_timeout }}
      register: rancher_rollout
      changed_when: false

  rescue:
    - name: Diagnostica deployment Rancher
      shell: |
        set -o pipefail
        echo "### DEPLOYMENT ###"
        kubectl -n cattle-system get deployment rancher -o wide 2>&1 || true
        echo
        echo "### REPLICASET ###"
        kubectl -n cattle-system get rs -l app=rancher -o wide 2>&1 || true
        echo
        echo "### POD ###"
        kubectl -n cattle-system get pods -l app=rancher -o wide 2>&1 || true
        echo
        echo "### SERVICE / ENDPOINT ###"
        kubectl -n cattle-system get svc rancher -o wide 2>&1 || true
        kubectl -n cattle-system get endpoints rancher -o wide 2>&1 || true
        echo
        echo "### INGRESS / INGRESSCLASS ###"
        kubectl -n cattle-system get ingress rancher -o wide 2>&1 || true
        kubectl get ingressclass 2>&1 || true
        echo
        echo "### EVENTI CATTLE-SYSTEM ###"
        kubectl -n cattle-system get events --sort-by=.lastTimestamp 2>&1 | tail -80 || true
        echo
        echo "### DESCRIBE POD RANCHER ###"
        kubectl -n cattle-system describe pods -l app=rancher 2>&1 || true
      args:
        executable: /bin/bash
      register: rancher_diagnostics
      changed_when: false
      failed_when: false

    - name: Log dei pod Rancher
      shell: |
        set -o pipefail
        for pod in $(kubectl -n cattle-system get pods -l app=rancher -o name 2>/dev/null); do
          echo "### ${pod}: log corrente ###"
          kubectl -n cattle-system logs "$pod" --all-containers=true --tail={{ rancher_diag_log_tail }} 2>&1 || true
          echo
          echo "### ${pod}: log precedente ###"
          kubectl -n cattle-system logs "$pod" --previous --all-containers=true --tail={{ rancher_diag_log_tail }} 2>&1 || true
          echo
        done
      args:
        executable: /bin/bash
      register: rancher_logs
      changed_when: false
      failed_when: false

    - name: Fermati spiegando perche' Rancher non e' pronto
      fail:
        msg: |
          Rancher non e' diventato disponibile entro {{ rancher_ready_timeout }}.

          Questo e' il punto in cui il playbook deve fermarsi: se prosegue, le
          chiamate del ruolo master1_create_cluster arrivano a un Rancher non
          pronto e falliscono con "HTTP Error 503: Service Unavailable".

          Stato Kubernetes:
          {{ rancher_diagnostics.stdout | default('(diagnostica non disponibile)') }}

          Log Rancher:
          {{ rancher_logs.stdout | default('(log non disponibili)') }}

- name: Check Rancher pod status
  command: kubectl -n cattle-system get pods -l app=rancher
  register: rancher_pods

- name: Display Rancher pod status
  debug:
    var: rancher_pods.stdout_lines

- name: Check Rancher service status
  command: kubectl -n cattle-system get svc rancher
  register: rancher_svc

- name: Display Rancher service status
  debug:
    var: rancher_svc.stdout_lines

