---
# Fallback usato solo se helm_version non e' definita altrove.
# group_vars/all.yml ha precedenza maggiore e normalmente sovrascrive
# questo valore. NON scrivere qui helm_version: "{{ helm_version }}":
# e' un riferimento circolare e Ansible lo risolve come recursive loop.
helm_version: "v3.11.0"

# Numero di repliche del deployment Rancher. Con tre master il valore normale e'
# 3; su VM piccole si puo' rilanciare con "-e rancher_replicas=1" per far
# partire il laboratorio senza moltiplicare per tre il carico di bootstrap.
rancher_replicas: "{{ [groups['masters'] | default([]) | length, 1] | max }}"

# Quanto aspettare che il deployment Rancher diventi disponibile dopo
# helm upgrade --install. Il primo avvio applica molte CRD e, su VM piccole,
# puo' metterci parecchio piu' dei due minuti previsti dalle probe del chart.
rancher_ready_timeout: "30m"

# Probe piu' pazienti dei default del chart Rancher. Non curano una VM senza
# memoria, ma evitano che kubelet uccida Rancher mentre sta ancora applicando
# CRD e popolando cache su macchine lente.
rancher_startup_probe_timeout_seconds: 10
rancher_startup_probe_period_seconds: 10
rancher_startup_probe_failure_threshold: 60
rancher_liveness_probe_timeout_seconds: 10
rancher_liveness_probe_period_seconds: 30
rancher_liveness_probe_failure_threshold: 10
rancher_readiness_probe_timeout_seconds: 10
rancher_readiness_probe_period_seconds: 30
rancher_readiness_probe_failure_threshold: 10

# Set Helm aggiuntivi, nella forma "chiave=valore". Esempio:
#   rancher_extra_helm_set:
#     - useBundledSystemChart=true
rancher_extra_helm_set: []

# Numero di righe di log da mostrare per ogni pod Rancher quando il rollout non
# diventa pronto.
rancher_diag_log_tail: 160
