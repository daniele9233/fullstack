---
# Stampa la scheda del nodo.
#
# Il template viene reso con lookup e non con il modulo template di proposito:
# il modulo scriverebbe un file sul nodo, e questa verifica non deve lasciare
# tracce da nessuna parte. Cosi' la scheda esiste solo a video.
#
# msg riceve una LISTA di righe e non un testo unico: il callback predefinito
# di Ansible stampa le liste una riga per elemento, mentre di una stringa con
# gli a capo dentro mostrerebbe i \n scritti per esteso.

- name: "Scheda di verifica: {{ inventory_hostname }}"
  debug:
    msg: >-
      {{ lookup('template', 'scheda_host.j2').splitlines()
         | map('regex_replace', '\s+$', '') | list }}
