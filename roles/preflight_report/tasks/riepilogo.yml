---
# Riepilogo finale: una riga per nodo e l'elenco di quello che va sistemato.
#
# Gira sul control node, in un play a parte, per un motivo preciso: i nodi che
# Ansible NON e' riuscito a raggiungere escono dal play, e con run_once non
# comparirebbero da nessuna parte. Qui l'elenco arriva da pf_nodi_verificati,
# che il play dei nodi ha riempito con ansible_play_hosts_all, quindi ci sono
# anche loro, ed e' proprio quello che si vuole vedere per primo.

- name: Escludi dal riepilogo i gruppi che non sono nodi
  set_fact:
    pf_nodi_esclusi: "{{ (pf_nodi_esclusi | default([])) + (groups[item] | default([])) }}"
  loop: "{{ pf_gruppi_esclusi }}"

# Il ripiego sull'inventario intero serve al caso limite in cui NESSUN nodo ha
# risposto: li' il play dei nodi non ha potuto scrivere pf_nodi_verificati, e
# senza ripiego il riepilogo uscirebbe vuoto proprio quando serve di piu'.
- name: Elenca i nodi che entrano nel riepilogo
  set_fact:
    pf_nodi_riepilogo: >-
      {{ (pf_nodi_verificati | default(groups['all'] | default([])))
         | difference(pf_nodi_esclusi | default([])) | sort }}

- name: Riepilogo della verifica
  debug:
    msg: >-
      {{ lookup('template', 'riepilogo.j2').splitlines()
         | map('regex_replace', '\s+$', '') | list }}

# --- Barriera facoltativa ---------------------------------------------------
# Il playbook di verifica non fallisce mai, se non glielo si chiede: e' una
# fotografia, non un cancello. Con -e pf_blocca_se_problemi=true diventa una
# barriera da mettere davanti a un'installazione non sorvegliata.

- name: Conta i nodi non raggiunti e quelli con problemi bloccanti
  set_fact:
    pf_nodi_non_raggiunti: >-
      {{ (pf_nodi_non_raggiunti | default([]))
         + ([item] if (hostvars[item].pf_righe | default([]) | length) == 0 else []) }}
    pf_nodi_con_problemi: >-
      {{ (pf_nodi_con_problemi | default([]))
         + ([item] if (hostvars[item].pf_righe | default([])
                       | selectattr('esito', 'equalto', 'PROBLEMA')
                       | list | length) > 0 else []) }}
  loop: "{{ pf_nodi_riepilogo }}"
  when: pf_blocca_se_problemi | bool

- name: Fermati se qualche nodo non e' pronto
  assert:
    that:
      - (pf_nodi_non_raggiunti | default([])) | length == 0
      - (pf_nodi_con_problemi | default([])) | length == 0
    fail_msg: >-
      Verifica non superata.
      Nodi non raggiunti: {{ (pf_nodi_non_raggiunti | default([])) | join(', ') | default('nessuno', true) }}.
      Nodi con problemi bloccanti: {{ (pf_nodi_con_problemi | default([])) | join(', ') | default('nessuno', true) }}.
      Il dettaglio e' nel riepilogo qui sopra.
    success_msg: "Verifica superata: nessun nodo con problemi bloccanti."
  when: pf_blocca_se_problemi | bool
