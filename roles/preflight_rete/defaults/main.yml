---
# ---------------------------------------------------------------------------
# PORTE CHE I RUOLI SI ASPETTANO DI POTER APRIRE
# ---------------------------------------------------------------------------
# Per ogni gruppo, le porte su cui l'installazione mettera' un servizio in
# ascolto. Il controllo e' semplice: se la porta e' gia' occupata da un
# processo DIVERSO da quello atteso, l'installazione fallira' li'.
#
# I numeri non sono ricopiati a mano dove esiste gia' una variabile: sono presi
# da group_vars/all.yml, cosi' cambiando la porta di haproxy o del supervisor
# RKE2 il controllo la segue da solo. Il default fra parentesi serve solo a far
# girare il ruolo anche fuori da questo repository.
#
#   atteso  nomi di processo che possono legittimamente tenere quella porta:
#           se c'e' uno di loro, il servizio e' semplicemente gia' installato,
#           e non e' un conflitto.
pf_porte_attese:
  masters: &porte_rke2_server
    - porta: "{{ rke2_supervisor_port | default(9345) }}"
      proto: tcp
      servizio: "supervisor RKE2 (registrazione dei server)"
      atteso: [rke2, rke2-server]
    - porta: 6443
      proto: tcp
      servizio: "API server Kubernetes"
      atteso: [kube-apiserver, rke2, rke2-server]
    - porta: 2379
      proto: tcp
      servizio: "etcd, client"
      atteso: [etcd]
    - porta: 2380
      proto: tcp
      servizio: "etcd, peer"
      atteso: [etcd]
    - porta: 10250
      proto: tcp
      servizio: "kubelet"
      atteso: [kubelet, rke2, rke2-server]

  new_managers: *porte_rke2_server

  workers:
    - porta: 10250
      proto: tcp
      servizio: "kubelet"
      atteso: [kubelet, rke2, rke2-agent]

  ingress:
    - porta: 10250
      proto: tcp
      servizio: "kubelet"
      atteso: [kubelet, rke2, rke2-agent]
    - porta: "{{ traefik_host_http_port | default(80) }}"
      proto: tcp
      servizio: "Traefik, hostPort http"
      atteso: [traefik]
    - porta: "{{ traefik_host_https_port | default(443) }}"
      proto: tcp
      servizio: "Traefik, hostPort https"
      atteso: [traefik]

  nginx_servers:
    - porta: 80
      proto: tcp
      servizio: "nginx, redirect verso https"
      atteso: [nginx]
    - porta: "{{ rancher_https_port | default(443) }}"
      proto: tcp
      servizio: "nginx, console Rancher e servizi"
      atteso: [nginx]
    - porta: "{{ haproxy_stats_port | default(7000) }}"
      proto: tcp
      servizio: "statistiche haproxy"
      atteso: [haproxy]
    - porta: "{{ haproxy_primary_port | default(5000) }}"
      proto: tcp
      servizio: "haproxy verso il primario PostgreSQL"
      atteso: [haproxy]
    - porta: "{{ haproxy_standby_port | default(5001) }}"
      proto: tcp
      servizio: "haproxy verso gli standby PostgreSQL"
      atteso: [haproxy]

  db_servers:
    - porta: 5432
      proto: tcp
      servizio: "PostgreSQL"
      atteso: [postgres, postmaster]
    - porta: "{{ haproxy_patroni_api_port | default(8008) }}"
      proto: tcp
      servizio: "API REST di Patroni (health check di haproxy)"
      atteso: [patroni, python3]
    - porta: 2379
      proto: tcp
      servizio: "etcd, client"
      atteso: [etcd]
    - porta: 2380
      proto: tcp
      servizio: "etcd, peer"
      atteso: [etcd]
    - porta: "{{ haproxy_backend_port | default(6432) }}"
      proto: tcp
      servizio: "PgBouncer"
      atteso: [pgbouncer]

  gluster_servers:
    - porta: 24007
      proto: tcp
      servizio: "glusterd"
      atteso: [glusterd, glusterfsd]
    - porta: 111
      proto: tcp
      servizio: "rpcbind"
      atteso: [rpcbind, systemd]
    - porta: 2049
      proto: tcp
      servizio: "NFS servito da Ganesha"
      atteso: [ganesha.nfsd]
    - porta: 875
      proto: tcp
      servizio: "rquota di Ganesha"
      atteso: [ganesha.nfsd]
    - porta: 2224
      proto: tcp
      servizio: "pcsd, gestione del cluster Pacemaker"
      atteso: [pcsd, ruby, python3]
    - porta: 3121
      proto: tcp
      servizio: "Pacemaker remoto"
      atteso: [pacemaker-remoted, pacemakerd]
    - porta: 5405
      proto: udp
      servizio: "Corosync"
      atteso: [corosync]

# ---------------------------------------------------------------------------
# CHI DEVE RAGGIUNGERE CHI
# ---------------------------------------------------------------------------
# Per ogni gruppo, i gruppi con cui deve poter parlare. La prova si fa sulla
# porta 22 e con un ping, non sulle porte dei servizi: prima di installare quei
# servizi non esistono, quindi una porta chiusa non direbbe niente. Quello che
# si sta verificando e' che la strada fra i nodi sia aperta.
pf_raggiungibilita:
  masters:         [masters]
  new_managers:    [new_managers, masters]
  workers:         [new_managers]
  ingress:         [new_managers]
  nginx_servers:   [nginx_servers, masters, ingress, db_servers]
  db_servers:      [db_servers]
  gluster_servers: [gluster_servers]

# ---------------------------------------------------------------------------
# VIP CHE DEVONO ESSERE LIBERI
# ---------------------------------------------------------------------------
# Un VIP che risponde PRIMA di installare vuol dire che l'indirizzo e' gia' di
# qualcun altro: keepalived e Pacemaker lo prenderebbero comunque, e due
# macchine con lo stesso indirizzo sulla stessa VLAN si tolgono il traffico a
# vicenda. Se invece l'infrastruttura e' gia' installata, e' normale che
# risponda, e il controllo dice anche su quale nodo si trova.
pf_vip_attesi:
  nginx_servers:
    - indirizzo: "{{ vip_rancher_ip | default('') }}"
      a_cosa_serve: "VIP della console Rancher, tenuto da nginx"
    - indirizzo: "{{ vip_patroni_ip | default('') }}"
      a_cosa_serve: "VIP di Patroni/PgBouncer, tenuto da haproxy"
  gluster_servers:
    - indirizzo: "{{ nfs_vip_ip | default('') }}"
      a_cosa_serve: "VIP NFS, gestito da Pacemaker"

# ---------------------------------------------------------------------------
# ENDPOINT ESTERNI
# ---------------------------------------------------------------------------
# Da dove i ruoli scaricano quello che installano. Sono i punti in cui un
# playbook si ferma a meta' su una rete chiusa, ed e' la cosa piu' scomoda da
# scoprire a installazione avviata.
pf_endpoint_esterni:
  - { host: get.rke2.io,          porta: 443, a_cosa_serve: "installer RKE2" }
  - { host: github.com,           porta: 443, a_cosa_serve: "rilasci RKE2 e chart" }
  - { host: get.helm.sh,          porta: 443, a_cosa_serve: "binario di Helm" }
  - { host: releases.rancher.com, porta: 443, a_cosa_serve: "chart di Rancher" }
  - { host: charts.jetstack.io,   porta: 443, a_cosa_serve: "chart di cert-manager" }
  - { host: traefik.github.io,    porta: 443, a_cosa_serve: "chart di Traefik" }
  - { host: repo.percona.com,     porta: 443, a_cosa_serve: "PostgreSQL, Patroni ed etcd" }
  - { host: archive.ubuntu.com,   porta: 80,  a_cosa_serve: "pacchetti Ubuntu" }
  - { host: security.ubuntu.com,  porta: 80,  a_cosa_serve: "aggiornamenti di sicurezza" }

# Secondi di attesa per ogni prova TCP. Basso di proposito: le prove sono
# molte, e su una rete chiusa si vuole una risposta rapida, non un playbook
# fermo per minuti.
pf_timeout_tcp: 4

# Con false le prove verso internet non vengono fatte. Su una rete chiusa, dove
# i pacchetti arrivano da un mirror interno, sono nove attese inutili per nodo:
#   ansible-playbook playbooks/00-verifica.yml -e pf_verifica_endpoint=false
pf_verifica_endpoint: true
