---
# Rete: interfacce, porte gia' occupate, VIP, raggiungibilita' fra i nodi,
# uscita verso i repository, risoluzione dei nomi.
#
# SOLO LETTURA. Le prove di collegamento aprono una connessione TCP e la
# chiudono subito: non spediscono dati, non scrivono niente, non toccano la
# configurazione di rete del nodo.

# --- Che cosa e' gia' in ascolto -------------------------------------------
# ss al posto di netstat: e' quello presente di serie su Ubuntu. -p richiede i
# privilegi di root per vedere il nome del processo, e il playbook gira con
# become, quindi c'e'.
- name: Leggi le porte gia' in ascolto
  shell: |
    ss -Hlntup 2>/dev/null | while read -r netid stato rq sq locale resto; do
      porta=${locale##*:}
      processo=$(printf '%s' "$resto" | sed -n 's/.*users:(("\([^"]*\)".*/\1/p')
      printf '%s:%s:%s\n' "$netid" "$porta" "${processo:-sconosciuto}"
    done | sort -u
  args:
    executable: /bin/bash
  register: pf_ascolto
  changed_when: false
  failed_when: false

- name: Leggi le interfacce di rete
  command: ip -br addr
  register: pf_interfacce
  changed_when: false
  failed_when: false

- name: Leggi la tabella di instradamento predefinita
  command: ip route show default
  register: pf_rotta
  changed_when: false
  failed_when: false

# --- Porte attese dai ruoli di questo nodo ---------------------------------

- name: Componi l'elenco delle porte attese per i gruppi di questo nodo
  set_fact:
    pf_porte_host: "{{ (pf_porte_host | default([])) + pf_porte_attese[item] }}"
  loop: "{{ group_names }}"
  when: item in pf_porte_attese

- name: Valuta una per una le porte attese
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  loop: "{{ pf_porte_host | default([]) | unique }}"
  loop_control:
    label: "{{ item.porta }}/{{ item.proto }}"
  vars:
    # Le righe lette da ss hanno la forma  proto:porta:processo
    occupanti: >-
      {{ pf_ascolto.stdout_lines
         | select('match', '^' ~ item.proto ~ ':' ~ item.porta ~ ':')
         | map('regex_replace', '^[^:]+:[^:]+:', '')
         | unique | list }}
    atteso: "{{ occupanti | intersect(item.atteso) | length > 0 }}"
    riga:
      sezione: PORTE
      voce: "{{ item.porta }}/{{ item.proto }}"
      valore: >-
        {{ item.servizio }} -
        {{ 'libera' if occupanti | length == 0
           else ("gia' in ascolto: " ~ occupanti | join(', ')) }}
      esito: >-
        {{ 'OK' if occupanti | length == 0
           else ('INFO' if atteso | bool else 'PROBLEMA') }}
      nota: >-
        la porta e' tenuta da {{ occupanti | join(', ') }}, che non e' il
        servizio atteso ({{ item.atteso | join(', ') }}): l'installazione
        fallira' al primo avvio. Ferma quel processo o cambia la porta nelle
        variabili.

# --- VIP --------------------------------------------------------------------

- name: Componi l'elenco dei VIP da verificare da questo nodo
  set_fact:
    pf_vip_host: "{{ (pf_vip_host | default([])) + pf_vip_attesi[item] }}"
  loop: "{{ group_names }}"
  when: item in pf_vip_attesi

# Tre domande. L'indirizzo e' sulla RETE di questo nodo? risponde gia' qualcuno?
# e, se risponde, e' questo nodo stesso?
#
# La prima e' quella che si sbaglia piu' spesso e la piu' silenziosa. Con un
# /28 la rete e' di sedici indirizzi, non di duecentocinquantasei: nodi in
# 10.205.166.208/28 (da .209 a .222) e VIP a .253 sembrano vicini guardando il
# terzo ottetto, ma sono due reti diverse. keepalived assegna comunque
# l'indirizzo e non protesta, mentre IPaddr2 di Pacemaker rifiuta di partire con
# "[findif] failed", che non spiega niente.
#
# "ip route get" risponde senza fare aritmetica: se l'indirizzo e' sulla rete
# locale la strada e' diretta, altrimenti nella risposta compare " via " e passa
# dal gateway.
#
# Le altre due distinguono un VIP gia' in uso da uno legittimamente presente:
# un VIP che risponde da qui e' keepalived o Pacemaker gia' installato, un VIP
# che risponde da altrove e' un indirizzo di qualcun altro.
- name: "Verifica dei VIP: rete, risposta, presenza locale"
  shell: |
    set +e
    {% for v in (pf_vip_host | default([])) | rejectattr('indirizzo', 'equalto', '') %}
    if ping -c 1 -W 1 {{ v.indirizzo | quote }} >/dev/null 2>&1; then risponde=si; else risponde=no; fi
    if ip -o addr show 2>/dev/null | grep -qw {{ v.indirizzo | quote }}; then locale=si; else locale=no; fi
    rotta=$(ip route get {{ v.indirizzo | quote }} 2>/dev/null | head -1)
    if [ -z "$rotta" ]; then stessarete=no; elif echo "$rotta" | grep -q " via "; then stessarete=no; else stessarete=si; fi
    echo "{{ v.indirizzo }}|$risponde|$locale|$stessarete|{{ v.a_cosa_serve }}"
    {% endfor %}
  args:
    executable: /bin/bash
  register: pf_vip_esito
  changed_when: false
  failed_when: false
  when: (pf_vip_host | default([])) | rejectattr('indirizzo', 'equalto', '') | list | length > 0

- name: Valuta i VIP
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  loop: "{{ pf_vip_esito.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split('|')[0] }}"
  vars:
    campi: "{{ item.split('|') }}"
    risponde: "{{ campi[1] == 'si' }}"
    locale: "{{ campi[2] == 'si' }}"
    stessa_rete: "{{ campi[3] == 'si' }}"
    riga:
      sezione: RETE
      voce: "VIP {{ campi[0] }}"
      valore: >-
        {{ campi[4] }} -
        {{ "NON e' sulla rete di questo nodo" if not stessa_rete | bool
           else ('libero, non risponde nessuno' if not risponde | bool
                 else ("risponde, ed e' gia' su questo nodo" if locale | bool
                       else 'RISPONDE da un altro nodo')) }}
      esito: >-
        {{ 'PROBLEMA' if not stessa_rete | bool
           else ('OK' if not risponde | bool
                 else ('INFO' if locale | bool else 'ATTENZIONE')) }}
      nota: >-
        {{ "il VIP non appartiene a nessuna rete configurata sulle interfacce del
            nodo: per raggiungerlo si passa dal gateway. keepalived se lo prende
            lo stesso e nessuno se ne accorge, Pacemaker invece non avvia la
            risorsa e lascia solo [findif] failed. Con un /28 la rete e' di
            sedici indirizzi: controlla con ip -br addr e scegli un indirizzo
            libero dentro a quella dei nodi."
           if not stessa_rete | bool
           else "l'indirizzo risponde ma non e' su questo nodo. Se
                 l'infrastruttura e' gia' installata e' normale, lo tiene
                 l'altro nodo; altrimenti l'indirizzo e' di qualcun altro e va
                 cambiato, perche' due macchine con lo stesso IP sulla stessa
                 VLAN si tolgono il traffico a vicenda." }}

# --- Raggiungibilita' fra i nodi -------------------------------------------

- name: Componi i gruppi che questo nodo deve raggiungere
  set_fact:
    pf_gruppi_peer: "{{ (pf_gruppi_peer | default([])) + pf_raggiungibilita[item] }}"
  loop: "{{ group_names }}"
  when: item in pf_raggiungibilita

- name: Componi nome e indirizzo dei nodi da raggiungere
  set_fact:
    pf_peer: >-
      {{ (pf_gruppi_peer | default([])) | unique | select('in', groups)
         | map('extract', groups) | flatten | unique
         | difference([inventory_hostname]) }}

# ping E porta 22: su molte reti l'ICMP e' filtrato mentre il TCP passa, quindi
# un ping che non torna da solo non vuol dire che il nodo sia irraggiungibile.
# La 22 e' l'unica porta che si sa gia' aperta prima di installare qualsiasi
# cosa: quelle dei servizi non esistono ancora.
- name: Verifica di raggiungere gli altri nodi
  shell: |
    set +e
    {% for p in pf_peer %}
    if ping -c 1 -W 1 {{ (hostvars[p].ansible_host | default(p)) | quote }} >/dev/null 2>&1; then eco=si; else eco=no; fi
    if timeout {{ pf_timeout_tcp }} bash -c "echo > /dev/tcp/{{ hostvars[p].ansible_host | default(p) }}/22" >/dev/null 2>&1; then ssh=si; else ssh=no; fi
    echo "{{ p }}|{{ hostvars[p].ansible_host | default(p) }}|$eco|$ssh"
    {% endfor %}
  args:
    executable: /bin/bash
  register: pf_peer_esito
  changed_when: false
  failed_when: false
  when: pf_peer | length > 0

# --- Uscita verso i repository ---------------------------------------------
# Una connessione TCP aperta e chiusa subito, senza spedire dati: dice se la
# strada c'e', senza scaricare niente.
- name: Verifica gli endpoint da cui i ruoli scaricano
  shell: |
    set +e
    {% for e in pf_endpoint_esterni %}
    if timeout {{ pf_timeout_tcp }} bash -c "echo > /dev/tcp/{{ e.host }}/{{ e.porta }}" >/dev/null 2>&1; then
      echo "{{ e.host }}:{{ e.porta }}|si|{{ e.a_cosa_serve }}"
    else
      echo "{{ e.host }}:{{ e.porta }}|no|{{ e.a_cosa_serve }}"
    fi
    {% endfor %}
  args:
    executable: /bin/bash
  register: pf_endpoint_esito
  changed_when: false
  failed_when: false
  when: pf_verifica_endpoint | default(true) | bool

- name: Prova a risolvere il dominio Rancher
  command: "getent hosts {{ rancher_domain }}"
  register: pf_dns
  changed_when: false
  failed_when: false
  when: (rancher_domain | default('')) | length > 0

# --- Voci della scheda ------------------------------------------------------

- name: Registra le voci di rete
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  vars:
    indirizzo_inventario: "{{ hostvars[inventory_hostname].ansible_host | default('') }}"
    indirizzi_nodo: "{{ ansible_all_ipv4_addresses | default([]) }}"
    peer_ko: >-
      {{ pf_peer_esito.stdout_lines | default([])
         | select('search', '\|no$') | list }}
    endpoint_ko: >-
      {{ pf_endpoint_esito.stdout_lines | default([])
         | select('search', '\|no\|') | list }}
    righe:
      - sezione: RETE
        voce: "Indirizzo di inventario"
        valore: >-
          {{ indirizzo_inventario | default('non dichiarato', true) }}
          {{ '(presente sul nodo)' if indirizzo_inventario in indirizzi_nodo
             else "(NON e' fra gli indirizzi del nodo: " ~ indirizzi_nodo | join(', ') ~ ')' }}
        esito: "{{ 'OK' if indirizzo_inventario in indirizzi_nodo else 'ATTENZIONE' }}"
        nota: >-
          ansible_host non corrisponde a nessun indirizzo configurato sul nodo.
          Succede con NAT o con un inventario disallineato: i template che
          generano upstream e backend per IP scriverebbero un indirizzo che gli
          altri nodi non sanno raggiungere.

      - sezione: RETE
        voce: "Instradamento predefinito"
        valore: "{{ pf_rotta.stdout | default('') | trim | default('nessuno', true) }}"
        esito: "{{ 'OK' if (pf_rotta.stdout | default('') | trim | length) > 0 else 'ATTENZIONE' }}"
        nota: "senza rotta predefinita il nodo non esce dalla propria rete."

      - sezione: RETE
        voce: "Risoluzione del dominio"
        valore: >-
          {{ rancher_domain | default('nessun dominio dichiarato') }} -
          {{ (pf_dns.stdout | default('') | trim) | default('non risolve', true) }}
        esito: >-
          {{ 'OK' if (pf_dns.rc | default(1)) == 0 else 'INFO' }}
        nota: >-
          il dominio non risolve ancora: e' normale prima di installare, perche'
          la voce in /etc/hosts la scrive update_hosts_file (playbook
          20-rancher.yml). Diventa un problema solo se resta cosi' dopo.

      - sezione: RETE
        voce: "Altri nodi raggiungibili"
        valore: >-
          {{ 'nessun altro nodo da raggiungere per i gruppi di questo host'
             if (pf_peer | default([]) | length) == 0
             else ((pf_peer_esito.stdout_lines | default([]) | length) - (peer_ko | length)) ~
                  ' su ' ~ (pf_peer_esito.stdout_lines | default([]) | length) ~
                  ('' if peer_ko | length == 0
                   else ' - non raggiunti: ' ~ (peer_ko | map('regex_replace', '\|.*$', '') | join(', '))) }}
        esito: "{{ 'OK' if peer_ko | length == 0 else 'PROBLEMA' }}"
        nota: >-
          alcuni nodi non rispondono sulla porta 22. Finche' non si parlano,
          etcd non fa quorum, Gluster non fa peering e Corosync non forma il
          cluster.

      - sezione: RETE
        voce: "Uscita verso i repository"
        valore: >-
          {{ "non verificata, pf_verifica_endpoint e' false"
             if not (pf_verifica_endpoint | default(true) | bool)
             else ((pf_endpoint_esito.stdout_lines | default([]) | length) - (endpoint_ko | length)) ~
                  ' su ' ~ (pf_endpoint_esito.stdout_lines | default([]) | length) ~ ' endpoint' ~
                  ('' if endpoint_ko | length == 0
                   else ' - irraggiungibili: ' ~ (endpoint_ko | map('regex_replace', '\|.*$', '') | join(', '))) }}
        esito: >-
          {{ 'INFO' if not (pf_verifica_endpoint | default(true) | bool)
             else ('OK' if endpoint_ko | length == 0 else 'ATTENZIONE') }}
        nota: >-
          da questi indirizzi i ruoli scaricano quello che installano: su una
          rete chiusa il playbook si ferma a meta'. Servono un proxy, un mirror
          interno, oppure le regole di uscita.

# Vale solo per i bilanciatori, ed e' l'errore che si fa piu' spesso: il valore
# di serie e' ens5, ma il nome dipende dalla macchina. Con un'interfaccia che
# non esiste keepalived parte e non annuncia niente, e i VIP non si spostano.
- name: Verifica l'interfaccia su cui keepalived annuncera' i VIP
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  when: "'nginx_servers' in group_names"
  vars:
    presente: "{{ (keepalived_interface | default('')) in (ansible_interfaces | default([])) }}"
    riga:
      sezione: RETE
      voce: "Interfaccia keepalived"
      valore: >-
        {{ keepalived_interface | default('non dichiarata') }}
        {{ '(presente)' if presente | bool
           else '(NON esiste; presenti: ' ~ (ansible_interfaces | default([]) | join(', ')) ~ ')' }}
      esito: "{{ 'OK' if presente | bool else 'PROBLEMA' }}"
      nota: >-
        keepalived_interface non corrisponde a nessuna interfaccia del nodo.
        keepalived parte lo stesso e non annuncia niente: i VIP non si
        spostano e il failover non avviene. Il nome giusto si legge qui sopra,
        nel blocco delle interfacce.

- name: Registra il blocco delle porte in ascolto
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco_porte, blocco_interfacce] }}"
  vars:
    blocco_porte:
      titolo: "Porte gia' in ascolto sul nodo (proto:porta:processo)"
      righe: >-
        {{ pf_ascolto.stdout_lines | default([]) | default(['nessuna'], true) }}
    blocco_interfacce:
      titolo: "Interfacce di rete (ip -br addr)"
      righe: >-
        {{ pf_interfacce.stdout_lines | default([], true)
           | default(['nessuna interfaccia leggibile'], true) }}

- name: Componi la tabella degli endpoint esterni
  set_fact:
    pf_endpoint_righe: >-
      {{ (pf_endpoint_righe | default([]))
         + [ ('raggiungibile' if campi[1] == 'si' else 'NON RAGGIUNGIBILE').ljust(20)
             ~ campi[0].ljust(28) ~ campi[2] ] }}
  loop: "{{ pf_endpoint_esito.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split('|')[0] }}"
  vars:
    campi: "{{ item.split('|') }}"

- name: Registra il blocco degli endpoint esterni
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco] }}"
  when: (pf_endpoint_righe | default([])) | length > 0
  vars:
    blocco:
      titolo: "Endpoint esterni usati dall'installazione"
      righe: >-
        {{ ['ESITO'.ljust(20) ~ 'ENDPOINT'.ljust(28) ~ 'A COSA SERVE']
           + (pf_endpoint_righe | default([])) }}
