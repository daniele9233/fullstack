---
# Kafka non arriva da apt: e' un tarball scompattato in kafka_home, una unit
# systemd scritta dal ruolo e un utente di sistema. Niente purge, quindi: si
# ferma il servizio e si toglie tutto a mano.

- name: Ferma il servizio Kafka
  systemd:
    name: "{{ kafka_service_name | default('kafka') }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Rimuovi la unit systemd e i file temporanei di Kafka
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ azzera_percorsi_kafka }}"

# La directory dati puo' essere un disco montato a mano: si svuota, non si
# cancella. Dentro c'e' meta.properties, il file che lega quel disco a un
# node.id preciso: finche' resta, il ruolo kafka_cluster si ferma se il nodo
# viene rimesso in inventario in una posizione diversa.
- name: Svuota la directory dati di Kafka
  include_tasks: svuota.yml
  vars:
    svuota_percorso: "{{ kafka_data_dir | default('/opt/kafka/data') }}"
  when: azzera_dati | bool

- name: Rimuovi la distribuzione Kafka
  file:
    path: "{{ kafka_home | default('/opt/kafka') }}"
    state: absent
  when: azzera_dati | bool

# Se kafka_data_dir sta fuori da kafka_home la directory della distribuzione se
# n'e' andata sopra; se sta dentro (e' il default, /opt/kafka/data) la rimozione
# ha portato via anche il mountpoint. In quel caso va ricreato, altrimenti il
# disco resta montato su una directory che non c'e' piu'.
- name: Ricrea il punto di mount dei dati se stava dentro alla distribuzione
  file:
    path: "{{ kafka_data_dir | default('/opt/kafka/data') }}"
    state: directory
    mode: '0755'
  when:
    - azzera_dati | bool
    - (kafka_data_dir | default('/opt/kafka/data')).startswith(kafka_home | default('/opt/kafka'))

- name: Rimuovi l'utente di sistema kafka
  user:
    name: "{{ kafka_user | default('kafka') }}"
    state: absent
    remove: false
  failed_when: false
  when: azzera_pacchetti | bool

# Il JDK Zulu che il ruolo scompatta sotto /usr/lib/jvm non e' un pacchetto e
# non se ne va da solo. Quello installato con apt (kafka_java_install_method
# uguale ad apt) resta: e' un pacchetto normale, e potrebbe servire ad altro
# sulla macchina.
- name: Rimuovi il JDK Zulu scompattato dal ruolo
  file:
    path: "{{ kafka_jvm_base_dir | default('/usr/lib/jvm') }}/{{ kafka_zulu_release }}"
    state: absent
  when: kafka_zulu_release is defined

# QUI SI ROMPE JAVA PER TUTTI SE NON SI FA ATTENZIONE.
#
# kafka_cluster registra la propria JVM in update-alternatives e la rende la
# java di sistema (kafka_java_set_default, acceso di default). Quella
# registrazione e' di MACCHINA, non dell'utente kafka: /usr/bin/java punta a
# /etc/alternatives/java, che punta dentro alla directory appena cancellata.
#
# Cancellare la directory e lasciare li' il collegamento significa che "java",
# lanciato da chiunque su quel nodo, risponde "command not found" — e il nodo
# doveva essere pulito, non rotto.
#
# Non basta togliere la voce morta dall'elenco: update-alternatives lo fa gia'
# da solo alla prima lettura, ma il gruppo resta in modo MANUALE puntato al
# nulla e il collegamento non si ripara. Ci vuole --auto, che sceglie la
# migliore JVM rimasta (per esempio una openjdk installata con apt, che questo
# ruolo non tocca) oppure toglie il collegamento se non ne resta nessuna.
- name: Verifica se il collegamento java e' rimasto appeso nel vuoto
  shell: >-
    if [ -L /etc/alternatives/java ] && [ ! -e /etc/alternatives/java ];
    then echo appeso; else echo ok; fi
  args:
    executable: /bin/bash
  register: azzera_java_link
  changed_when: false
  failed_when: false

- name: Rimetti a posto il collegamento java
  command: update-alternatives --auto java
  when: azzera_java_link.stdout | default('ok') | trim == 'appeso'
  register: azzera_java_auto
  failed_when: false
  changed_when: azzera_java_auto.rc | default(1) == 0
