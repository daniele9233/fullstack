---
# Ordine: prima si spegne tutto, poi si toglie. Fermare i servizi alla fine
# vorrebbe dire cancellare configurazioni sotto ai processi che le stanno
# usando, e ritrovarsi un glusterd vivo che riscrive /var/lib/glusterd mentre
# lo si sta rimuovendo.

- name: Pretendi la conferma esplicita
  assert:
    that:
      - azzera_conferma | default('') == 'AZZERA'
    fail_msg: |
      Questo ruolo CANCELLA. Toglie Rancher, RKE2, PostgreSQL, Patroni, etcd,
      GlusterFS, Ganesha, Pacemaker, nginx, haproxy, keepalived, Kafka ed
      Elasticsearch dal nodo, dati compresi.

      Per lanciarlo servono due cose, e servono insieme:

        --limit <host o gruppo>       su chi
        -e azzera_conferma=AZZERA     conferma

      Per prendere tutto l'inventario il filtro si scrive, non si omette:
      --limit all. Il control node ([local]) resta fuori comunque.
    success_msg: "Conferma ricevuta: azzeramento di {{ inventory_hostname }}."
  run_once: false

# Il control node sta in [local] e da li' si lanciano i playbook: azzerarlo
# significa segarsi il ramo su cui si e' seduti.
#
# SECONDA RETE. La prima e' "hosts: all:!local" in playbooks/99-azzera.yml, che
# tiene [local] fuori dal play: per quella strada qui non ci si arriva nemmeno.
# Questo assert serve a chi include il ruolo da un altro playbook, o a un host
# che e' locale (ansible_connection=local) senza stare in [local].
- name: Rifiuta di azzerare il control node
  assert:
    that:
      - ansible_connection | default('ssh') != 'local'
      - inventory_hostname not in (groups['local'] | default([]))
    fail_msg: >-
      {{ inventory_hostname }} e' il control node: si azzererebbe la macchina da
      cui stai lanciando. Con playbooks/99-azzera.yml questo non succede — il
      play esclude [local] da solo — quindi ci sei arrivato da un altro
      playbook: togli questo host dal pattern.

- name: Annuncia che cosa sta per succedere
  debug:
    msg:
      - "AZZERAMENTO DI {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})"
      - "Rancher/RKE2: {{ azzera_rancher }} · Database: {{ azzera_database }} · Storage: {{ azzera_storage }} · Bilanciatori: {{ azzera_bilanciatori }} · Kafka: {{ azzera_kafka }} · Elasticsearch: {{ azzera_elasticsearch }}"
      - "Dati cancellati: {{ azzera_dati }} · Pacchetti rimossi: {{ azzera_pacchetti }}"

- name: Azzera Rancher e RKE2
  include_tasks: rancher.yml
  when: azzera_rancher | bool

- name: Azzera il database
  include_tasks: database.yml
  when: azzera_database | bool

- name: Azzera lo storage
  include_tasks: storage.yml
  when: azzera_storage | bool

- name: Azzera i bilanciatori
  include_tasks: bilanciatori.yml
  when: azzera_bilanciatori | bool

- name: Azzera Kafka
  include_tasks: kafka.yml
  when: azzera_kafka | bool

- name: Azzera Elasticsearch
  include_tasks: elasticsearch.yml
  when: azzera_elasticsearch | bool

- name: Ripulisci quello che resta e fai il punto
  include_tasks: finale.yml
