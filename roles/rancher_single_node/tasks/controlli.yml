---
# Quello che, se manca, fa fallire l'installazione a meta' con un messaggio che
# parla d'altro.

- name: Verifica di avere un solo nodo nel gruppo
  assert:
    that:
      - groups[rsn_group] | default([]) | length == 1
    fail_msg: >-
      Il gruppo [{{ rsn_group }}] ha
      {{ groups[rsn_group] | default([]) | length }} host. Questo ruolo installa
      Rancher SU UN NODO SOLO: su piu' host produrrebbe altrettanti cluster
      separati, ognuno con il proprio Rancher che si crede l'unico e lo stesso
      dominio puntato a uno solo di loro. Per il cluster a 3 nodi c'e'
      playbooks/20-rancher.yml con il gruppo [masters].
    success_msg: >-
      Nodo singolo: {{ groups[rsn_group] | first }}
  run_once: true

- name: Verifica che il nodo abbia un indirizzo IP dichiarato
  assert:
    that:
      - rsn_node_ip | length > 0
      - rsn_node_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      {{ inventory_hostname }}: rsn_node_ip vale "{{ rsn_node_ip }}", che non e'
      un indirizzo IPv4. E' l'indirizzo a cui punta rancher_domain, quello che
      finisce nel SAN del certificato dell'API server e quello con cui il nodo
      si annuncia: dichiara ansible_host nell'inventario.

- name: Verifica che il dominio di Rancher sia dichiarato
  assert:
    that:
      - rancher_domain | default('') | length > 0
      - rancher_domain is not match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      rancher_domain vale "{{ rancher_domain | default('') }}".
      Serve un NOME, non un indirizzo: e' l'hostname dell'Ingress di Rancher e
      il nome sul certificato, e un IP li' dentro non funziona.
  run_once: true

- name: Verifica che la password di bootstrap sia dichiarata
  assert:
    that:
      - rancher_password | default('') | length >= 12
    fail_msg: >-
      rancher_password e' vuota o piu' corta di 12 caratteri. E' la password
      dell'utente admin al primo accesso, e Rancher rifiuta le password brevi
      lasciando il deployment su senza che si riesca a entrare.
  run_once: true

- name: Verifica la provenienza del certificato
  assert:
    that:
      - rsn_tls_source in ['secret', 'rancher']
    fail_msg: >-
      rsn_tls_source vale "{{ rsn_tls_source }}": sono previsti "secret" (i .pem
      forniti, come nell'installazione a 3 nodi) e "rancher" (Rancher si genera
      una CA sua, e serve cert-manager che il ruolo installa).
  run_once: true

# Con tls source "secret" i tre file devono esserci SUL CONTROLLER, e devono
# essere quelli giusti: un certificato che non copre rancher_domain fa partire
# tutto e poi rifiutare l'handshake dal browser, che e' il momento peggiore per
# scoprirlo.
- name: Verifica che i certificati ci siano sul controller
  stat:
    path: "{{ item }}"
  loop:
    - "{{ repo_dir }}/roles/master1_helm_cert_manager_install/files/{{ fullchain_pem_file }}"
    - "{{ repo_dir }}/roles/master1_helm_cert_manager_install/files/{{ privkey_pem_file }}"
    - "{{ repo_dir }}/roles/master1_helm_cert_manager_install/files/{{ cacerts_pem_file }}"
  delegate_to: localhost
  become: false
  register: rsn_certs
  when: rsn_tls_source == 'secret'
  run_once: true

- name: Fermati se i certificati mancano
  assert:
    that:
      - rsn_certs.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Con rsn_tls_source=secret servono i tre .pem in
      roles/master1_helm_cert_manager_install/files/ sul control node, e mancano:
      {{ rsn_certs.results | rejectattr('stat.exists') | map(attribute='item')
         | map('basename') | join(', ') }}.
      Mettili li', oppure passa a rsn_tls_source=rancher e lascia che Rancher si
      firmi il certificato da solo (il browser mostrera' un avviso).
  when: rsn_tls_source == 'secret'
  run_once: true

- name: Segnala se la distribuzione non e' quella prevista
  debug:
    msg: >-
      ATTENZIONE {{ inventory_hostname }}: la distribuzione rilevata e'
      {{ ansible_distribution }} {{ ansible_distribution_version }}. Questo
      repository e' provato su Ubuntu: altrove i percorsi di systemd-resolved e
      i pacchetti non tornano.
  when: ansible_distribution | default('') != 'Ubuntu'

# Traefik e Rancher pretendono le porte 80 e 443 del nodo. Su una macchina che
# ha gia' un nginx o un haproxy sopra, il DaemonSet di Traefik non parte e
# l'attesa fallisce con un messaggio che parla di pod, non di porte.
- name: Guarda chi tiene le porte 80 e 443
  shell: >-
    ss -lntp | awk '$4 ~ /:(80|443)$/' || true
  args:
    executable: /bin/bash
  register: rsn_porte
  changed_when: false

- name: Fermati se le porte dell'ingress sono gia' occupate
  fail:
    msg: |
      Su {{ inventory_hostname }} le porte 80 e/o 443 sono gia' occupate:

      {{ rsn_porte.stdout }}

      Traefik e' un DaemonSet con hostPort 80 e 443: con quelle porte prese il
      pod non parte, l'Ingress di Rancher resta senza nessuno che lo serva e la
      console non risponde. Ferma il servizio che le tiene (di solito un nginx o
      un haproxy di un'installazione precedente), oppure usa un'altra macchina.
  when: rsn_porte.stdout | default('') | trim | length > 0
