---
# RANCHER SU UN NODO SOLO: RKE2 + Traefik + Rancher su una macchina sola.
#
# E' l'installazione a 3 nodi ridotta a uno. Stesso software, stesse versioni,
# stesse variabili dove ha senso condividerle (rancher_domain, rancher_password,
# rancher_version, helm_version, i .pem dei certificati).
#
# --- CHE COSA CAMBIA RISPETTO AI 3 NODI ------------------------------------
#
# 1. NIENTE QUORUM, NIENTE serial: 1, NIENTE token da leggere.
#    A 3 master ogni nodo deve unirsi al primo, e il playbook li porta su uno
#    alla volta aspettando che etcd promuova ciascuno da learner a votante. Qui
#    il nodo bootstrappa e basta: config.yaml non ha la direttiva "server:" e
#    non c'e' nessuna barriera fra un host e il successivo.
#
# 2. NIENTE CLUSTER DOWNSTREAM.
#    master1_create_cluster non c'e': Rancher gestisce solo "local". Con questo
#    sparisce anche meta' della complessita' degli agent.
#
# 3. UNA REPLICA DI RANCHER, non tre.
#    Il chart ne vuole 3 di default e le tiene su nodi diversi (anti-affinity).
#    Su un nodo solo due resterebbero Pending per sempre e il deployment non
#    diventerebbe mai pronto: e' l'errore che fa sembrare rotta un'installazione
#    che invece e' solo stata chiesta male.
#
# 4. IL NOME DEL NODO E' SCRITTO, NON DEDOTTO.
#    config.yaml contiene node-name. RKE2 fissa il nome del nodo alla prima
#    registrazione e non lo cambia piu': su una macchina riusata, con l'hostname
#    rimasto da un'installazione precedente, il nodo entrerebbe con quel nome e
#    ci resterebbe.
#
# 5. /etc/hosts NON E' PIU' UN LAVORO A MANO.
#    A 3 nodi ogni macchina deve risolvere il dominio Rancher, e l'elenco lo si
#    mantiene a mano. Qui il nodo e' uno, la riga e' una, e la scrive il ruolo:
#    sul nodo, dentro ai pod che ne hanno bisogno (hostAliases) e — se lo si
#    vuole — sul control node Ansible. Vedi tasks/nomi.yml.
#
# 6. resolv-conf SCRITTO IN CONFIG.YAML.
#    Su Ubuntu /etc/resolv.conf punta allo stub 127.0.0.53 di systemd-resolved.
#    CoreDNS lo eredita, prova a inoltrare li' dentro al proprio pod e ogni
#    risoluzione esterna va in timeout. Qui si punta al resolv.conf vero.

- name: Controlli preliminari
  import_tasks: controlli.yml

- name: Risoluzione del nome di Rancher
  import_tasks: nomi.yml

- name: RKE2
  import_tasks: rke2.yml

- name: kubectl e helm sul nodo
  import_tasks: strumenti.yml

# Traefik non sta qui dentro: e' il ruolo traefik_install, lo stesso dei 3 nodi,
# e lo invoca il playbook fra questo ruolo e Rancher. Scriverne una copia
# significherebbe due ingress da tenere allineati.

- name: cert-manager
  import_tasks: certmanager.yml
  when: rsn_tls_source == 'rancher'

- name: Rancher
  import_tasks: rancher.yml

- name: Risoluzione del dominio dentro ai pod
  import_tasks: agenti.yml
  when: rsn_patch_agent_hostaliases | bool

- name: Verifica
  import_tasks: verifica.yml
  when: rsn_verify | bool
