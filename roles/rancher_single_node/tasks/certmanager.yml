---
# cert-manager, e SOLO con rsn_tls_source = "rancher".
#
# Con i .pem forniti (rsn_tls_source = "secret", il default e la strada dei 3
# nodi) cert-manager non serve a niente: il certificato esiste gia', Rancher lo
# legge dal secret e nessuno deve emetterne. Installarlo comunque vorrebbe dire
# tre deployment e dei CRD in piu' da tenere aggiornati per nulla.
#
# Serve invece quando Rancher si firma il certificato da solo: li' e'
# cert-manager a emetterlo, e senza il chart di Rancher resta in attesa di un
# Certificate che nessuno crea mai.

- name: Aggiungi il repository di jetstack
  command: "helm repo add jetstack {{ rsn_cert_manager_repo_url }} --force-update"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  changed_when: false

- name: Aggiorna i repository helm
  command: helm repo update
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  changed_when: false

- name: Verifica se cert-manager e' gia' installato
  command: "helm status cert-manager --namespace {{ rsn_cert_manager_namespace }}"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_cm_release
  changed_when: false
  failed_when: false

# installCRDs=true: i CRD di cert-manager vengono installati dal chart. Senza,
# vanno applicati a mano prima, e il chart fallisce con un errore che parla di
# risorse sconosciute invece che di CRD mancanti.
- name: Installa cert-manager
  command: >
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace {{ rsn_cert_manager_namespace }}
    --create-namespace
    --version {{ rsn_cert_manager_version }}
    --set installCRDs=true
    --wait --timeout 10m
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_cm_helm
  changed_when: rsn_cm_release.rc != 0

- name: Attendi che cert-manager sia pronto
  command: >-
    kubectl -n {{ rsn_cert_manager_namespace }} rollout status
    deploy/cert-manager --timeout=300s
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  changed_when: false
