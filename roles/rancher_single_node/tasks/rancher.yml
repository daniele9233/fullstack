---
# Rancher via Helm. Stesso chart, stessa versione e stessa forma dei comandi
# dell'installazione a 3 nodi: quello che cambia e' il numero di repliche e da
# dove viene il certificato.

- name: Aggiungi il repository di Rancher
  command: "helm repo add {{ rsn_rancher_repo_name }} {{ rsn_rancher_repo_url }} --force-update"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  changed_when: false

- name: Aggiorna i repository helm
  command: helm repo update
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  changed_when: false

# "create --dry-run=client -o yaml | apply -f -" e non "create" e basta: create
# fallisce con AlreadyExists al secondo run.
- name: "Crea il namespace {{ rsn_rancher_namespace }}"
  shell: >-
    set -o pipefail;
    kubectl create namespace {{ rsn_rancher_namespace }}
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_ns
  changed_when: "'unchanged' not in (rsn_ns.stdout | default(''))"

# --- Certificati forniti ----------------------------------------------------
# Solo con rsn_tls_source = "secret". Con "rancher" non si copia niente: il
# certificato lo emette cert-manager.

# I tre .pem stanno nella files/ del ruolo dei 3 nodi, non in una copia qui:
# sono gli stessi certificati, e duplicarli vorrebbe dire rinnovarli in due
# posti e accorgersene quando meta' infrastruttura ha ancora il vecchio.
#
# Il percorso e' ASSOLUTO, ancorato a repo_dir. Un src relativo qui NON
# funzionerebbe: copy lo cercherebbe nella files/ di QUESTO ruolo e in quella
# del playbook (cioe' playbooks/), dove non c'e'.
- name: Copia i certificati sul nodo
  copy:
    src: "{{ repo_dir }}/roles/master1_helm_cert_manager_install/files/{{ item.src }}"
    dest: "{{ remote_cert_path }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ fullchain_pem_file }}", dest: "fullchain.pem", mode: '0644' }
    - { src: "{{ privkey_pem_file }}",   dest: "privkey.pem",   mode: '0600' }
    - { src: "{{ cacerts_pem_file }}",   dest: "cacerts.pem",   mode: '0644' }
  loop_control:
    label: "{{ item.dest }}"
  when: rsn_tls_source == 'secret'

- name: Crea il secret TLS dell'Ingress di Rancher
  shell: >-
    set -o pipefail;
    kubectl -n {{ rsn_rancher_namespace }} create secret tls tls-rancher-ingress
    --cert={{ remote_cert_path }}/fullchain.pem
    --key={{ remote_cert_path }}/privkey.pem
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_tls_secret
  changed_when: "'unchanged' not in (rsn_tls_secret.stdout | default(''))"
  when: rsn_tls_source == 'secret'

- name: Crea il secret della CA
  shell: >-
    set -o pipefail;
    kubectl -n {{ rsn_rancher_namespace }} create secret generic tls-ca
    --from-file={{ remote_cert_path }}/cacerts.pem
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_ca_secret
  changed_when: "'unchanged' not in (rsn_ca_secret.stdout | default(''))"
  when: rsn_tls_source == 'secret'

# --- Il chart ---------------------------------------------------------------

# Serve a due cose: sapere se questo run e' una prima installazione (e quindi
# se contarlo come changed) e, soprattutto, se passare bootstrapPassword. Quella
# password vale solo al primo avvio, quando l'utente admin non ha ancora fatto
# il setup: ripassarla a ogni upgrade la rimetterebbe sulla riga di comando per
# niente.
- name: Verifica se il release Rancher esiste gia'
  command: "helm status rancher --namespace {{ rsn_rancher_namespace }}"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_rancher_release
  changed_when: false
  failed_when: false

# replicas: IL PUNTO che distingue questa installazione da quella a 3 nodi.
# Il chart ne vuole 3 di default e le distribuisce su nodi diversi con una
# anti-affinity: su un nodo solo due resterebbero Pending per sempre, il
# deployment non diventerebbe mai pronto e sembrerebbe un'installazione rotta
# invece che una chiesta male.
- name: Installa Rancher
  command: >
    helm upgrade --install rancher {{ rsn_rancher_repo_name }}/rancher
    --namespace {{ rsn_rancher_namespace }}
    --version {{ rancher_version }}
    --set hostname={{ rancher_domain }}
    --set replicas={{ rsn_rancher_replicas }}
    --set ingress.ingressClassName={{ rsn_ingress_class }}
    {% if rsn_tls_source == 'secret' %}--set ingress.tls.source=secret --set privateCA=true{% else %}--set ingress.tls.source=rancher{% endif %}
    {% if rsn_rancher_release.rc != 0 %}--set bootstrapPassword={{ rancher_password }}{% endif %}
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_rancher_helm
  # changed solo alla prima installazione. Un upgrade che non cambia niente
  # incrementa comunque la revision di Helm, ma non tocca i pod.
  changed_when: rsn_rancher_release.rc != 0
  # bootstrapPassword finirebbe in chiaro in ansible.log, che ansible.cfg scrive
  # sempre. Per vedere l'output durante una diagnosi:
  #   -e rancher_hide_secrets=false
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Attendi che Rancher sia pronto
  command: >-
    kubectl -n {{ rsn_rancher_namespace }} rollout status deploy/rancher
    --timeout={{ rsn_rancher_wait_timeout }}s
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_rancher_rollout
  changed_when: false
  failed_when: false

- name: Raccogli lo stato dei pod di Rancher
  command: "kubectl -n {{ rsn_rancher_namespace }} get pods -o wide"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_rancher_pods
  changed_when: false

- name: Fermati se Rancher non e' pronto
  assert:
    that:
      - rsn_rancher_rollout.rc == 0
    fail_msg: |
      Rancher non e' pronto dopo {{ rsn_rancher_wait_timeout }} secondi.

      {{ rsn_rancher_pods.stdout }}

      I due casi che si vedono davvero:
        - pod Pending: su un nodo solo e' quasi sempre replicas > 1. Qui e'
          {{ rsn_rancher_replicas }}: se non e' 1, abbassalo.
        - pod in crash o in ImagePullBackOff: il nodo non arriva al registry.
          kubectl -n {{ rsn_rancher_namespace }} describe pod -l app=rancher
    success_msg: >-
      Rancher {{ rancher_version }} pronto su {{ rsn_rancher_replicas }} replica/e.
