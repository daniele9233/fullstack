---
# Verifica in sola lettura. Non guarda "helm dice che è andata bene": interroga
# il cluster e poi Rancher dalla sua porta, che e' l'unica cosa che dice se la
# console risponde davvero.

- name: Leggi lo stato del nodo
  command: "kubectl get nodes -o wide"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_nodi
  changed_when: false

# Il nome con cui il nodo si e' registrato DEVE essere quello dichiarato. Se non
# lo e', config.yaml e' stato scritto dopo la prima registrazione: RKE2 il nome
# non lo cambia piu', e tutto quello che a quel nome e' agganciato resta
# agganciato al nome vecchio.
- name: Verifica che il nodo si chiami come deve
  assert:
    that:
      - rsn_node_name in rsn_nodi.stdout
    fail_msg: |
      Nel cluster non c'e' nessun nodo chiamato "{{ rsn_node_name }}":

      {{ rsn_nodi.stdout }}

      RKE2 fissa il nome alla PRIMA registrazione. Se il nodo era gia' entrato
      con un altro nome — l'hostname di un'installazione precedente — node-name
      in config.yaml non lo rinomina. Si azzera e si rifa' entrare:
        ansible-playbook playbooks/99-azzera.yml --limit {{ inventory_hostname }} -e azzera_conferma=AZZERA
    success_msg: >-
      Nodo {{ rsn_node_name }} registrato con il nome giusto.

- name: Leggi i pod di sistema
  command: "kubectl get pods -A -o wide"
  environment:
    KUBECONFIG: "{{ rsn_kubeconfig }}"
  register: rsn_pods
  changed_when: false

- name: Elenca i pod che non stanno girando
  set_fact:
    rsn_pods_ko: >-
      {{ rsn_pods.stdout_lines[1:]
         | reject('search', '\s(Running|Completed)\s')
         | list }}

- name: Segnala i pod non a posto
  debug:
    msg:
      - "Ci sono {{ rsn_pods_ko | length }} pod che non sono Running ne' Completed:"
      - "{{ rsn_pods_ko }}"
      - >-
        Pending su un nodo solo vuol dire quasi sempre una replica in piu' del
        necessario o una porta gia' occupata; ImagePullBackOff vuol dire che il
        nodo non arriva al registry.
  when: rsn_pods_ko | length > 0

# --- Rancher risponde? ------------------------------------------------------
# Dal nodo, contro il proprio Ingress, con l'Host giusto. validate_certs no: il
# certificato puo' essere quello autofirmato da Rancher, e qui interessa che
# risponda, non di chi si fida il nodo.

- name: Interroga Rancher dal nodo
  uri:
    url: "https://{{ rancher_domain }}/healthz"
    method: GET
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 20
  register: rsn_healthz
  until: rsn_healthz.status | default(0) in [200, 401, 403]
  retries: 30
  delay: 10
  changed_when: false
  failed_when: false

- name: Verifica che la console risponda
  assert:
    that:
      - rsn_healthz.status | default(0) in [200, 401, 403]
    fail_msg: >-
      https://{{ rancher_domain }}/healthz ha risposto
      "{{ rsn_healthz.status | default('nessuna risposta') }}" dal nodo stesso.
      Se il messaggio parla di connessione rifiutata, l'Ingress non e' servito
      da nessuno: controlla che Traefik sia su con
      "kubectl -n traefik get pods,daemonset" — e che le porte 80 e 443 del nodo
      non siano di qualcun altro. Risposta:
      {{ rsn_healthz.msg | default('') }}
    success_msg: >-
      https://{{ rancher_domain }} risponde (HTTP {{ rsn_healthz.status }}).
