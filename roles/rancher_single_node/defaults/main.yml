---
# rsn_ = Rancher Single Node.
#
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore. Le variabili
# GIA' condivise con l'installazione a 3 nodi non vengono ridichiarate qui —
# rancher_domain, rancher_password, rancher_version, helm_version e i nomi dei
# file dei certificati restano quelle, cosi' non esistono due verita' sullo
# stesso dominio.

# Gruppo di inventario. UN SOLO HOST: il ruolo si ferma se ne trova di piu',
# invece di installare N cluster separati che si chiamano tutti "local".
rsn_group: "rancher_single"


# ===========================================================================
# 1. IDENTITA' DEL NODO
# ===========================================================================

# node-name scritto ESPLICITAMENTE in config.yaml, invece di lasciare che RKE2
# usi l'hostname della macchina.
#
# Non e' pignoleria. RKE2 fissa il nome del nodo alla PRIMA registrazione e da
# li' non lo cambia piu': su una macchina riusata, con l'hostname rimasto da una
# vita precedente, il nodo entra nel cluster con il nome sbagliato e ci resta —
# e il nome sbagliato si porta dietro le voci VXLAN di Calico, i certificati e
# tutto quello che a quel nome e' agganciato. Scrivendolo qui, l'hostname della
# macchina diventa irrilevante.
rsn_node_name: "{{ inventory_hostname }}"

# node-ip: l'indirizzo con cui il nodo si presenta. Su una macchina con piu'
# interfacce, senza questo RKE2 sceglie da solo e puo' scegliere quella
# sbagliata.
rsn_node_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default(inventory_hostname)) }}"


# ===========================================================================
# 2. RISOLUZIONE DEL NOME  (il punto per cui questo ruolo esiste)
# ===========================================================================
#
# rancher_domain deve risolvere a rsn_node_ip in TRE posti, e sono tre posti
# diversi con tre meccanismi diversi:
#
#   1. sul NODO          -> /etc/hosts, una riga sola, scritta da questo ruolo
#   2. dentro ai POD     -> hostAliases su cattle-cluster-agent e fleet-agent,
#                           applicati da questo ruolo. E' l'unico che /etc/hosts
#                           del nodo NON copre: i pod hanno un loro resolver, e
#                           su rete chiusa il dominio non esiste da nessuna
#                           parte
#   3. da DOVE SI GUARDA -> il browser e il control node Ansible
#
# I primi due il ruolo li fa da solo. Il terzo tocca al control node, ed e'
# l'unico /etc/hosts che una persona vede: con rsn_update_control_node_hosts a
# true lo scrive il ruolo anche li' (serve root sul control node), altrimenti la
# riga da incollare viene stampata nel riepilogo.
#
# In nessun caso c'e' da mantenere a mano un elenco di host su piu' macchine:
# il nodo e' uno, la riga e' una.

rsn_manage_node_hosts: true
rsn_update_control_node_hosts: true

# Marcatore delle righe scritte da questo ruolo in /etc/hosts. Serve a
# riscriverle quando l'indirizzo cambia invece di accumularne una nuova ogni
# volta, e a poterle togliere senza toccare il resto del file.
rsn_hosts_marker: "rancher_single_node"

# La riga "127.0.1.1 <hostname>" che Ubuntu mette di serie fa risolvere il nome
# della macchina a un loopback. Su un nodo Kubernetes e' una trappola: i
# componenti che risolvono il proprio nome per annunciarsi si annunciano su
# 127.0.1.1. Con true il ruolo la toglie.
rsn_remove_127_0_1_1: true

# hostAliases sui pod che devono raggiungere Rancher per nome. Non serve su una
# rete dove rancher_domain e' in un DNS vero: in quel caso metti false.
rsn_patch_agent_hostaliases: true
rsn_agent_deployments:
  - { namespace: "cattle-system", nome: "cattle-cluster-agent" }
  - { namespace: "cattle-fleet-local-system", nome: "fleet-agent" }

# Quanto aspettare che i deployment degli agent compaiano. Non nascono insieme a
# Rancher: fleet-agent arriva quando Fleet ha finito di installarsi. Su alcune
# versioni uno dei due non esiste proprio, e allora si aspetta invano tutto
# questo tempo: e' il motivo per cui l'attesa e' corta e non fallisce.
rsn_agent_wait_retries: 24
rsn_agent_wait_delay: 5


# ===========================================================================
# 3. RKE2
# ===========================================================================

# Vuoto = ultima disponibile da get.rke2.io. Valorizzalo (es. "v1.33.11+rke2r1")
# per fissarla e rendere le installazioni ripetibili.
rsn_rke2_version: ""

# CNI. Lo stesso dell'installazione a 3 nodi, per non avere due standard.
#
# Su UN NODO SOLO la scelta conta molto meno: non c'e' traffico fra nodi, quindi
# non c'e' overlay VXLAN da far passare in mezzo a un firewall — che e' il modo
# in cui Calico si rompe piu' spesso. Lista VUOTA = default RKE2 (canal), che e'
# un chart in meno da scaricare e una cosa in meno che puo' fallire.
rsn_cni:
  - calico

# Componenti packaged da non installare. La lista viene calcolata: canal si
# disabilita SOLO se il CNI e' un altro, altrimenti il nodo resta senza rete.
rsn_disable_ingress_nginx: true

# resolv-conf per il kubelet.
#
# Su Ubuntu /etc/resolv.conf e' il link allo stub di systemd-resolved e contiene
# "nameserver 127.0.0.53". Dentro un pod quel 127.0.0.53 e' il pod stesso:
# CoreDNS eredita quel file, prova a inoltrare li' e non riceve risposta, e ogni
# risoluzione esterna va in timeout. RKE2 se ne accorge e ripiega su 8.8.8.8,
# che su una rete aziendale chiusa non risponde comunque.
#
# Questo e' il resolv.conf VERO, quello con i nameserver dell'azienda. Il ruolo
# lo scrive in config.yaml solo se il file esiste davvero sul nodo: su una
# macchina senza systemd-resolved la riga non compare e RKE2 fa come sempre.
rsn_resolv_conf: "/run/systemd/resolve/resolv.conf"

# Token del cluster. Vuoto = lo genera RKE2. Su un nodo solo non serve a
# nessuno, ma valorizzarlo permette di aggiungere altri server in futuro senza
# andare a leggere /var/lib/rancher/rke2/server/node-token.
rsn_token: ""

# SAN aggiuntivi nel certificato dell'API server. Il dominio Rancher, l'IP e il
# nome del nodo ci sono gia'.
rsn_extra_tls_san: []

rsn_write_kubeconfig_mode: "0644"

# L'avvio si aspetta in TRE tappe, ognuna con la sua diagnosi: il servizio resta
# su, l'API server risponde, il nodo diventa Ready. Un'attesa sola non
# distingueva "rke2 e' morto" da "il CNI non parte", e falliva dopo dieci minuti
# elencando le cause possibili invece di mostrare quella vera.
#
# L'API server e' la tappa in cui si vede lo stato lasciato da un'installazione
# precedente: con un datastore etcd di un cluster a piu' nodi, etcd cerca gli
# altri membri, non trova il quorum e l'API non parte mai — mentre il servizio
# risulta attivo.
rsn_api_retries: 60
rsn_api_delay: 5

# Attesa che il nodo sia Ready. Al primo avvio RKE2 deve scaricare le immagini
# dei componenti di sistema: qui i minuti sono 10.
rsn_ready_retries: 60
rsn_ready_delay: 10

# true = il ruolo si RIFIUTA di installare su una macchina che ha gia' uno stato
# RKE2 di un'altra installazione, invece di provarci e fallire mezz'ora dopo.
#
# E' il controllo che in questo repository esiste gia' per Kafka (un nodo con
# dati o con un node.id diverso non si riformatta) e per Elasticsearch. Qui
# serve per la stessa ragione: una macchina che e' stata master di un cluster a
# 3 nodi conserva il datastore etcd di QUEL cluster, e riaccendendo rke2-server
# etcd si mette a cercare gli altri due membri.
#
# Lo stato precedente viene ignorato quando l'API server risponde gia': quello
# non e' un residuo, e' l'installazione di questo stesso nodo, e rilanciare il
# playbook su un nodo che funziona deve restare innocuo.
rsn_pretendi_nodo_pulito: true


# ===========================================================================
# 4. STRUMENTI SUL NODO
# ===========================================================================

rsn_kubeconfig: "/root/.kube/config"
rsn_install_helm: true

# kubectl con cui il ruolo interroga il cluster. Il percorso pieno di RKE2, non
# "kubectl" e basta: nei primi task di questo ruolo /usr/local/bin/kubectl puo'
# non esistere ancora.
rsn_kubectl: "/var/lib/rancher/rke2/bin/kubectl"

# Attesa che Traefik sia pronto, subito dopo averlo installato. Il chart arriva
# da traefik.github.io e lo scarica un POD: se i pod non risolvono i nomi, il
# job resta li' a riprovare per sempre — e' il guasto che ha bloccato
# l'installazione a 3 nodi.
rsn_traefik_retries: 60
rsn_traefik_delay: 10


# ===========================================================================
# 5. RANCHER
# ===========================================================================

rsn_rancher_namespace: "cattle-system"
rsn_rancher_repo_name: "rancher-stable"
rsn_rancher_repo_url: "https://releases.rancher.com/server-charts/stable"

# Da dove viene il certificato del dominio Rancher:
#
#   "secret"   i .pem che stanno in roles/master1_helm_cert_manager_install/files/,
#              come nell'installazione a 3 nodi. Serve un certificato valido per
#              rancher_domain.
#
#   "rancher"  Rancher si genera una CA sua e firma da solo. NON serve nessun
#              file, ma serve cert-manager, che questo ruolo installa. E' la
#              scelta comoda in laboratorio: il browser mostrera' un avviso di
#              certificato non fidato, ed e' normale.
rsn_tls_source: "secret"

# Numero di repliche di Rancher. TRE E' IL DEFAULT DEL CHART e su un nodo solo
# e' sbagliato: le tre repliche hanno una anti-affinity per nodo, quindi due
# resterebbero Pending per sempre e il deployment non diventerebbe mai pronto.
rsn_rancher_replicas: 1

rsn_ingress_class: "{{ rancher_ingress_class | default('traefik') }}"

# cert-manager, installato solo con rsn_tls_source = "rancher".
rsn_cert_manager_version: "v1.16.2"
rsn_cert_manager_namespace: "cert-manager"
rsn_cert_manager_repo_url: "https://charts.jetstack.io"

rsn_rancher_wait_timeout: 900

# --- Cluster downstream -----------------------------------------------------
# true = dopo Rancher si crea il cluster downstream e ci si agganciano i nodi di
# [new_managers], [workers] e [ingress], con lo STESSO ruolo del percorso a 3
# nodi (master1_create_cluster): stesse API, stesso token di registrazione,
# stesso system-agent-install.sh.
#
# Con i tre gruppi vuoti il cluster viene creato in Rancher e resta ad aspettare
# nodi. E' voluto, ed e' quello che fa anche l'installazione a 3 nodi.
#
# Il nome, la versione di Kubernetes e il CNI del cluster downstream restano
# cluster_name, cluster_k8s_version e cluster_cni in group_vars/all.yml: sono le
# stesse variabili dei 3 nodi, e non ne servono altre.
rsn_crea_cluster_downstream: true


# ===========================================================================
# 6. VERIFICA
# ===========================================================================

rsn_verify: true
