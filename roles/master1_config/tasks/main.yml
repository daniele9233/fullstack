---
# Scrive /etc/rancher/rke2/config.yaml e avvia rke2-server.
#
# Il file NON sceglie ne' il CNI ne' l'ingress (vedi il template): quelle sono
# le righe che tenevano giu' l'installazione. Quello che c'e' serve a fare di
# piu' macchine un cluster solo, e gira con serial: 1 dal playbook — prima il
# bootstrap, poi i server che si uniscono, uno alla volta.

- name: Crea la directory di configurazione RKE2
  file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Verifica se rke2-server e' gia' attivo
  systemd:
    name: rke2-server
  register: rke2_service_state
  failed_when: false

# --- Token del cluster -------------------------------------------------------
# Con rke2_token valorizzato si usa quello su tutti i server. Con rke2_token
# vuoto (default) il primo master bootstrappa senza token, RKE2 gliene genera
# uno, e i master successivi lo leggono direttamente da lui.
#
# La lettura e' delegata al primo master invece di appoggiarsi a un fact
# propagato fra i batch di serial: 1. Cosi' funziona anche rilanciando il
# playbook con --limit su un solo nodo aggiuntivo.

- name: Usa il token pre-condiviso se configurato
  set_fact:
    rke2_effective_token: "{{ rke2_token }}"
  when: rke2_token | default('') | length > 0

- name: Leggi il node-token generato dal primo master
  slurp:
    src: /var/lib/rancher/rke2/server/node-token
  delegate_to: "{{ groups['masters'][0] }}"
  register: rke2_node_token_raw
  when:
    - groups['masters'] | length > 1
    - rke2_token | default('') | length == 0
    - inventory_hostname != groups['masters'][0]

- name: Usa il node-token letto dal primo master
  set_fact:
    # trim obbligatorio: il file termina con newline, che finirebbe nel token.
    rke2_effective_token: "{{ rke2_node_token_raw.content | b64decode | trim }}"
  when:
    - groups['masters'] | length > 1
    - rke2_token | default('') | length == 0
    - inventory_hostname != groups['masters'][0]

# --- Ingress controller ------------------------------------------------------
# SI CHIEDE AL BINARIO PRIMA DI SCRIVERE, e non e' pignoleria: "ingress-controller"
# non esiste su tutte le versioni di RKE2, e un config.yaml con dentro
# un'opzione sconosciuta fa RIFIUTARE la configurazione a rke2-server, che non
# parte affatto. E' successo, ed e' costata l'installazione: il fallimento
# arrivava come un avvio che non riusciva, senza dire che il problema era una
# riga scritta da noi.
#
# Il costo di questo controllo e' una chiamata a --help. Il costo di non farlo
# e' un cluster che non si alza.
#
# "NON HO POTUTO CHIEDERE" NON E' "IL FLAG NON C'E'", e la prima versione di
# questo controllo confondeva le due cose: eseguiva "rke2 server --help" con
# failed_when: false e, se l'uscita era vuota — binario non sul PATH del task,
# comando non riuscito, qualunque cosa — concludeva che l'opzione non esistesse
# e fermava il playbook su un RKE2 che invece la conosceva benissimo.
#
# Adesso il binario si cerca per percorso assoluto, stderr si unisce a stdout
# (rke2 stampa li' il banner di versione), e si blocca SOLO quando la domanda ha
# davvero avuto risposta. Se la risposta non arriva si prosegue avvisando: in
# quel caso un'opzione sconosciuta fa fallire l'avvio di rke2-server in modo
# rumoroso, con il journal che lo dice — e' un rischio, ma minore di fermare
# un'installazione che andrebbe bene.

- name: Chiedi a RKE2 quali opzioni conosce
  shell: |
    for b in /usr/local/bin/rke2 /usr/bin/rke2 "$(command -v rke2 2>/dev/null)"; do
      if [ -n "$b" ] && [ -x "$b" ]; then
        exec "$b" server --help 2>&1
      fi
    done
    echo "rke2: binario non trovato"
    exit 127
  args:
    executable: /bin/bash
  register: rke2_help
  changed_when: false
  failed_when: false
  when: rke2_ingress_controller | default([]) | length > 0

- name: Fermati se questo RKE2 non conosce ingress-controller
  fail:
    msg: |
      Su {{ inventory_hostname }} e' stato chiesto
      rke2_ingress_controller: {{ rke2_ingress_controller | join(', ') }}
      ma questo RKE2 non dichiara l'opzione "--ingress-controller".

      Scrivendola lo stesso in config.yaml, rke2-server rifiuterebbe la
      configurazione e non partirebbe: non e' un avvio lento, e' un cluster che
      non si alza.

      Verifica sul nodo che cosa conosce:
        rke2 --version
        rke2 server --help | grep -i ingress

      Due strade: svuotare rke2_ingress_controller in group_vars/all.yml (torna
      il default di RKE2, cioe' ingress-nginx), oppure portare RKE2 a una
      versione che l'opzione ce l'ha.
  when:
    - rke2_ingress_controller | default([]) | length > 0
    - rke2_help.rc | default(1) == 0
    - "'--ingress-controller' not in (rke2_help.stdout | default(''))"

- name: Avvisa che non e' stato possibile interrogare il binario rke2
  debug:
    msg: |
      Su {{ inventory_hostname }} non e' riuscito "rke2 server --help"
      (codice {{ rke2_help.rc | default('?') }}), quindi non si sa se questo RKE2
      conosca l'opzione "ingress-controller". Si prosegue: se non la conosce,
      rke2-server non partira' e il journal lo dira' chiaramente.

      Uscita del comando:
      {{ (rke2_help.stdout | default('')) [:400] }}
      {{ (rke2_help.stderr | default('')) [:400] }}
  when:
    - rke2_ingress_controller | default([]) | length > 0
    - rke2_help.rc | default(1) != 0

# I valori li dichiara RKE2 nel proprio --help. Uno scritto male non fa partire
# il server, esattamente come l'opzione sconosciuta.
- name: Verifica che i valori di ingress-controller siano ammessi
  assert:
    that:
      - rke2_ingress_controller | difference(['none', 'ingress-nginx', 'traefik']) | length == 0
    fail_msg: >-
      rke2_ingress_controller contiene
      {{ rke2_ingress_controller | difference(['none', 'ingress-nginx', 'traefik']) | join(', ') }},
      che RKE2 non accetta. I valori ammessi sono: none, ingress-nginx, traefik.
      Il primo della lista diventa anche la IngressClass predefinita.
    quiet: yes
  when: rke2_ingress_controller | default([]) | length > 0

- name: Create /etc/rancher/rke2/config.yaml
  template:
    src: config_master1.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: '0600'
  register: rke2_config

# --- SI RILEGGE QUELLO CHE SI E' APPENA SCRITTO ------------------------------
#
# Non e' paranoia, e' la lezione di un guasto vero. Il template produceva
#
#   tls-san:
#     - dominio  - 192.168.1.64  - 192.168.1.65  - 192.168.1.66
#
# perche' i tag Jinja "{%- for %}" con trim_blocks (che Ansible attiva di suo)
# toglievano anche l'a-capo PRIMA del tag. Quella riga e' YAML VALIDO: un
# elemento solo, una stringa senza senso. rke2-server partiva, il cluster
# funzionava, e il dominio semplicemente NON entrava nel certificato dell'API
# server — senza un errore da nessuna parte, per giorni.
#
# Lo stesso bug su "ingress-controller" produceva "ingress-controller:  - traefik",
# che invece YAML valido non e', e li' rke2-server si e' rifiutato di partire.
# Un difetto silenzioso e uno rumoroso, con la stessa unica causa.
#
# Quindi: si rilegge il file dal nodo, lo si interpreta come YAML, e si
# controlla che dica quello che doveva dire. Costa due task e chiude tutta la
# categoria.

- name: Rileggi config.yaml dal nodo
  slurp:
    src: /etc/rancher/rke2/config.yaml
  register: rke2_config_scritto

- name: Interpreta config.yaml e verifica che dica quello che deve dire
  block:
    - name: Interpreta config.yaml come YAML
      set_fact:
        rke2_config_letto: "{{ rke2_config_scritto.content | b64decode | from_yaml }}"

    - name: Controlla le chiavi di config.yaml
      assert:
        that:
          # tls-san dev'essere una LISTA con il dominio piu' un IP per master.
          # E' il controllo che avrebbe preso il guasto silenzioso.
          - rke2_config_letto['tls-san'] is sequence
          - rke2_config_letto['tls-san'] is not string
          - rke2_config_letto['tls-san'] | length == (1 + (groups['masters'] | length)
                                                        + (rke2_extra_tls_san | default([]) | length))
          - rancher_domain in rke2_config_letto['tls-san']
          - rke2_config_letto['node-ip'] | string == rke2_node_ip | string
          # L'ingress solo se e' stato chiesto, e identico a come e' stato chiesto.
          - (rke2_ingress_controller | default([]) | length == 0)
            or (rke2_config_letto['ingress-controller'] | default([]) == rke2_ingress_controller)
          # Con piu' di un master, chi non bootstrappa deve avere "server:".
          - (groups['masters'] | length == 1)
            or (inventory_hostname == groups['masters'][0])
            or (rke2_config_letto['server'] | default('') | length > 0)
        fail_msg: |
          /etc/rancher/rke2/config.yaml su {{ inventory_hostname }} non contiene
          quello che doveva contenere. Interpretato:

          {{ rke2_config_letto | to_nice_yaml }}

          rke2-server NON e' stato avviato: un config.yaml sbagliato-ma-valido
          fa partire un cluster storto invece di fallire, ed e' peggio.
        quiet: yes

  rescue:
    - name: Interrompi mostrando il file che non si lascia leggere
      fail:
        msg: |
          /etc/rancher/rke2/config.yaml su {{ inventory_hostname }} non e' YAML
          valido, oppure non dice quello che doveva dire.

          Contenuto scritto dal playbook:
          ---
          {{ rke2_config_scritto.content | b64decode }}
          ---

          rke2-server NON e' stato avviato: sarebbe morto con "yaml: line N: ..."
          e il playbook sarebbe finito a leggere il journal per scoprire una cosa
          che si vede da qui.

          Se le liste appaiono collassate su una riga sola, il difetto e' nei tag
          Jinja del template (vedi il commento in testa a
          templates/config_master1.yaml.j2): Ansible usa trim_blocks, quindi
          "{%- for %}" toglie un a-capo di troppo.


# block/rescue: se rke2-server non parte, systemd restituisce solo "exited with
# error code". Il motivo sta nel journal, che qui viene raccolto e stampato
# invece di lasciare il fallimento cieco.
- name: Avvio di rke2-server
  block:
    - name: Abilita e avvia rke2-server
      systemd:
        name: rke2-server
        enabled: yes
        state: started
        daemon_reload: yes
  rescue:
    # LE RIGHE DI ERRORE PRIMA, E POCHE. Prima si stampavano 80 righe di journal
    # dalla piu' vecchia alla piu' recente: la causa e' l'ULTIMA, quindi finiva
    # in fondo a un muro di INFO sui manifest applicati — e in un terminale o in
    # un incollaggio quella coda si perde, lasciando in mano solo il rumore.
    #
    # Adesso si filtra prima per le righe che dicono qualcosa (fatal, error,
    # flag sconosciuti, YAML che non si lascia leggere) e si mostrano quelle in
    # cima. Le ultime 30 righe restano sotto, come contesto.
    - name: Raccogli gli ultimi log di rke2-server
      shell: |
        set -o pipefail
        echo "### RIGHE DI ERRORE ###"
        journalctl -u rke2-server --no-pager -n 300 -o cat 2>&1 \
          | grep -iE 'level=(fatal|error)|flag provided but not defined|not defined|cannot unmarshal|yaml:|invalid|panic:|Failed to' \
          | tail -15 \
          || echo "(nessuna riga di errore riconosciuta: guarda il contesto qui sotto)"
        echo
        echo "### ULTIME 30 RIGHE ###"
        journalctl -u rke2-server --no-pager -n 30 -o cat 2>&1
      args:
        executable: /bin/bash
      register: rke2_journal
      failed_when: false
      changed_when: false

    - name: Interrompi mostrando il motivo del fallimento
      fail:
        msg: |
          Avvio di rke2-server fallito su {{ inventory_hostname }}.

          {{ rke2_journal.stdout }}

          Il file che il playbook ha appena scritto e'
          /etc/rancher/rke2/config.yaml: se l'errore qui sopra nomina
          un'opzione, e' li' dentro.

# Il task sopra non riavvia un servizio gia' in esecuzione: senza questo, una
# modifica al tls-san su un nodo gia' attivo resterebbe senza effetto.
- name: Riavvia rke2-server se la configurazione e' cambiata
  systemd:
    name: rke2-server
    state: restarted
  when:
    - rke2_config is changed
    - rke2_service_state.status.ActiveState | default('inactive') == 'active'

# Al primo avvio RKE2 scarica ed estrae le immagini dei componenti di sistema:
# qualche minuto e' normale. I ruoli dopo questo copiano
# /var/lib/rancher/rke2/bin/kubectl e /etc/rancher/rke2/rke2.yaml, che prima di
# qui non esistono.
- name: Attendi che l'API server risponda
  command: >-
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get --raw=/readyz
  register: rke2_readyz
  until: rke2_readyz.rc == 0
  retries: "{{ rke2_ready_retries }}"
  delay: "{{ rke2_ready_delay }}"
  changed_when: false
  failed_when: false

- name: Leggi perche' rke2-server non e' partito
  shell: journalctl -u rke2-server -n 40 --no-pager -o cat 2>&1 | tail -40
  args:
    executable: /bin/bash
  register: rke2_journal
  changed_when: false
  failed_when: false
  when: rke2_readyz.rc != 0

- name: Fermati spiegando perche' rke2-server non e' partito
  fail:
    msg: |
      Su {{ inventory_hostname }} l'API server non ha risposto entro
      {{ rke2_ready_retries | int * rke2_ready_delay | int }} secondi.

      Ultime righe del journal di rke2-server:
      {{ rke2_journal.stdout | default('(journal non leggibile)') }}
  when: rke2_readyz.rc != 0

# BARRIERA PRIMA DI PASSARE AL MASTER SUCCESSIVO.
#
# Conta i server etcd in stato Ready e attende che siano tanti quanti i master
# avviati fino a questo punto: e' la prova che il nodo corrente e' davvero
# ENTRATO nel cluster, non solo che il suo processo e' partito. /readyz da solo
# non basta — risponde ok appena l'API server locale e' su, quando il nodo puo'
# non essere ancora registrato.
#
# Con un master solo l'indice e' 0 e la condizione e' ">= 1": la stessa
# espressione vale per tutti e due i casi.
- name: Attendi che tutti i master avviati finora siano Ready
  shell: >-
    set -o pipefail;
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get nodes -l node-role.kubernetes.io/etcd=true --no-headers
    | awk '$2 == "Ready"' | wc -l
  args:
    executable: /bin/bash
  register: rke2_ready_masters
  until: rke2_ready_masters.stdout | int >= (groups['masters'].index(inventory_hostname) + 1)
  retries: "{{ rke2_ready_retries }}"
  delay: "{{ rke2_ready_delay }}"
  changed_when: false

# RKE2 aggiunge ogni nuovo server come learner etcd e lo promuove a membro
# votante poco DOPO che il nodo risulta Ready. Aggiungere il server successivo
# dentro a quella finestra fa fallire l'avvio di rke2-server. Solo fra un master
# e il successivo: sull'ultimo (e sul nodo singolo) non si aspetta niente.
- name: Lascia stabilizzare etcd prima del master successivo
  pause:
    seconds: "{{ rke2_settle_seconds }}"
  when:
    - groups['masters'] | length > 1
    - inventory_hostname != groups['masters'][-1]

- name: Mostra lo stato del cluster locale
  command: >-
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get nodes
  register: rke2_nodes
  changed_when: false

- name: Riepilogo nodo
  debug:
    msg: |
      {{ inventory_hostname }} ({{ 'bootstrap' if inventory_hostname == groups['masters'][0] else 'join su ' + hostvars[groups['masters'][0]].ansible_host }})
      CNI e ingress: default RKE2 (canal, ingress-nginx)
      {{ rke2_nodes.stdout }}
