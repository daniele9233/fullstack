---
# Scrive la configurazione RKE2 e avvia il server. Il play che invoca questo
# ruolo gira con serial: 1, quindi i master vengono portati su uno alla volta
# nell'ordine dell'inventario: prima il bootstrap, poi i due che si uniscono.

- name: Crea la directory di configurazione RKE2
  file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Verifica se rke2-server e' gia' attivo
  systemd:
    name: rke2-server
  register: rke2_service_state
  failed_when: false

# --- Token del cluster -------------------------------------------------------
# Con rke2_token valorizzato si usa quello su tutti i master. Con rke2_token
# vuoto (default) il primo master bootstrappa senza token, RKE2 gliene genera
# uno, e i master successivi lo leggono direttamente da lui.
#
# La lettura e' delegata al primo master invece di appoggiarsi a un fact
# propagato tra i batch di serial: 1. Cosi' funziona anche rilanciando il
# playbook con --limit su un solo nodo aggiuntivo.

- name: Usa il token pre-condiviso se configurato
  set_fact:
    rke2_effective_token: "{{ rke2_token }}"
  when: rke2_token | length > 0

- name: Leggi il node-token generato dal primo master
  slurp:
    src: /var/lib/rancher/rke2/server/node-token
  delegate_to: "{{ groups['masters'][0] }}"
  register: rke2_node_token_raw
  when:
    - rke2_token | length == 0
    - inventory_hostname != groups['masters'][0]

- name: Usa il node-token letto dal primo master
  set_fact:
    # trim obbligatorio: il file termina con newline, che finirebbe nel token.
    rke2_effective_token: "{{ rke2_node_token_raw.content | b64decode | trim }}"
  when:
    - rke2_token | length == 0
    - inventory_hostname != groups['masters'][0]

- name: Create /etc/rancher/rke2/config.yaml
  template:
    src: config_master1.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: '0600'
  register: rke2_config

# La porta del supervisor deve essere libera prima di avviare. Se e' occupata
# mentre rke2-server NON e' attivo, si tratta di un processo orfano di
# un'installazione precedente: meglio dirlo subito che lasciare systemd in
# restart loop con "bind: address already in use".
- name: Verifica che la porta del supervisor sia libera
  shell: >-
    ss -lntp | awk '$4 ~ /:{{ rke2_supervisor_port }}$/' || true
  args:
    executable: /bin/bash
  register: rke2_port_check
  changed_when: false
  when: rke2_service_state.status.ActiveState | default('inactive') != 'active'

- name: Interrompi se la porta del supervisor e' gia' occupata
  fail:
    msg: |
      Sul nodo {{ inventory_hostname }} la porta {{ rke2_supervisor_port }} e'
      gia' occupata mentre rke2-server non e' attivo:

      {{ rke2_port_check.stdout }}

      Il processo indicato sopra dice cosa fare:

        - rke2 o containerd: residuo di un'installazione precedente. Rilancia
          con -e clean_nodes_before_join=true, oppure esegui sul nodo
          /usr/local/bin/rke2-killall.sh

        - nginx, haproxy o simili: e' un bilanciatore configurato in passato su
          questa macchina, e va fermato o riconfigurato a mano. Il playbook non
          lo tocca di proposito.
  when:
    - rke2_service_state.status.ActiveState | default('inactive') != 'active'
    - rke2_port_check.stdout | default('') | length > 0

# block/rescue: se rke2-server non parte, systemd restituisce solo "exited with
# error code". Il motivo sta nel journal, che qui viene raccolto e stampato
# invece di lasciare il fallimento cieco.
- name: Avvio di rke2-server
  block:
    - name: Abilita e avvia rke2-server
      systemd:
        name: rke2-server
        enabled: yes
        state: started
        daemon_reload: yes
  rescue:
    - name: Raccogli gli ultimi log di rke2-server
      command: journalctl -u rke2-server --no-pager -n 80
      register: rke2_journal
      failed_when: false
      changed_when: false

    - name: Interrompi mostrando il motivo del fallimento
      fail:
        msg: |
          Avvio di rke2-server fallito su {{ inventory_hostname }}.
          Ultime righe del journal:
          {{ rke2_journal.stdout }}

# Il task sopra non riavvia un servizio gia' in esecuzione, quindi una modifica
# alla configurazione su un nodo gia' attivo resterebbe senza effetto.
- name: Riavvia rke2-server se la configurazione e' cambiata
  systemd:
    name: rke2-server
    state: restarted
  when:
    - rke2_config is changed
    - rke2_service_state.status.ActiveState | default('inactive') == 'active'

# --- Barriera prima di passare al master successivo --------------------------
# RKE2 aggiunge ogni nuovo server come learner etcd e lo promuove a membro
# votante solo quando ha recuperato il log. Aggiungere il server successivo
# durante quella finestra fa fallire l'avvio di rke2-server.
#
# /readyz da solo NON basta come barriera: risponde ok appena l'API server
# locale e' su, quando il nodo non e' ancora registrato ne' promosso.

- name: Attendi che l'API server del nodo risponda
  command: >-
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get --raw=/readyz
  register: rke2_readyz
  until: rke2_readyz.rc == 0
  retries: "{{ rke2_ready_retries }}"
  delay: "{{ rke2_ready_delay }}"
  changed_when: false

# Conta i nodi etcd in stato Ready e attende che siano tanti quanti i master
# avviati fino a questo punto: e' la prova che il nodo corrente e' davvero
# entrato nel cluster, non solo che il suo processo e' partito.
- name: Attendi che tutti i master avviati finora siano Ready
  shell: >-
    set -o pipefail;
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get nodes -l node-role.kubernetes.io/etcd=true --no-headers
    | awk '$2 == "Ready"' | wc -l
  args:
    executable: /bin/bash
  register: rke2_ready_masters
  until: rke2_ready_masters.stdout | int >= (groups['masters'].index(inventory_hostname) + 1)
  retries: "{{ rke2_ready_retries }}"
  delay: "{{ rke2_ready_delay }}"
  changed_when: false

# Margine per la promozione da learner a membro votante, che avviene poco dopo
# che il nodo risulta Ready. Solo tra un master e il successivo.
- name: Lascia stabilizzare etcd prima del master successivo
  pause:
    seconds: "{{ rke2_settle_seconds }}"
  when:
    - groups['masters'] | length > 1
    - inventory_hostname != groups['masters'][-1]

- name: Mostra lo stato del cluster locale
  command: >-
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    get nodes
  register: rke2_nodes
  changed_when: false

- name: Riepilogo nodo
  debug:
    msg: |
      {{ inventory_hostname }} ({{ 'bootstrap' if inventory_hostname == groups['masters'][0] else 'join su ' + hostvars[groups['masters'][0]].ansible_host }})
      {{ rke2_nodes.stdout }}
