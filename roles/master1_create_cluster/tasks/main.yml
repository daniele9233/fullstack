---
# Pausa di assestamento dopo l'installazione di Rancher. E' cieca di proposito:
# nel percorso a 3 nodi questo ruolo parte subito dopo "helm install rancher",
# quando l'API puo' rispondere al login ma non essere ancora pronta a
# provisionare.
#
# Sul nodo singolo non serve: li' rancher_single_node ha gia' verificato che la
# console risponda, e il playbook passa cluster_pausa_iniziale: 0.
- name: Attesa di assestamento di Rancher
  pause:
    seconds: "{{ cluster_pausa_iniziale }}"
  delegate_to: "{{ ansibleSshHost }}"
  when: cluster_pausa_iniziale | int > 0

# until/retries: la pausa qui sopra e' un'attesa a tempo, questa e' un'attesa
# sul fatto. Se Rancher non e' ancora in piedi il login fallisce e si riprova,
# invece di far cadere il playbook al primo tentativo.
#
# ATTENZIONE A CHI PARLA CON CHI: la chiamata parte dal CONTROL NODE
# (delegate_to), non dal master. Quindi conta come il control node risolve
# rancher_domain e chi risponde a quell'indirizzo — non quello che gira sui
# master. Il rescue qui sotto va a guardare esattamente quello, perche' "Status
# code was -1" da solo non dice niente.
- name: Login all'API di Rancher
  block:
    - name: Get Rancher API token
      delegate_to: "{{ ansibleSshHost }}"
      uri:
        url: "https://{{ rancher_domain }}/v3-public/localProviders/local?action=login"
        method: POST
        body_format: json
        validate_certs: no
        body:
          username: "admin"
          password: "{{ rancher_password }}"
        return_content: yes
        status_code: [200, 201]
      register: api_token_response
      until: api_token_response.status | default(0) in [200, 201]
      retries: "{{ cluster_login_retries }}"
      delay: "{{ cluster_login_delay }}"

  rescue:
    - name: Guarda a quale indirizzo risponde il dominio
      shell: >-
        getent hosts {{ rancher_domain }} 2>&1;
        echo '--- chi risponde sulla 443 ---';
        timeout 5 curl -sS -o /dev/null -w 'HTTP %{http_code} da %{remote_ip}:%{remote_port}\n'
        -k https://{{ rancher_domain }}/ping 2>&1
      args:
        executable: /bin/bash
      delegate_to: "{{ ansibleSshHost }}"
      register: cluster_dns_check
      changed_when: false
      failed_when: false

    - name: Fermati spiegando chi non risponde
      fail:
        msg: |
          Il login all'API di Rancher non riesce da {{ ansibleSshHost }} (il control node).

          URL: https://{{ rancher_domain }}/v3-public/localProviders/local?action=login
          Esito: {{ api_token_response.msg | default('nessuna risposta') }}

          Dal control node, {{ rancher_domain }} risolve e risponde cosi':
          {{ cluster_dns_check.stdout | default('(nessun esito)') }}

          {% if 'Connection refused' in (api_token_response.msg | default('')) %}
          "Connection refused" vuol dire che l'indirizzo si risolve ma su quella
          macchina NESSUNO ascolta sulla 443. Le due cause solite:

            1. il dominio punta a un bilanciatore su cui nginx non c'e' o non e'
               in ascolto. nginx qui ascolta SOLO su vip_rancher_ip:443
               (roles/nginx_install/templates/rancher-console.conf.j2), quindi
               rancher_endpoint_ip deve valere il VIP, non l'IP di una delle due
               macchine — e playbooks/10-bilanciatori.yml dev'essere gia' girato.

            2. il dominio punta ai master, ma sui master la 443 non la tiene
               nessuno perche' Traefik non e' partito. In quel caso il playbook
               si e' gia' fermato prima, su traefik_install.

          Adesso rancher_endpoint_ip vale
          "{{ rancher_endpoint_ip | default('(non impostata: si usa il primo master)') }}"
          e vip_rancher_ip vale "{{ vip_rancher_ip | default('(non impostata)') }}".
          {% elif 'timed out' in (api_token_response.msg | default('')) or 'timeout' in (api_token_response.msg | default('')) %}
          Un timeout (invece di un rifiuto) di solito e' un firewall in mezzo, o
          un indirizzo su cui non c'e' nessuna macchina accesa.
          {% elif api_token_response.status | default(0) == 401 %}
          401: il dominio risponde, ma la password non e' quella. E'
          rancher_password, e conta quella usata al PRIMO avvio di Rancher: se il
          bootstrap e' gia' avvenuto con un'altra, cambiarla qui non basta.
          {% endif %}

- name: Set Rancher server URL (completa setup iniziale)
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/settings/server-url"
    method: PUT
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      name: server-url
      value: "https://{{ rancher_domain }}"
    status_code: 200
    validate_certs: no

- name: Accept Rancher EULA
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/setting/first-login"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    status_code: [200, 204, 409]
    validate_certs: no
  ignore_errors: yes

# Il POST qui sotto crea il cluster e accetta solo 201: al secondo run
# risponderebbe 409 e il playbook si fermerebbe. Si guarda prima se il cluster
# c'e' gia' e, se c'e', non si tocca — riapplicare la definizione a un cluster
# in esercizio farebbe ripartire i nodi.
- name: Verifica se il cluster downstream esiste gia'
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    status_code: [200, 404]
    validate_certs: no
  register: cluster_esistente

- name: Mostra se il cluster va creato
  debug:
    msg: >-
      {{ ('Il cluster ' ~ cluster_name ~ ' esiste gia in fleet-default: non viene ricreato.')
         if cluster_esistente.status == 200
         else ('Il cluster ' ~ cluster_name ~ ' non esiste: viene creato adesso.') }}

# --- resolv.conf dei nodi downstream -----------------------------------------
# Stessa storia del cluster locale (vedi rke2_resolv_conf in group_vars): senza,
# il CoreDNS del cluster downstream inoltra a 8.8.8.8 e su rete chiusa non
# risolve niente — il primo a caderci e' il chart di Traefik.
#
# Il file va cercato SUI NODI, non qui: questo ruolo gira sul primo master. Se
# manca anche su uno solo, la riga non si scrive: un resolv-conf che punta al
# nulla e' peggio di nessun resolv-conf.
- name: Verifica il resolv.conf sui nodi del cluster downstream
  stat:
    path: "{{ cluster_resolv_conf }}"
  delegate_to: "{{ item }}"
  loop: >-
    {{ (groups['new_managers'] | default([]))
       + (groups['workers'] | default([]))
       + (groups['ingress'] | default([])) }}
  register: cluster_resolv_stat
  changed_when: false
  when: cluster_resolv_conf | default('') | length > 0

- name: Stabilisci se scrivere resolv-conf nel cluster downstream
  set_fact:
    cluster_resolv_senza: >-
      {{ cluster_resolv_stat.results | default([])
         | selectattr('stat', 'defined')
         | rejectattr('stat.exists')
         | map(attribute='item') | list }}

- name: Mostra la scelta su resolv-conf
  debug:
    msg: >-
      {{ ('Il cluster downstream nascera con resolv-conf: ' ~ cluster_resolv_conf)
         if (cluster_resolv_conf | default('') | length > 0 and cluster_resolv_senza | length == 0)
         else ('resolv-conf NON verra scritto: '
               ~ ('disabilitato (cluster_resolv_conf vuoto)'
                  if cluster_resolv_conf | default('') | length == 0
                  else cluster_resolv_conf ~ ' non esiste su ' ~ (cluster_resolv_senza | join(', '))
                       ~ '. Su rete chiusa quel cluster non risolvera i nomi esterni.')) }}

- name: Create a new Kubernetes RKE2 custom cluster via Rancher API
  when: cluster_esistente.status == 404
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      type: "provisioning.cattle.io.cluster"
      metadata:
        name: "{{ cluster_name }}"
        namespace: "fleet-default"
      spec:
        kubernetesVersion: "{{ cluster_k8s_version }}"
        rkeConfig:
          # Costruito come dizionario e non riga per riga perche' resolv-conf
          # c'e' solo quando il file esiste su tutti i nodi: una chiave che
          # compare o non compare non si scrive con un "when" in mezzo a un body.
          #
          # disable: stesso standard del cluster locale — Calico come CNI e
          # Traefik come ingress, quindi il nginx packaged non va installato.
          # Traefik lo mette il ruolo traefik_install sui nodi [new_managers].
          machineGlobalConfig: >-
            {{ {
                 'cni': cluster_cni,
                 'disable-kube-proxy': false,
                 'etcd-expose-metrics': false,
                 'disable': cluster_disable
               } | combine(
                 {'resolv-conf': cluster_resolv_conf}
                 if (cluster_resolv_conf | default('') | length > 0
                     and cluster_resolv_senza | length == 0)
                 else {}) }}
          # Valori per i chart packaged del cluster downstream. Serve a imporre a
          # Calico con quale indirizzo annunciarsi: senza, sceglie la prima
          # interfaccia che trova e su una macchina con piu' interfacce prende
          # quella sbagliata — e il traffico fra pod di nodi diversi sparisce in
          # silenzio. Vedi cluster_chart_values in group_vars/all.yml.
          chartValues: "{{ cluster_chart_values | default({}) }}"
          machineSelectorConfig:
            - config:
                protect-kernel-defaults: false
          registries: {}
          upgradeStrategy:
            controlPlaneConcurrency: "1"
            controlPlaneDrainOptions:
              enabled: false
              force: false
              ignoreDaemonSets: true
              skipWaitForDeleteTimeout: 0
              timeout: 120
            workerConcurrency: "1"
            workerDrainOptions:
              enabled: false
              force: false
              ignoreDaemonSets: true
              skipWaitForDeleteTimeout: 0
              timeout: 120
          etcd:
            snapshotScheduleCron: "0 */5 * * *"
            snapshotRetention: 5
            disableSnapshots: false
        defaultPodSecurityPolicyTemplateName: ""
        defaultPodSecurityAdmissionConfigurationTemplateName: ""
        defaultClusterRoleForProjectMembers: ""
        enableNetworkPolicy: false
        fleetWorkspaceName: "fleet-default"
    status_code: 201
    validate_certs: no
  register: create_cluster_result

- name: Show cluster creation result
  debug:
    var: create_cluster_result.json
  when: cluster_esistente.status == 404

- name: Wait for cluster to be provisioned
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: cluster_status
  until: cluster_status.json.status is defined and cluster_status.json.status.conditions is defined
  retries: 30
  delay: 10
  ignore_errors: yes

- name: Get cluster ID from legacy API for registration token
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusters?name={{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: legacy_cluster_info
  retries: 10
  delay: 5

- name: Debug cluster info
  debug:
    var: legacy_cluster_info.json

- name: Get or create cluster registration token
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusterregistrationtokens"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      type: "clusterRegistrationToken"
      clusterId: "{{ legacy_cluster_info.json.data[0].id }}"
    status_code: [201, 409]  # 409 se il token esiste già
    validate_certs: no
  register: registration_token_result
  when: legacy_cluster_info.json.data | length > 0
  ignore_errors: yes

- name: Wait for registration token to be ready
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusterregistrationtokens?clusterId={{ legacy_cluster_info.json.data[0].id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: token_list
  until: token_list.json.data | length > 0 and token_list.json.data[0].nodeCommand is defined and token_list.json.data[0].nodeCommand != ""
  retries: 20
  delay: 10

# Legge da cluster_name e cluster_k8s_version, non da create_cluster_result:
# quel registro non esiste quando il cluster c'era gia' e il task di creazione
# e' stato saltato.
- name: Show cluster status
  debug:
    msg: |
      Cluster {{ 'creato adesso' if cluster_esistente.status == 404 else 'gia esistente, non ricreato' }}.
      Nome: {{ cluster_name }}
      Namespace: fleet-default
      Kubernetes Version: {{ cluster_k8s_version }}
      ID legacy: {{ legacy_cluster_info.json.data[0].id | default('non ancora assegnato') }}

- name: Debug registration token
  debug:
    var: token_list.json.data[0]

- name: Extract registration details
  set_fact:
    rancher_host: "{{ rancher_domain | regex_replace('^https?://', '') }}"
    node_command: "{{ token_list.json.data[0].nodeCommand }}"

- name: Extract token from nodeCommand
  set_fact:
    cluster_token: "{{ node_command | regex_search('--token ([A-Za-z0-9:]+)', '\\1') | first }}"

- name: Debug extracted values
  debug:
    msg: |
      Rancher Host: {{ rancher_host }}
      Cluster Token: {{ cluster_token }}
      Node Command: {{ node_command }}

- name: Install system-agent and join nodes as managers
  shell: |
    # pipefail: senza, l'esito della pipeline e' quello di "sh", e un curl
    # fallito (host non risolto, rete chiusa) passa per un'installazione
    # riuscita. E' successo: tre nodi "Success" e zero nodi registrati.
    set -o pipefail
    # Download and install system-agent for manager nodes
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --token {{ cluster_token }} \
      --etcd --controlplane
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_managers_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['new_managers'] | default([]) }}"

- name: Install system-agent and join nodes as workers
  shell: |
    set -o pipefail
    # Download and install system-agent for worker nodes
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --token {{ cluster_token }} \
      --worker
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_workers_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['workers'] | default([]) }}"

- name: Install system-agent and join nodes as ingress
  shell: |
    set -o pipefail
    # Download and install system-agent for ingress nodes
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --label '{{ ingress_node_key }}={{ ingress_node_value }}' \
      --token {{ cluster_token }} \
      --worker \
      --taints '{{ ingress_node_key }}={{ ingress_node_value }}:NoSchedule'
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_ingress_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['ingress'] | default([]) }}"

- name: Wait for manager nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_managers_status
  until: join_managers_status.finished
  retries: 60
  delay: 10
  delegate_to: "{{ item.item }}"
  loop: "{{ join_managers_async.results }}"
  ignore_errors: yes

- name: Wait for worker nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_workers_status
  until: join_workers_status.finished
  retries: 120
  delay: 20
  delegate_to: "{{ item.item }}"
  loop: "{{ join_workers_async.results }}"
  ignore_errors: yes

- name: Wait for ingress nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_ingress_status
  until: join_ingress_status.finished
  retries: 120
  delay: 20
  delegate_to: "{{ item.item }}"
  loop: "{{ join_ingress_async.results }}"
  ignore_errors: yes

- name: Show manager nodes join results
  debug:
    msg: |
      Manager Node: {{ item.item.item | default('?') }}
      Status: {{ 'Success' if item.rc | default(1) == 0 else 'Failed' }}
      Output: {{ item.stdout if item.stdout is defined else 'No output' }}
      Error: {{ item.stderr if item.stderr is defined else 'No error' }}
  loop: "{{ join_managers_status.results }}"

- name: Show worker nodes join results
  debug:
    msg: |
      Worker Node: {{ item.item.item | default('?') }}
      Status: {{ 'Success' if item.rc | default(1) == 0 else 'Failed' }}
      Output: {{ item.stdout if item.stdout is defined else 'No output' }}
      Error: {{ item.stderr if item.stderr is defined else 'No error' }}
  loop: "{{ join_workers_status.results }}"

- name: Show ingress nodes join results
  debug:
    msg: |
      Ingress Node: {{ item.item.item | default('?') }}
      Status: {{ 'Success' if item.rc | default(1) == 0 else 'Failed' }}
      Output: {{ item.stdout if item.stdout is defined else 'No output' }}
      Error: {{ item.stderr if item.stderr is defined else 'No error' }}
  loop: "{{ join_ingress_status.results }}"

# --- I join falliti fermano il playbook -------------------------------------
#
# Prima non lo facevano: i tre task qui sopra stampavano "Status: Success" e il
# play finiva con failed=0 anche con zero nodi agganciati. Due difetti insieme —
# senza pipefail l'esito di "curl | sh" era quello di sh, e nessuno guardava
# quell'esito comunque.
#
# Il caso che si vede davvero: "curl: (6) Could not resolve host". I nodi da
# agganciare devono risolvere il dominio di Rancher, e devono continuare a
# risolverlo dopo — l'agent ci parla per nome, per sempre.

- name: Raccogli i nodi che non si sono agganciati
  set_fact:
    # LE PARENTESI ATTORNO ALLE TRE LISTE SONO OBBLIGATORIE.
    #
    # In Jinja il filtro "|" lega piu' stretto della somma "+", quindi
    #   a + b + c | selectattr(...) | rejectattr(...)
    # si legge
    #   a + b + (c | selectattr(...) | rejectattr(...))
    # e i primi due elenchi passano NON filtrati. Scritto cosi', questo task
    # dichiarava falliti i nodi manager e worker mostrando "uscita 0", cioe'
    # successo, mentre l'unico davvero filtrato era l'ingress.
    join_falliti: >-
      {{ ((join_managers_status.results | default([]))
          + (join_workers_status.results | default([]))
          + (join_ingress_status.results | default([])))
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | list }}

- name: Fermati se qualche nodo non si e' agganciato
  fail:
    msg: |
      {{ join_falliti | length }} nodi non si sono agganciati al cluster
      {{ cluster_name }}:

      {% for f in join_falliti %}
      {{ f.item.item | default('?') }} (uscita {{ f.rc }}):
      {{ f.stderr | default('') | trim }}

      {% endfor %}
      Se leggi "Could not resolve host", quei nodi non risolvono
      "{{ rancher_domain }}". Non e' un problema del momento del join: l'agent
      di Rancher parla con il server PER NOME, quindi quel nome deve risolvere
      su ogni nodo agganciato, sempre. Mettilo nel DNS, oppure lascia che sia il
      playbook a scrivere la riga in /etc/hosts di quei nodi — e' quello che fa
      playbooks/21-rancher-single.yml con il ruolo update_hosts_file.
  when: join_falliti | length > 0

# --- Che cosa e' arrivato davvero in Rancher --------------------------------
#
# DUE ELENCHI DIVERSI, e vanno letti in due momenti diversi. Confonderli e'
# costato dieci minuti di attesa e un "0 nodi" su un aggancio riuscito.
#
#   MACCHINE (cluster.x-k8s.io.machines) — compaiono in un minuto, appena il
#   rancher-system-agent contatta il server. Sono la prova che il JOIN e'
#   andato: nella console stanno sotto la scheda "Machines" del cluster, in
#   stato Reconciling.
#
#   NODI (v3/nodes) — compaiono MOLTO dopo: solo quando il control plane del
#   cluster downstream ha finito di installare RKE2 e il cluster agent si e'
#   connesso. Con un control plane che sta ancora scaricando RKE2, quell'elenco
#   e' vuoto, e non e' un guasto.
#
# Il playbook aspetta le MACCHINE, che sono quello che dipende da lui. Il resto
# del provisioning va avanti da solo e si guarda dalla console: bloccare qui
# vorrebbe dire tenere Ansible occupato mezz'ora per una cosa su cui non puo'
# fare niente.

- name: Attendi che le macchine compaiano in Rancher
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: >-
      https://{{ rancher_domain }}/v1/cluster.x-k8s.io.machines/fleet-default
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
    status_code: [200, 404]
  register: cluster_macchine
  until: >-
    (cluster_macchine.json.data | default([])
     | selectattr('spec.clusterName', 'defined')
     | selectattr('spec.clusterName', 'equalto', cluster_name)
     | list | length)
    >= ((groups['new_managers'] | default([]) | length)
        + (groups['workers'] | default([]) | length)
        + (groups['ingress'] | default([]) | length))
  retries: "{{ cluster_macchine_retries }}"
  delay: "{{ cluster_macchine_delay }}"
  failed_when: false

- name: Conta le macchine di questo cluster
  set_fact:
    cluster_macchine_mie: >-
      {{ cluster_macchine.json.data | default([])
         | selectattr('spec.clusterName', 'defined')
         | selectattr('spec.clusterName', 'equalto', cluster_name)
         | list }}

# I nodi veri e propri: si leggono e si riportano, NON si aspettano.
- name: Verify nodes are registered in Rancher
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/nodes?clusterId={{ legacy_cluster_info.json.data[0].id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
    status_code: [200, 404]
  register: cluster_nodes
  failed_when: false
  changed_when: false

- name: Fermati se nessuna macchina e' arrivata in Rancher
  fail:
    msg: |
      Nessuna macchina di {{ cluster_name }} risulta in Rancher dopo
      {{ cluster_macchine_retries | int * cluster_macchine_delay | int }} secondi.

      Il rancher-system-agent e' stato installato sui nodi (i task sopra sono
      riusciti), ma nessuno di loro si e' presentato al server. Da guardare, in
      quest'ordine, su uno dei nodi agganciati:

        systemctl status rancher-system-agent
        journalctl -u rancher-system-agent -n 50

      Se nel journal ci sono errori di connessione o di certificato, il nodo non
      arriva a https://{{ rancher_domain }}.
  when: cluster_macchine_mie | length == 0

- name: Show registered nodes
  debug:
    msg: |
      Cluster {{ cluster_name }}: {{ cluster_macchine_mie | length }} macchine
      registrate su {{ (groups['new_managers'] | default([]) | length)
                       + (groups['workers'] | default([]) | length)
                       + (groups['ingress'] | default([]) | length) }} agganciate.
      {% for m in cluster_macchine_mie %}
      - {{ m.metadata.name | default('?') }}:
        {{ (m.status.conditions | default([])
            | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first)
           | default('in provisioning', true) }}
      {% endfor %}

      Nodi Kubernetes gia' pronti: {{ cluster_nodes.json.data | default([]) | length }}
      {% for node in cluster_nodes.json.data | default([]) %}
      - {{ node.nodeName | default('?') }} ({{ node.ipAddress | default('?') }})
        {{ node.controlPlane | default(false) | ternary('controlplane', '') }}{{ node.etcd | default(false) | ternary(' etcd', '') }}{{ node.worker | default(false) | ternary(' worker', '') }}
        stato: {{ node.state | default('?') }}
      {% endfor %}

      {% if (cluster_nodes.json.data | default([]) | length) < (cluster_macchine_mie | length) %}
      I nodi compaiono qui solo quando il control plane del cluster downstream
      ha finito di installare RKE2 e il cluster agent si e' connesso: con le
      macchine in "Reconciling" e il messaggio "Waiting for Cluster control
      plane to be initialized" e' NORMALE che questo elenco sia ancora corto.
      Il provisioning prosegue da solo — si segue dalla console, sotto
      Cluster Management -> {{ cluster_name }} -> Machines.
      {% endif %}
