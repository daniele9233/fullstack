---
# CREAZIONE DEL CLUSTER DOWNSTREAM VIA API RANCHER.
#
# E' il ruolo del playbook di riferimento, adattato: stesse chiamate, stesso
# ordine, stesse attese. Le aggiunte sono il gruppo [ingress] (che qui esiste e
# li' no), le guardie sui gruppi vuoti, e la configurazione di rete e ingress
# del cluster — CNI, chartValues e ingress-controller.
#
# QUELLO CHE IL CORPO DELLA POST DICE AL CLUSTER, e perche' passa tutto da qui:
# da quando il cluster esiste, la configurazione dei nodi downstream la scrive
# RANCHER, non questo playbook. Non c'e' un secondo momento in cui correggere:
# machineGlobalConfig diventa il config.yaml di quei nodi, e chartValues
# diventa il HelmChartConfig dei chart packaged.
#
#   cni              cluster_cni. Calico.
#   chartValues      cluster_chart_values. Dice a Calico la MTU e con quale
#                    indirizzo annunciarsi: sono i due valori che canal prende
#                    gia' giusti e Calico no. Vuoto con canal.
#   ingress-controller  cluster_ingress_controller. Traefik, dal chart
#                    rke2-traefik impacchettato dentro RKE2: niente da scaricare
#                    da traefik.github.io mentre il cluster si costruisce.
#
# resolv-conf NON C'E' PIU', e non va rimesso per abitudine: scriveva
# /run/systemd/resolve/resolv.conf in machineGlobalConfig per far risolvere a
# CoreDNS i nomi esterni, e serviva perche' c'era un chart da scaricare da
# Internet. Con i chart packaged non c'e' piu' niente da prendere da fuori
# mentre il cluster si costruisce.
#
# Tutte le chiamate HTTPS sono delegate al control node (ansibleSshHost), che
# deve quindi risolvere rancher_domain: ci pensa il play update_hosts_file, che
# include [local] proprio per questo.


# --- Controlli prima di chiedere qualcosa a Rancher --------------------------
#
# SI CONTROLLA PRIMA, e la ragione e' che qui non c'e' un secondo tentativo
# comodo: un valore sbagliato non fa fallire la POST — Rancher la accetta — e si
# manifesta minuti dopo come nodi che si registrano e non diventano mai Ready,
# con il journal da leggere su un'altra macchina. Sul cluster locale
# master1_config puo' chiedere al binario "rke2 server --help" prima di
# scrivere; qui il binario su quei nodi non esiste ancora, quindi si controlla
# quello che si puo': i valori ammessi e la versione dichiarata.

- name: Verifica che il CNI del cluster downstream sia un valore ammesso
  assert:
    that:
      - cluster_cni in ['calico', 'canal', 'cilium', 'flannel', 'none']
    fail_msg: >-
      cluster_cni vale "{{ cluster_cni }}", che RKE2 non accetta. I valori
      ammessi sono: calico, canal, cilium, flannel, none. Un CNI scritto male
      non fa fallire questa POST — Rancher la accetta — ma i nodi downstream
      non diventeranno mai Ready.
    quiet: yes

- name: Verifica che l'ingress controller del cluster downstream sia ammesso
  assert:
    that:
      - cluster_ingress_controller in ['none', 'ingress-nginx', 'traefik']
    fail_msg: >-
      cluster_ingress_controller vale "{{ cluster_ingress_controller }}", che
      RKE2 non accetta. I valori ammessi sono: none, ingress-nginx, traefik.
      Svuota la variabile per lasciar decidere RKE2 (oggi ingress-nginx).
    quiet: yes
  when: cluster_ingress_controller | default('') | length > 0

# "ingress-controller:" non esiste su tutte le versioni di RKE2, e su una che non
# la conosce rke2-server RIFIUTA la configurazione e non parte affatto. Qui non
# si puo' chiedere al binario, quindi si confronta la versione dichiarata con
# quella di cui si ha una prova.
#
# Le due stringhe vanno ripulite PRIMA del confronto: "v1.35.7+rke2r1" non e' un
# numero di versione per nessuno: la "v" iniziale e il suffisso "+rke2rN" vanno
# tolti, altrimenti il confronto non fa quello che sembra fare. split('+')[0] e
# non una regex, cosi' non c'e' un backslash da far sopravvivere a YAML e Jinja.
- name: Verifica che questa versione di RKE2 conosca ingress-controller
  assert:
    that:
      - (cluster_k8s_version | regex_replace('^v', '')).split('+')[0]
        is version((cluster_ingress_controller_min_version | regex_replace('^v', '')).split('+')[0], '>=')
    fail_msg: >-
      cluster_ingress_controller vale "{{ cluster_ingress_controller }}", ma
      cluster_k8s_version e' {{ cluster_k8s_version }}, precedente a
      {{ cluster_ingress_controller_min_version }} — la piu' vecchia su cui
      quell'opzione risulta verificata (e' quella con cui gira il cluster
      Rancher). Scrivendo "ingress-controller" in machineGlobalConfig su un RKE2
      che non la conosce, rke2-server sui nodi downstream rifiuta la
      configurazione e NON PARTE: le macchine si registrano in Rancher, il
      provisioning resta appeso, e non c'e' niente in questo playbook che lo
      dica. Due strade: alzare cluster_k8s_version a una versione che Rancher sa
      provisionare e che l'opzione ce l'ha, oppure svuotare
      cluster_ingress_controller e tenere il default di RKE2 (ingress-nginx).
    quiet: yes
  when: cluster_ingress_controller | default('') | length > 0

# machineGlobalConfig si costruisce QUI e non dentro al corpo della POST perche'
# "ingress-controller" c'e' solo se e' stato chiesto, e una chiave condizionale
# dentro a un dizionario YAML letterale non si scrive: verrebbe fuori la chiave
# con dentro una stringa vuota, che non e' "non chiedere niente" — e' chiedere
# un ingress controller che non si chiama in nessun modo.
#
# Il valore e' una LISTA anche quando e' uno solo: RKE2 dichiara
# "ingress-controller" come opzione ripetibile, ed e' la forma con cui il cluster
# Rancher gira oggi (vedi il config.yaml scritto da master1_config).
- name: Componi machineGlobalConfig del cluster downstream
  set_fact:
    cluster_machine_global_config: >-
      {{ {'cni': cluster_cni,
          'disable-kube-proxy': false,
          'etcd-expose-metrics': false}
         | combine({'ingress-controller': [cluster_ingress_controller]}
                   if (cluster_ingress_controller | default('') | length > 0)
                   else {}) }}

- name: Configurazione con cui nascera' il cluster downstream
  debug:
    msg: >-
      {{ cluster_name }} ({{ cluster_k8s_version }}): CNI {{ cluster_cni }},
      ingress
      {{ (cluster_ingress_controller ~ ' (IngressClass "' ~ cluster_ingress_class ~ '")')
         if (cluster_ingress_controller | default('') | length > 0)
         else 'lasciato al default di RKE2' }},
      chartValues
      {{ 'per ' ~ (cluster_chart_values.keys() | list | join(', '))
         if (cluster_chart_values | default({}) | length > 0)
         else 'nessuno' }}.

# Pausa di assestamento. Rancher risponde al login prima di essere pronto a
# provisionare: e' cieca, ma e' quella del playbook che funziona.
- name: Wait for Rancher cluster to be fully ready
  pause:
    seconds: "{{ cluster_pausa_iniziale }}"
  delegate_to: "{{ ansibleSshHost }}"

- name: Get Rancher API token
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3-public/localProviders/local?action=login"
    method: POST
    body_format: json
    validate_certs: no
    body:
      username: "admin"
      password: "{{ rancher_password }}"
    return_content: yes
    status_code: [200, 201]
  register: api_token_response
  until: api_token_response.status in [200, 201]
  retries: "{{ cluster_login_retries }}"
  delay: "{{ cluster_login_delay }}"
  # La password finirebbe in chiaro in ansible.log, che ansible.cfg scrive
  # sempre. Per vedere l'output durante una diagnosi: -e rancher_hide_secrets=false
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Set Rancher server URL (completa setup iniziale)
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/settings/server-url"
    method: PUT
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      name: server-url
      value: "https://{{ rancher_domain }}"
    status_code: 200
    validate_certs: no
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Accept Rancher EULA
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/setting/first-login"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    status_code: [200, 204, 409]
    validate_certs: no
  ignore_errors: yes
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

# Se il cluster c'e' gia' non lo si ricrea: la POST tornerebbe 409 e il
# playbook si fermerebbe al secondo lancio. Il playbook di riferimento non lo
# prevede perche' li' si lancia una volta sola.
- name: Verifica se il cluster esiste gia'
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
    status_code: [200, 404]
    validate_certs: no
  register: cluster_esistente
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Create a new Kubernetes RKE2 custom cluster via Rancher API
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      type: "provisioning.cattle.io.cluster"
      metadata:
        name: "{{ cluster_name }}"
        namespace: "fleet-default"
      spec:
        kubernetesVersion: "{{ cluster_k8s_version }}"
        rkeConfig:
          # cni, disable-kube-proxy, etcd-expose-metrics e — se chiesto —
          # ingress-controller. Composto sopra: vedi il commento li'.
          machineGlobalConfig: "{{ cluster_machine_global_config }}"
          # Valori dei chart packaged. Con Calico dice la MTU del tunnel e con
          # quale indirizzo il nodo si annuncia; con canal e' {} e non c'e'
          # niente da imporre. Vedi cluster_chart_values in group_vars/all.yml.
          chartValues: "{{ cluster_chart_values | default({}) }}"
          machineSelectorConfig:
            - config:
                protect-kernel-defaults: false
          registries: {}
          upgradeStrategy:
            controlPlaneConcurrency: "1"
            controlPlaneDrainOptions:
              enabled: false
              force: false
              ignoreDaemonSets: true
              skipWaitForDeleteTimeout: 0
              timeout: 120
            workerConcurrency: "1"
            workerDrainOptions:
              enabled: false
              force: false
              ignoreDaemonSets: true
              skipWaitForDeleteTimeout: 0
              timeout: 120
          etcd:
            snapshotScheduleCron: "0 */5 * * *"
            snapshotRetention: 5
            disableSnapshots: false
        defaultPodSecurityPolicyTemplateName: ""
        defaultPodSecurityAdmissionConfigurationTemplateName: ""
        defaultClusterRoleForProjectMembers: ""
        enableNetworkPolicy: false
        fleetWorkspaceName: "fleet-default"
    status_code: 201
    validate_certs: no
  register: create_cluster_result
  when: cluster_esistente.status == 404
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Show cluster creation result
  debug:
    msg: >-
      {{ 'Cluster ' ~ cluster_name ~ ' creato (' ~ cluster_k8s_version ~ ', CNI ' ~ cluster_cni ~ ')'
         if cluster_esistente.status == 404
         else 'Cluster ' ~ cluster_name ~ ' esisteva gia: non ricreato' }}

# UN CLUSTER CHE ESISTE GIA' NON PRENDE LA CONFIGURAZIONE NUOVA, e questo e' il
# modo in cui il cambio di CNI puo' passare inosservato: si cambia cluster_cni,
# si rilancia il playbook, la POST non viene nemmeno rifatta (il cluster c'e'
# gia'), il riepilogo finale legge la VARIABILE e annuncia "CNI calico" — mentre
# nel cluster vero e' rimasto canal. Da fuori sembra fatto.
#
# Quindi si legge quello che Rancher ha davvero in pancia e lo si confronta con
# quello che si e' chiesto. Non e' un errore che ferma il playbook: il cluster
# esistente funziona, e la decisione di rifarlo non e' di un task.
- name: Confronta la configurazione chiesta con quella del cluster esistente
  vars:
    cni_nel_cluster: >-
      {{ cluster_esistente.json.spec.rkeConfig.machineGlobalConfig.cni
         | default('(non dichiarato: default RKE2, canal)') }}
    ingress_nel_cluster: >-
      {{ cluster_esistente.json.spec.rkeConfig.machineGlobalConfig['ingress-controller']
         | default([]) | join(', ') | default('(non dichiarato: default RKE2, ingress-nginx)', true) }}
  debug:
    msg: |
      Il cluster {{ cluster_name }} ESISTE GIA' e non viene ricreato: la
      configurazione qui sotto e' quella con cui e' nato, non quella di
      group_vars/all.yml.

        CNI      nel cluster: {{ cni_nel_cluster | trim }}   —   chiesto: {{ cluster_cni }}
        Ingress  nel cluster: {{ ingress_nel_cluster | trim }}   —   chiesto: {{ cluster_ingress_controller | default('(default RKE2)', true) }}

      {% if (cni_nel_cluster | trim) != cluster_cni %}
      IL CNI DIVERGE. Non si cambia a caldo e non si cambia da qui: rilanciare
      il playbook non lo tocca. Per averlo davvero, il cluster va cancellato
      dalla console (Cluster Management -> {{ cluster_name }} -> Delete) e i
      nodi ripuliti prima di riagganciarli:
        ansible-playbook playbooks/20-rancher.yml -e clean_nodes_before_join=true
      {% endif %}
      {% if (ingress_nel_cluster | trim) != (cluster_ingress_controller | default('', true)) %}
      L'INGRESS DIVERGE. Anche questo sta in machineGlobalConfig e vale per il
      cluster, non per il singolo nodo: i nodi nuovi che si agganciano adesso
      prendono la configurazione VECCHIA, non questa.
      {% endif %}
  when: cluster_esistente.status == 200

- name: Wait for cluster to be provisioned
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v1/provisioning.cattle.io.clusters/fleet-default/{{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: cluster_status
  until: cluster_status.json.status is defined and cluster_status.json.status.conditions is defined
  retries: 30
  delay: 10
  ignore_errors: yes
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Get cluster ID from legacy API for registration token
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusters?name={{ cluster_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: legacy_cluster_info
  until: legacy_cluster_info.json.data | default([]) | length > 0
  retries: 10
  delay: 5
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Get or create cluster registration token
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusterregistrationtokens"
    method: POST
    body_format: json
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    body:
      type: "clusterRegistrationToken"
      clusterId: "{{ legacy_cluster_info.json.data[0].id }}"
    status_code: [201, 409]  # 409 se il token esiste gia'
    validate_certs: no
  register: registration_token_result
  when: legacy_cluster_info.json.data | length > 0
  ignore_errors: yes
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Wait for registration token to be ready
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/clusterregistrationtokens?clusterId={{ legacy_cluster_info.json.data[0].id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: token_list
  until: token_list.json.data | length > 0 and token_list.json.data[0].nodeCommand is defined and token_list.json.data[0].nodeCommand != ""
  retries: 20
  delay: 10
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Extract registration details
  set_fact:
    rancher_host: "{{ rancher_domain | regex_replace('^https?://', '') }}"
    node_command: "{{ token_list.json.data[0].nodeCommand }}"
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Extract token from nodeCommand
  set_fact:
    cluster_token: "{{ node_command | regex_search('--token ([A-Za-z0-9:]+)', '\\1') | first }}"
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Token di registrazione ottenuto
  debug:
    msg: "Rancher: {{ rancher_host }} — token di registrazione pronto"

# --- Aggancio dei nodi -------------------------------------------------------
# async/poll: 0 lancia i join in parallelo su tutti i nodi e li aspetta dopo.
# system-agent-install.sh scarica e installa il rancher-system-agent, che a sua
# volta tira giu' RKE2: sono minuti per nodo, e in sequenza sarebbero mezz'ora.

- name: Install system-agent and join nodes as managers
  shell: |
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --token {{ cluster_token }} \
      --etcd --controlplane
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_managers_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['new_managers'] | default([]) }}"
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Install system-agent and join nodes as workers
  shell: |
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --token {{ cluster_token }} \
      --worker
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_workers_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['workers'] | default([]) }}"
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

# I nodi [ingress] entrano come worker con una label in piu'.
#
# NIENTE TAINT, ed e' un cambiamento: prima ne prendevano uno NoSchedule, che
# aveva senso finche' su quei nodi girava un Traefik installato a parte, con
# nodeSelector e tolleranza scritti da noi. L'ingress adesso lo installa RKE2
# con il proprio chart, che di quel taint non sa niente e non lo tollera: quei
# nodi resterebbero gli unici senza ingress — l'esatto contrario di quello che
# si vuole da un nodo che si chiama [ingress]. La label resta, e serve a
# puntarci un nodeSelector quando servira'.
- name: Install system-agent and join ingress nodes as workers
  shell: |
    curl --insecure -fL https://{{ rancher_host }}/system-agent-install.sh | sh -s - \
      --server https://{{ rancher_host }} \
      --label 'cattle.io/os=linux' \
      --label '{{ ingress_node_key }}={{ ingress_node_value }}' \
      --token {{ cluster_token }} \
      --worker
  args:
    executable: /bin/bash
  async: 600
  poll: 0
  register: join_ingress_async
  delegate_to: "{{ item }}"
  loop: "{{ groups['ingress'] | default([]) }}"
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Wait for manager nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_managers_status
  until: join_managers_status.finished
  retries: 60
  delay: 10
  delegate_to: "{{ item.item }}"
  loop: "{{ join_managers_async.results | default([]) }}"
  ignore_errors: yes

- name: Wait for worker nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_workers_status
  until: join_workers_status.finished
  retries: 120
  delay: 20
  delegate_to: "{{ item.item }}"
  loop: "{{ join_workers_async.results | default([]) }}"
  ignore_errors: yes

- name: Wait for ingress nodes join to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: join_ingress_status
  until: join_ingress_status.finished
  retries: 120
  delay: 20
  delegate_to: "{{ item.item }}"
  loop: "{{ join_ingress_async.results | default([]) }}"
  ignore_errors: yes

- name: Show join results
  debug:
    msg: >-
      {{ item.item.item | default('?') }}:
      {{ 'OK' if (item.rc | default(1)) == 0 else 'FALLITO — ' ~ (item.stderr | default('nessun messaggio')) }}
  loop: >-
    {{ (join_managers_status.results | default([]))
       + (join_workers_status.results | default([]))
       + (join_ingress_status.results | default([])) }}
  loop_control:
    label: "{{ item.item.item | default('?') }}"

# --- Verifica ----------------------------------------------------------------
# Stessa chiamata del playbook di riferimento (/v3/nodes), con in piu' un
# "until": li' c'erano retries senza until, che in Ansible non riprova niente.
#
# I nodi compaiono man mano che RKE2 finisce di installarsi su ogni macchina, e
# ci mette minuti. Se allo scadere non ci sono tutti non e' un fallimento: il
# provisioning prosegue dentro a Rancher e non dipende piu' da questo playbook.
# Per questo ignore_errors, e per questo il riepilogo dice quanti ne ha visti
# invece di dichiarare riuscito l'aggancio.
- name: Verify nodes are registered in Rancher
  delegate_to: "{{ ansibleSshHost }}"
  uri:
    url: "https://{{ rancher_domain }}/v3/nodes?clusterId={{ legacy_cluster_info.json.data[0].id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ api_token_response.json.token }}"
      Content-Type: "application/json"
    validate_certs: no
  register: cluster_nodes
  until: (cluster_nodes.json.data | default([]) | length) >= (nodi_attesi | int)
  retries: "{{ cluster_macchine_retries }}"
  delay: "{{ cluster_macchine_delay }}"
  ignore_errors: yes
  vars:
    nodi_attesi: >-
      {{ (groups['new_managers'] | default([]) | length)
         + (groups['workers'] | default([]) | length)
         + (groups['ingress'] | default([]) | length) }}
  no_log: "{{ rancher_hide_secrets | default(true) | bool }}"

- name: Show registered nodes
  debug:
    msg: |
      Cluster {{ cluster_name }}: {{ cluster_nodes.json.data | default([]) | length }} nodi
      visti da Rancher su {{ nodi_attesi | int }} macchine agganciate.
      {% for node in cluster_nodes.json.data | default([]) %}
      - {{ node.nodeName | default(node.hostname) | default('?') }}
        IP: {{ node.ipAddress | default('?') }}
        Ruoli: {{ 'controlplane ' if node.controlPlane | default(false) else '' }}{{ 'etcd ' if node.etcd | default(false) else '' }}{{ 'worker' if node.worker | default(false) else '' }}
        Stato: {{ node.state | default('?') }}
      {% endfor %}
      {% if (cluster_nodes.json.data | default([]) | length) < (nodi_attesi | int) %}
      I nodi mancanti stanno ancora installando RKE2: il provisioning prosegue
      dentro a Rancher e si segue dalla console, in Cluster Management.
      {% endif %}
  vars:
    nodi_attesi: >-
      {{ (groups['new_managers'] | default([]) | length)
         + (groups['workers'] | default([]) | length)
         + (groups['ingress'] | default([]) | length) }}
