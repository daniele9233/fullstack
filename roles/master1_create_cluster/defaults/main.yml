---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.

# Pausa di assestamento prima di parlare con l'API di Rancher.
#
# Questo ruolo parte subito dopo "helm install rancher", quando l'API puo' gia'
# rispondere al login ma non essere pronta a provisionare. La pausa e' cieca ma
# serve, ed e' quella del playbook di riferimento: 280 secondi.
#
# Non e' l'unica difesa: il login qui sotto riprova, quindi se Rancher ci mette
# di piu' il playbook aspetta invece di cadere.
cluster_pausa_iniziale: 280

# Tentativi sul login all'API. E' l'attesa SUL FATTO che accompagna la pausa a
# tempo qui sopra.
cluster_login_retries: 30
cluster_login_delay: 10

# Attesa che i nodi del cluster downstream compaiano in Rancher.
#
# Il join si vede subito — il rancher-system-agent contatta il server in un
# minuto — ma il NODO Kubernetes compare solo quando RKE2 ha finito di
# installarsi su quella macchina, e ci mette minuti. 30 x 10s e' un margine
# ragionevole; se scade non e' un errore, il provisioning prosegue in Rancher.
cluster_macchine_retries: 30
cluster_macchine_delay: 10
