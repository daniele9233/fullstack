---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.

# Pausa di assestamento prima di parlare con l'API di Rancher.
#
# Nel percorso a 3 nodi (playbooks/20-rancher.yml) questo ruolo parte subito
# dopo "helm install rancher", quando l'API puo' gia' rispondere al login ma non
# essere pronta a provisionare: la pausa e' cieca ma serve, e resta com'era.
#
# Sul nodo singolo (playbooks/21-rancher-single.yml) non serve: li'
# rancher_single_node ha gia' verificato che la console risponda, e il playbook
# passa 0.
cluster_pausa_iniziale: 280

# Tentativi sul login all'API. E' l'attesa SUL FATTO che accompagna la pausa a
# tempo qui sopra: se Rancher non e' ancora in piedi si riprova, invece di far
# cadere il playbook al primo tentativo.
cluster_login_retries: 30
cluster_login_delay: 10

# Attesa che i nodi agganciati compaiano davvero in Rancher. Prima c'erano
# retries senza until, cioe' nessuna attesa: la richiesta partiva una volta
# sola, subito dopo il join, e trovava zero nodi — che e' normale, l'agent ci
# mette minuti. Il playbook lo riportava come esito buono.
cluster_nodi_retries: 30
cluster_nodi_delay: 20
