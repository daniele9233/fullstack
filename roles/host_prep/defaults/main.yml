---
# Firewall e AppArmor vanno disattivati su tutti i nodi gestiti: RKE2, Gluster,
# NFS, Pacemaker e VRRP usano un insieme di porte e protocolli ampio, e VRRP
# non e' nemmeno TCP (protocollo IP 112). Con ufw attivo i cluster sembrano
# partire ma non convergono mai.
disable_ufw: true
disable_apparmor: true

# Toglie a NetworkManager le interfacce del CNI e spegne nm-cloud-setup.
#
# E' un requisito documentato di RKE2, non una precauzione: NetworkManager
# riconfigura le interfacce che il CNI crea nel default network namespace, e
# nm-cloud-setup — presente di serie sulle immagini cloud — AGGIUNGE UNA TABELLA
# DI ROUTING che scavalca quella del CNI.
#
# Il guasto che ne segue e' fra i piu' difficili da diagnosticare che esistano:
# "ip route" resta perfetta (e' la tabella main, e nessuno la tocca), le rotte
# verso i blocchi pod degli altri nodi ci sono tutte, Calico riporta ogni
# componente Available — e i pacchetti escono dal nodo e non arrivano, perche'
# le "ip rule" li hanno deviati su un'altra tabella prima che la main venisse
# consultata. Si guarda la configurazione giusta e si vede tutto a posto.
#
# Non si spegne, se non si sa cosa si sta facendo. Nemmeno su macchine dove
# "tutte le porte sono aperte": questo non c'entra con le porte.
gestisci_networkmanager: true

# Allinea l'hostname di sistema al nome usato nell'inventario.
#
# Disattivato di default DI PROPOSITO: su un nodo gia' in un cluster, cambiare
# l'hostname lo rende irriconoscibile. RKE2 registra i nodi Kubernetes con il
# nome host, quindi cambiarlo su un master gia' provisionato orfanizza il nodo
# nel cluster. Va abilitato solo su macchine non ancora inizializzate.
#
# E' abilitato in group_vars/gluster_servers.yml perche' li' serve davvero:
# Corosync identifica i nodi per nome e li confronta con "uname -n". Se il nome
# di inventario e l'hostname reale divergono, le risorse Pacemaker non partono.
set_hostname_from_inventory: false

# Mette in pausa gli aggiornamenti automatici per la durata del playbook.
#
# unattended-upgrades tiene il lock di dpkg e fa fallire i task apt dei ruoli
# successivi con "Could not get lock /var/lib/dpkg/lock-frontend. It is held by
# process NNNN (unattended-upgr)". Su una macchina appena provisionata parte
# quasi sempre, e il playbook la incrocia a meta' esecuzione.
#
# I timer vengono FERMATI, non disabilitati: tornano attivi al prossimo riavvio,
# quindi il nodo non resta senza aggiornamenti di sicurezza per sempre.
apt_pause_unattended_upgrades: true

# Attesa massima perche' un aggiornamento gia' in corso finisca da solo:
# 60 tentativi da 5 secondi, cioe' 5 minuti. Un unattended-upgrade appena
# avviato su una macchina nuova ci mette di piu' del previsto, ma va aspettato:
# ucciderlo a meta' lascerebbe dpkg in stato incoerente.
apt_lock_retries: 60
apt_lock_delay: 5
