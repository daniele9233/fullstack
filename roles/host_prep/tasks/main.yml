---
# Preparazione comune a tutti i nodi gestiti, da eseguire prima di qualsiasi
# installazione: un firewall attivo o AppArmor in mezzo fanno fallire i cluster
# in modi che sembrano problemi di configurazione.

- name: Rileva i servizi presenti sul nodo
  service_facts:

# service_facts non usa sempre la stessa chiave: con systemd attivo riporta
# "ufw.service", ma quando raccoglie da SysV riporta "ufw". Su Ubuntu ufw ha
# sia l'unit sia lo script init.d, quindi vanno controllate entrambe le forme:
# un controllo sulla sola forma con suffisso salta il task senza dire nulla.
- name: Determina quali servizi sono presenti
  set_fact:
    host_prep_has_ufw: "{{ ('ufw.service' in ansible_facts.services) or ('ufw' in ansible_facts.services) }}"
    host_prep_has_firewalld: "{{ ('firewalld.service' in ansible_facts.services) or ('firewalld' in ansible_facts.services) }}"
    host_prep_has_apparmor: "{{ ('apparmor.service' in ansible_facts.services) or ('apparmor' in ansible_facts.services) }}"
    host_prep_has_nm: "{{ ('NetworkManager.service' in ansible_facts.services) or ('NetworkManager' in ansible_facts.services) }}"
    host_prep_has_nmcloud: "{{ ('nm-cloud-setup.service' in ansible_facts.services) or ('nm-cloud-setup' in ansible_facts.services) }}"

# --- Firewall ---------------------------------------------------------------
# Fermare l'unit non basta: "ufw disable" e' quello che azzera le regole e
# impedisce il ricaricamento al boot.

- name: Leggi lo stato di ufw
  command: ufw status
  register: host_prep_ufw_status
  changed_when: false
  failed_when: false
  when:
    - disable_ufw | bool
    - host_prep_has_ufw | bool

- name: Disattiva ufw
  command: ufw --force disable
  when:
    - disable_ufw | bool
    - host_prep_has_ufw | bool
    - "'Status: active' in (host_prep_ufw_status.stdout | default(''))"

# Non serve un task systemd per ufw: "ufw disable" ferma il firewall E lo
# toglie dall'avvio al boot ("Firewall stopped and disabled on system startup"),
# scrivendo ENABLED=no in /etc/ufw/ufw.conf. Un secondo task sull'unit sarebbe
# ridondante e aggiungerebbe solo un punto in cui il play puo' interrompersi.

# firewalld non c'e' su Ubuntu, ma se qualcuno lo installa vanifica tutto il
# resto senza dare segnali evidenti.
- name: Disattiva firewalld se presente
  systemd:
    name: firewalld
    enabled: false
    state: stopped
  when:
    - disable_ufw | bool
    - host_prep_has_firewalld | bool

# --- NetworkManager e le interfacce del CNI ----------------------------------
#
# QUESTO E' IL PEZZO CHE MANCAVA, ed e' costato una giornata.
#
# La doc RKE2 lo dice testualmente: "NetworkManager manipulates the routing
# table for interfaces in the default network namespace" — cioe' proprio dove il
# CNI crea le sue. Se NetworkManager gestisce vxlan.calico e le cali*, gliele
# riconfigura sotto, e il tunnel smette di consegnare.
#
# Peggio ancora nm-cloud-setup, che sulle immagini cloud (AWS, Azure) c'e' di
# serie: la doc dice che quei servizi "add a routing table that interferes with
# the CNI plugin's configuration". AGGIUNGE UNA TABELLA DI ROUTING. Ed e' il
# motivo per cui un guasto del genere e' quasi impossibile da leggere: "ip route"
# mostra la tabella main, che resta perfetta — rotte verso i blocchi pod degli
# altri nodi tutte al loro posto — mentre le "ip rule" deviano il traffico su
# un'altra tabella prima ancora che quelle rotte vengano consultate. Si guarda
# la configurazione giusta e si vede tutto a posto, e intanto i pacchetti
# escono dal nodo e non arrivano.
#
# Non e' un problema di rete, e nessun firewall lo spiega: e' una configurazione
# dell'host. E sopravvive a qualunque azzeramento di RKE2, perche' non e' roba
# di RKE2 — resta li' anche dopo rke2-uninstall.sh, anche dopo il riavvio.
# service_facts elenca NetworkManager anche su macchine dove non e' realmente
# installato: la prova che decide e' /etc/NetworkManager sul disco. Distinguere
# i due casi conta, perche' se NetworkManager non c'e' allora non e' lui a
# riconfigurare le interfacce del CNI, e la causa di un eventuale guasto di rete
# va cercata altrove invece che darla per trovata.
- name: Verifica se NetworkManager e' davvero installato
  stat:
    path: /etc/NetworkManager
  register: host_prep_nm_dir

# Va stampato sempre, anche quando non c'e' niente da fare: sapere CHI gestisce
# la rete su un nodo e' la prima cosa che serve quando il traffico fra pod non
# passa, e finora l'abbiamo sempre dedotta invece di leggerla.
- name: Riepilogo di cosa gestisce la rete su questo nodo
  debug:
    msg: >-
      {{ inventory_hostname }}: NetworkManager
      {{ 'INSTALLATO' if host_prep_nm_dir.stat.exists else 'ASSENTE' }},
      nm-cloud-setup
      {{ 'PRESENTE' if host_prep_has_nmcloud | bool else 'assente' }}.
      {{ 'Nessuno dei due puo essere la causa di un guasto di rete fra i nodi qui.'
         if (not host_prep_nm_dir.stat.exists and not host_prep_has_nmcloud | bool)
         else 'Configurazione applicata.' }}

# La directory puo' non esserci su un'installazione minimale anche con
# NetworkManager presente: template non crea il percorso padre e fallirebbe con
# "Destination directory ... does not exist".
- name: Crea la directory di configurazione di NetworkManager
  file:
    path: /etc/NetworkManager/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - gestisci_networkmanager | bool
    - host_prep_nm_dir.stat.exists

# template e non "copy: content:": ansible_managed lo fornisce il modulo
# template, non copy — scritto con copy il task muore con "'ansible_managed' is
# undefined". E' anche il modo in cui il resto del repository scrive i file.
- name: Sottrai a NetworkManager le interfacce del CNI
  template:
    src: rke2-canal.conf.j2
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    owner: root
    group: root
    mode: '0644'
  register: host_prep_nm_conf
  when:
    - gestisci_networkmanager | bool
    - host_prep_nm_dir.stat.exists

- name: Ricarica NetworkManager
  command: nmcli general reload
  when:
    - gestisci_networkmanager | bool
    - host_prep_nm_dir.stat.exists
    - host_prep_nm_conf is changed
  failed_when: false
  changed_when: true

# nm-cloud-setup ha anche un timer: fermare solo il service lo fa tornare al
# primo scatto, e il guasto si ripresenta a distanza di minuti su un cluster
# che sembrava a posto.
- name: Disattiva nm-cloud-setup e il suo timer
  systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - nm-cloud-setup.service
    - nm-cloud-setup.timer
  register: host_prep_nmcloud
  failed_when: false
  when:
    - gestisci_networkmanager | bool
    - host_prep_has_nmcloud | bool

# La doc e' esplicita: le tabelle che nm-cloud-setup ha gia' aggiunto NON
# spariscono fermando il servizio. "a reboot of the node is necessary to
# effectively apply the changes". Dirlo e' l'unica cosa onesta: un playbook che
# prosegue in silenzio lascerebbe il nodo in uno stato che sembra corretto.
- name: Avvisa che serve un riavvio
  debug:
    msg: >-
      {{ inventory_hostname }}: nm-cloud-setup era attivo ed e' stato
      disattivato adesso. Le tabelle di routing che ha gia' installato restano
      finche' il nodo non viene RIAVVIATO — e finche' ci sono, il traffico fra
      pod di nodi diversi puo' sparire senza errori. Riavvia questo nodo prima
      di considerare buona l'installazione.
  when:
    - gestisci_networkmanager | bool
    - host_prep_has_nmcloud | bool
    - host_prep_nmcloud is changed


# --- AppArmor ---------------------------------------------------------------

- name: Disattiva AppArmor
  systemd:
    name: apparmor
    enabled: false
    state: stopped
  when:
    - disable_apparmor | bool
    - host_prep_has_apparmor | bool

# --- Aggiornamenti automatici -----------------------------------------------
# Va fatto qui, nel primo play: i task apt dei ruoli successivi girano anche
# mezz'ora dopo, e senza questo si trovano il lock di dpkg occupato.

# Su una macchina appena creata cloud-init sta ancora installando pacchetti.
# Fermare i timer mentre lui lavora non servirebbe a niente: prima si aspetta
# che abbia finito. Se cloud-init non c'e', il comando non esiste e si tira
# dritto.
- name: Attendi la fine di cloud-init
  command: cloud-init status --wait
  register: host_prep_cloud_init
  changed_when: false
  failed_when: false
  when: apt_pause_unattended_upgrades | bool

- name: Ferma i timer degli aggiornamenti automatici
  systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false
  when: apt_pause_unattended_upgrades | bool

# Fermare i timer non tocca un aggiornamento GIA' in corso, ed e' giusto cosi':
# interromperlo a meta' transazione lascerebbe dpkg da riparare a mano. Si
# aspetta che esca da solo.
#
# Si prova a prendere il lock, non si guardano i processi. Cercare per nome non
# funziona: unattended-upgrade-shutdown gira SEMPRE dal boot in attesa del
# segnale di spegnimento, non tiene nessun lock, e in /proc il suo nome e'
# troncato a "unattended-upgr". Un controllo su quel nome non passerebbe mai.
#
# lockf() usa fcntl(), lo stesso meccanismo di dpkg e apt: se il lock si prende,
# e' libero davvero. Viene rilasciato subito. Nessun O_TRUNC nella open: i file
# di lock non vanno azzerati.
- name: Attendi che il lock di dpkg sia libero
  shell: |
    python3 - <<'PY'
    import fcntl, os, sys, time

    LOCKS = [
        "/var/lib/dpkg/lock-frontend",
        "/var/lib/dpkg/lock",
        "/var/cache/apt/archives/lock",
        "/var/lib/apt/lists/lock",
    ]

    def occupato():
        for path in LOCKS:
            if not os.path.exists(path):
                continue
            fd = os.open(path, os.O_RDWR | os.O_CREAT, 0o640)
            try:
                fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                fcntl.lockf(fd, fcntl.LOCK_UN)
            except OSError:
                return path
            finally:
                os.close(fd)
        return None

    for _ in range({{ apt_lock_retries }}):
        preso = occupato()
        if preso is None:
            sys.exit(0)
        time.sleep({{ apt_lock_delay }})

    print(preso)
    sys.exit(1)
    PY
  args:
    executable: /bin/bash
  register: host_prep_apt_lock
  changed_when: false
  # Non blocca il playbook: se il lock resta occupato, i task apt dei ruoli
  # hanno gia' until/retries e riproveranno per conto loro. Questa attesa serve
  # solo a non farli partire in salita.
  failed_when: false
  when: apt_pause_unattended_upgrades | bool

- name: Segnala che il lock di dpkg e' ancora occupato
  debug:
    msg: >-
      {{ inventory_hostname }}: {{ host_prep_apt_lock.stdout | trim }} risulta
      ancora bloccato dopo {{ apt_lock_retries | int * apt_lock_delay | int }}
      secondi. Il playbook prosegue e i task apt riproveranno da soli. Per
      vedere chi lo tiene: fuser -v /var/lib/dpkg/lock-frontend
  when:
    - apt_pause_unattended_upgrades | bool
    - host_prep_apt_lock.rc | default(0) != 0

# --- Hostname ---------------------------------------------------------------

- name: Verifica l'hostname corrente
  command: hostname
  register: host_prep_hostname
  changed_when: false
  when: set_hostname_from_inventory | bool

- name: Allinea l'hostname al nome di inventario
  hostname:
    name: "{{ inventory_hostname }}"
  when:
    - set_hostname_from_inventory | bool
    - host_prep_hostname.stdout | default('') | trim != inventory_hostname

# --- Riepilogo --------------------------------------------------------------

- name: Riepilogo preparazione host
  debug:
    msg: >-
      {{ inventory_hostname }}:
      ufw {{ 'disattivato' if (host_prep_has_ufw | bool and disable_ufw | bool) else 'non presente o non gestito' }},
      apparmor {{ 'disattivato' if (host_prep_has_apparmor | bool and disable_apparmor | bool) else 'non presente o non gestito' }},
      hostname {{ 'allineato a ' ~ inventory_hostname if set_hostname_from_inventory | bool else 'lasciato invariato' }},
      aggiornamenti automatici {{ 'in pausa fino al riavvio' if apt_pause_unattended_upgrades | bool else 'lasciati attivi' }}
