---
- name: Verifica che i VIP siano configurati
  assert:
    that:
      - vip_rancher_ip | length > 0
      - vip_patroni_ip | length > 0
      - vip_rancher_ip != vip_patroni_ip
    fail_msg: >-
      vip_rancher_ip e vip_patroni_ip devono essere valorizzati in
      group_vars/all.yml e devono essere due indirizzi diversi.

- name: Verifica che l'interfaccia di rete esista sul nodo
  shell: "ip -o link show {{ keepalived_interface }}"
  register: keepalived_iface_check
  changed_when: false
  failed_when: keepalived_iface_check.rc != 0

- name: Installa keepalived
  apt:
    name: keepalived
    state: present
    update_cache: yes
    cache_valid_time: 3600

# nginx fa il bind esplicito su vip_rancher_ip:443 anche sul nodo che in quel
# momento non possiede il VIP: senza questo sysctl il bind fallisce con
# "Cannot assign requested address" e nginx non parte affatto.
# haproxy non ne ha bisogno, perche' ascolta su *:porta.
- name: Consenti il bind su indirizzi non locali
  sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: yes
    state: present
    reload: yes

- name: Crea la directory di configurazione keepalived
  file:
    path: "{{ keepalived_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# Gli script vanno scritti prima della configurazione che li referenzia:
# con enable_script_security keepalived rifiuta di eseguire script mancanti o
# scrivibili da utenti non privilegiati.
- name: Installa lo script di health check di nginx
  template:
    src: nginx-ha-check.j2
    dest: "{{ keepalived_config_dir }}/nginx-ha-check"
    owner: root
    group: root
    mode: '0750'
  notify: restart keepalived

# Lo schema precedente avviava e fermava nginx tramite un file di stato scritto
# da uno script di notify. Ora nginx gira su entrambi i nodi e keepalived si
# limita a controllarlo, quindi il notify non serve piu' e va tolto dal disco
# per non lasciare in giro uno script che nessuno invoca.
- name: Rimuovi lo script di notify obsoleto
  file:
    path: "{{ keepalived_config_dir }}/nginx-ha-notify"
    state: absent

- name: Deploy della configurazione keepalived
  template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_dir }}/keepalived.conf"
    owner: root
    group: root
    mode: '0644'
    backup: yes
    validate: "keepalived --config-test -f %s"
  notify: restart keepalived

- name: Abilita e avvia keepalived
  systemd:
    name: keepalived
    enabled: yes
    state: started
    daemon_reload: yes
