---
# Ganesha NFS davanti ai volumi Gluster. Il servizio non viene abilitato in
# systemd: lo avvia e lo sposta Pacemaker insieme al VIP. Due gestori sullo
# stesso servizio farebbero a pugni.

# NFS serve solo a Kubernetes: si esportano SOLO i volumi marcati con
# nfs_export: true in gluster_volumes. Gli altri (POSTGRESQL, ELASTIC) restano
# volumi Gluster con i loro brick, senza alcun export.
- name: Seleziona i volumi da esportare via NFS
  set_fact:
    ganesha_volumes: >-
      {{ gluster_volumes
         | selectattr('nfs_export', 'defined')
         | selectattr('nfs_export')
         | list }}

- name: Verifica che ci sia almeno un volume da esportare
  assert:
    that:
      - ganesha_volumes | length > 0
    fail_msg: >-
      Nessun volume con nfs_export: true in gluster_volumes: Ganesha non
      avrebbe nulla da esportare e Pacemaker avvierebbe un servizio vuoto.
    success_msg: >-
      Esportati via NFS: {{ ganesha_volumes | map(attribute='name') | join(', ') }}.
      Non esportati: {{ (gluster_volumes | map(attribute='name') | list)
                        | difference(ganesha_volumes | map(attribute='name') | list)
                        | join(', ') | default('nessuno', true) }}.

- name: Verifica che i volumi esportati abbiano pseudo
  assert:
    that:
      - item.pseudo | default('') | length > 0
    fail_msg: >-
      Il volume {{ item.name }} ha nfs_export: true ma nessun pseudo: senza il
      percorso NFSv4 il client non saprebbe cosa montare.
  loop: "{{ ganesha_volumes }}"
  loop_control:
    label: "{{ item.name }}"

# Un client per riga, in CIDR: gli host dei gruppi indicati piu' gli extra.
- name: Componi l'elenco dei client autorizzati
  set_fact:
    ganesha_clients: >-
      {{ (ganesha_client_groups
          | map('extract', groups)
          | select('defined')
          | flatten
          | map('extract', hostvars, 'ansible_host')
          | select('defined')
          | map('regex_replace', '^(.*)$', '\1/32')
          | list) + ganesha_extra_clients }}

- name: Verifica che ci sia almeno un client autorizzato
  assert:
    that:
      - ganesha_clients | length > 0
    fail_msg: >-
      Nessun client autorizzato: con Access_Type = {{ ganesha_default_access }}
      e nessun blocco CLIENT nessuno potrebbe scrivere sulle share. Popola
      ganesha_client_groups o ganesha_extra_clients.

- name: Installa Ganesha con il backend Gluster
  apt:
    name: nfs-ganesha-gluster
    state: present
    update_cache: yes
    cache_valid_time: 3600
  # Riprova se dpkg e' occupato da un altro processo: vedi apt_lock_retries
  # in group_vars/all.yml.
  register: apt_result
  until: apt_result is succeeded
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Crea la directory degli export
  file:
    path: "{{ ganesha_export_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy di un export per ogni volume da esportare
  template:
    src: export.conf.j2
    dest: "{{ ganesha_export_dir }}/{{ item.export_name | default(item.name | lower) }}.conf"
    owner: root
    group: root
    mode: '0644'
    backup: yes
  loop: "{{ ganesha_volumes }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: volume_index
  vars:
    export_id: "{{ volume_index + 1 }}"
  notify: restart ganesha

# Un volume tolto da nfs_export lascerebbe dietro il suo file di export: senza
# questa rimozione resterebbe esportato fino al prossimo reinstall del nodo.
- name: Rimuovi gli export dei volumi non piu' esportati
  file:
    path: "{{ ganesha_export_dir }}/{{ item.export_name | default(item.name | lower) }}.conf"
    state: absent
  loop: "{{ gluster_volumes | difference(ganesha_volumes) }}"
  loop_control:
    label: "{{ item.name }}"
  notify: restart ganesha

# blockinfile e non template: ganesha.conf arriva dal pacchetto con blocchi
# utili, qui si aggiungono soltanto gli include.
- name: Includi gli export in ganesha.conf
  blockinfile:
    path: "{{ ganesha_config_path }}"
    marker: "# {mark} EXPORT ANSIBLE"
    create: yes
    owner: root
    group: root
    mode: '0644'
    block: |
      {% for volume in ganesha_volumes %}
      %include "{{ ganesha_export_dir }}/{{ volume.export_name | default(volume.name | lower) }}.conf"
      {% endfor %}
  notify: restart ganesha

- name: Lascia il servizio a Pacemaker
  systemd:
    name: nfs-ganesha
    enabled: "{{ not ganesha_managed_by_pacemaker }}"
  when: ganesha_managed_by_pacemaker

- name: Abilita e avvia Ganesha
  systemd:
    name: nfs-ganesha
    enabled: yes
    state: started
    daemon_reload: yes
  when: not ganesha_managed_by_pacemaker
