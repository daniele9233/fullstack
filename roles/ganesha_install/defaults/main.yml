---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.
ganesha_config_path: "/etc/ganesha/ganesha.conf"
ganesha_export_dir: "/etc/ganesha/exports"
ganesha_export_path: "/"
ganesha_protocols: "3,4"
ganesha_sectype: "sys"
ganesha_default_access: "RO"
ganesha_client_access: "RW"
ganesha_client_squash: "no_root_squash"
ganesha_client_groups: []
ganesha_extra_clients: []
gluster_volumes: []

# Il servizio nfs-ganesha e' avviato e spostato da Pacemaker insieme al VIP.
# Mettere a false per gestirlo direttamente con systemd, senza cluster.
ganesha_managed_by_pacemaker: true
pcs_resource_ganesha: "nfs_server"

# Serve all'handler, che riavvia la risorsa dal primo nodo del cluster. Stesso
# default del ruolo pacemaker_nfs_ha; group_vars/all.yml ha la precedenza.
pcs_cluster_nodes: "{{ groups['gluster_servers'][:2] }}"
