---
# Fotografia del nodo: sistema operativo, risorse, orologio, software gia'
# presente.
#
# SOLO LETTURA. Nessun task di questo ruolo scrive sul nodo: si usano moduli di
# raccolta (setup, service_facts) e comandi con changed_when: false. Il
# riepilogo di Ansible resta a zero cambiamenti anche quando i controlli
# trovano qualcosa che non va.
#
# ---------------------------------------------------------------------------
# COME SI AGGIUNGE UN CONTROLLO
# ---------------------------------------------------------------------------
# Tutti i ruoli preflight_* accumulano le proprie voci in pf_righe, una lista
# di dizionari con sempre le stesse cinque chiavi:
#
#   sezione   in quale blocco della scheda finisce la riga
#   voce      l'etichetta a sinistra
#   valore    quello che si e' letto sul nodo
#   esito     OK | INFO | ATTENZIONE | PROBLEMA
#   nota      che cosa fare; compare solo quando l'esito non e' OK
#
# Il testo lungo (lsblk, porte in ascolto, filesystem) non entra in pf_righe:
# va in pf_blocchi, una lista di { titolo, righe }, che il report stampa cosi'
# com'e' sotto le sezioni.
#
# preflight_report non fa altro che impaginare pf_righe e pf_blocchi:
# aggiungere un controllo vuol dire aggiungere una riga qui, senza toccare la
# stampa e senza toccare il riepilogo finale, che conta gli esiti da solo.

- name: Requisiti attesi per i gruppi di questo nodo
  set_fact:
    pf_requisiti: "{{ pf_requisiti_gruppo[item] }}"
  loop: "{{ group_names }}"
  when: item in pf_requisiti_gruppo

- name: Requisiti generici, se il nodo non sta in nessun gruppo noto
  set_fact:
    pf_requisiti: "{{ pf_requisiti_default }}"
  when: pf_requisiti is not defined

# --- Letture sul nodo -------------------------------------------------------

- name: Con quale utente sta girando il playbook
  command: id -un
  register: pf_utente
  changed_when: false

- name: Leggi l'orologio del nodo
  command: date +%s
  register: pf_epoch_nodo
  changed_when: false

# --value stampa i valori nell'ordine in cui sono chiesti, uno per riga:
# prima NTPSynchronized, poi il fuso orario. Senza timedatectl (container,
# distribuzioni senza systemd) il comando non esiste e si tira dritto.
- name: Leggi la sincronizzazione dell'orologio
  command: timedatectl show --property=NTPSynchronized --property=Timezone --value
  register: pf_ntp
  changed_when: false
  failed_when: false

- name: Leggi lo stato di cloud-init
  command: cloud-init status
  register: pf_cloud_init
  changed_when: false
  failed_when: false

# shell e non command: "command -v" e' una builtin della shell, non un
# eseguibile, quindi il modulo command non la troverebbe.
- name: Verifica quali comandi richiesti dai ruoli sono presenti
  shell: "command -v {{ item.comando }}"
  args:
    executable: /bin/bash
  loop: "{{ pf_comandi_richiesti }}"
  loop_control:
    label: "{{ item.comando }}"
  register: pf_comandi
  changed_when: false
  failed_when: false

# Lo stato "ii" e' l'unico che vuol dire installato davvero: un pacchetto
# rimosso ma non purgato resta in elenco con stato "rc", e segnalarlo come
# presente manderebbe fuori strada.
- name: Elenca il software d'infrastruttura gia' installato
  shell: |
    set -o pipefail
    dpkg-query -W -f='${db:Status-Abbrev}|${binary:Package}\n' \
      {{ pf_pacchetti_infra | join(' ') }} 2>/dev/null \
      | awk -F'|' '$1 ~ /^ii/ { sub(/:.*/, "", $2); print $2 }' \
      | sort -u \
      | tr '\n' ' '
  args:
    executable: /bin/bash
  register: pf_infra_presente
  changed_when: false
  failed_when: false
  when: ansible_pkg_mgr | default('') == 'apt'

# Stessa domanda che si fa host_prep prima di installare, ma senza aspettare e
# senza creare niente: si apre in SOLA LETTURA e si prova a prendere un lock
# CONDIVISO. Se dpkg o apt tengono il lock esclusivo, il tentativo fallisce
# subito ed e' esattamente l'informazione che serve.
#
# Non si cerca il processo per nome: unattended-upgrade-shutdown gira sempre
# dal boot senza tenere nessun lock, e in /proc il nome e' troncato a
# "unattended-upgr". Un controllo su quel nome direbbe sempre "occupato".
- name: Verifica se il lock di apt e' occupato
  shell: |
    python3 - <<'PY'
    import fcntl, os, sys

    LOCKS = [
        "/var/lib/dpkg/lock-frontend",
        "/var/lib/dpkg/lock",
        "/var/cache/apt/archives/lock",
        "/var/lib/apt/lists/lock",
    ]

    for path in LOCKS:
        if not os.path.exists(path):
            continue
        fd = os.open(path, os.O_RDONLY)
        try:
            fcntl.lockf(fd, fcntl.LOCK_SH | fcntl.LOCK_NB)
            fcntl.lockf(fd, fcntl.LOCK_UN)
        except OSError:
            print(path)
            sys.exit(1)
        finally:
            os.close(fd)
    sys.exit(0)
    PY
  args:
    executable: /bin/bash
  register: pf_lock_apt
  changed_when: false
  failed_when: false
  when: ansible_pkg_mgr | default('') == 'apt'

# --- Voci della scheda ------------------------------------------------------

- name: Registra le voci di sistema
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  vars:
    scarto: "{{ (pf_epoch_nodo.stdout | int) - (lookup('pipe', 'date +%s') | int) }}"
    comandi_mancanti: >-
      {{ pf_comandi.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.comando') | list }}
    swap_acceso: "{{ (ansible_swaptotal_mb | default(0) | int) > 0 }}"
    nodo_kubernetes: "{{ group_names | intersect(pf_gruppi_kubernetes) | length > 0 }}"
    infra_presente: "{{ pf_infra_presente.stdout | default('') | trim }}"
    righe:
      - sezione: SISTEMA
        voce: "Utente sul nodo"
        valore: "{{ pf_utente.stdout | trim }}"
        esito: "{{ 'OK' if pf_utente.stdout | trim == 'root' else 'PROBLEMA' }}"
        nota: >-
          i ruoli installano pacchetti e scrivono in /etc: servono i privilegi
          di root. Controlla ansible_user nell'inventario e il become.

      - sezione: SISTEMA
        voce: "Sistema operativo"
        valore: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_distribution_release | default('?') }})
        esito: >-
          {{ 'OK' if ansible_distribution == 'Ubuntu' and
                     ansible_distribution_major_version | int >= 22
             else 'ATTENZIONE' }}
        nota: >-
          i ruoli sono scritti e provati su Ubuntu 24.04: nomi dei pacchetti e
          repository Percona valgono per quella.

      - sezione: SISTEMA
        voce: "Kernel e architettura"
        valore: "{{ ansible_kernel }} - {{ ansible_architecture }}"
        esito: "INFO"
        nota: ""

      - sezione: SISTEMA
        voce: "Hostname del nodo"
        valore: >-
          {{ ansible_hostname }}
          {{ '(= nome di inventario)' if ansible_hostname == inventory_hostname
             else '(inventario: ' ~ inventory_hostname ~ ')' }}
        esito: >-
          {{ 'OK' if ansible_hostname == inventory_hostname
             else ('INFO' if set_hostname_from_inventory | default(false) | bool
                   else 'ATTENZIONE') }}
        nota: >-
          hostname e nome di inventario divergono e set_hostname_from_inventory
          e' false, quindi host_prep non lo allineera'. Corosync e Gluster
          identificano i nodi per nome: su [gluster_servers] va allineato.

      - sezione: SISTEMA
        voce: "Interprete Python"
        valore: "{{ ansible_python_version }} - {{ ansible_python.executable | default('?') }}"
        esito: "{{ 'OK' if ansible_python_version is version('3.8', '>=') else 'ATTENZIONE' }}"
        nota: "Ansible ha bisogno di Python 3 sul nodo gestito."

      - sezione: SISTEMA
        voce: "CPU"
        valore: >-
          {{ ansible_processor_vcpus | default(0) }} vCPU
          (attese almeno {{ pf_requisiti.vcpu }})
        esito: >-
          {{ 'OK' if (ansible_processor_vcpus | default(0) | int) >= (pf_requisiti.vcpu | int)
             else 'ATTENZIONE' }}
        nota: "CPU sotto la soglia indicativa per i gruppi di questo nodo."

      - sezione: SISTEMA
        voce: "Memoria"
        valore: >-
          {{ (ansible_memtotal_mb | default(0) | int / 1024) | round(1) }} GiB totali,
          {{ (ansible_memfree_mb | default(0) | int / 1024) | round(1) }} GiB liberi
          (attesi almeno {{ (pf_requisiti.ram_mb | int / 1024) | round(1) }} GiB)
        esito: >-
          {{ 'OK' if (ansible_memtotal_mb | default(0) | int) >= (pf_requisiti.ram_mb | int)
             else 'ATTENZIONE' }}
        nota: "memoria sotto la soglia indicativa per i gruppi di questo nodo."

      - sezione: SISTEMA
        voce: "Swap"
        valore: >-
          {{ 'attivo, ' ~ ((ansible_swaptotal_mb | int / 1024) | round(1)) ~ ' GiB'
             if swap_acceso | bool else 'spento' }}
        esito: >-
          {{ 'ATTENZIONE' if (swap_acceso | bool and nodo_kubernetes | bool)
             else ('INFO' if swap_acceso | bool else 'OK') }}
        nota: >-
          kubelet non parte con lo swap acceso: su un nodo Kubernetes va spento
          (swapoff -a e la riga tolta da /etc/fstab) prima di installare RKE2.

      - sezione: SISTEMA
        voce: "Acceso da"
        valore: "{{ ((ansible_uptime_seconds | default(0) | int) / 3600) | round(1) }} ore"
        esito: "INFO"
        nota: ""

      - sezione: SISTEMA
        voce: "Orologio"
        valore: >-
          {{ pf_ntp.stdout_lines[1] | default('fuso ignoto') }},
          NTP {{ 'sincronizzato' if (pf_ntp.stdout_lines[0] | default('no')) == 'yes'
                 else 'NON sincronizzato' }},
          scarto dal control node {{ scarto }}s
        esito: >-
          {{ 'OK' if ((pf_ntp.stdout_lines[0] | default('no')) == 'yes' and
                      (scarto | int | abs) <= (pf_scarto_orologio_max | int))
             else 'ATTENZIONE' }}
        nota: >-
          etcd e Patroni sono sensibili al tempo: con i nodi sfasati il quorum
          si comporta in modi difficili da leggere. Controlla chrony o
          systemd-timesyncd.

      - sezione: SISTEMA
        voce: "cloud-init"
        valore: >-
          {{ (pf_cloud_init.stdout | default('') | trim) | default('non presente', true) }}
        esito: >-
          {{ 'ATTENZIONE' if 'running' in (pf_cloud_init.stdout | default('')) else 'INFO' }}
        nota: >-
          cloud-init sta ancora installando pacchetti: host_prep lo aspettera'
          (cloud-init status --wait), ma la macchina non e' ancora a regime.

      - sezione: SISTEMA
        voce: "Comandi richiesti"
        valore: >-
          {{ (pf_comandi_richiesti | length) - (comandi_mancanti | length) }} su
          {{ pf_comandi_richiesti | length }} presenti{{
            '' if comandi_mancanti | length == 0
            else ' - mancano: ' ~ comandi_mancanti | join(', ') }}
        esito: "{{ 'OK' if comandi_mancanti | length == 0 else 'ATTENZIONE' }}"
        nota: >-
          i ruoli installano quasi tutto da soli, ma senza python3 Ansible non
          gira affatto e senza curl l'installer RKE2 non parte.

# Le due voci che seguono valgono solo dove c'e' apt: su un'altra
# distribuzione non ci sarebbe niente da leggere.
- name: Registra le voci legate ad apt
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  when: ansible_pkg_mgr | default('') == 'apt'
  vars:
    infra_presente: "{{ pf_infra_presente.stdout | default('') | trim }}"
    lock_occupato: "{{ (pf_lock_apt.rc | default(0)) != 0 }}"
    righe:
      - sezione: SISTEMA
        voce: "Lock di apt"
        valore: >-
          {{ 'occupato: ' ~ (pf_lock_apt.stdout | trim) if lock_occupato | bool
             else 'libero' }}
        esito: "{{ 'ATTENZIONE' if lock_occupato | bool else 'OK' }}"
        nota: >-
          un aggiornamento automatico e' in corso. host_prep lo aspetta fino a
          {{ (apt_lock_retries | default(60) | int) * (apt_lock_delay | default(5) | int) }}
          secondi; per vedere chi lo tiene: fuser -v /var/lib/dpkg/lock-frontend

      - sezione: SISTEMA
        voce: "Software gia' installato"
        valore: "{{ infra_presente | default('niente, macchina pulita', true) }}"
        esito: "{{ 'INFO' if infra_presente | length > 0 else 'OK' }}"
        nota: >-
          la macchina e' gia' stata usata. Per rifare il cluster da zero serve
          -e clean_nodes_before_join=true (nodi RKE2) oppure
          -e postgres_force_reinit=true (database): sono operazioni distruttive.
