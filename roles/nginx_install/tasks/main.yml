---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Install Nginx
  apt:
    name: nginx
    state: present
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# Nessuno stop preventivo: scrivere certificati e configurazione non richiede
# che nginx sia fermo, e fermarlo aprirebbe una finestra di disservizio a ogni
# esecuzione del playbook. Le modifiche vengono applicate dall'handler.
- name: Create Nginx certificate directory
  file:
    path: "{{ nginx_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Calcola i backend nginx dall'inventario
  set_fact:
    nginx_rancher_backend_hosts: "{{ groups.get('masters', []) }}"
    nginx_ingress_backend_hosts: "{{ groups.get('ingress', []) }}"
    nginx_multi_services_enabled: "{{ (groups.get('ingress', []) | length) > 0 }}"

- name: Verifica che ci siano backend per la console Rancher
  assert:
    that:
      - nginx_rancher_backend_hosts | length > 0
    fail_msg: >-
      Il gruppo [masters] dell'inventario e' vuoto: nginx non puo' generare
      l'upstream rancher_servers_https per {{ nginx_server_name }}.
    success_msg: >-
      Backend Rancher configurati:
      {{ nginx_rancher_backend_hosts | join(', ') }}.

- name: Avvisa che i servizi downstream non verranno pubblicati
  debug:
    msg: >-
      Il gruppo [ingress] dell'inventario e' vuoto: nginx configura solo la
      console Rancher. Il server block multi-servizi non viene installato.
  when: not (nginx_multi_services_enabled | bool)

- name: Copy SSL certificate to remote server
  copy:
    src: "{{ local_ssl_cert_path }}"
    dest: "{{ nginx_ssl_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Copy SSL private key to remote server
  copy:
    src: "{{ local_ssl_key_path }}"
    dest: "{{ nginx_ssl_key_path }}"
    owner: root
    group: root
    mode: '0600'
  notify: restart nginx

- name: Create Nginx conf.d directory
  file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Nginx conf-http.d directory
  file:
    path: "{{ nginx_conf_http_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Backup original nginx.conf
  copy:
    src: /etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf.backup
    remote_src: yes
    backup: yes
  ignore_errors: yes

# I server block vanno scritti prima di nginx.conf, che li include: cosi' il
# "nginx -t" piu' sotto valida l'insieme completo. Non hanno un validate
# proprio perche' da soli sono frammenti: referenziano upstream e contesto
# http{} che stanno in nginx.conf.
- name: Deploy dei server block in conf-http.d
  template:
    src: "{{ item }}.j2"
    dest: "{{ nginx_conf_http_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
    backup: yes
  loop:
    - rancher-console.conf
    - rancher-ingress.conf
  when: item != 'rancher-ingress.conf' or (nginx_multi_services_enabled | bool)
  notify: restart nginx

- name: Rimuovi il server block multi-servizi senza backend ingress
  file:
    path: "{{ nginx_conf_http_dir }}/rancher-ingress.conf"
    state: absent
  when: not (nginx_multi_services_enabled | bool)
  notify: restart nginx

- name: Deploy Nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart nginx

- name: Test Nginx configuration
  command: nginx -t
  register: nginx_test
  changed_when: false

- name: Display Nginx test result
  debug:
    var: nginx_test.stdout_lines

# Schema attivo/passivo: nginx gira solo sul nodo che tiene il VIP, avviato e
# fermato da nginx-ha-notify di keepalived.
#
# Ansible qui non lo avvia di proposito. nginx-ha-notify reagisce alle
# TRANSIZIONI di stato, non e' un ciclo di riconciliazione: se Ansible lo
# avviasse anche sul nodo passivo, resterebbe avviato fino alla transizione
# successiva e il comportamento del failover dipenderebbe dalla storia delle
# transizioni invece che dalla configurazione.
- name: Lascia il servizio nginx a keepalived
  systemd:
    name: nginx
    enabled: false
  when: nginx_managed_by_keepalived | bool

- name: Leggi gli indirizzi del nodo per capire dove sta il VIP Rancher
  command: ip -o addr show
  register: nginx_addr_show
  changed_when: false
  when: nginx_managed_by_keepalived | bool

- name: Allinea nginx allo stato del VIP Rancher
  systemd:
    name: nginx
    enabled: false
    state: >-
      {{ 'started'
         if ((vip_rancher_ip ~ '/' ~ (vip_rancher_prefix | string))
             in (nginx_addr_show.stdout | default('')))
         else 'stopped' }}
  when: nginx_managed_by_keepalived | bool

- name: Enable and start Nginx service
  systemd:
    name: nginx
    enabled: yes
    state: started
  when: not (nginx_managed_by_keepalived | bool)

- name: Check if Nginx is running
  systemd:
    name: nginx
  register: nginx_status

- name: Display Nginx status
  debug:
    msg: "Nginx is {{ nginx_status.status.ActiveState }}"
