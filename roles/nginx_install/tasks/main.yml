---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  # Riprova se dpkg e' occupato da un altro processo: vedi apt_lock_retries
  # in group_vars/all.yml.
  register: apt_result
  until: apt_result is succeeded
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Install Nginx
  apt:
    name: nginx
    state: present
  # Riprova se dpkg e' occupato da un altro processo: vedi apt_lock_retries
  # in group_vars/all.yml.
  register: apt_result
  until: apt_result is succeeded
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# Nessuno stop preventivo: scrivere certificati e configurazione non richiede
# che nginx sia fermo, e fermarlo aprirebbe una finestra di disservizio a ogni
# esecuzione del playbook. Le modifiche vengono applicate dall'handler.
- name: Create Nginx certificate directory
  file:
    path: "{{ nginx_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy SSL certificate to remote server
  copy:
    src: "{{ local_ssl_cert_path }}"
    dest: "{{ nginx_ssl_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Copy SSL private key to remote server
  copy:
    src: "{{ local_ssl_key_path }}"
    dest: "{{ nginx_ssl_key_path }}"
    owner: root
    group: root
    mode: '0600'
  notify: restart nginx

- name: Create Nginx conf.d directory
  file:
    path: /etc/nginx/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Nginx conf-http.d directory
  file:
    path: "{{ nginx_conf_http_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Backup original nginx.conf
  copy:
    src: /etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf.backup
    remote_src: yes
    backup: yes
  ignore_errors: yes

# I server block vanno scritti prima di nginx.conf, che li include: cosi' il
# "nginx -t" piu' sotto valida l'insieme completo. Non hanno un validate
# proprio perche' da soli sono frammenti: referenziano upstream e contesto
# http{} che stanno in nginx.conf.
- name: Deploy dei server block in conf-http.d
  template:
    src: "{{ item }}.j2"
    dest: "{{ nginx_conf_http_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
    backup: yes
  loop:
    - rancher-console.conf
    - rancher-ingress.conf
  notify: restart nginx

- name: Deploy Nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart nginx

- name: Test Nginx configuration
  command: nginx -t
  register: nginx_test
  changed_when: false

- name: Display Nginx test result
  debug:
    var: nginx_test.stdout_lines

# Schema attivo/passivo: nginx gira solo sul nodo che tiene il VIP, avviato e
# fermato da nginx-ha-notify di keepalived.
#
# Ansible qui non lo avvia di proposito. nginx-ha-notify reagisce alle
# TRANSIZIONI di stato, non e' un ciclo di riconciliazione: se Ansible lo
# avviasse anche sul nodo passivo, resterebbe avviato fino alla transizione
# successiva e il comportamento del failover dipenderebbe dalla storia delle
# transizioni invece che dalla configurazione.
- name: Lascia il servizio nginx a keepalived
  systemd:
    name: nginx
    enabled: false
  when: nginx_managed_by_keepalived | bool

- name: Enable and start Nginx service
  systemd:
    name: nginx
    enabled: yes
    state: started
  when: not (nginx_managed_by_keepalived | bool)

- name: Check if Nginx is running
  systemd:
    name: nginx
  register: nginx_status

- name: Display Nginx status
  debug:
    msg: "Nginx is {{ nginx_status.status.ActiveState }}"
