---
# Verifiche sul CONTROL NODE e sull'inventario, prima ancora di toccare le
# macchine: la versione di Ansible, i certificati, la coerenza dei gruppi e
# delle variabili che i template daranno per buone.
#
# SOLO LETTURA: si guardano file e variabili, non si scrive niente.
#
# Sono i controlli che fanno risparmiare piu' tempo, perche' riguardano errori
# che NON fanno fallire nessun task: due host con lo stesso indirizzo, un VIP
# che coincide con l'IP di un nodo, un gruppo con 2 membri dove ne servono 3.
# Il playbook gira fino in fondo e il cluster non si forma, e il perche' si
# capisce ore dopo.

- name: Verifica la presenza dei file richiesti dai ruoli
  stat:
    path: "{{ item.percorso }}"
  loop: "{{ pf_file_richiesti }}"
  loop_control:
    label: "{{ item.percorso }}"
  register: pf_file
  changed_when: false

# Due host con lo stesso ansible_host sono quasi sempre un copia-incolla
# dell'inventario. Il playbook li tratta come macchine diverse, ci installa
# sopra due volte, e il cluster nasce con un nodo fantasma.
- name: Cerca indirizzi ripetuti nell'inventario
  set_fact:
    pf_indirizzi: >-
      {{ (pf_indirizzi | default([])) + [hostvars[item].ansible_host] }}
  loop: >-
    {{ (groups['all'] | default([])) | difference(groups['local'] | default([]))
       | select('in', hostvars) | list }}
  when: hostvars[item].ansible_host is defined

- name: Registra le voci del control node
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  vars:
    file_mancanti: >-
      {{ pf_file.results | rejectattr('stat.exists') | map(attribute='item') | list }}
    nodi: >-
      {{ (groups['all'] | default([])) | difference(groups['local'] | default([])) }}
    indirizzi_ripetuti: >-
      {{ (pf_indirizzi | default([]))
         | difference((pf_indirizzi | default([])) | unique)
         | unique }}
    righe:
      - sezione: CONTROLLER
        voce: "Versione di Ansible"
        valore: "ansible-core {{ ansible_version.full }}"
        esito: >-
          {{ 'OK' if ansible_version.full is version(pf_ansible_minimo, '>=') else 'ATTENZIONE' }}
        nota: >-
          il repository e' scritto e provato su ansible-core
          {{ pf_ansible_minimo }} e oltre. Con una versione precedente alcuni
          moduli e filtri usati qui non esistono ancora.

      - sezione: CONTROLLER
        voce: "Python del control node"
        valore: "{{ ansible_python_version }}"
        esito: "{{ 'OK' if ansible_python_version is version('3.9', '>=') else 'ATTENZIONE' }}"
        nota: "ansible-core recenti chiedono Python 3.9 o superiore sul controller."

      - sezione: CONTROLLER
        voce: "Certificati e file da copiare"
        valore: >-
          {{ (pf_file_richiesti | length) - (file_mancanti | length) }} su
          {{ pf_file_richiesti | length }} presenti{{
            '' if file_mancanti | length == 0
            else ' - mancano: ' ~ (file_mancanti | map(attribute='percorso')
                                   | map('basename') | unique | join(', ')) }}
        esito: "{{ 'OK' if file_mancanti | length == 0 else 'PROBLEMA' }}"
        nota: >-
          i ruoli copiano questi file sui nodi: senza, l'installazione si ferma
          a meta' e la console Rancher resta senza certificato. Mancano, con il
          percorso per esteso a partire dalla radice del repository:
          {{ file_mancanti | map(attribute='percorso') | join(' ; ') }}

      - sezione: INVENTARIO
        voce: "Nodi dichiarati"
        valore: >-
          {{ nodi | length }} nodi in
          {{ (groups.keys() | list | difference(['all', 'ungrouped', 'local'])) | length }} gruppi
        esito: "{{ 'OK' if nodi | length > 0 else 'PROBLEMA' }}"
        nota: >-
          l'inventario non ha nemmeno un nodo: sono tutti commentati. Il
          playbook girerebbe a vuoto.

      - sezione: INVENTARIO
        voce: "Indirizzi ripetuti"
        valore: >-
          {{ 'nessuno' if indirizzi_ripetuti | length == 0
             else indirizzi_ripetuti | join(', ') }}
        esito: "{{ 'OK' if indirizzi_ripetuti | length == 0 else 'PROBLEMA' }}"
        nota: >-
          due host di inventario puntano allo stesso indirizzo. Ansible li
          tratta come macchine diverse e installa due volte sulla stessa: il
          cluster nasce con un nodo che non esiste.

# Un vincolo per gruppo, ognuno con il proprio perche': un gruppo con un numero
# di nodi sbagliato non fa fallire niente, fa solo un cluster che non regge.
- name: Verifica la numerosita' dei gruppi
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  loop: "{{ pf_vincoli_gruppo }}"
  loop_control:
    label: "{{ item.gruppo }}"
  vars:
    quanti: "{{ groups[item.gruppo] | default([]) | length }}"
    riga:
      sezione: INVENTARIO
      voce: "Gruppo [{{ item.gruppo }}]"
      valore: >-
        {{ quanti }} nodi
        {{ "(vuoto: quest'area non verra' installata)" if quanti | int == 0
           else '(' ~ (groups[item.gruppo] | join(', ')) ~ ')' }}
      esito: >-
        {{ 'OK' if (quanti | int) in item.ammessi
           else ('INFO' if quanti | int == 0 else 'ATTENZIONE') }}
      nota: >-
        {{ item.perche }} Ammessi: {{ item.ammessi | join(' oppure ') }}.

# I VIP devono essere indirizzi LIBERI. Se coincidono con l'indirizzo di un
# nodo dell'inventario e' un errore di battitura, e si scopre quando keepalived
# si porta via l'IP di una macchina viva.
- name: Verifica che i VIP non coincidano con l'indirizzo di un nodo
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  loop:
    - { nome: "vip_rancher_ip", valore: "{{ vip_rancher_ip | default('') }}", a_cosa_serve: "console Rancher, tenuto da nginx" }
    - { nome: "vip_patroni_ip", valore: "{{ vip_patroni_ip | default('') }}", a_cosa_serve: "Patroni/PgBouncer, tenuto da haproxy" }
    - { nome: "nfs_vip_ip",     valore: "{{ nfs_vip_ip | default('') }}",     a_cosa_serve: "NFS, gestito da Pacemaker" }
  loop_control:
    label: "{{ item.nome }}"
  vars:
    scontro: "{{ item.valore in (pf_indirizzi | default([])) }}"
    riga:
      sezione: INVENTARIO
      voce: "{{ item.nome }}"
      valore: >-
        {{ item.valore | default('non dichiarato', true) }} - {{ item.a_cosa_serve }}
      esito: >-
        {{ 'PROBLEMA' if scontro | bool
           else ('ATTENZIONE' if (item.valore | length) == 0 else 'OK') }}
      nota: >-
        {{ "questo VIP coincide con l'indirizzo di un nodo dell'inventario:
            keepalived o Pacemaker se lo porterebbero via a una macchina viva.
            Scegli un indirizzo libero nella VLAN."
           if scontro | bool
           else "la variabile e' vuota: il ruolo che la usa genererebbe una
                 configurazione senza indirizzo." }}

# I due VRID devono essere diversi fra loro e unici nella VLAN. Uguali, le due
# istanze VRRP si scambiano gli annunci e i VIP saltano da un nodo all'altro.
- name: Verifica i VRID di keepalived
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + [riga] }}"
  vars:
    uguali: >-
      {{ (keepalived_vrid_rancher | default(0)) == (keepalived_vrid_patroni | default(1)) }}
    riga:
      sezione: INVENTARIO
      voce: "VRID di keepalived"
      valore: >-
        rancher {{ keepalived_vrid_rancher | default('?') }},
        patroni {{ keepalived_vrid_patroni | default('?') }}
      esito: "{{ 'PROBLEMA' if uguali | bool else 'OK' }}"
      nota: >-
        le due istanze VRRP hanno lo stesso VRID: si scambiano gli annunci e i
        VIP saltano da un nodo all'altro. Devono essere diversi fra loro e
        unici nella VLAN.
  when: groups['nginx_servers'] | default([]) | length > 0

- name: Componi l'inventario come lo vede Ansible
  set_fact:
    pf_inventario_righe: >-
      {{ (pf_inventario_righe | default([]))
         + [ ('[' ~ item ~ ']').ljust(20) ~ ' '
             ~ ((groups[item] | join(', ')) | default('vuoto', true)) ] }}
  loop: "{{ groups.keys() | list | difference(['all', 'ungrouped']) | sort }}"

- name: Registra il blocco con l'inventario letto da Ansible
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco] }}"
  vars:
    blocco:
      titolo: "Inventario come lo vede Ansible"
      righe: "{{ pf_inventario_righe | default(['inventario vuoto']) }}"
