---
# Gruppi il cui numero di nodi non e' libero, con il perche'. Sono i vincoli
# che, se violati, non fanno fallire nessun task: fanno solo un cluster che non
# forma il quorum, e il motivo si capisce ore dopo.
pf_vincoli_gruppo:
  - gruppo: masters
    ammessi: [1, 3]
    perche: >-
      il cluster RKE2 locale usa etcd, che ha bisogno di un numero dispari di
      nodi. Con 2 master il quorum si perde alla caduta di uno solo.
  - gruppo: db_servers
    ammessi: [1, 3]
    perche: >-
      etcd e Patroni hanno bisogno di un numero dispari di nodi. Con 2 nodi il
      cluster non regge la caduta di nessuno dei due.
  - gruppo: gluster_servers
    ammessi: [0, 3]
    perche: >-
      "replica 3 arbiter 1" richiede esattamente 3 nodi: due con i dati e il
      terzo come arbitro dei soli metadati.
  - gruppo: nginx_servers
    ammessi: [1, 2]
    perche: >-
      i bilanciatori sono una coppia keepalived: il primo host e' MASTER, il
      secondo BACKUP. Un terzo non farebbe danni ma non servirebbe a niente.

# File che devono esistere sul control node prima di lanciare. Sono quelli che
# i ruoli copiano sui nodi: se mancano, il playbook si ferma a meta'.
#
# I percorsi sono ASSOLUTI, ancorati a repo_dir. Un percorso relativo qui non
# funzionerebbe: il modulo stat gira come un modulo qualsiasi, con una
# directory di lavoro sua che non e' la radice del repository, e riporterebbe
# "manca" per file che invece ci sono. E' lo stesso motivo per cui local_ssl_*
# in group_vars/all.yml sono ancorati anche loro.
pf_radice: "{{ repo_dir | default(inventory_dir) }}"

pf_file_richiesti:
  - percorso: "{{ pf_radice }}/roles/master1_helm_cert_manager_install/files/{{ fullchain_pem_file | default('fullchain.pem') }}"
    a_cosa_serve: "certificato della console Rancher"
  - percorso: "{{ pf_radice }}/roles/master1_helm_cert_manager_install/files/{{ privkey_pem_file | default('privkey.pem') }}"
    a_cosa_serve: "chiave privata del certificato Rancher"
  - percorso: "{{ pf_radice }}/roles/master1_helm_cert_manager_install/files/{{ cacerts_pem_file | default('cacerts.pem') }}"
    a_cosa_serve: "catena della CA, usata da cert-manager"
  - percorso: "{{ local_ssl_cert_path | default(pf_radice ~ '/files/fullchain.pem') }}"
    a_cosa_serve: "certificato che nginx pubblica sui bilanciatori"
  - percorso: "{{ local_ssl_key_path | default(pf_radice ~ '/files/privkey.pem') }}"
    a_cosa_serve: "chiave privata usata da nginx"

# Versione di ansible-core con cui il repository e' stato provato. Piu' bassa
# non vuol dire rotto, ma i moduli usati qui sono quelli di questa.
pf_ansible_minimo: "2.16"
