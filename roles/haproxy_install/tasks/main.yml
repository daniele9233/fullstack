---
- name: Installa haproxy
  apt:
    name: haproxy
    state: present
    update_cache: yes
    cache_valid_time: 3600
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Deploy della configurazione haproxy
  template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_path }}"
    owner: root
    group: root
    mode: '0644'
    backup: yes
    # haproxy rifiuta di partire con una configurazione non valida: meglio
    # scoprirlo qui che lasciare il servizio giu'.
    validate: "haproxy -c -f %s"
  notify: reload haproxy

- name: Abilita e avvia haproxy
  systemd:
    name: haproxy
    enabled: yes
    state: started
    daemon_reload: yes

# --- Tuning di rete ----------------------------------------------------------
# Applicato DOPO la configurazione, come nella procedura seguita a mano sui
# bilanciatori.
#
# ip_nonlocal_bind: permette di fare il bind di un indirizzo che il nodo non
# possiede. Serve a nginx, che ascolta esplicitamente su vip_rancher_ip:443
# anche sul bilanciatore che in quel momento non ha il VIP; senza, il bind
# fallisce con "Cannot assign requested address" e nginx non parte affatto.
# Lo imposta gia' keepalived_install, che gira prima: qui e' ripetuto perche' fa
# parte del tuning documentato di HAProxy, ed essendo idempotente la seconda
# scrittura non cambia niente.
#
# ip_forward: instradamento fra interfacce. Non serve a un HAProxy in modalita'
# proxy, che termina e riapre le connessioni, ma e' nella configurazione dei
# bilanciatori in esercizio ed e' richiesto dagli schemi in cui il traffico di
# ritorno passa dal bilanciatore.
#
# reload: yes equivale al "sysctl -p" della procedura manuale.
- name: Tuning dei parametri di rete
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
  loop: "{{ haproxy_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

- name: Mostra i parametri di rete applicati
  debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ haproxy_sysctl | dict2items | map(attribute='key') | zip(haproxy_sysctl.values())
         | map('join', ' = ') | join(', ') }}

- name: Segnala che non ci sono backend configurati
  debug:
    msg: >-
      Il gruppo [{{ haproxy_backend_group }}] dell'inventario e' vuoto: haproxy
      espone solo le statistiche sulla porta {{ haproxy_stats_port }}.
      Popola il gruppo con i nodi Patroni/PgBouncer per generare le sezioni
      primary ({{ haproxy_primary_port }}) e standby ({{ haproxy_standby_port }}).
  when: groups[haproxy_backend_group] | default([]) | length == 0
