---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.


haproxy_stats_port: 7000
haproxy_primary_port: 5000
haproxy_standby_port: 5001
haproxy_backend_port: 6432
haproxy_patroni_api_port: 8008

haproxy_maxconn_global: 4000
haproxy_maxconn_default: 3000
haproxy_maxconn_server: 300
haproxy_timeout_client: "10m"
haproxy_timeout_server: "10m"

haproxy_chroot: "/var/lib/haproxy"
haproxy_user: "haproxy"
haproxy_group: "haproxy"
haproxy_config_path: "/etc/haproxy/haproxy.cfg"

# Gruppo dell'inventario da cui prendere i nodi Patroni/PgBouncer.
haproxy_backend_group: "db_servers"

# Tuning di rete applicato ai bilanciatori dopo la configurazione di haproxy,
# come nella procedura seguita a mano. Finiscono in /etc/sysctl.conf e vengono
# ricaricati subito, l'equivalente di "sysctl -p".
haproxy_sysctl:
  net.ipv4.ip_nonlocal_bind: 1
  net.ipv4.ip_forward: 1
