---
# kubectl E IL KUBECONFIG SUL NODO — ASPETTANDOLI, NON DANDOLI PER SCONTATI.
#
# Vedi defaults/main.yml per il perche': quando questo ruolo parte, RKE2 sul
# nodo downstream puo' essere ancora in installazione.

- name: Cerca un kubectl gia' presente sul nodo
  shell: |
    for p in {{ ks_kubectl_candidati | join(' ') }}; do
      if [ -x "$p" ]; then echo "$p"; exit 0; fi
    done
    exit 1
  register: ks_kubectl_trovato
  changed_when: false
  # Non trovarlo NON e' un errore: e' il caso normale al primo giro, e si
  # aspetta nel task dopo.
  failed_when: false

- name: Attendi che RKE2 finisca di installarsi su questo nodo
  when: ks_kubectl_trovato.rc != 0
  block:
    - name: "Attesa di {{ ks_kubectl_rke2 }}"
      wait_for:
        path: "{{ ks_kubectl_rke2 }}"
        timeout: "{{ ks_attesa_timeout }}"

  rescue:
    # wait_for direbbe solo "Timeout when waiting for file": qui si dice che
    # cosa guardare, perche' la causa sta fuori da Ansible.
    - name: Spiega perche' kubectl non e' arrivato
      fail:
        msg: >-
          Dopo {{ ks_attesa_timeout }} secondi su questo nodo non e' comparso
          {{ ks_kubectl_rke2 }}: RKE2 non si e' installato. Il nodo si e'
          registrato in Rancher (altrimenti non saremmo qui), quindi il
          rancher-system-agent c'e' ed e' lui che deve tirare giu' RKE2.
          Sul nodo: "systemctl status rancher-system-agent" e
          "journalctl -u rancher-system-agent -n 200". Le due cause solite sono
          la rete verso i registry delle immagini e uno stato RKE2 rimasto da
          un'installazione precedente su questa stessa macchina.

- name: Rileva il kubectl da usare
  set_fact:
    # Se ne era gia' stato trovato uno si usa quello, altrimenti e' arrivato
    # quello di RKE2 che abbiamo appena aspettato.
    ks_kubectl_sorgente: >-
      {{ ks_kubectl_trovato.stdout | trim
         if ks_kubectl_trovato.rc == 0
         else ks_kubectl_rke2 }}

- name: Copia kubectl in {{ ks_kubectl_bin }}
  copy:
    src: "{{ ks_kubectl_sorgente }}"
    dest: "{{ ks_kubectl_bin }}"
    mode: '0755'
    owner: root
    group: root
    remote_src: yes
  when: ks_kubectl_sorgente != ks_kubectl_bin

- name: Attendi il kubeconfig di RKE2
  wait_for:
    path: "{{ ks_kubeconfig_rke2 }}"
    timeout: "{{ ks_attesa_timeout }}"

- name: Crea /root/.kube
  file:
    path: "{{ ks_kubeconfig | dirname }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copia il kubeconfig di RKE2 in {{ ks_kubeconfig }}
  copy:
    src: "{{ ks_kubeconfig_rke2 }}"
    dest: "{{ ks_kubeconfig }}"
    mode: '0600'
    owner: root
    group: root
    remote_src: yes

# Il binario c'e' e il file di configurazione pure: sono due cose diverse
# dall'avere un cluster che risponde. Al primo avvio l'API server arriva minuti
# dopo il binario, quindi si aspetta anche questo.
- name: Attendi che il cluster risponda
  block:
    - name: kubectl get nodes
      command: "{{ ks_kubectl_bin }} get nodes"
      environment:
        KUBECONFIG: "{{ ks_kubeconfig }}"
      register: kubectl_test
      changed_when: false
      retries: "{{ ks_api_retries }}"
      delay: "{{ ks_api_delay }}"
      until: kubectl_test.rc == 0

  rescue:
    # IL JOURNAL SI PORTA QUI, non si manda l'operatore a cercarlo. Prima questo
    # rescue diceva "guarda journalctl sul nodo": dieci minuti di retry, poi un
    # messaggio che rimanda su un'ALTRA macchina per leggere l'unica riga che
    # conta. Quella riga entra nel playbook, come gia' fa master1_config sul
    # cluster locale.
    #
    # Le righe di errore per prime e poche: la causa e' l'ULTIMA del journal,
    # quindi mostrandolo in ordine finisce in fondo a un muro di INFO e in un
    # incollaggio si perde.
    - name: Raccogli gli ultimi log di rke2-server
      shell: |
        set -o pipefail
        echo "### RIGHE DI ERRORE ###"
        journalctl -u rke2-server --no-pager -n 300 -o cat 2>&1 \
          | grep -iE 'level=(fatal|error)|bootstrap data|different token|flag provided but not defined|cannot unmarshal|yaml:|address already in use|panic:|Failed to' \
          | tail -15 \
          || echo "(nessuna riga di errore riconosciuta: guarda il contesto qui sotto)"
        echo
        echo "### ULTIME 20 RIGHE ###"
        journalctl -u rke2-server --no-pager -n 20 -o cat 2>&1
      args:
        executable: /bin/bash
      register: ks_journal
      failed_when: false
      changed_when: false

    - name: Spiega perche' il cluster non risponde
      fail:
        msg: |
          kubectl c'e' ma l'API server di {{ inventory_hostname }} non risponde
          dopo {{ ks_api_retries | int * ks_api_delay | int }} secondi.

          {{ ks_journal.stdout | default('(journal non leggibile)') }}

          Ultimo errore di kubectl: {{ kubectl_test.stderr | default('nessuno') | trim }}

          SE SOPRA C'E' "bootstrap data already found and encrypted with
          different token", il nodo ha ancora il datastore etcd di
          un'installazione precedente e il token nuovo non lo apre. Non e' un
          guasto di rete e non passa aspettando: la macchina va ripulita e
          riagganciata.
            ansible-playbook -i inventory.ini playbooks/20-rancher.yml \
              -e clean_nodes_before_join=true --limit new_managers,workers
            ansible-playbook -i inventory.ini playbooks/20-rancher.yml
          Il --limit non e' facoltativo: senza, la pulizia azzera anche i master
          che ospitano Rancher.

- name: Nodi visti dal cluster downstream
  debug:
    msg: "{{ kubectl_test.stdout_lines }}"
