---
# kubectl SUL NODO + IL DNS DELL'AGENT DEL CLUSTER DOWNSTREAM.
#
# Gira sui [new_managers] dopo master1_create_cluster, nell'ultimo play di
# playbooks/20-rancher.yml. Che cosa fa e perche' e' scritto in
# defaults/main.yml.
#
# In breve: prima aspetta che RKE2 abbia messo kubectl e il kubeconfig sul nodo
# — non li da' piu' per scontati, ed e' la correzione che serviva — poi scrive
# hostAliases sui deployment degli agent, che e' l'unico modo che quei pod
# hanno di risolvere il dominio di Rancher.

# master_node_ip e rancher_domain sono l'indirizzo e il nome che finiscono
# dentro agli hostAliases: senza, questo ruolo non ha niente da scrivere.
#
# Il controllo sta in un block/rescue e non in un assert secco perche' il modo
# in cui master_node_ip manca non e' "non c'e'": in group_vars/all.yml vale
# hostvars[groups['masters'][0]]['ansible_host'], e con [masters] vuoto non e'
# indefinita — e' una espressione che ESPLODE con "list object has no element
# 0". default() non lo intercetta, il rescue si'.
- name: Verifica di sapere nome e indirizzo di Rancher
  block:
    - name: Nome e indirizzo di Rancher
      assert:
        that:
          - master_node_ip | default('') | string | length > 0
          - rancher_domain | default('') | length > 0
        fail_msg: >-
          Servono rancher_domain e master_node_ip (l'indirizzo a cui risponde
          la console di Rancher): finiscono negli hostAliases del pod
          cattle-cluster-agent.
        quiet: yes

  rescue:
    - name: Spiega che master_node_ip va passata
      fail:
        msg: >-
          Non so a quale indirizzo risponde Rancher. In group_vars/all.yml
          master_node_ip vale hostvars[groups['masters'][0]]['ansible_host'], e
          qui il gruppo [masters] e' vuoto. Mettici il nodo che ospita Rancher,
          oppure passa master_node_ip a questo ruolo.

- name: kubectl e kubeconfig sul nodo
  import_tasks: attesa.yml

# Un ciclo e non tre copie degli stessi task: i deployment da sistemare sono
# una lista in ks_agent_deployments, e ce ne sono due (cattle-cluster-agent e
# fleet-agent) che vanno trattati allo stesso modo ma non aspettati allo stesso
# modo.
- name: Risoluzione del dominio Rancher dentro ai pod degli agent
  include_tasks: agente.yml
  loop: "{{ ks_agent_deployments }}"
  loop_control:
    loop_var: agente
    label: "{{ agente.namespace }}/{{ agente.nome }}"

# Non fa niente con i default: cluster_calico_vxlan_port e' vuota e la porta la
# decide Calico. Sta qui perche' e' l'unico punto del playbook in cui si ha in
# mano un kubectl del cluster DOWNSTREAM — FelixConfiguration e' una risorsa di
# quel cluster, non del cluster Rancher. Il perche' per esteso e' nel file.
- name: Porta VXLAN di Calico
  import_tasks: calico.yml
