---
# Pacemaker tiene insieme il servizio Ganesha e il VIP NFS: stanno nello stesso
# gruppo di risorse, quindi si spostano insieme sullo stesso nodo.
#
# Il cluster comprende i soli host di pcs_cluster_nodes, che di default sono i
# due nodi con i dati: l'arbitro Gluster non serve NFS e resta fuori. Su di lui
# questo ruolo non installa e non configura niente.
#
# La configurazione del cluster e' un'operazione unica, non per nodo: tutto
# quello che segue la sezione "solo primo nodo" gira solo da li'.

- name: Verifica i parametri obbligatori del cluster
  assert:
    that:
      - nfs_vip_ip | length > 0
      - pcs_cluster_password | length > 0
    fail_msg: >-
      nfs_vip_ip e pcs_cluster_password devono essere valorizzati in
      group_vars/all.yml.
  run_once: true

- name: Verifica che il VIP NFS non sia gia' assegnato a un host
  assert:
    that:
      - nfs_vip_ip not in (groups['gluster_servers'] | map('extract', hostvars, 'ansible_host') | list)
    fail_msg: >-
      nfs_vip_ip ({{ nfs_vip_ip }}) coincide con l'indirizzo di un nodo del
      cluster. Il VIP deve essere un indirizzo libero.
  run_once: true

- name: Verifica i nodi del cluster Pacemaker
  assert:
    that:
      - pcs_cluster_nodes | length >= 2
      - pcs_cluster_nodes | difference(groups['gluster_servers']) | length == 0
    fail_msg: >-
      pcs_cluster_nodes ({{ pcs_cluster_nodes | join(', ') }}) deve contenere
      almeno due host, tutti presenti in [gluster_servers].
    success_msg: >-
      Cluster Pacemaker su {{ pcs_cluster_nodes | join(', ') }}.
      Fuori dal cluster: {{ groups['gluster_servers']
                            | difference(pcs_cluster_nodes)
                            | join(', ') | default('nessuno', true) }}.
  run_once: true

- name: Segnala il cluster a due nodi
  debug:
    msg: >-
      Cluster a due nodi: "pcs cluster setup" scrive two_node: 1 in
      corosync.conf e il cluster resta sempre in quorum. Il failover per caduta
      di un nodo funziona; con stonith disattivo non e' coperto il caso in cui i
      due nodi restano vivi ma smettono di vedersi.
  when: pcs_cluster_nodes | length == 2
  run_once: true

# --- Da qui solo sui nodi del cluster: l'arbitro non partecipa ---

# ocf:heartbeat:IPaddr2 non sceglie l'interfaccia da una variabile: la ricava
# dalla tabella di instradamento, cercando quale interfaccia serve la rete a cui
# il VIP appartiene con la netmask dichiarata. Se nessuna corrisponde, la
# risorsa non parte e lascia questo messaggio, che non dice quale sia il
# problema:
#
#   nfs_ip start on <nodo> returned 'error' ([findif] failed)
#
# L'errore quasi sempre e' nfs_vip_prefix diverso dal prefisso vero della VLAN:
# nodi in /28 e VIP dichiarato /24, o viceversa. Qui si guardano i prefissi
# realmente configurati sul nodo e si pretende che nfs_vip_prefix sia uno di
# quelli. E' un controllo per eccesso, non fa aritmetica di reti, ma prende
# esattamente il caso che si verifica.
- name: Leggi i prefissi di rete configurati sul nodo
  shell: |
    set -o pipefail
    ip -o -4 addr show scope global | awk '{ print $4 }' | awk -F/ '{ print $2 }' | sort -u | tr '\n' ' '
  args:
    executable: /bin/bash
  register: pcs_prefissi
  changed_when: false
  when: inventory_hostname in pcs_cluster_nodes

- name: Verifica che nfs_vip_prefix sia il prefisso della rete dei nodi
  assert:
    that:
      - (nfs_vip_prefix | string) in (pcs_prefissi.stdout | default('') | split)
    fail_msg: >-
      nfs_vip_prefix e' {{ nfs_vip_prefix }}, ma su {{ inventory_hostname }} le
      interfacce usano /{{ pcs_prefissi.stdout | default('') | trim | replace(' ', ', /') }}.
      IPaddr2 cerca l'interfaccia che serve la rete del VIP con quella netmask,
      non la trova, e la risorsa nfs_ip resta Stopped con "[findif] failed".
      Il valore giusto si legge con "ip -br addr" sui nodi, ed e' lo stesso che
      sta in vip_rancher_prefix per i bilanciatori se stanno nella stessa VLAN.
    success_msg: >-
      nfs_vip_prefix {{ nfs_vip_prefix }} coerente con le interfacce di
      {{ inventory_hostname }}.
  # Se la lettura non ha prodotto niente il controllo non si puo' fare, e non
  # deve inventarsi un errore: meglio lasciar proseguire e vedere che cosa dice
  # IPaddr2, piuttosto che fermare il playbook su un dato che non c'e'.
  when:
    - inventory_hostname in pcs_cluster_nodes
    - (pcs_prefissi.stdout | default('') | trim | length) > 0

- name: Installa Pacemaker e pcs
  apt:
    name: "{{ pcs_pacchetti }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: inventory_hostname in pcs_cluster_nodes
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Abilita e avvia pcsd
  systemd:
    name: pcsd
    enabled: yes
    state: started
    daemon_reload: yes
  when: inventory_hostname in pcs_cluster_nodes

# pcs autentica i nodi fra loro con questo utente: la password deve essere la
# stessa ovunque. Il modulo user e' idempotente e non la riscrive a ogni run.
- name: Imposta la password dell'utente di cluster
  user:
    name: "{{ pcs_cluster_user }}"
    password: "{{ pcs_cluster_password | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}"
    update_password: always
  no_log: true
  when: inventory_hostname in pcs_cluster_nodes

# --- Da qui solo sul primo nodo del cluster ---

# NON si chiede "esiste un cluster?" ma "esiste IL NOSTRO cluster?".
#
# La differenza non e' teorica. Il pacchetto corosync di Debian e Ubuntu
# installa un /etc/corosync/corosync.conf gia' pronto, con cluster_name: debian
# e un nodo solo, e systemd lo avvia da solo appena installato. Un controllo su
# "pcs cluster status" trova quel cluster, esce zero, e il ruolo conclude che
# non c'e' niente da fare: setup e autenticazione vengono saltati, le risorse
# vengono create dentro al cluster fasullo, e ci si ritrova con
#
#   Cluster name: debian
#   1 node configured
#
# cioe' un nodo solo, senza il secondo e senza nessun failover possibile.
#
# Si legge quindi direttamente corosync.conf: il nome del cluster e l'elenco dei
# ring0_addr. Se non corrispondono a pcs_cluster_name e pcs_cluster_nodes, il
# cluster va rifatto.
- name: Leggi il cluster attualmente configurato
  shell: |
    set +e
    nome=$(awk -F':[[:space:]]*' '/cluster_name/ { print $2 }' /etc/corosync/corosync.conf 2>/dev/null | tr -d ' ')
    nodi=$(awk '/ring0_addr/ { print $2 }' /etc/corosync/corosync.conf 2>/dev/null | tr '\n' ' ')
    echo "NOME=${nome:-nessuno}"
    echo "NODI=${nodi}"
  args:
    executable: /bin/bash
  register: pcs_corosync
  changed_when: false
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Decidi se il cluster va creato
  set_fact:
    pcs_da_creare: >-
      {{ nome_attuale != pcs_cluster_name
         or (nodi_attuali | sort) != (pcs_cluster_nodes | sort) }}
  vars:
    nome_attuale: >-
      {{ pcs_corosync.stdout_lines | select('match', '^NOME=')
         | map('regex_replace', '^NOME=', '') | first | default('nessuno') }}
    nodi_attuali: >-
      {{ (pcs_corosync.stdout_lines | select('match', '^NODI=')
          | map('regex_replace', '^NODI=', '') | first | default('')).split() }}
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Mostra che cosa si e' trovato
  debug:
    msg: >-
      {{ 'Cluster gia a posto: ' ~ pcs_cluster_name ~ ' su ' ~ (pcs_cluster_nodes | join(', ')) ~ ', non si tocca.'
         if not pcs_da_creare | bool
         else 'Il cluster va creato: quello configurato adesso non e il nostro. Trovato -> '
              ~ (pcs_corosync.stdout_lines | join('  ')) }}
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Autentica i nodi del cluster
  command: >-
    pcs host auth {{ pcs_cluster_nodes | join(' ') }}
    -u {{ pcs_cluster_user }} -p {{ pcs_cluster_password }}
  when:
    - inventory_hostname == pcs_cluster_nodes[0]
    - pcs_da_creare | bool
  no_log: true

# --enable, che la procedura a mano non ha: senza, dopo un reboot il nodo non
# rientra nel cluster finche' qualcuno non lo avvia.
#
# --force perche' un cluster c'e' quasi sempre gia': quello preconfezionato dal
# pacchetto Debian. Senza, "pcs cluster setup" si rifiuta di sovrascriverlo e il
# ruolo si ferma. Con --force lo distrugge sui nodi elencati e crea il nostro.
- name: Crea il cluster
  command: >-
    pcs cluster setup {{ pcs_cluster_name }}
    {{ pcs_cluster_nodes | join(' ') }} --start --enable --force
  when:
    - inventory_hostname == pcs_cluster_nodes[0]
    - pcs_da_creare | bool

- name: Attendi che il cluster risponda
  command: pcs cluster status
  register: pcs_ready
  until: pcs_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Imposta stonith
  command: "pcs property set stonith-enabled={{ pcs_stonith_enabled | lower }}"
  when: inventory_hostname == pcs_cluster_nodes[0]
  changed_when: true

- name: Leggi le risorse gia' definite
  command: pcs resource config
  register: pcs_resources
  changed_when: false
  failed_when: false
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Crea la risorsa Ganesha
  command: >-
    pcs resource create {{ pcs_resource_ganesha }} systemd:nfs-ganesha
    op monitor interval={{ pcs_resource_monitor_interval }}
  when:
    - inventory_hostname == pcs_cluster_nodes[0]
    - pcs_resource_ganesha not in (pcs_resources.stdout | default(''))

- name: Crea la risorsa VIP
  command: >-
    pcs resource create {{ pcs_resource_vip }} ocf:heartbeat:IPaddr2
    ip={{ nfs_vip_ip }} cidr_netmask={{ nfs_vip_prefix }}
    op monitor interval={{ pcs_resource_monitor_interval }}
  when:
    - inventory_hostname == pcs_cluster_nodes[0]
    - pcs_resource_vip not in (pcs_resources.stdout | default(''))

# Nello stesso gruppo per due motivi: restano sullo stesso nodo e partono in
# ordine, prima Ganesha e poi il VIP. Cosi' il VIP non viene mai annunciato
# prima che il servizio dietro sia pronto a rispondere.
- name: Raggruppa Ganesha e VIP
  command: >-
    pcs resource group add {{ pcs_resource_group }}
    {{ pcs_resource_ganesha }} {{ pcs_resource_vip }}
  when:
    - inventory_hostname == pcs_cluster_nodes[0]
    - pcs_resource_group not in (pcs_resources.stdout | default(''))

- name: Stato finale del cluster
  command: pcs status
  register: pcs_final
  changed_when: false
  when: inventory_hostname == pcs_cluster_nodes[0]

- name: Mostra lo stato del cluster
  debug:
    msg: "{{ pcs_final.stdout_lines }}"
  when: inventory_hostname == pcs_cluster_nodes[0]
