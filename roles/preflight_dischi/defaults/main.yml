---
# Un disco piu' piccolo di questo non viene proposto come candidato per i dati:
# quasi sempre e' un residuo (una ISO, un disco di servizio del provider) e
# proporlo manderebbe fuori strada. In GiB.
pf_disco_dati_minimo_gb: 5

# Comandi necessari a create_disk. Il ruolo non installa niente: se manca
# lvm2 il volume group non si crea, se manca parted la partizione non si fa, e
# se manca mkfs.xfs il filesystem non si formatta. Sono tre errori che si
# scoprono a meta' ruolo, quando il disco e' gia' stato toccato.
pf_comandi_lvm:
  - { comando: pvs,     pacchetto: lvm2,     a_cosa_serve: "volume group e logical volume" }
  - { comando: lvcreate, pacchetto: lvm2,    a_cosa_serve: "creazione dei logical volume" }
  - { comando: parted,  pacchetto: parted,   a_cosa_serve: "partizionamento del disco" }
  - { comando: mkfs.xfs, pacchetto: xfsprogs, a_cosa_serve: "filesystem xfs (disk_fs_type)" }

# Percorsi il cui spazio libero viene sempre riportato, qualunque sia il
# gruppo. A questi si aggiunge da solo disk_mount_point del nodo.
pf_percorsi_da_misurare:
  - /
  - /var
  - /tmp
