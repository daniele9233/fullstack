---
# Dischi, partizioni, LVM e mount.
#
# SOLO LETTURA: lsblk, findmnt, df, pvs/vgs/lvs. Non si partiziona, non si
# formatta, non si monta niente.
#
# Questo ruolo ha due lavori. Il primo e' dire se il nodo e' pronto: c'e' lo
# spazio, c'e' il disco dati, ci sono i comandi che servono. Il secondo e'
# rispondere alla domanda che viene dopo, cioe' CON QUALI VALORI si popolano le
# variabili di create_disk (disk_device in testa) quando si decide di far
# creare gli LVM ad Ansible invece che a mano. Per questo la scheda finisce con
# un blocco gia' pronto da copiare.

# La logica e' la stessa di create_disk: si parte dal device montato su /, si
# risale al disco fisico e da li' in poi quel disco e' intoccabile.
# Con la root su LVM, findmnt restituisce /dev/mapper/<vg>-<lv>: lsblk -s
# risale la catena delle dipendenze fino al disco vero.
- name: Rileva il disco di sistema
  shell: |
    set -o pipefail
    sorgente=$(findmnt -n -o SOURCE / 2>/dev/null | head -1)
    lsblk -nsro NAME,TYPE "$sorgente" 2>/dev/null | awk '$2 == "disk" { print $1; exit }'
  args:
    executable: /bin/bash
  register: pf_disco_sistema
  changed_when: false
  failed_when: false

# Ogni disco viene classificato con gli stessi criteri che usa create_disk per
# scegliere: nessuna partizione, niente di montato, nessun filesystem sul
# device nudo, e non essere il disco di sistema. Cosi' il candidato indicato
# qui e' esattamente quello che sceglierebbe il ruolo, senza sorprese al
# momento di lanciarlo.
#
#   SISTEMA   il disco su cui sta /, che non si tocca
#   LIBERO    utilizzabile per i dati: e' quello che serve sapere
#   PICCOLO   libero ma sotto pf_disco_dati_minimo_gb. Quasi sempre e' un
#             residuo, e proporlo come disco dati manderebbe fuori strada
#   OCCUPATO  ha partizioni, un mount o un filesystem: c'e' gia' qualcosa
#
# zram, loop, sr e ram non sono dischi veri e vengono saltati: lsblk li
# classifica lo stesso come "disk" e comparirebbero fra i candidati.
- name: Classifica i dischi presenti
  shell: |
    set +e
    radice="{{ pf_disco_sistema.stdout | trim }}"
    minimo=$(( {{ pf_disco_dati_minimo_gb | int }} * 1024 * 1024 * 1024 ))
    for d in $(lsblk -ndo NAME,TYPE | awk '$2 == "disk" { print $1 }'); do
      case "$d" in
        zram*|loop*|sr*|ram*|fd*) continue ;;
      esac
      dimensione=$(lsblk -ndo SIZE "/dev/$d" | tr -d ' ')
      byte=$(lsblk -bndo SIZE "/dev/$d" | tr -d ' ')
      modello=$(lsblk -ndo MODEL "/dev/$d" | sed 's/ *$//')
      partizioni=$(( $(lsblk -no NAME "/dev/$d" | wc -l) - 1 ))
      montati=$(lsblk -no MOUNTPOINT "/dev/$d" | grep -c .)
      filesystem=$(lsblk -ndo FSTYPE "/dev/$d" | tr -d ' ')
      if [ "$d" = "$radice" ]; then
        stato=SISTEMA
        dettaglio="disco di sistema, $partizioni partizioni"
      elif [ "$partizioni" -ne 0 ] || [ "$montati" -ne 0 ] || [ -n "$filesystem" ]; then
        stato=OCCUPATO
        dettaglio="$partizioni partizioni, $montati mount, filesystem ${filesystem:-nessuno}"
      elif [ "${byte:-0}" -lt "$minimo" ]; then
        stato=PICCOLO
        dettaglio="libero ma sotto {{ pf_disco_dati_minimo_gb }}G, non proposto per i dati"
      else
        stato=LIBERO
        dettaglio="nessuna partizione, non montato, nessun filesystem"
      fi
      echo "$stato|/dev/$d|$dimensione|$byte|$dettaglio|${modello:-modello ignoto}"
    done
  args:
    executable: /bin/bash
  register: pf_dischi
  changed_when: false
  failed_when: false

- name: Leggi l'albero dei dischi
  command: lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINT,LABEL,MODEL
  register: pf_lsblk
  changed_when: false
  failed_when: false

- name: Leggi i filesystem montati
  command: df -hTP -x tmpfs -x devtmpfs -x squashfs -x overlay
  register: pf_df
  changed_when: false
  failed_when: false

- name: Leggi lo stato di LVM
  shell: |
    set +e
    if ! command -v pvs >/dev/null 2>&1; then
      echo "lvm2 non e' installato: nessun volume LVM da mostrare"
      exit 0
    fi
    echo "Physical volume:"
    pvs --noheadings -o pv_name,vg_name,pv_size,pv_free 2>/dev/null | sed 's/^/  /' | grep . || echo "  nessuno"
    echo "Volume group:"
    vgs --noheadings -o vg_name,vg_size,vg_free,pv_count,lv_count 2>/dev/null | sed 's/^/  /' | grep . || echo "  nessuno"
    echo "Logical volume:"
    lvs --noheadings -o vg_name,lv_name,lv_size,lv_attr 2>/dev/null | sed 's/^/  /' | grep . || echo "  nessuno"
  args:
    executable: /bin/bash
  register: pf_lvm
  changed_when: false
  failed_when: false

- name: Verifica i comandi necessari a creare gli LVM
  shell: "command -v {{ item.comando }}"
  args:
    executable: /bin/bash
  loop: "{{ pf_comandi_lvm }}"
  loop_control:
    label: "{{ item.comando }}"
  register: pf_lvm_comandi
  changed_when: false
  failed_when: false

# findmnt esce diverso da zero quando il percorso non e' un mountpoint, ed e'
# proprio l'informazione che interessa: e' lo stesso controllo che fa
# 30-database.yml prima di inizializzare il database.
- name: Verifica se {{ disk_mount_point | default('/var/lib/rancher') }} e' un mountpoint
  command: "findmnt -n -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL {{ disk_mount_point | default('/var/lib/rancher') }}"
  register: pf_mount_dati
  changed_when: false
  failed_when: false

- name: Misura lo spazio libero sui percorsi che contano
  command: "df -BG --output=target,size,avail,pcent {{ item }}"
  loop: "{{ (pf_percorsi_da_misurare + [disk_mount_point | default('/')]) | unique }}"
  loop_control:
    label: "{{ item }}"
  register: pf_spazio
  changed_when: false
  failed_when: false

# --- Voci della scheda ------------------------------------------------------

# I soli nomi dei device liberi. Serve al riepilogo finale, che gira sul
# control node e legge questo fatto dagli hostvars: la' non c'e' modo di
# rifare la classificazione.
- name: Ricorda quali dischi sono liberi
  set_fact:
    pf_dischi_liberi: >-
      {{ pf_dischi.stdout_lines | default([]) | select('match', '^LIBERO\|')
         | map('regex_replace', '^[^|]+\|([^|]+)\|.*$', '\1') | list }}

- name: Registra le voci sui dischi
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  vars:
    liberi: "{{ pf_dischi.stdout_lines | default([]) | select('match', '^LIBERO\\|') | list }}"
    tutti: "{{ pf_dischi.stdout_lines | default([]) }}"
    lvm_mancanti: >-
      {{ pf_lvm_comandi.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
    # df -BG --output=target,size,avail,pcent stampa l'intestazione e una riga
    # sola: percorso, dimensione, spazio libero, percentuale usata.
    radice: >-
      {{ ((pf_spazio.results | selectattr('item', 'equalto', '/') | first).stdout_lines
          | default([]))[1] | default('') }}
    radice_libera_gb: >-
      {{ (radice.split()[2] | default('0G')) | regex_replace('[^0-9].*$', '') | default('0', true) }}
    righe:
      - sezione: DISCHI
        voce: "Dischi presenti"
        valore: >-
          {{ tutti | length }}
          ({{ tutti | map('regex_replace', '^[^|]+\|([^|]+)\|([^|]+)\|.*$', '\1 \2')
              | join(', ') | default('nessuno', true) }})
        esito: "INFO"
        nota: ""

      - sezione: DISCHI
        voce: "Disco di sistema"
        valore: >-
          /dev/{{ pf_disco_sistema.stdout | trim | default('non riconosciuto', true) }}
          (escluso da create_disk)
        esito: "{{ 'OK' if (pf_disco_sistema.stdout | trim | length) > 0 else 'ATTENZIONE' }}"
        nota: >-
          non si e' riusciti a risalire dal mount di / al disco fisico: la
          ricerca automatica del disco dati non avrebbe un disco da escludere.
          Dichiara disk_device a mano.

      - sezione: DISCHI
        voce: "Dischi liberi per i dati"
        valore: >-
          {{ liberi | length }}
          {{ '' if liberi | length == 0
             else '(' ~ (liberi | map('regex_replace', '^[^|]+\|([^|]+)\|([^|]+)\|.*$', '\1 \2') | join(', ')) ~ ')' }}
        esito: "{{ 'OK' if liberi | length > 0 else 'INFO' }}"
        nota: >-
          nessun disco libero: se i dati devono stare su un disco dedicato,
          va aggiunto alla macchina. Altrimenti finiranno sul filesystem di
          sistema, che per un database e' una scelta da fare di proposito.

      - sezione: DISCHI
        voce: "{{ disk_mount_point | default('/var/lib/rancher') }}"
        valore: >-
          {{ 'disco dedicato -> ' ~ (pf_mount_dati.stdout | trim)
             if (pf_mount_dati.rc | default(1)) == 0
             else 'sta sul filesystem di sistema, nessun disco dedicato' }}
        esito: "{{ 'OK' if (pf_mount_dati.rc | default(1)) == 0 else 'INFO' }}"
        nota: >-
          il percorso non e' un mountpoint. I dati finiranno sulla partizione
          di sistema: per i database si puo' pretendere il contrario con
          -e postgres_require_dedicated_disk=true.

      - sezione: DISCHI
        voce: "Spazio libero su /"
        valore: >-
          {{ radice_libera_gb }}G liberi su {{ (radice.split()[1] | default('?')) }}
          (attesi almeno {{ pf_requisiti.disco_gb | default(20) }}G)
        esito: >-
          {{ 'OK' if (radice_libera_gb | int) >= (pf_requisiti.disco_gb | default(20) | int)
             else 'ATTENZIONE' }}
        nota: >-
          spazio sotto la soglia indicativa. RKE2 tiene immagini e dati in
          /var/lib/rancher, e un nodo che riempie la root smette di
          schedulare (DiskPressure).

      - sezione: DISCHI
        voce: "Strumenti per gli LVM"
        valore: >-
          {{ (pf_comandi_lvm | length) - (lvm_mancanti | length) }} su
          {{ pf_comandi_lvm | length }} presenti{{
            '' if lvm_mancanti | length == 0
            else ' - mancano: ' ~ (lvm_mancanti | map(attribute='comando') | join(', '))
                 ~ ' (pacchetti: ' ~ (lvm_mancanti | map(attribute='pacchetto') | unique | join(', ')) ~ ')' }}
        esito: "{{ 'OK' if lvm_mancanti | length == 0 else 'ATTENZIONE' }}"
        nota: >-
          servono solo se si riattiva create_disk. Senza, il ruolo si ferma a
          meta' con il disco gia' toccato: installali prima.

# Le righe grezze hanno la forma stato|device|dimensione|byte|dettaglio|modello.
# Qui diventano una tabella con le colonne allineate: e' il blocco che si legge
# per capire, a colpo d'occhio, che cosa c'e' su questa macchina.
- name: Componi la tabella dei dischi classificati
  set_fact:
    pf_dischi_righe: >-
      {{ (pf_dischi_righe | default([]))
         + [ campi[0].ljust(10) ~ campi[1].ljust(14) ~ campi[2].rjust(8)
             ~ '   ' ~ campi[4].ljust(46) ~ campi[5] ] }}
  loop: "{{ pf_dischi.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split('|')[1] }}"
  vars:
    campi: "{{ item.split('|') }}"

- name: Registra i blocchi sui dischi
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco_lsblk, blocco_stato, blocco_df, blocco_lvm] }}"
  vars:
    intestazione: >-
      {{ 'STATO'.ljust(10) ~ 'DEVICE'.ljust(14) ~ 'SIZE'.rjust(8)
         ~ '   ' ~ 'MOTIVO'.ljust(46) ~ 'MODELLO' }}
    blocco_lsblk:
      titolo: "Dischi del nodo (lsblk)"
      righe: "{{ pf_lsblk.stdout_lines | default(['illeggibili']) }}"
    blocco_stato:
      titolo: "Dischi classificati come li vedrebbe create_disk"
      righe: >-
        {{ ([intestazione] + (pf_dischi_righe | default([])))
           if (pf_dischi_righe | default([]) | length) > 0
           else ['nessun disco fisico riconosciuto'] }}
    blocco_df:
      titolo: "Filesystem montati (df -hT)"
      righe: "{{ pf_df.stdout_lines | default(['illeggibili']) }}"
    blocco_lvm:
      titolo: "Stato di LVM"
      righe: "{{ pf_lvm.stdout_lines | default(['illeggibile']) }}"

# Il pezzo per cui serve davvero questo ruolo: i valori gia' pronti da mettere
# nell'inventario o in group_vars quando si decide di far creare gli LVM ad
# Ansible. Vengono dai nomi che il nodo ha ADESSO (disk_vg_name, disk_lv_name,
# disk_mount_point del suo gruppo), non da valori inventati, cosi' quello che
# si copia e' coerente con il resto del repository.
- name: Registra il blocco con le variabili suggerite per gli LVM
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco] }}"
  vars:
    liberi: "{{ pf_dischi.stdout_lines | default([]) | select('match', '^LIBERO\\|') | list }}"
    scelto: >-
      {{ (liberi | first | default('') ).split('|')[1] | default('', true) }}
    blocco:
      titolo: "Variabili per gli LVM, se un giorno li fa Ansible (ruolo create_disk)"
      righe: >-
        {{ (['  Nessun disco libero su questo nodo: qui create_disk non avrebbe',
             '  niente da partizionare e ' ~ (disk_mount_point | default('/var/lib/rancher')) ~
             ' resterebbe sul filesystem di sistema.']
            if liberi | length == 0
            else
            ['  Candidato: ' ~ scelto ~ '   ('
              ~ ((liberi | first).split('|')[2]) ~ ', '
              ~ ((liberi | first).split('|')[5]) ~ ')',
             '' ] +
            (['  Ce ne sono ' ~ liberi | length ~ ': senza disk_device il ruolo prende il primo',
              "  che il kernel enumera, cioe' " ~ scelto ~ '. Meglio dichiararlo.',
              '']
             if liberi | length > 1 else []) +
            ["  In group_vars, oppure accanto all'host in inventory.ini:",
             '',
             '    disk_device: "' ~ scelto ~ '"',
             '    disk_vg_name: "' ~ (disk_vg_name | default('vg_rancher')) ~ '"',
             '    disk_lv_name: "' ~ (disk_lv_name | default('lv_rancher')) ~ '"',
             '    disk_lv_size: "' ~ (disk_lv_size | default('100%FREE')) ~ '"',
             '    disk_fs_type: "' ~ (disk_fs_type | default('xfs')) ~ '"',
             '    disk_mount_point: "' ~ (disk_mount_point | default('/var/lib/rancher')) ~ '"',
             '    disk_mount_options: "' ~ (disk_mount_options | default('defaults')) ~ '"',
             '',
             '  Riga di inventario per questo host soltanto:',
             '',
             '    ' ~ inventory_hostname ~ ' ansible_host=' ~ (ansible_host | default(inventory_hostname))
                   ~ ' ansible_user=' ~ (ansible_user | default('root'))
                   ~ ' disk_device=' ~ scelto,
             '',
             '  Riga che finirebbe in /etc/fstab:',
             '',
             '    /dev/' ~ (disk_vg_name | default('vg_rancher')) ~ '/'
                        ~ (disk_lv_name | default('lv_rancher')) ~ ' '
                        ~ (disk_mount_point | default('/var/lib/rancher')) ~ ' '
                        ~ (disk_fs_type | default('xfs')) ~ ' '
                        ~ (disk_mount_options | default('defaults')) ~ ' 0 0']) }}
