---
# Interruttore generale del ruolo. Disattivato di default: la pulizia e'
# distruttiva e su un nodo sano smonta il cluster. Va abilitata solo quando si
# riparte da capo su macchine gia' usate in un'installazione precedente:
#
#   ansible-playbook -i inventory.ini site.yml -e clean_nodes_before_join=true
#
clean_nodes_before_join: false

# Servizi fermati e disabilitati prima di tutto il resto. Non e' un errore se
# non esistono: un nodo rimasto a meta' provisioning puo' avere solo l'agent.
clean_node_state_services:
  - rancher-system-agent
  - rke2-server
  - rke2-agent

# Script ufficiali, eseguiti solo se presenti e in quest'ordine.
# rke2-killall.sh per primo: fermare l'unit systemd non basta, RKE2 lascia vivi
# containerd, kubelet e il processo supervisor. Un supervisor orfano continua a
# tenere la porta 9345 e il successivo avvio muore con
# "listen tcp :9345: bind: address already in use".
clean_node_state_uninstall_scripts:
  - /usr/local/bin/rke2-killall.sh
  - /usr/local/bin/rancher-system-agent-uninstall.sh
  - /usr/local/bin/rke2-uninstall.sh
  - /usr/local/bin/rke2-agent-uninstall.sh

# Porte che devono risultare libere a pulizia finita.
clean_node_state_ports:
  - 9345
  - 6443

# Directory di stato rimosse dopo gli script di uninstall.
# NOTA: si rimuovono solo sottodirectory di /var/lib/rancher, mai la
# directory stessa, che e' il mount point del volume LVM creato da create_disk.
clean_node_state_paths:
  - /etc/cni/net.d
  - /var/lib/cni
  # Tutta /opt/cni, non solo bin: su questi nodi la disinstallazione di cilium
  # aveva lasciato /etc/cni/net.d/05-cilium.conflist senza piu' /opt/cni/bin.
  - /opt/cni
  - /etc/rancher/agent
  - /etc/rancher/rke2
  - /var/lib/rancher/agent
  - /var/lib/rancher/rke2

# Unit file e binari lasciati indietro quando mancano gli script di uninstall.
clean_node_state_files:
  - /etc/systemd/system/rancher-system-agent.service
  - /etc/systemd/system/rancher-system-agent.env
  - /etc/systemd/system/rke2-server.service
  - /etc/systemd/system/rke2-server.env
  - /etc/systemd/system/rke2-agent.service
  - /etc/systemd/system/rke2-agent.env
  - /usr/local/bin/rancher-system-agent
  - /usr/local/bin/rancher-system-agent-uninstall.sh
