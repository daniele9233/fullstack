---
# Firewall, protezioni obbligatorie del kernel e parametri sysctl.
#
# SOLO LETTURA: si legge lo stato, non si disattiva niente. A disattivare ufw,
# firewalld e AppArmor ci pensa host_prep quando parte l'installazione vera;
# qui interessa sapere da dove si parte, e soprattutto accorgersi del caso
# scomodo, cioe' un firewall acceso con disable_ufw messo a false.

- name: Leggi lo stato dei firewall e delle protezioni obbligatorie
  shell: |
    set +e

    if command -v ufw >/dev/null 2>&1; then
      stato=$(ufw status 2>/dev/null | sed -n 's/^Status: //p' | head -1)
      echo "UFW=${stato:-illeggibile}"
      echo "UFW_REGOLE=$(ufw status numbered 2>/dev/null | grep -c '^\[')"
    else
      echo "UFW=non installato"
      echo "UFW_REGOLE=0"
    fi

    if command -v firewall-cmd >/dev/null 2>&1; then
      echo "FIREWALLD=$(firewall-cmd --state 2>&1 | head -1)"
    else
      echo "FIREWALLD=non installato"
    fi

    # -S e non -L: -S non fa risoluzione inversa dei nomi, quindi non rischia
    # di restare appeso su un DNS lento.
    if command -v iptables >/dev/null 2>&1; then
      echo "IPTABLES_REGOLE=$(iptables -S 2>/dev/null | grep -c '^-A')"
      echo "IPTABLES_POLICY=$(iptables -S 2>/dev/null | grep '^-P' | tr '\n' ' ')"
    else
      echo "IPTABLES_REGOLE=0"
      echo "IPTABLES_POLICY=iptables non installato"
    fi

    if command -v nft >/dev/null 2>&1; then
      echo "NFT_TABELLE=$(nft list tables 2>/dev/null | grep -c 'table')"
    else
      echo "NFT_TABELLE=0"
    fi

    apparmor=$(systemctl is-active apparmor 2>/dev/null | head -1)
    echo "APPARMOR=${apparmor:-non presente}"
    profili=$(wc -l < /sys/kernel/security/apparmor/profiles 2>/dev/null)
    echo "APPARMOR_PROFILI=${profili:-0}"
  args:
    executable: /bin/bash
  register: pf_fw_raw
  changed_when: false
  failed_when: false

- name: Leggi i parametri di kernel che contano
  command: "sysctl -n {{ item }}"
  loop: "{{ pf_sysctl_da_leggere }}"
  loop_control:
    label: "{{ item }}"
  register: pf_sysctl
  changed_when: false
  failed_when: false

- name: Verifica quali moduli del kernel risultano caricati
  shell: "lsmod | awk '{ print $1 }' | grep -qx '{{ item }}'"
  args:
    executable: /bin/bash
  loop: "{{ pf_moduli_da_verificare }}"
  loop_control:
    label: "{{ item }}"
  register: pf_moduli
  changed_when: false
  failed_when: false

# --- Voci della scheda ------------------------------------------------------

- name: Registra le voci di firewall
  set_fact:
    pf_righe: "{{ (pf_righe | default([])) + righe }}"
  vars:
    # Le righe CHIAVE=valore lette sopra, trasformate in dizionario una volta
    # sola, cosi' le voci qui sotto restano leggibili.
    v: "{{ dict(pf_fw_raw.stdout_lines | map('split', '=', 1) | list) }}"
    ufw_acceso: "{{ 'active' in (v.UFW | default('')) }}"
    firewalld_acceso: "{{ (v.FIREWALLD | default('')) == 'running' }}"
    apparmor_acceso: "{{ (v.APPARMOR | default('')) == 'active' }}"
    moduli_assenti: >-
      {{ pf_moduli.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
    righe:
      - sezione: FIREWALL
        voce: "ufw"
        valore: >-
          {{ v.UFW | default('?') }}{{ ', ' ~ v.UFW_REGOLE ~ ' regole'
                                       if (v.UFW_REGOLE | default('0') | int) > 0 else '' }}
        esito: >-
          {{ 'OK' if not ufw_acceso | bool
             else ('ATTENZIONE' if disable_ufw | default(true) | bool else 'PROBLEMA') }}
        nota: >-
          {{ "ufw e' acceso: host_prep lo disattivera' prima di installare, con
              ufw --force disable."
             if disable_ufw | default(true) | bool
             else "ufw e' acceso e disable_ufw e' false: non lo spegnera' nessuno.
                   I cluster sembrano partire e non convergono mai, perche' fra
                   RKE2, Gluster, NFS e Pacemaker le porte in gioco sono tante e
                   VRRP non e' nemmeno TCP (protocollo IP 112)." }}

      - sezione: FIREWALL
        voce: "firewalld"
        valore: "{{ v.FIREWALLD | default('?') }}"
        esito: >-
          {{ 'OK' if not firewalld_acceso | bool
             else ('ATTENZIONE' if disable_ufw | default(true) | bool else 'PROBLEMA') }}
        nota: >-
          firewalld non c'e' su Ubuntu di serie: se qualcuno l'ha installato
          blocca il traffico di cluster senza dare segnali evidenti.

      - sezione: FIREWALL
        voce: "Regole iptables"
        valore: >-
          {{ v.IPTABLES_REGOLE | default('0') }} regole,
          policy {{ v.IPTABLES_POLICY | default('?') | trim }}
        esito: >-
          {{ 'ATTENZIONE' if 'DROP' in (v.IPTABLES_POLICY | default('')) else 'INFO' }}
        nota: >-
          una policy di catena su DROP scarta il traffico anche con ufw spento.
          Su un nodo gia' installato le regole sono normali: le scrivono
          kube-proxy e il CNI.

      - sezione: FIREWALL
        voce: "Tabelle nftables"
        valore: "{{ v.NFT_TABELLE | default('0') }}"
        esito: "INFO"
        nota: ""

      - sezione: FIREWALL
        voce: "AppArmor"
        valore: >-
          {{ v.APPARMOR | default('?') }},
          {{ v.APPARMOR_PROFILI | default('0') }} profili caricati
        esito: >-
          {{ 'OK' if not apparmor_acceso | bool
             else ('ATTENZIONE' if disable_apparmor | default(true) | bool else 'PROBLEMA') }}
        nota: >-
          {{ "AppArmor e' attivo: host_prep lo disattivera' prima di installare."
             if disable_apparmor | default(true) | bool
             else "AppArmor e' attivo e disable_apparmor e' false: i profili
                   possono fermare i container e le risorse Pacemaker." }}

      - sezione: FIREWALL
        voce: "SELinux"
        valore: "{{ ansible_selinux.status | default('non presente') }}"
        esito: >-
          {{ 'ATTENZIONE' if (ansible_selinux.status | default('')) == 'enabled' else 'OK' }}
        nota: "SELinux in enforcing blocca RKE2 se non e' stato configurato apposta."

      - sezione: FIREWALL
        voce: "Moduli del kernel"
        valore: >-
          {{ (pf_moduli_da_verificare | length) - (moduli_assenti | length) }} su
          {{ pf_moduli_da_verificare | length }} caricati{{
            '' if moduli_assenti | length == 0
            else ' - non caricati: ' ~ moduli_assenti | join(', ') }}
        esito: "{{ 'OK' if moduli_assenti | length == 0 else 'INFO' }}"
        nota: >-
          non e' detto che manchino: possono essere compilati nel kernel oppure
          venire caricati al primo uso. Diventa un problema solo se dopo
          l'installazione i Service Kubernetes non rispondono.

- name: Componi l'elenco dei parametri di kernel
  set_fact:
    pf_sysctl_righe: >-
      {{ (pf_sysctl_righe | default([]))
         + [ item.item.ljust(38) ~ ' '
             ~ (item.stdout | default('') | trim | default('non impostato', true)) ] }}
  loop: "{{ pf_sysctl.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Registra il blocco dei parametri di kernel
  set_fact:
    pf_blocchi: "{{ (pf_blocchi | default([])) + [blocco] }}"
  vars:
    blocco:
      titolo: "Parametri di kernel, letti e non modificati"
      righe: "{{ pf_sysctl_righe }}"
