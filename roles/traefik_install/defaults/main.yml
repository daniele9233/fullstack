---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.
traefik_enabled: true

traefik_namespace: "traefik"
traefik_chart: "traefik"
traefik_repo: "https://traefik.github.io/charts"
traefik_chart_version: ""

traefik_kind: "DaemonSet"
traefik_host_http_port: 80
traefik_host_https_port: 443
traefik_default_ingress_class: true

traefik_node_selector: {}
traefik_tolerations: []

# Directory sorvegliata da rke2-server: quello che ci finisce dentro viene
# applicato al cluster senza bisogno di kubectl o helm sul nodo.
traefik_manifest_dir: "/var/lib/rancher/rke2/server/manifests"
traefik_manifest_file: "traefik.yaml"

# Attesa che i pod siano pronti dopo l'installazione. Il chart va scaricato
# dalla rete e il DaemonSet deve partire su ogni nodo: 5 minuti bastano.
traefik_wait_retries: 30
traefik_wait_delay: 10

# true = se dopo l'attesa Traefik non e' pronto, il playbook SI FERMA qui,
# mostrando i log del job che scarica il chart.
#
# Prima proseguiva, e la verifica diceva solo "non ancora pronto". Sembrava
# prudente e invece era il contrario: senza Traefik nessuno serve l'Ingress di
# Rancher, quindi il playbook tirava dritto e moriva mezz'ora dopo, in un altro
# play, con "Connection refused" sulla API di Rancher — un messaggio che di
# Traefik non parla. Il motivo vero (di solito: il pod che scarica il chart non
# risolve traefik.github.io) restava dentro a un job che nessuno andava a
# guardare.
#
# Fermarsi qui non fa perdere niente: quello che viene dopo non puo' funzionare.
traefik_ferma_se_non_pronto: true

# Righe di log del job helm-install-traefik da mostrare quando qualcosa non va.
traefik_log_righe: 40
