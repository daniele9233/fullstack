---
# Traefik come ingress controller, al posto di rke2-ingress-nginx.
#
# Gira sui nodi CONTROL PLANE, non su quelli ingress: il manifest descrive dove
# far girare i pod, ci pensa poi Kubernetes a schedularli. Sul cluster locale
# sono i [masters], su quello downstream i [new_managers].
#
# Non serve ne' helm ne' kubectl sul nodo: il file finisce nella directory che
# rke2-server sorveglia, e il helm-controller integrato fa il resto.

# Due modi validi di non avere nginx, e il controllo deve accettarli entrambi:
#
#   - ingress-controller: traefik|none in config.yaml — il meccanismo previsto
#     da RKE2, e l'unico che funzioni dalle versioni in cui rke2-ingress-nginx
#     non e' piu' fra i valori ammessi di "disable";
#   - rke2-ingress-nginx fra i disable — il modo vecchio, ancora valido sulle
#     versioni che lo accettano.
#
# Controllare solo il secondo faceva fallire questo assert appena la scelta
# dell'ingress e' passata a rke2_ingress_controller, su un cluster che era
# configurato correttamente.
- name: Verifica che nessun altro ingress pretenda le porte 80 e 443
  assert:
    that:
      - >-
        (rke2_ingress_controller | default('') | length > 0
         and rke2_ingress_controller != 'ingress-nginx')
        or ('rke2-ingress-nginx' in (rke2_disable | default([])))
    fail_msg: >-
      Traefik e rke2-ingress-nginx pretendono entrambi le porte
      {{ traefik_host_http_port }} e {{ traefik_host_https_port }} dei nodi: il
      secondo che parte resta in CrashLoopBackOff.
      Metti rke2_ingress_controller a "traefik" (o "none") in
      group_vars/all.yml, oppure aggiungi rke2-ingress-nginx a rke2_disable.
  when: traefik_enabled | bool
  run_once: true

# La directory esiste gia' se rke2-server e' partito almeno una volta. Su un
# nodo appena installato puo' non esserci ancora: creandola, il manifest resta
# li' pronto e viene applicato al primo avvio.
- name: Crea la directory dei manifest RKE2
  file:
    path: "{{ traefik_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: traefik_enabled | bool

- name: Deploy del manifest Traefik
  template:
    src: traefik.yaml.j2
    dest: "{{ traefik_manifest_dir }}/{{ traefik_manifest_file }}"
    owner: root
    group: root
    mode: '0600'
  when: traefik_enabled | bool

# Rimosso quando traefik_enabled passa a false: senza, il manifest resterebbe
# nella directory e il helm-controller continuerebbe a tenere su il chart.
- name: Rimuovi il manifest Traefik quando disabilitato
  file:
    path: "{{ traefik_manifest_dir }}/{{ traefik_manifest_file }}"
    state: absent
  when: not (traefik_enabled | bool)

# --- Verifica, solo dal primo nodo del gruppo --------------------------------

- name: Attendi che Traefik sia pronto
  shell: >-
    set -o pipefail;
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    -n {{ traefik_namespace }} get daemonset traefik
    -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}'
  args:
    executable: /bin/bash
  register: traefik_ready
  until: >-
    traefik_ready.rc == 0
    and traefik_ready.stdout | length > 0
    and traefik_ready.stdout.split('/')[0] | int > 0
    and traefik_ready.stdout.split('/')[0] == traefik_ready.stdout.split('/')[1]
  retries: "{{ traefik_wait_retries }}"
  delay: "{{ traefik_wait_delay }}"
  changed_when: false
  # Il fallimento lo gestiscono i task qui sotto, che prima vanno a leggere
  # PERCHE' non e' pronto.
  failed_when: false
  when:
    - traefik_enabled | bool
    - inventory_hostname == ansible_play_hosts_all[0]

- name: Stabilisci se Traefik e' pronto
  set_fact:
    traefik_pronto: >-
      {{ traefik_ready.rc | default(1) == 0
         and (traefik_ready.stdout | default('')) is match('^[0-9]+/[0-9]+$')
         and traefik_ready.stdout.split('/')[0] | int > 0
         and traefik_ready.stdout.split('/')[0] == traefik_ready.stdout.split('/')[1] }}
  when:
    - traefik_enabled | bool
    - inventory_hostname == ansible_play_hosts_all[0]

- name: Stato di Traefik
  debug:
    msg: "Traefik pronto: {{ traefik_ready.stdout }} pod"
  when:
    - traefik_enabled | bool
    - inventory_hostname == ansible_play_hosts_all[0]
    - traefik_pronto | bool

# --- Traefik non e' pronto: prima si guarda PERCHE', poi ci si ferma ----------
#
# Il chart lo scarica un POD (il job helm-install-traefik), non il nodo. Se i
# pod non risolvono i nomi esterni — il caso classico e' il CoreDNS che inoltra
# a 8.8.8.8 perche' /etc/resolv.conf del nodo e' lo stub 127.0.0.53 — quel job
# resta a riprovare per sempre con "lookup traefik.github.io: i/o timeout", e
# fuori si vede solo un DaemonSet che non esiste. Il motivo sta nei log del job:
# vanno stampati qui, non lasciati li' da cercare.
- name: Diagnosi di Traefik non pronto
  when:
    - traefik_enabled | bool
    - inventory_hostname == ansible_play_hosts_all[0]
    - not (traefik_pronto | bool)
  block:
    - name: Log del job che scarica il chart
      shell: >-
        set -o pipefail;
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system logs job/helm-install-traefik
        --tail={{ traefik_log_righe }} 2>&1 | tail -{{ traefik_log_righe }}
      args:
        executable: /bin/bash
      register: traefik_job_log
      changed_when: false
      failed_when: false

    - name: Stato di HelmChart, job e pod
      shell: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system get helmchart traefik 2>&1;
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n kube-system get job,pods -l helmcharts.helm.cattle.io/chart=traefik 2>&1;
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        -n {{ traefik_namespace }} get daemonset,pods -o wide 2>&1
      args:
        executable: /bin/bash
      register: traefik_stato
      changed_when: false
      failed_when: false

    - name: Fermati spiegando perche' Traefik non e' pronto
      fail:
        msg: |
          Traefik non e' pronto dopo {{ traefik_wait_retries | int * traefik_wait_delay | int }} secondi su {{ inventory_hostname }}.

          Log di helm-install-traefik (e' il pod che scarica il chart):
          {{ traefik_job_log.stdout | default('(nessun log: il job non esiste ancora)') }}

          Stato di HelmChart, job e DaemonSet:
          {{ traefik_stato.stdout | default('(niente)') }}

          Se qui sopra leggi "i/o timeout" o "no such host" su traefik.github.io,
          il problema NON e' Traefik: e' che questo pod non risolve i nomi.
          Le cause sono DUE e si somigliano molto. Prima di agire, distinguile:

            {{ traefik_kubectl }} --kubeconfig {{ traefik_kubeconfig }} \
              -n kube-system get pods -o wide | grep coredns

            {{ traefik_kubectl }} --kubeconfig {{ traefik_kubeconfig }} run t1 \
              --rm -i --restart=Never --image=busybox:1.36 \
              --overrides='{"spec":{"nodeName":"<NODO-DI-COREDNS>"}}' \
              -- nslookup github.com

            {{ traefik_kubectl }} --kubeconfig {{ traefik_kubeconfig }} run t2 \
              --rm -i --restart=Never --image=busybox:1.36 \
              --overrides='{"spec":{"nodeName":"<UN-ALTRO-NODO>"}}' \
              -- nslookup github.com

          FALLISCONO ENTRAMBI -> e' il resolv.conf. Su Ubuntu /etc/resolv.conf
          punta allo stub 127.0.0.53 di systemd-resolved, RKE2 vede il loopback
          e ripiega su 8.8.8.8, che su rete aziendale chiusa non risponde. La
          cura e' rke2_resolv_conf in group_vars/all.yml (cluster locale) e
          cluster_resolv_conf (downstream): il config.yaml del nodo deve avere

            resolv-conf: /run/systemd/resolve/resolv.conf

          Poi "systemctl restart rke2-server" sui nodi, o reinstallazione.

          IL PRIMO RISOLVE E IL SECONDO NO -> non c'entra il DNS: CoreDNS sta
          bene, e' il traffico fra pod di NODI DIVERSI che non passa. Con Calico
          quel traffico e' VXLAN su UDP 4789; con canal e' UDP 8472. Se la rete
          lascia passare una porta e non l'altra, il cluster sembra sano (tutti
          i nodi Ready) ma i pod non si raggiungono fra macchine. La cura e'
          calico_vxlan_port in group_vars/all.yml: mettici la porta che questa
          rete consente davvero. Su un nodo singolo il guasto non si vede mai,
          perche' li' non si incapsula niente.

          Con traefik_ferma_se_non_pronto=false il playbook prosegue lo stesso,
          ma quello che viene dopo (l'Ingress di Rancher) non puo' funzionare.
      when: traefik_ferma_se_non_pronto | bool

    - name: Prosegui senza Traefik, come richiesto
      debug:
        msg: >-
          Traefik non e' pronto, ma traefik_ferma_se_non_pronto e' false: si
          prosegue. L'Ingress di Rancher restera' senza nessuno che lo serve.
      when: not (traefik_ferma_se_non_pronto | bool)
