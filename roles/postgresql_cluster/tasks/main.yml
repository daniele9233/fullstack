---
# Cluster PostgreSQL con Patroni ed etcd sul gruppo [db_servers].
#
# Il ruolo e' IDEMPOTENTE: rilanciarlo su un cluster gia' attivo non cancella
# nulla e non riavvia niente. Le directory dati vengono create solo se mancano,
# e i passi di bootstrap girano solo alla prima installazione.
#
# Per ripartire da zero azzerando i dati serve una richiesta esplicita:
#   ansible-playbook -i inventory.ini site.yml -e postgres_force_reinit=true
# che CANCELLA il database e il datastore etcd su tutti i nodi.

- name: Verifica di avere tre nodi nel gruppo
  assert:
    that:
      - groups[postgres_cluster_group] | default([]) | length == 3
    fail_msg: >-
      Il gruppo [{{ postgres_cluster_group }}] ha
      {{ groups[postgres_cluster_group] | default([]) | length }} host.
      Patroni con etcd richiede un numero dispari di nodi per il quorum: tre.
  run_once: true

# --- Rilevamento dello stato esistente -------------------------------------
# Il marcatore di una PGDATA gestita da Patroni e' patroni.dynamic.json, che
# scrive Patroni e nessun altro.
#
# NON si guarda PG_VERSION: quel file esiste anche nel cluster "main" che
# percona-postgresql crea da solo durante l'installazione, come fa
# postgresql-common su Debian e Ubuntu. Usandolo, su una macchina nuova il
# ruolo concludeva "gia' inizializzato" subito dopo aver installato i pacchetti,
# saltava l'attesa della leadership e avviava le repliche prima che esistesse un
# leader.

- name: Verifica se PGDATA e' gestita da Patroni
  stat:
    path: "{{ postgres_data_dir }}/patroni.dynamic.json"
  register: patroni_marker

- name: Verifica se PGDATA contiene un cluster PostgreSQL
  stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pg_version_file

- name: Verifica se etcd ha gia' un datastore
  stat:
    path: "{{ etcd_data_dir }}/member"
  register: etcd_member_dir

- name: Determina cosa va inizializzato
  set_fact:
    pg_needs_bootstrap: "{{ postgres_force_reinit | bool or not patroni_marker.stat.exists }}"
    etcd_needs_bootstrap: "{{ postgres_force_reinit | bool or not etcd_member_dir.stat.exists }}"

- name: Mostra lo stato rilevato
  debug:
    msg: >-
      {{ inventory_hostname }}:
      PostgreSQL {{ 'da inizializzare' if pg_needs_bootstrap else 'gia gestito da Patroni in ' ~ postgres_data_dir }},
      etcd {{ 'da inizializzare' if etcd_needs_bootstrap else 'datastore gia presente' }}
      {{ '(cluster del pacchetto da rimuovere)'
         if pg_version_file.stat.exists and not patroni_marker.stat.exists else '' }}
      {{ '(FORZATO: i dati verranno CANCELLATI)' if postgres_force_reinit | bool else '' }}

# --- Preparazione del sistema ----------------------------------------------

- name: Leggi il timezone corrente
  command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  when: current_timezone.stdout | trim != timezone

- name: Update and upgrade system
  apt:
    update_cache: yes
    upgrade: dist
  when: postgres_dist_upgrade | bool
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Install utility packages
  apt:
    name: "{{ postgres_utility_packages }}"
    state: present
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Add /etc/hosts entries
  lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ item }}\s*$'
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
    backup: yes
  loop: "{{ groups[postgres_cluster_group] }}"

# --- Repository Percona -----------------------------------------------------

- name: Verifica se percona-release e' gia' installato
  stat:
    path: /usr/bin/percona-release
  register: percona_release_bin

- name: Ensure curl is installed
  apt:
    name: curl
    state: present
  when: not percona_release_bin.stat.exists
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Download Percona repo via curl (workaround bug)
  shell: "curl -fsSL -o /tmp/percona-release.deb {{ percona_release_deb_url }}"
  when: not percona_release_bin.stat.exists

- name: Install Percona repo
  apt:
    deb: /tmp/percona-release.deb
  when: not percona_release_bin.stat.exists
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# "percona-release setup" e' idempotente: riscrive la configurazione del repo e
# non fa danni se e' gia' a posto, quindi gira SEMPRE.
#
# Prima era condizionato all'esistenza di un file *{{ percona_repo }}* in
# /etc/apt/sources.list.d, e bastava un file rimasto indietro perche' il setup
# venisse saltato lasciando un repo inutilizzabile: apt poi falliva con
# "No package matching 'percona-postgresql-{{ postgres_version }}'", che non
# dice niente su dove sia il problema. Il controllo su un file presume anche il
# formato .list, mentre le versioni recenti di percona-release scrivono in
# deb822 (.sources).
- name: "Setup Percona PostgreSQL {{ postgres_version }} repo"
  command: "percona-release setup {{ percona_repo }}"
  register: percona_setup
  changed_when: "'already enabled' not in (percona_setup.stdout | default(''))"

- name: Aggiorna l'indice dei pacchetti dopo il setup del repo
  apt:
    update_cache: yes
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# --- Pacchetti --------------------------------------------------------------

# Il messaggio di apt quando un pacchetto non c'e' non distingue fra "repo non
# configurato", "indice non scaricato" e "nome del pacchetto sbagliato". Questa
# verifica lo dice prima, e indica dove guardare.
- name: Verifica che il repo esponga i pacchetti PostgreSQL
  shell: >-
    set -o pipefail;
    apt-cache policy {{ postgres_packages[0] }} | awk '/Candidate:/ {print $2}'
  args:
    executable: /bin/bash
  register: pg_candidate
  changed_when: false
  failed_when: false

- name: Fermati se il repo Percona non e' utilizzabile
  assert:
    that:
      - (pg_candidate.stdout | trim) not in ['', '(none)']
    fail_msg: >-
      {{ postgres_packages[0] }} non risulta disponibile su
      {{ inventory_hostname }}: il repo {{ percona_repo }} non e' configurato,
      oppure il suo indice non e' stato scaricato. Sul nodo controlla
      "percona-release show", "ls /etc/apt/sources.list.d/" e l'esito di
      "apt-get update", e verifica che raggiunga repo.percona.com.
    success_msg: >-
      {{ postgres_packages[0] }} disponibile in versione
      {{ pg_candidate.stdout | trim }}.

- name: "Install PostgreSQL {{ postgres_version }} and tools"
  apt:
    name: "{{ postgres_packages }}"
    state: present
    update_cache: yes
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# etcd arriva dal repo Percona appena configurato, che pero' RIMUOVE le
# versioni vecchie dall'indice quando pubblica le nuove: un pin che ieri
# esisteva oggi puo' non esserci piu', e apt fallirebbe con un generico
# "version not found". La verifica sta PRIMA dell'install per dire subito
# quali versioni ci sono davvero.
- name: Leggi le versioni etcd disponibili
  shell: >-
    set -o pipefail;
    apt-cache madison etcd | awk -F'|' '{gsub(/ /, "", $2); print $2}'
  args:
    executable: /bin/bash
  register: etcd_available
  changed_when: false
  failed_when: false
  when: etcd_version | length > 0

- name: Verifica che la versione etcd richiesta esista nel repo
  assert:
    that:
      - etcd_version in (etcd_available.stdout_lines | default([]))
    fail_msg: >-
      etcd {{ etcd_version }} non e' nel repo. Versioni disponibili:
      {{ etcd_available.stdout_lines | default([]) | join(', ')
         | default('nessuna: il repo Percona non espone etcd', true) }}.
      Aggiorna etcd_version in group_vars/all.yml con una di queste, oppure
      lasciala vuota per installare l'ultima disponibile.
  when: etcd_version | length > 0

- name: Install etcd
  apt:
    name: "etcd{{ '=' ~ etcd_version if etcd_version | length > 0 else '' }}"
    state: present
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

# Il servizio postgresql del pacchetto va disattivato: e' Patroni ad avviare e
# fermare PostgreSQL. Idempotente, non cambia nulla se e' gia' cosi'.
- name: Stop and disable system PostgreSQL service
  systemd:
    name: postgresql
    state: stopped
    enabled: no

# --- Cluster creato dal pacchetto -------------------------------------------
# percona-postgresql crea da solo il cluster "main" in postgres_data_dir mentre
# si installa. Quella PGDATA non va bene a Patroni, che deve farla lui con i
# parametri del proprio bootstrap: trovandola gia' piena, sul primo nodo adotta
# una configurazione che non e' la sua (e' da li' che nasce il
# "max_wal_senders: 10->5" fra i pending restart, con PostgreSQL in start
# failed), e sugli altri si rifiuta di clonare il leader dentro una directory
# non vuota, esce, e la REST API non risponde mai.
#
# pg_dropcluster e non "rm -rf": e' lo strumento di postgresql-common, toglie
# anche /etc/postgresql/<versione>/main dal registro dei cluster e si rifiuta di
# agire se il cluster e' in esecuzione.

- name: Elenca i cluster PostgreSQL registrati
  command: pg_lsclusters -h
  register: pg_clusters
  changed_when: false
  failed_when: false

- name: Rimuovi il cluster creato dal pacchetto
  command: "pg_dropcluster --stop {{ postgres_version }} main"
  when:
    - postgres_drop_packaged_cluster | bool
    # Mai su una PGDATA che Patroni gestisce gia': li' ci sono i dati veri.
    - not patroni_marker.stat.exists
    - pg_clusters.stdout_lines | select('match', '^' ~ postgres_version ~ '\s+main\s') | list | length > 0

# --- Directory dati ---------------------------------------------------------
# Cancellazione solo su richiesta esplicita. Senza postgres_force_reinit le
# directory vengono soltanto create se mancanti.

- name: Azzera le directory dati (SOLO con postgres_force_reinit)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ etcd_data_dir }}"
  when: postgres_force_reinit | bool

# postgres_mount_point e' la HOME dell'utente postgres e su Debian e Ubuntu deve
# appartenergli. Se la directory esiste GIA' quando il pacchetto si installa —
# perche' e' un mount fatto a mano, o perche' l'ha creata il playbook — il
# postinst non ne corregge il proprietario, e resta di root: PostgreSQL non
# parte e Patroni fallisce con "Unable to start service patroni".
#
# Qui l'utente postgres esiste di sicuro, i pacchetti sono gia' installati.
- name: Assicura che {{ postgres_mount_point }} appartenga a postgres
  file:
    path: "{{ postgres_mount_point }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Assicura la directory dati di PostgreSQL
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Assicura la directory dati di etcd
  file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: '0700'

# --- etcd -------------------------------------------------------------------
# etcd viene configurato e avviato PRIMA di Patroni, che senza il DCS non puo'
# acquisire la leadership.

- name: Configure etcd cluster
  template:
    src: etcd.conf.yaml.j2
    dest: /etc/etcd/etcd.conf.yaml
    mode: '0644'
    backup: yes
  register: etcd_config

# La unit del pacchetto avvia etcd SENZA --config-file: legge /etc/default/etcd
# e ignora /etc/etcd/etcd.conf.yaml. Senza questo override etcd parte con i
# valori predefiniti, ascolta solo su localhost:2379, e il controllo di salute
# sull'IP del nodo riceve "connection refused" mentre systemd lo dà per attivo.
#
# Quando riceve --config-file, etcd ignora gli altri flag e le variabili
# d'ambiente: il drop-in rende quel file l'unica fonte di configurazione.
- name: Trova il binario etcd
  shell: "command -v etcd"
  args:
    executable: /bin/bash
  register: etcd_bin
  changed_when: false

- name: Crea la directory del drop-in di etcd
  file:
    path: /etc/systemd/system/etcd.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Fai leggere a etcd la configurazione scritta dal ruolo
  copy:
    dest: /etc/systemd/system/etcd.service.d/10-config-file.conf
    owner: root
    group: root
    mode: '0644'
    # ansible_managed qui non si puo' usare: lo fornisce il modulo template,
    # non copy.
    content: |
      # Ansible managed - roles/postgresql_cluster
      [Service]
      ExecStart=
      ExecStart={{ etcd_bin.stdout | trim }} --config-file /etc/etcd/etcd.conf.yaml
  register: etcd_dropin

# Le porte vanno verificate PRIMA di avviare: se le tiene qualcun altro, etcd
# esce subito e l'unico segnale sarebbe un "connection refused" dopo due minuti
# e mezzo di tentativi. Su un nodo che e' anche server RKE2 la 2379 e la 2380
# sono dell'etcd interno di RKE2.
#
# Il controllo prova a fare il bind, invece di leggere i nomi dei processi:
# l'etcd di RKE2 gira in un pod statico e si chiama "etcd" anche lui, quindi
# distinguerlo per nome non funzionerebbe. Se il nostro servizio e' gia' attivo
# le porte sono legittimamente sue e non si controlla niente.
- name: Verifica che le porte di etcd siano libere
  shell: |
    python3 - <<'PY'
    import socket, subprocess, sys

    servizio = subprocess.run(
        ["systemctl", "show", "-p", "MainPID", "--value", "etcd"],
        capture_output=True, text=True).stdout.strip()
    if servizio not in ("", "0"):
        sys.exit(0)

    occupate = []
    for porta in ({{ etcd_client_port }}, {{ etcd_peer_port }}):
        s = socket.socket()
        s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        try:
            s.bind(("{{ hostvars[inventory_hostname].ansible_host }}", porta))
        except OSError:
            occupate.append(str(porta))
        finally:
            s.close()

    if occupate:
        print(",".join(occupate))
        sys.exit(1)
    PY
  args:
    executable: /bin/bash
  register: etcd_ports
  changed_when: false
  failed_when: false

- name: Fermati se le porte di etcd sono gia' occupate
  assert:
    that:
      - etcd_ports.rc == 0
    fail_msg: >-
      Su {{ inventory_hostname }} le porte {{ etcd_ports.stdout | trim }} sono
      gia' occupate da un altro processo. Se questo nodo e' anche un server
      RKE2, sono quelle del suo etcd interno: sposta etcd_client_port ed
      etcd_peer_port su valori liberi, per esempio 2479 e 2480.

- name: Avvia etcd
  systemd:
    name: etcd
    # Un cambio di configurazione senza riavvio resterebbe senza effetto: etcd
    # legge il file solo all'avvio.
    state: "{{ 'restarted' if (etcd_config is changed or etcd_dropin is changed) else 'started' }}"
    enabled: yes
    daemon_reload: yes

- name: Attendi che etcd risponda
  uri:
    url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ etcd_client_port }}/health"
    status_code: 200
  register: etcd_health
  until: etcd_health.status | default(0) == 200
  retries: "{{ etcd_health_retries }}"
  delay: "{{ etcd_health_delay }}"
  changed_when: false
  failed_when: false

# Senza questo, il fallimento del controllo di salute dice solo "connection
# refused" e il motivo resta nel journal del nodo.
- name: Leggi lo stato di etcd se non risponde
  shell: |
    systemctl is-active etcd || true
    journalctl -u etcd -n 20 --no-pager || true
  args:
    executable: /bin/bash
  register: etcd_diag
  changed_when: false
  failed_when: false
  when: etcd_health.status | default(0) != 200

- name: Fermati se etcd non risponde
  assert:
    that:
      - etcd_health.status | default(0) == 200
    fail_msg: >-
      etcd non risponde su
      http://{{ hostvars[inventory_hostname].ansible_host }}:{{ etcd_client_port }}/health
      dopo {{ etcd_health_retries | int * etcd_health_delay | int }} secondi.
      Stato del servizio e ultime righe del journal:
      {{ etcd_diag.stdout_lines | default([]) | join(' | ') }}
  when: etcd_health.status | default(0) != 200

# --- Patroni ----------------------------------------------------------------

- name: Include Patroni tasks
  include_tasks: patroni.yml

# --- Riepilogo --------------------------------------------------------------
# I riavvii dei servizi non sono automatici: su un cluster di produzione un
# restart va deciso da chi opera, non innescato da un template modificato.

- name: Segnala le configurazioni cambiate
  debug:
    msg: >-
      {{ inventory_hostname }}: configurazione modificata
      {{ '[etcd]' if etcd_config is changed else '' }}
      {{ '[patroni]' if patroni_config is changed else '' }}.
      Per applicarla:
      {{ 'systemctl restart etcd (UN NODO ALLA VOLTA, verificando il quorum)' if etcd_config is changed else '' }}
      {{ 'patronictl -c /etc/patroni/patroni.yml reload ' ~ patroni_scope if patroni_config is changed else '' }}
  when: etcd_config is changed or patroni_config is changed
