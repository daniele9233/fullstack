---
- name: Install Percona Patroni
  apt:
    name: percona-patroni
    state: present
  # Riprova SOLO se dpkg e' occupato da un altro processo (vedi apt_lock_retries
  # in group_vars/all.yml). Qualsiasi altro errore ferma subito il task: senza
  # questa condizione un pacchetto inesistente verrebbe ritentato 60 volte
  # nascondendo il messaggio vero per cinque minuti.
  register: apt_result
  until: apt_result is succeeded or ('lock' not in apt_result.msg | default('') | lower)
  retries: "{{ apt_lock_retries | default(60) }}"
  delay: "{{ apt_lock_delay | default(5) }}"

- name: Create patroni configuration file
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: root
    group: root
    mode: '0644'
    backup: yes
  register: patroni_config

# Al primo bootstrap il primo nodo deve acquisire la leadership e fare initdb
# prima che gli altri provino a clonarlo: da qui l'avvio in due tempi con la
# pausa in mezzo.
#
# A cluster gia' inizializzato non serve nessuna sequenza: "state: started" e'
# idempotente e non tocca un Patroni gia' in esecuzione, quindi i due gruppi di
# task si riducono a una verifica.

# I due avvii non falliscono da soli: "Unable to start service patroni" non dice
# niente, e il motivo resta nel journal del nodo. Il task di diagnostica che
# segue ciascuno lo va a prendere e lo mette nel messaggio d'errore.
- name: Start Patroni on primary node only
  systemd:
    name: patroni
    state: started
    enabled: yes
    daemon_reload: yes
  when: inventory_hostname == patroni_primary_node
  register: patroni_start
  # ignore_errors e NON failed_when: false. Il secondo azzera il flag "failed"
  # nel risultato registrato, e la diagnostica che lo verifica non partirebbe
  # mai; ignore_errors lascia il flag e si limita a non fermare il play.
  ignore_errors: true

- name: Fermati se Patroni non parte sul primo nodo
  include_tasks: patroni_diagnostica.yml
  when:
    - inventory_hostname == patroni_primary_node
    - patroni_start is failed

# Si aspetta la leadership vera, non un numero di secondi: sul primo bootstrap
# il nodo deve fare initdb, avviare PostgreSQL e prendersi la chiave nel DCS, e
# quanto ci mette dipende dalla macchina. /leader risponde 200 solo sul nodo che
# e' leader in quel momento.
- name: Attendi che il primo nodo abbia acquisito la leadership
  uri:
    url: "http://{{ hostvars[patroni_primary_node].ansible_host }}:{{ patroni_restapi_port }}/leader"
    status_code: 200
  register: patroni_leader
  until: patroni_leader.status | default(0) == 200
  retries: "{{ patroni_leader_retries }}"
  delay: "{{ patroni_leader_delay }}"
  changed_when: false
  when:
    - inventory_hostname == patroni_primary_node
    - pg_needs_bootstrap | bool

- name: Start Patroni on remaining nodes
  systemd:
    name: patroni
    state: started
    enabled: yes
    daemon_reload: yes
  when: inventory_hostname != patroni_primary_node
  register: patroni_start
  # ignore_errors e NON failed_when: false. Il secondo azzera il flag "failed"
  # nel risultato registrato, e la diagnostica che lo verifica non partirebbe
  # mai; ignore_errors lascia il flag e si limita a non fermare il play.
  ignore_errors: true

- name: Fermati se Patroni non parte sugli altri nodi
  include_tasks: patroni_diagnostica.yml
  when:
    - inventory_hostname != patroni_primary_node
    - patroni_start is failed

- name: Attendi che la REST API di Patroni risponda
  uri:
    url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ patroni_restapi_port }}/health"
    status_code: [200, 503]
  register: patroni_health
  until: patroni_health.status | default(0) in [200, 503]
  retries: 30
  delay: 5
  changed_when: false

- name: Mostra lo stato del cluster Patroni
  command: "patronictl -c /etc/patroni/patroni.yml list"
  register: patroni_list
  changed_when: false
  failed_when: false
  when: inventory_hostname == patroni_primary_node

- name: Riepilogo cluster
  debug:
    msg: "{{ patroni_list.stdout_lines | default(['patronictl non disponibile']) }}"
  when: inventory_hostname == patroni_primary_node
