---
# Valori di ripiego: group_vars/all.yml ha precedenza maggiore.

postgres_version: "17"

# Punto di mount del disco dati dedicato, montato a mano sui tre nodi.
# La directory dati vera sta SOTTO questo mount, come nel playbook originale.
postgres_mount_point: "/var/lib/postgresql"
postgres_data_dir: "{{ postgres_mount_point }}/{{ postgres_version }}/main"
postgres_bin_dir: "/usr/lib/postgresql/{{ postgres_version }}/bin"

# Repo Percona da abilitare con "percona-release setup".
percona_repo: "ppg-{{ postgres_version }}"
percona_release_deb_url: "https://repo.percona.com/apt/percona-release_latest.noble_all.deb"

# I nomi dei pacchetti Percona seguono la versione. NON verificabili offline:
# controlla con "apt-cache search percona-postgresql-{{ postgres_version }}"
# dopo aver abilitato il repo, in particolare pgaudit-set-user e wal2json.
postgres_packages:
  - "percona-postgresql-{{ postgres_version }}"
  - "percona-postgresql-{{ postgres_version }}-repack"
  - "percona-postgresql-{{ postgres_version }}-pgaudit"
  - "percona-pgbackrest"
  - "percona-pgbouncer"
  - "percona-pgaudit{{ postgres_version }}-set-user"
  - "percona-pgbadger"
  - "percona-postgresql-{{ postgres_version }}-wal2json"
  - "percona-postgresql-contrib"

# Pacchetto etcd fornito dal repo Percona: nell'archivio Ubuntu Noble non
# esiste un pacchetto "etcd" (ci sono etcd-server ed etcd-client, fermi alla
# 3.4.30). Vuota = ultima versione del repo; per fissarla, il valore va scelto
# fra quelli di "apt-cache madison etcd" e il ruolo verifica che esista.
etcd_version: ""
etcd_data_dir: "/var/lib/etcd/postgresql"

timezone: "Europe/Rome"

# Pacchetti di utilita'. x11-apps arriva dal playbook originale: su un server
# di database non serve, si puo' togliere.
postgres_utility_packages:
  - net-tools
  - x11-apps

# "upgrade: dist" a ogni esecuzione come nel playbook originale. In produzione
# valuta di metterlo a false ed eseguire gli aggiornamenti in una finestra
# controllata, separata dal deploy del cluster.
postgres_dist_upgrade: true

# Cancellazione dei dati su richiesta esplicita. Con false il ruolo non
# rimuove nulla: crea le directory solo se mancano e salta il bootstrap dove
# il cluster e' gia' inizializzato.
postgres_force_reinit: false

# Rimuove il cluster "main" che percona-postgresql crea da solo installandosi.
# Patroni deve inizializzare PGDATA per conto suo: una directory gia' piena gli
# impedisce sia di configurare il primo nodo sia di clonare il leader sugli
# altri. La rimozione NON avviene mai su una PGDATA con patroni.dynamic.json,
# cioe' gia' gestita da Patroni: li' ci sono i dati veri.
postgres_drop_packaged_cluster: true

# Attesa che il primo nodo diventi leader, solo al bootstrap: 60 tentativi da
# 5 secondi, cioe' 5 minuti. Prima era una pausa fissa di 20 secondi, che su una
# macchina lenta scadeva prima che initdb avesse finito.
patroni_leader_retries: 60
patroni_leader_delay: 5

# Attesa che etcd risponda su /health dopo l'avvio: 30 tentativi da 5 secondi.
# Se scade, il ruolo riporta stato del servizio e ultime righe del journal
# invece del solo "connection refused".
etcd_health_retries: 30
etcd_health_delay: 5

patroni_scope: postgres
patroni_namespace: /pg_cluster/
patroni_restapi_port: 8008
patroni_postgres_port: 5432
etcd_client_port: 2379
etcd_peer_port: 2380

# Il primo host del gruppo bootstrappa il cluster.
patroni_primary_node: "{{ groups[postgres_cluster_group][0] }}"
postgres_cluster_group: "db_servers"

# CAMBIA QUESTE PASSWORD prima di andare in produzione.
patroni_users:
  superuser:
    username: postgres
    password: postgres
  replication:
    username: replicator
    password: replicator
  rewind:
    username: pgrewind
    password: pgrewind
  admin:
    password: admin
