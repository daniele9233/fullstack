---
# Quello che si verifica e' una proprieta' del CLUSTER, non del nodo: basta
# chiederlo una volta. Su un gruppo con piu' host gli altri non ripetono la
# stessa prova, che creerebbe pod con lo stesso nome.
#
# NON "meta: end_host", che e' quello che c'era prima. Questo ruolo gira in mezzo
# a un play che dopo di lui ha traefik_install: chiudere il play per il nodo
# significherebbe lasciare il cluster SENZA INGRESS ogni volta che qui non c'e'
# niente da verificare — cioe' proprio quando va tutto bene. Con un block/when si
# salta questo ruolo e basta.
- name: Stabilisci chi fa la verifica
  set_fact:
    rpv_tocca_a_me: "{{ inventory_hostname == ansible_play_hosts_all[0] }}"

- name: Verifica della rete fra i nodi
  when: rpv_tocca_a_me | bool
  block:

    # jsonpath SENZA {range}...{end} e senza {"\n"}, e argv invece della forma a
    # stringa. Il motivo e' lo stesso in entrambi i casi: "command" spezza sugli
    # spazi e toglie le virgolette, quindi {"\n"} arrivava a kubectl come {\n} e
    # il suo parser si fermava con "unrecognized character in action: U+005C".
    # {.items[*].metadata.name} restituisce i nomi separati da spazio: per dei
    # nomi di nodo va benissimo, e non ha niente da quotare.
    - name: Elenca i nodi del cluster
      command:
        argv:
          - "{{ rpv_kubectl }}"
          - "--kubeconfig"
          - "{{ rpv_kubeconfig }}"
          - "get"
          - "nodes"
          - "-o"
          - "jsonpath={.items[*].metadata.name}"
      register: rpv_nodi
      changed_when: false

    - name: Trova su quali nodi gira CoreDNS
      command:
        argv:
          - "{{ rpv_kubectl }}"
          - "--kubeconfig"
          - "{{ rpv_kubeconfig }}"
          - "-n"
          - "kube-system"
          - "get"
          - "pods"
          - "-l"
          - "k8s-app=kube-dns"
          - "-o"
          - "jsonpath={.items[*].spec.nodeName}"
      register: rpv_nodi_coredns
      changed_when: false
      failed_when: false

    # Il pod di prova va messo dove CoreDNS NON c'e': e' l'unico modo di
    # costringere la query ad attraversare i nodi. Metterlo a caso significherebbe,
    # meta' delle volte, verificare che una macchina parla con se stessa.
    - name: Scegli un nodo senza CoreDNS
      set_fact:
        rpv_nodo_prova: >-
          {{ ((rpv_nodi.stdout | default('') | split | list)
              | difference(rpv_nodi_coredns.stdout | default('') | split | list))
             | first | default('') }}

    - name: Niente da verificare su un cluster che non attraversa i nodi
      debug:
        msg: >-
          Nessun nodo senza CoreDNS: o il cluster ha un nodo solo, o CoreDNS gira
          ovunque. Non c'e' traffico fra pod di macchine diverse da verificare, e
          il playbook prosegue.
      when: rpv_nodo_prova | length == 0

    - name: Prova che la rete fra i nodi passi
      when: rpv_nodo_prova | length > 0
      block:

        - name: "Verifica che un pod su {{ rpv_nodo_prova }} raggiunga CoreDNS su un altro nodo"
          command:
            argv:
              - "{{ rpv_kubectl }}"
              - "--kubeconfig"
              - "{{ rpv_kubeconfig }}"
              - "run"
              - "rete-prova-{{ rpv_nodo_prova | lower }}"
              - "--rm"
              - "--attach"
              - "--restart=Never"
              - "--quiet"
              - "--image={{ rpv_immagine }}"
              - "--timeout={{ rpv_timeout }}s"
              - "--overrides={{ {'spec': {'nodeName': rpv_nodo_prova}} | to_json }}"
              - "--"
              - "nslookup"
              - "{{ rpv_nome_da_risolvere }}"
          register: rpv_esito
          changed_when: false
          failed_when: false

        # Il pod si cancella da se' con --rm, ma non quando kubectl viene
        # interrotto o va in timeout: senza questo, il tentativo dopo trova il
        # nome gia' occupato e fallisce per un motivo che non c'entra niente.
        - name: Rimuovi il pod di prova se e' rimasto
          command: >-
            {{ rpv_kubectl }} --kubeconfig {{ rpv_kubeconfig }}
            delete pod rete-prova-{{ rpv_nodo_prova | lower }} --ignore-not-found
          changed_when: false
          failed_when: false

        - name: Stabilisci se la rete fra i nodi passa
          set_fact:
            rpv_ok: >-
              {{ rpv_esito.rc == 0
                 and ('Address' in (rpv_esito.stdout | default('')))
                 and ("can't resolve" not in (rpv_esito.stdout | default('')))
                 and ('timed out' not in (rpv_esito.stdout | default('') ~ rpv_esito.stderr | default(''))) }}

        - name: La rete fra i nodi funziona
          debug:
            msg: >-
              Rete fra i nodi verificata: un pod su {{ rpv_nodo_prova }} ha risolto
              {{ rpv_nome_da_risolvere }} tramite CoreDNS su un altro nodo.
              CNI: {{ rpv_cni }}, tunnel {{ rpv_tunnel_iface }} su UDP {{ rpv_tunnel_porta }}.
          when: rpv_ok | bool

        - name: Fermati spiegando che la rete fra i nodi non passa
          fail:
            msg: |
              LA RETE FRA I NODI NON PASSA. Un pod su {{ rpv_nodo_prova }} non riesce a
              risolvere {{ rpv_nome_da_risolvere }} tramite CoreDNS, che sta su un altro
              nodo.

              Uscita del pod di prova:
              {{ rpv_esito.stdout | default('(vuota)') }}
              {{ rpv_esito.stderr | default('') }}

              NON PROSEGUIRE credendo che sia un problema di DNS o di Internet. Il
              cluster sembra sano — tutti i nodi Ready, i pod sullo stesso nodo si
              parlano — ma il traffico fra pod di macchine diverse sparisce. Se si va
              avanti, il prossimo a fallire e' il job che scarica il chart di Traefik,
              cinque minuti piu' tardi, con un errore che parla di traefik.github.io e
              manda la diagnosi fuori strada. E' gia' successo.

              Se invece qui sopra leggi che l'immagine {{ rpv_immagine }} non si scarica,
              il problema e' un altro: il pull passa dalla rete dell'HOST, non da quella
              dei pod. In quel caso questa verifica non ha ancora detto niente.

              IL CNI IN USO E' {{ rpv_cni | upper }}: il tunnel e' {{ rpv_tunnel_iface }}
              e incapsula su UDP {{ rpv_tunnel_porta }}. E' quella la porta che deve
              passare fra i nodi, ed e' quella su cui puntare il tcpdump.

              DA DOVE PARTIRE, in ordine:

              1. Confronta un pod sul nodo di CoreDNS con uno su un altro nodo:

                   {{ rpv_kubectl }} --kubeconfig {{ rpv_kubeconfig }} \
                     -n kube-system get pods -o wide | grep coredns

                   {{ rpv_kubectl }} --kubeconfig {{ rpv_kubeconfig }} run t --rm -i \
                     --restart=Never --image={{ rpv_immagine }} \
                     --overrides='{"spec":{"nodeName":"<NODO>"}}' -- nslookup github.com

                 Falliscono ENTRAMBI = non e' la rete fra i nodi, e' il resolv.conf
                 (rke2_resolv_conf in group_vars/all.yml).
                 Uno risolve e l'altro no = e' la rete fra i nodi, prosegui.

              2. Con quale indirizzo si annuncia ogni nodo, e a che MTU:

                   ip -d addr show {{ rpv_tunnel_iface }} | sed -n 3p

                 Il campo "local" deve essere l'indirizzo del nodo in kubectl get nodes
                 -o wide.
              {% if rpv_cni == 'calico' %}
                 Se diverge, e' l'autodetection di Calico: la impone il ruolo
                 calico_config (calico_autodetection), ma solo alla PRIMA installazione
                 del chart — su un cluster gia' su non basta rilanciare il playbook.
              {% else %}
                 Con canal quell'indirizzo viene dall'InternalIP del Node, cioe' dal
                 node-ip che il playbook scrive in config.yaml: se diverge, a divergere
                 e' quello, e si guarda "kubectl get nodes -o wide" contro l'inventario.
              {% endif %}

              3. Le rotte verso i blocchi pod degli altri nodi:

                   ip route | grep 10.42

                 Se mancano, il problema e' nella configurazione del CNI. Se ci sono
                 ma il traffico non arriva, e' la rete fisica: un tcpdump sulla porta
                 {{ rpv_tunnel_porta }} fra due nodi lo dice in trenta secondi.
          when:
            - not (rpv_ok | bool)
            - rpv_ferma_se_rotta | bool

        - name: Prosegui con la rete fra i nodi rotta, come richiesto
          debug:
            msg: >-
              La rete fra i nodi NON passa, ma rpv_ferma_se_rotta e' false: si prosegue.
              Traefik, Rancher e il cluster downstream non possono funzionare cosi'.
          when:
            - not (rpv_ok | bool)
            - not (rpv_ferma_se_rotta | bool)
