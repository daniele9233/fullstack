---
# Quello che, se manca, fa fallire l'installazione a meta' con un messaggio che
# parla d'altro. Meglio fermarsi qui.
#
# I controlli sul CLUSTER stanno in testa. Quelli sulla SINGOLA MACCHINA
# (distribuzione, heap, NTP, disco dati) sono gli stessi del nodo singolo, e
# sono copiati da elasticsearch_node/tasks/controlli.yml: non si possono
# includere da la' perche' quel file comincia con l'assert "un solo host", che
# qui fallirebbe per costruzione.

# --- Il cluster --------------------------------------------------------------

# Dispari e almeno tre. L'elezione del master e' a maggioranza: con due nodi la
# perdita di uno ferma il cluster invece di lasciarlo in piedi — sono PEGGIO di
# uno solo. Con quattro, la perdita di due lo ferma esattamente come con tre:
# il quarto nodo non compra niente.
- name: Verifica il numero di nodi del cluster
  assert:
    that:
      - groups[esc_group] | default([]) | length >= (esc_min_nodes | int)
      - (groups[esc_group] | default([]) | length) is odd
    fail_msg: >-
      Il gruppo [{{ esc_group }}] ha
      {{ groups[esc_group] | default([]) | length }} host
      ({{ groups[esc_group] | default([]) | join(', ') }}). Un cluster
      Elasticsearch vuole un numero DISPARI di nodi master, almeno
      {{ esc_min_nodes }}: l'elezione e' a maggioranza, e con un numero pari
      la perdita di meta' dei nodi ferma il cluster. Per un nodo solo c'e'
      [{{ es_group }}] e playbooks/60-elasticsearch.yml.
    success_msg: >-
      Cluster di {{ groups[esc_group] | length }} nodi:
      {{ groups[esc_group] | join(', ') }} — il primo,
      {{ esc_first_node }}, genera la CA
  run_once: true

# Un host nei due gruppi verrebbe configurato due volte in due modi che si
# contraddicono: discovery.type=single-node da un ruolo, discovery.seed_hosts
# dall'altro, e l'ultimo che scrive vince senza che nessuno se ne accorga.
- name: Verifica che nessun host stia anche in [{{ es_group }}]
  assert:
    that:
      - (groups[esc_group] | default([])) | intersect(groups[es_group] | default([])) | length == 0
    fail_msg: >-
      {{ (groups[esc_group] | default([])) | intersect(groups[es_group] | default([])) | join(', ') }}
      sta sia in [{{ esc_group }}] sia in [{{ es_group }}]. Un nodo e' o
      singolo o in cluster: i due ruoli scrivono due discovery diverse nello
      stesso elasticsearch.yml.
    quiet: yes
  run_once: true

# I nomi dei nodi devono essere unici: node.name e' anche il nome della
# directory dei certificati e dell'istanza in cert.yml. Con es_node_name al
# default (il nome di inventario) sono unici per costruzione; se qualcuno lo
# sovrascrive per host, meglio accorgersene qui che in un cluster dove due
# nodi si chiamano allo stesso modo.
- name: Verifica che i node.name siano tutti diversi
  assert:
    that:
      - esc_initial_master_nodes | length == (esc_initial_master_nodes | unique | length)
    fail_msg: >-
      Due o piu' nodi del cluster hanno lo stesso node.name
      ({{ esc_initial_master_nodes | join(', ') }}). es_node_name deve essere
      diverso su ogni host.
    quiet: yes
  run_once: true

- name: Verifica che almeno un nodo sia master-eligible
  assert:
    that:
      - esc_initial_master_nodes | length > 0
      - (esc_initial_master_nodes | length) is odd
    fail_msg: >-
      I nodi con "master" fra i ruoli sono {{ esc_initial_master_nodes | length }}
      ({{ esc_initial_master_nodes | join(', ') }}): servono, e in numero
      dispari. Controlla es_node_roles negli host dell'inventario.
    quiet: yes
  run_once: true

- name: Verifica che il nodo abbia un indirizzo IP dichiarato
  assert:
    that:
      - es_node_ip | length > 0
      - es_node_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      {{ inventory_hostname }}: es_node_ip vale "{{ es_node_ip }}", che non e'
      un indirizzo IPv4. network.host vuole un indirizzo, non un nome, lo
      stesso indirizzo finisce nel SAN del certificato e in
      discovery.seed_hosts degli altri nodi: dichiara ansible_host
      nell'inventario.

# Tre nodi con lo stesso indirizzo si vedono come uno solo. E' il refuso piu'
# facile da fare copiando le righe dell'inventario, ed e' anche quello che
# c'era nella procedura a mano di riferimento (elasticinfra02 e 03 con lo
# stesso IP).
- name: Verifica che gli indirizzi dei nodi siano tutti diversi
  assert:
    that:
      - esc_seed_hosts | length == (esc_seed_hosts | unique | length)
    fail_msg: >-
      Due o piu' nodi del cluster hanno lo stesso indirizzo
      ({{ esc_seed_hosts | join(', ') }}). Controlla ansible_host
      nell'inventario: e' il refuso classico da copia-incolla delle righe.
    quiet: yes
  run_once: true

# --- La singola macchina (come sul nodo singolo) ----------------------------

# Il pacchetto e' lo stesso per tutte le distribuzioni deb, quindi su una
# Ubuntu diversa da quella prevista funziona lo stesso. Vale pero' saperlo:
# questo repository e' provato su Ubuntu, non su Debian ne' su RHEL.
- name: Segnala se la distribuzione non e' quella prevista
  debug:
    msg: >-
      ATTENZIONE {{ inventory_hostname }}: la distribuzione rilevata e'
      {{ ansible_distribution }} {{ ansible_distribution_version }}. Il ruolo e'
      scritto per Ubuntu (26.04 o successive) e usa apt: su una distribuzione
      diversa i pacchetti e i percorsi non tornano.
  when: ansible_distribution | default('') != 'Ubuntu'

# --- Memoria ----------------------------------------------------------------

- name: Segnala se l'heap richiesta e' sproporzionata alla memoria
  debug:
    msg: >-
      ATTENZIONE {{ inventory_hostname }}: {{ ansible_memtotal_mb }} MB di RAM
      con es_heap_size="{{ es_heap_size }}". L'heap non deve superare META' della
      memoria della macchina: il resto serve al page cache, da cui Elasticsearch
      legge gli indici, e a Lucene fuori dall'heap. Abbassa es_heap_size in
      group_vars/all.yml, oppure lasciala vuota e lascia decidere a
      Elasticsearch.
  when:
    - es_heap_size | length > 0
    - es_heap_gb | int > 0
    - ansible_memtotal_mb | int < (es_heap_gb | int * 2048)
  vars:
    # regex_search senza gruppo restituisce la stringa intera ("8g") oppure
    # None quando l'heap e' espressa in altro modo (8192m): default('', true)
    # copre il None, poi restano solo le cifre.
    es_heap_gb: >-
      {{ (es_heap_size | regex_search('^[0-9]+[gG]$'))
         | default('', true) | regex_replace('[^0-9]', '') | default('0', true) }}

# Oltre i 31 GB circa la JVM smette di usare i puntatori compressi: l'heap piu'
# grande contiene MENO oggetti di una da 31 GB. E' l'errore di dimensionamento
# piu' comune su macchine grandi.
- name: Segnala se l'heap supera la soglia dei puntatori compressi
  debug:
    msg: >-
      ATTENZIONE {{ inventory_hostname }}: es_heap_size="{{ es_heap_size }}"
      supera i 31 GB. Sopra quella soglia la JVM perde i puntatori compressi e
      un heap piu' grande rende MENO di uno da 31 GB. Se la macchina ha molta
      memoria, lasciala al page cache.
  when:
    - es_heap_size | regex_search('^[0-9]+[gG]$') is not none
    - (es_heap_size | regex_replace('[^0-9]', '') | int) > 31

# L'orologio sfasato sballa i timestamp dei documenti e le finestre delle
# query. In cluster fa anche di peggio: i nodi si scambiano stati con
# timestamp, e uno sfasamento grosso rende i log dei tre nodi incomparabili
# fra loro proprio quando servono per capire chi ha fatto cosa.
- name: Leggi lo stato della sincronizzazione oraria
  command: timedatectl show -p NTPSynchronized --value
  register: es_ntp
  changed_when: false
  failed_when: false

- name: Segnala se l'orologio non e' sincronizzato
  debug:
    msg: >-
      ATTENZIONE {{ inventory_hostname }}: NTP non sincronizzato. Attivalo
      (systemd-timesyncd o chrony) prima di indicizzare: i campi @timestamp e le
      query per intervallo dipendono dall'orologio della macchina, e in cluster
      i log dei tre nodi devono potersi leggere sulla stessa linea del tempo.
  when: es_ntp.stdout | trim | lower != 'yes'

# --- Disco dati -------------------------------------------------------------
# A MANO c'e' solo il MOUNT: il disco lo prepara e lo monta l'operatore, come
# per i database, per i brick Gluster e per Kafka.
#
# La DIRECTORY invece la crea il ruolo se non c'e' — qui e poi in install.yml,
# dove le viene dato il proprietario giusto (l'utente elasticsearch a questo
# punto non esiste ancora, lo crea il pacchetto).

- name: "Crea {{ es_data_dir }} se non c'e'"
  file:
    path: "{{ es_data_dir }}"
    state: directory
    mode: "0750"

# findmnt esce diverso da zero quando il percorso non e' un mountpoint, ed e'
# proprio l'informazione che serve, quindi non e' un errore.
- name: "Rileva su quale filesystem sta {{ es_data_dir }}"
  command: "findmnt -n -o TARGET,SOURCE,FSTYPE {{ es_data_dir }}"
  register: es_mount
  changed_when: false
  failed_when: false

- name: Mostra dove finiranno gli indici
  debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ 'disco dedicato -> ' ~ es_mount.stdout | trim
         if es_mount.rc == 0
         else es_data_dir ~ ' sta sul filesystem di sistema, nessun disco dedicato' }}

- name: Pretendi un disco dedicato, se richiesto
  assert:
    that:
      - es_mount.rc == 0
    fail_msg: >-
      {{ es_data_dir }} non e' un mountpoint su {{ inventory_hostname }} e
      es_require_dedicated_disk e' true: gli indici finirebbero sulla partizione
      di sistema e la riempirebbero. Monta il disco, oppure rilancia senza quel
      parametro.
  when: es_require_dedicated_disk | bool
