---
# Installazione completa, nell'ordine corretto.
#
# I play non stanno piu' qui dentro: sono in playbooks/, uno per area, e questo
# file li mette in fila. Cosi' non c'e' duplicazione — ogni play e' scritto una
# volta sola — e ciascun pezzo resta lanciabile da solo quando serve piu'
# controllo:
#
#   ansible-playbook playbooks/10-bilanciatori.yml
#   ansible-playbook playbooks/20-rancher.yml
#   ansible-playbook playbooks/30-database.yml
#   ansible-playbook playbooks/40-storage.yml
#   ansible-playbook playbooks/50-kafka.yml
#   ansible-playbook playbooks/60-elasticsearch.yml
#
# La preparazione dei nodi (host_prep) e il disco dati (create_disk) non sono
# piu' due play su "all": ogni playbook prepara i propri host. Il risultato per
# host e' identico, ma lanciandone uno solo non si toccano gli altri gruppi.
#
# L'INVENTARIO VA TENUTO COMPLETO anche quando si lancia un playbook solo:
# diversi template leggono gruppi che non stanno installando (haproxy legge
# [db_servers], nginx legge [masters] e [ingress], Ganesha i gruppi Kubernetes).
# Commentare un gruppo per "isolare" un test produce configurazioni monche
# senza che niente fallisca: per isolare si usa il playbook, non l'inventario.
#
# LA VERIFICA PRELIMINARE NON C'E' PIU'. I ruoli preflight_* e il playbook
# 00-verifica.yml sono stati rimossi: al loro posto arriveranno una dashboard
# web e dei controlli scritti meglio. Nel frattempo l'installazione parte
# direttamente, quindi le cose che la verifica raccontava prima — una porta gia'
# occupata, un firewall acceso, un VIP che e' di qualcun altro, due nodi che non
# si parlano — si scoprono quando il ruolo che ci sbatte contro fallisce.
#
# I controlli che impediscono un DANNO restano dentro ai ruoli, dove servono:
# kafka_cluster, per esempio, si ferma prima di riformattare un nodo che ha gia'
# dei dati o che ha un node.id diverso da quello atteso.

- import_playbook: playbooks/10-bilanciatori.yml
- import_playbook: playbooks/20-rancher.yml
- import_playbook: playbooks/30-database.yml
- import_playbook: playbooks/40-storage.yml

# Kafka non c'entra con Rancher e non dipende da nessuno dei play sopra: sta in
# fondo perche' e' l'ultimo arrivato, non perche' debba aspettare qualcosa. Con
# il gruppo [kafka_servers] vuoto il play viene saltato senza rumore.
- import_playbook: playbooks/50-kafka.yml

# Elasticsearch, come Kafka, e' indipendente da tutto il resto: nodo singolo,
# gruppo [elastic_servers]. Vuoto il gruppo, il play viene saltato senza rumore.
- import_playbook: playbooks/60-elasticsearch.yml

# Gli indici di logging: legge i namespace dal cluster Kubernetes e prepara su
# Elasticsearch template, indici e alias su cui il collector scrivera'. Sta in
# fondo perche' e' l'unico play che ha bisogno di DUE cose gia' in piedi — il
# cluster downstream (20-rancher) e il nodo Elasticsearch (60-elasticsearch) —
# e non basta a se stesso come gli altri.
#
# Si salta da solo finche' logging_system_project_id e logging_es_host sono
# vuote, che e' come nascono in group_vars/all.yml: senza il projectId del
# progetto "system" di Rancher non c'e' modo di distinguere i namespace
# infrastrutturali dagli applicativi, e tirare a indovinare qui vuol dire
# creare gli indici sbagliati.
- import_playbook: playbooks/70-logging.yml
  when:
    - logging_system_project_id | default('') | length > 0
    - logging_es_host | default('') | length > 0
