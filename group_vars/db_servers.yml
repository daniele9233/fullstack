---
# Variabili valide solo per il gruppo [db_servers].

# Disco dati di PostgreSQL. Riproduce il layout dei db in esercizio:
#
#   sdb          150G  disk
#   └─sdb1       150G  part
#     └─vg_data-lv_data  lvm  /var/lib/postgresql
#
# Il disco di sistema resta sda (sda1 /boot/efi, sda2 /boot, sda3 con
# ubuntu-vg/ubuntu-lv su /), che il ruolo esclude da solo.
disk_mount_point: "{{ postgres_mount_point }}"
disk_vg_name: "vg_data"
disk_lv_name: "lv_data"

# Device dichiarato, non cercato: il ruolo saprebbe trovare il primo disco
# libero, ma su una macchina con piu' dischi aggiuntivi prende quello che il
# kernel enumera per primo. Dichiarandolo, un disco sbagliato si vede leggendo
# questo file e non a formattazione avvenuta.
# Se su un host il disco dati non e' sdb, sovrascrivilo nell'inventario:
#   dbserver02 ansible_host=... disk_device=/dev/sdc
disk_device: ""

# 100%FREE: l'LV prende tutta la partizione, come i 150G in esercizio.
disk_lv_size: "100%FREE"

# Riga di fstab prodotta, identica a quella che scriviamo a mano:
#   /dev/vg_data/lv_data /var/lib/postgresql xfs defaults 0 0
disk_fs_type: "xfs"
disk_mount_options: "defaults"
