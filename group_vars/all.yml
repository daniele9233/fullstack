---
# Variabili comuni per tutti gli host

# Dominio e credenziali
rancher_domain: "kikko.app.inail-svil.almaviva.it"
rancher_password: "DanielE9233???"

# ansible.cfg ha log_path e [diff] always = True: senza questo, la riga di
# comando di "helm install rancher" finirebbe in ansible.log con dentro
# bootstrapPassword. Stesso meccanismo di kafka_hide_secrets.
# Metterlo a false serve solo per capire perche' un task fallisce.
rancher_hide_secrets: true

# Versioni software
helm_version: "v3.11.0"
rancher_version: "2.14.2"

# ---------------------------------------------------------------------------
# LOCK DI APT
# ---------------------------------------------------------------------------
# Su una macchina appena provisionata unattended-upgrades parte da solo e tiene
# il lock di dpkg. I task apt dei ruoli girano anche mezz'ora dopo l'inizio del
# playbook e ci finiscono contro:
#   E: Could not get lock /var/lib/dpkg/lock-frontend.
#      It is held by process NNNN (unattended-upgr)
#
# Due difese. host_prep, nel primo play, attende cloud-init, ferma i timer degli
# aggiornamenti automatici e aspetta che dpkg si liberi. In piu' ogni task apt
# riprova invece di far fallire il playbook, per coprire un lock preso da
# qualcos'altro (una sessione aperta a mano, un postinst).
#
# I timer vengono fermati, NON disabilitati: tornano attivi al riavvio, quindi
# il nodo non resta senza aggiornamenti di sicurezza. Con
# apt_pause_unattended_upgrades a false non viene toccato niente e restano solo
# i tentativi ripetuti.
apt_pause_unattended_upgrades: true
apt_lock_retries: 60
apt_lock_delay: 5

# Configurazione del disco dati dedicato.
# Questi valori valgono per i nodi RKE2; [db_servers] li sovrascrive in
# group_vars/db_servers.yml puntando a /var/lib/postgresql.
# I bilanciatori e i nodi Gluster sono esclusi dal play: la' il disco si monta
# a mano.
#
# disk_device vuoto = il ruolo cerca il primo disco libero. Per non affidarsi
# a quella ricerca, dichiaralo per host nell'inventario:
#   rancher01c ansible_host=... disk_device=/dev/sdb
disk_device: ""
disk_mount_point: "/var/lib/rancher"
disk_vg_name: "vg_rancher"
disk_lv_name: "lv_rancher"
disk_lv_size: "100%FREE"
disk_fs_type: "xfs"
# "defaults" e basta, come sui server in esercizio. La riga di fstab risulta:
#   /dev/vg_rancher/lv_rancher /var/lib/rancher xfs defaults 0 0
disk_mount_options: "defaults"

# Certificati
fullchain_pem_file: "fullchain.pem"
privkey_pem_file: "privkey.pem"
cacerts_pem_file: "cacerts.pem"
remote_cert_path: "/root"

# ---------------------------------------------------------------------------
# CLUSTER DOWNSTREAM (creato via API Rancher dal ruolo master1_create_cluster)
# ---------------------------------------------------------------------------
# E' il "custom cluster" di Rancher: Rancher crea l'oggetto, emette un token di
# registrazione, e i nodi di [new_managers], [workers] e [ingress] si agganciano
# con system-agent-install.sh. Da quel momento la configurazione di quel cluster
# la scrive RANCHER sui nodi, non questo playbook: tutto quello che vogliamo dirgli
# deve passare da qui, cioe' dal corpo della POST in master1_create_cluster.
cluster_name: "iacdevops"

# Versione di Kubernetes/RKE2 del cluster downstream.
#
# ALLINEATA A rke2_version DEL CLUSTER RANCHER, e non per simmetria: e' la
# versione su cui "ingress-controller" (qui sotto) e' verificata funzionante,
# perche' e' quella con cui gira il cluster a tre master. Su una versione che
# non conosce l'opzione, rke2-server sui nodi downstream rifiuta la
# configurazione e NON PARTE — e li' il guasto e' molto meno leggibile che sul
# cluster locale: le macchine si registrano in Rancher, il provisioning resta
# appeso, e il journal da guardare e' su un'altra macchina.
#
# Deve corrispondere a una versione che QUESTO Rancher sa provisionare: la POST
# di creazione fallisce se non la conosce. L'elenco e' nella console, in
# Cluster Management -> Create -> Custom, nel menu "Kubernetes Version".
cluster_k8s_version: "v1.35.7+rke2r1"

# --- CNI del cluster downstream ---------------------------------------------
#
# CALICO. Valori ammessi da RKE2: calico, canal, cilium, flannel, none.
#
# QUI C'ERA CANAL, e c'era per una ragione: con Calico il cluster non veniva su
# — i nodi risultavano tutti Ready, i pod sulla stessa macchina si parlavano, e
# il traffico fra pod di nodi DIVERSI spariva senza un errore. Quel guasto e'
# documentato nel README, sezione RANCHER.
#
# PERCHE' ADESSO CALICO PUO' TORNARE. Le tre spiegazioni di allora erano la
# porta VXLAN, l'indirizzo con cui il nodo si annuncia, e NetworkManager. Delle
# tre, due sono coperte qui sotto e la terza e' cambiata da sola:
#
#   la porta      Calico incapsula sulla UDP 4789, canal sulla 8472. Sulla
#                 vecchia rete 10.205.166.x la 8472 era aperta da sempre e la
#                 4789 non era mai servita a nessuno. I nodi adesso stanno tutti
#                 su 192.168.1.0/24, un segmento piatto senza niente in mezzo, e
#                 host_prep disattiva ufw: non c'e' piu' un apparato che possa
#                 far passare una porta e non l'altra. Se il dubbio dovesse
#                 tornare, c'e' cluster_calico_vxlan_port qui sotto.
#
#   l'indirizzo   Calico NON usa il node-ip che RKE2 scrive in config.yaml: se
#                 lo sceglie da solo con nodeAddressAutodetectionV4, il cui
#                 default e' "la prima interfaccia non-loopback che trovo".
#                 Canal invece legge l'InternalIP del Node. E' la differenza che
#                 spiega perche' a parita' di macchine uno andava e l'altro no.
#                 cluster_chart_values qui sotto glielo impone.
#
#   NetworkManager  se gestisce vxlan.calico e le cali*, gliele riconfigura
#                 sotto e il tunnel smette di consegnare. Il ruolo host_prep
#                 adesso le sottrae a NetworkManager e disattiva nm-cloud-setup
#                 su TUTTI i nodi, downstream compresi — quando Calico e' stato
#                 abbandonato, quel ruolo era appena stato scritto e non ancora
#                 corretto (creava il file in una directory che non esisteva).
#
# IL CNI NON SI CAMBIA A CALDO: cambiando questa riga su un cluster GIA' CREATO
# non succede niente di buono. Rancher tiene il CNI in spec.rkeConfig del
# cluster e la POST non viene nemmeno rifatta (master1_create_cluster vede che
# il cluster esiste e non lo ricrea): il cluster va cancellato dalla console e i
# nodi ripuliti con "playbooks/20-rancher.yml -e clean_nodes_before_join=true".
cluster_cni: "calico"

# Valori dei chart packaged del cluster downstream, passati a Rancher in
# spec.rkeConfig.chartValues. E' l'equivalente, per un cluster creato via API,
# del HelmChartConfig che si poserebbe a mano in
# /var/lib/rancher/rke2/server/manifests.
#
# calicoNetwork E' SCRITTO PER INTERO, e non e' verbosita': bgp e ipPools stanno
# qui perche' un valore omesso non e' garantito essere un valore ereditato. Un
# calicoNetwork parziale, se il merge non conservasse i default del chart,
# lascerebbe Calico senza incapsulamento e con BGP acceso ma senza peer: nessun
# tunnel, nessuna rotta verso gli altri nodi, e il cluster che sembra sano
# mentre i pod non si raggiungono fra macchine. E' lo stesso sintomo che si sta
# cercando di non rivedere.
cluster_chart_values_calico:
  rke2-calico:
    installation:
      calicoNetwork:
        # Niente BGP: i nodi non si scambiano rotte, si parlano nel tunnel.
        bgp: Disabled

        # MTU del tunnel. 1450 e' il valore che il chart rke2-canal usa da
        # sempre qui, ed e' provato su questa infrastruttura. Lasciandolo
        # dedurre a Calico, su una scheda con MTU alta si imposta di conseguenza
        # (su AWS si era messo a 8951): non e' sbagliato in se', ma vale solo se
        # TUTTO il percorso fra i nodi regge i jumbo frame — altrimenti i
        # pacchetti grandi spariscono e i piccoli passano, che e' il peggior
        # guasto da diagnosticare.
        mtu: 1450

        # Il pool da cui nascono gli IP dei pod, con l'incapsulamento.
        # VXLAN e non IPIP: il primo e' UDP normale, il secondo e' il protocollo
        # IP 4, che molte reti scartano del tutto.
        # 10.42.0.0/16 e blockSize 26 sono i default di RKE2: sono scritti
        # perche' qui calicoNetwork e' dichiarato per intero. Cambiando
        # cluster-cidr al cluster, va cambiato anche questo.
        ipPools:
          - cidr: "10.42.0.0/16"
            encapsulation: VXLAN
            natOutgoing: Enabled
            blockSize: 26

        # Con quale indirizzo il nodo si annuncia agli altri. NodeInternalIP =
        # quello del Node Kubernetes, cioe' l'indirizzo dell'inventario. E' LA
        # riga per cui esiste tutto questo blocco.
        nodeAddressAutodetectionV4:
          kubernetes: NodeInternalIP

# Deriva dal CNI: con canal non c'e' niente da imporre (l'indirizzo lo prende
# dall'InternalIP del Node e la MTU la fissa il chart rke2-canal), quindi
# tornando indietro questo si svuota da se' invece di restare a parlare di un
# chart che non c'e'.
cluster_chart_values: >-
  {{ cluster_chart_values_calico if cluster_cni == 'calico' else {} }}

# Porta UDP del tunnel VXLAN di Calico sul cluster downstream.
#
# VUOTA (default) = la decide Calico, cioe' 4789, che e' il numero IANA e lo
# standard. Sul segmento 192.168.1.0/24 non c'e' niente che la filtri.
#
# VALORIZZATA = kubectl_setup applica quel valore alla FelixConfiguration del
# cluster downstream dopo il join. Il valore da mettere, se dovesse servire, e'
# 8472: quella di flannel/canal, l'unica che su questa infrastruttura si sa per
# certo che passa.
#
# QUANDO METTERLA. Il sintomo e' preciso e non somiglia a un problema di porta:
# nodi tutti Ready, pod sullo stesso nodo che si parlano, e traffico fra pod di
# nodi DIVERSI che sparisce senza errori — tipicamente CoreDNS che va in timeout
# per i pod dell'altra macchina. La prova si fa da un pod:
#   kubectl run t --rm -it --image busybox --restart Never -- ping <IP pod altro nodo>
cluster_calico_vxlan_port: ""

# --- Ingress controller del cluster downstream ------------------------------
#
# TRAEFIK. Stessa scelta e stesse ragioni del cluster Rancher (vedi
# rke2_ingress_controller piu' sotto): il chart e' rke2-traefik, IMPACCHETTATO
# dentro RKE2, quindi non c'e' niente da scaricare da traefik.github.io mentre
# il cluster si costruisce — che e' il download da cui, ogni volta che qualcosa
# non andava DENTRO al cluster, la diagnosi partiva verso Internet.
#
# Finisce in machineGlobalConfig, cioe' nel config.yaml che Rancher scrive sui
# nodi downstream, come "ingress-controller:". Valori ammessi da RKE2: none,
# ingress-nginx, traefik.
#
# VUOTA = non si scrive niente e decide RKE2, che oggi installa
# rke2-ingress-nginx.
#
# L'OPZIONE NON ESISTE SU TUTTE LE VERSIONI DI RKE2, e su una che non la conosce
# rke2-server rifiuta la configurazione e non parte affatto. Sul cluster locale
# master1_config lo chiede al binario prima di scrivere; qui il binario non c'e'
# ancora — sui nodi downstream RKE2 lo installa Rancher, dopo — quindi il
# controllo si fa sulla VERSIONE dichiarata, contro
# cluster_ingress_controller_min_version qui sotto.
cluster_ingress_controller: "traefik"

# La versione da cui in poi "ingress-controller" e' considerata disponibile.
# v1.35.7+rke2r1 e' quella con cui il cluster Rancher gira con traefik, quindi
# e' il piu' basso valore di cui qui si abbia una prova. Il confronto guarda
# solo la parte "vX.Y.Z", non il suffisso "+rke2rN".
cluster_ingress_controller_min_version: "v1.35.0"

# IngressClass che risulta dal controller scelto, per il cluster downstream.
# Deriva da rke2_ingress_class_names (piu' sotto), la stessa tabella del cluster
# locale: RKE2 accetta "ingress-nginx" come controller ma la IngressClass che ne
# esce si chiama "nginx", e chiedere una classe che non esiste e' esattamente il
# guasto che e' gia' costato una console che non rispondeva.
# Serve al riepilogo e a chi deve scrivere ingressClassName sui propri Ingress.
cluster_ingress_class: >-
  {{ rke2_ingress_class_names.get(cluster_ingress_controller, cluster_ingress_controller)
  if (cluster_ingress_controller | default('') | length > 0
      and cluster_ingress_controller != 'none')
  else '' }}

# Marcatura dei nodi [ingress] del cluster downstream: la label passata a
# system-agent-install.sh al momento del join.
#
# IL TAINT NON C'E' PIU'. Aveva senso finche' su quei nodi girava un Traefik
# installato a parte con nodeSelector e tolleranza scritti da noi: i due si
# tenevano per mano e il taint teneva lontani gli altri carichi. Adesso
# l'ingress lo installa RKE2 con il proprio chart, che di quel taint non sa
# niente e non lo tollera: quei nodi resterebbero gli unici senza ingress —
# l'esatto contrario di quello che si vuole da un nodo che si chiama [ingress].
# La label resta, e serve a puntarci un nodeSelector quando servira'.
#
# ATTENZIONE cambiandola su un cluster gia' in piedi: la label viene applicata
# al JOIN, quindi i nodi gia' registrati mantengono la vecchia.
ingress_node_key: "node"
ingress_node_value: "ingress"

# Host da cui partono le chiamate all'API di Rancher (delegate_to). E' il
# control node, che quindi deve risolvere rancher_domain: ci pensa il play
# update_hosts_file, che include [local] proprio per questo.
ansibleSshHost: "localhost"

# ---------------------------------------------------------------------------
# NODO RANCHER (l'host di [masters], quello che ospita la console)
# ---------------------------------------------------------------------------
# /etc/rancher/rke2/config.yaml contiene tls-san, node-ip, l'ingress controller
# e — con piu' di un server — token e server. NON contiene il CNI: li' RKE2 posa
# il suo default, canal, ed e' la configurazione con cui questo cluster gira.
#
# I DUE CLUSTER NON HANNO LA STESSA RETE, e non e' una dimenticanza. Il cluster
# Rancher e' su canal perche' cosi' e' stato installato e funziona, e il CNI non
# si cambia a caldo: rifarlo vorrebbe dire rifare il cluster che ospita la
# console. Il cluster downstream nasce adesso, quindi la' Calico si puo'
# scegliere subito (cluster_cni piu' sopra). Se un giorno anche questo va
# rifatto da zero, la variabile da aggiungere e' "rke2_cni" in
# config_master1.yaml.j2 — non c'e', perche' oggi non serve a niente.
#
# QUELLO CHE C'ERA, E PERCHE' NON C'E' PIU':
#
#   rke2_cni: [calico]           il traffico fra pod di nodi diversi non
#                                passava. Vedi cluster_cni piu' sopra: le tre
#                                spiegazioni possibili sono adesso coperte, ma
#                                su QUESTO cluster non si torna indietro per il
#                                motivo detto sopra.
#
#   rke2_ingress_controller      C'E' DI NUOVO, ed e' qui sotto: vale [traefik].
#                                Era stata tolta perche' l'opzione veniva
#                                scritta in config.yaml senza sapere se quel RKE2
#                                la conoscesse — su una versione che non la
#                                conosce, rke2-server rifiuta la configurazione e
#                                non parte — e perche' l'Ingress della console
#                                nasceva con ingressClassName "traefik" mentre il
#                                controller installato restava nginx: creato, e
#                                servito da nessuno. Adesso master1_config
#                                interroga il binario prima di scrivere, e la
#                                classe deriva dal controller invece di essere
#                                ripetuta a mano.
#                                Nota storica da non riusare: qui era scritto che
#                                l'opzione esiste "solo dalla 1.36 in poi". Non
#                                e' esatto — su v1.35.7+rke2r1 c'e', e questo
#                                cluster ci gira. La versione minima verificata
#                                sta in cluster_ingress_controller_min_version.
#
#   rke2_disable                 toglieva rke2-ingress-nginx per far posto a
#                                Traefik. Con Traefik non installato, toglieva
#                                l'unico ingress che c'era.
#
#   traefik_*                    il chart Traefik veniva scaricato da
#                                traefik.github.io. E' il download che falliva
#                                con "i/o timeout" ogni volta che qualcosa non
#                                andava dentro al cluster, mandando la diagnosi
#                                verso Internet. Adesso non c'e' piu' niente da
#                                scaricare.
#
#   rke2_resolv_conf             serviva a far risolvere a CoreDNS i nomi
#                                esterni, e serviva perche' c'era un chart da
#                                scaricare. Senza quel chart, RKE2 fa come ha
#                                sempre fatto. Se dovesse riemergere un problema
#                                di risoluzione DENTRO ai pod, la riga da
#                                rimettere a mano in config.yaml e'
#                                "resolv-conf: /run/systemd/resolve/resolv.conf".
#
#   rke2_node_name               scriveva in config.yaml il nome di inventario
#   rke2_ferma_se_cni_diverso    invece dell'hostname, e sorvegliava i modi in
#   rke2_write_kubeconfig_mode   cui quel nome puo' divergere. RKE2 fissa il nome
#                                del nodo alla PRIMA registrazione e non lo
#                                cambia mai piu': scriverlo a mano su una
#                                macchina gia' registrata non la rinomina, ne
#                                registra una seconda e lascia la prima come
#                                fantasma. Adesso vale l'hostname, che e' il
#                                default di RKE2 e quello che usa il playbook di
#                                riferimento. Se l'hostname di una macchina
#                                riusata e' sbagliato, si corregge PRIMA di
#                                installare.
#
# IL CLUSTER A PIU' SERVER INVECE E' TORNATO. Era stato tolto insieme al resto,
# ed era troppo: tre server RKE2 con canal sono una configurazione standard, e
# il guasto era del CNI e dell'ingress, non del numero di nodi.
# rke2_token, rke2_supervisor_port, rke2_node_ip,
# rke2_settle_seconds e rke2_extra_tls_san sono qui sotto.

# --- Cluster a piu' server --------------------------------------------------
# [masters] puo' avere 1 o 3 host, mai 2: etcd ha bisogno di un numero DISPARI
# per il quorum. Il primo host dell'inventario bootstrappa, gli altri si
# uniscono a lui — l'ordine delle righe conta e non va cambiato a cluster fatto.
#
# Rancher resta UNO: il chart si installa solo sul primo master e Kubernetes
# distribuisce le sue repliche sui nodi. Tre Rancher separati sarebbero un'altra
# cosa, e sbagliata.

# Segreto condiviso dai server del cluster.
#
# VUOTO (default) = completamente automatico: il primo master bootstrappa e
# genera il proprio token, i master successivi lo leggono da lui in
# /var/lib/rancher/rke2/server/node-token. Nessun segreto nel repository.
#
# VALORIZZATO = token pre-condiviso, scritto uguale nel config.yaml di tutti i
# master prima del primo avvio. Serve solo se il token deve essere noto in
# anticipo. Generalo con: openssl rand -hex 32
rke2_token: ""

# Porta del SUPERVISOR RKE2, quella su cui i server aggiuntivi si registrano.
# NON e' 6443 (API server): usare 6443 qui e' l'errore piu' comune su RKE2.
rke2_supervisor_port: 9345

# node-ip: l'indirizzo con cui il nodo si annuncia agli altri, e verso cui canal
# incapsula il traffico fra i pod. Senza, RKE2 lo deduce dall'interfaccia di
# default, che su una macchina con piu' schede puo' non essere quella su cui gli
# altri nodi lo raggiungono — ed e' uno dei modi in cui la rete fra i pod smette
# di funzionare senza dare un errore.
rke2_node_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default(inventory_hostname)) }}"

# Margine per la promozione del nodo da learner etcd a membro votante, applicato
# fra un master e il successivo. Alzarlo se l'avvio del terzo master fallisce.
rke2_settle_seconds: 45

# SAN aggiuntivi nel certificato dell'API server. Il dominio Rancher e gli IP di
# tutti i master ci sono gia': qui vanno solo eventuali VIP o FQDN del
# bilanciatore davanti ai master.
rke2_extra_tls_san: []

# --- Versione di RKE2 -------------------------------------------------------
#
# rke2_version fissa una versione ESATTA, e deve corrispondere a un tag di
# rilascio che esiste davvero su github.com/rancher/rke2/releases: una versione
# inventata fallisce con "curl: (22) ... 404" al primo nodo.
#
# rke2_channel NON e' un numero: e' un canale, e a scegliere la versione ci
# pensa il server di aggiornamento di Rancher. Non puo' sbagliare il tag, ma ha
# un effetto collaterale che su un cluster GIA' IN PIEDI e' grosso:
#
#   master1_install rilancia "curl -sfL https://get.rke2.io | sh -" a ogni
#   esecuzione del playbook. Con il canale, quello che scarica e' l'ULTIMA
#   stabile del momento: se nel frattempo il canale e' avanzato, rilanciare il
#   playbook per cambiare una riga di configurazione AGGIORNA RKE2 su tutti i
#   master. Un upgrade di Kubernetes che nessuno ha chiesto, mentre si voleva
#   toccare l'ingress.
#
# Per questo adesso la versione e' FISSATA a quella con cui il cluster e' stato
# installato, letta dai nodi con "rke2 --version". Il canale resta come ripiego
# per un'installazione da zero su macchine nuove: svuotare rke2_version e
# decide lui.
#
# PER AGGIORNARE RKE2 di proposito: si cambia questo numero, verificandolo prima
# su github.com/rancher/rke2/releases, e si rilancia il playbook — che porta su
# i master uno alla volta (serial: 1) aspettando che ognuno rientri nel cluster.
rke2_version: "v1.35.7+rke2r1"
rke2_channel: "stable"

# Attesa che l'API server risponda e che il nodo diventi Ready dopo il primo
# avvio. Al primo giro RKE2 scarica ed estrae le immagini dei componenti di
# sistema: 10 minuti di margine non sono tanti su rete lenta.
rke2_ready_retries: 60
rke2_ready_delay: 10

# --- Ingress controller -----------------------------------------------------
#
# LISTA VUOTA (default) = non si scrive niente in config.yaml e decide RKE2, che
# oggi installa rke2-ingress-nginx. E' la configurazione con cui la console
# risponde: l'Ingress di Rancher nasce senza classe esplicita e lo serve la
# IngressClass di default.
#
# VALORIZZATA = finisce in config.yaml come "ingress-controller:". I valori
# ammessi sono quelli dichiarati da RKE2:
#
#   none            nessun ingress controller
#   ingress-nginx   il default di oggi
#   traefik         il chart rke2-traefik, IMPACCHETTATO dentro RKE2
#
# Il PRIMO valore della lista diventa anche la IngressClass predefinita, e da
# quello deriva rancher_ingress_class qui sotto: e' cosi' che la classe scritta
# sull'Ingress della console e l'ingress controller installato non possono
# divergere. Prima divergevano, ed era il guasto.
#
#   rke2_ingress_controller:
#     - traefik
#
# TRAEFIK NON SI SCARICA DA INTERNET: il chart e' dentro RKE2. E' l'opposto di
# quello che faceva il vecchio ruolo traefik_install, che lo prendeva da
# traefik.github.io mentre il cluster si stava costruendo.
#
# ATTENZIONE, TRE COSE:
#
# 1. L'OPZIONE NON ESISTE SU TUTTE LE VERSIONI. Su un RKE2 che non la conosce,
#    rke2-server rifiuta la configurazione e NON PARTE — e' successo, ed e'
#    costato l'installazione. master1_config adesso interroga il binario
#    ("rke2 server --help") PRIMA di scrivere la riga, e si ferma spiegando cosa
#    fare invece di lasciare un cluster morto. Per verificarlo a mano:
#      rke2 server --help | grep -i ingress
#
# 2. I DUE CONTROLLER NON CONVIVONO: vogliono entrambi le porte 80 e 443 dei
#    nodi. Cambiando ingress su un cluster gia' in piedi, la console non
#    risponde per il tempo dello scambio. E se il chart vecchio non se ne va da
#    solo, va tolto a mano:
#      kubectl -n kube-system get helmchart | grep ingress
#
# 3. LA CLASSE SULL'INGRESS GIA' ESISTENTE NON SI SPOSTA DA SOLA. Se Kubernetes
#    ci ha scritto dentro una classe alla creazione, cambiare il default non la
#    tocca. Si controlla cosi':
#      kubectl -n cattle-system get ingress rancher -o jsonpath='{.spec.ingressClassName}'
#    Vuoto = segue la classe di default e si sistema da se'. Valorizzato = va
#    riportato in pari, e ci pensa il playbook rilanciandolo, perche' passa
#    "--set ingress.ingressClassName" al chart Rancher.
#
# TRAEFIK, scelto: ingress-nginx e' andato in EOL a marzo 2026, RKE2 lo tiene in
# v1.36 come deprecato e lo rimuove del tutto in v1.37. Non e' una preferenza
# estetica, e' una migrazione da fare comunque — tanto vale farla adesso, che il
# cluster e' nuovo e non ci sono ancora Ingress applicativi da riportare in pari.
#
# Per tornare a ingress-nginx basta rimettere qui la lista vuota.
rke2_ingress_controller:
  - traefik

# IL NOME DEL CONTROLLER NON E' IL NOME DELLA INGRESSCLASS.
#
# RKE2 accetta "ingress-nginx" come valore di ingress-controller, ma la
# IngressClass che ne risulta si chiama "nginx":
#
#   $ kubectl get ingressclass
#   NAME    CONTROLLER             PARAMETERS   AGE
#   nginx   k8s.io/ingress-nginx   <none>       16m
#
# Chiedere all'Ingress della console la classe "ingress-nginx" vorrebbe dire
# chiedere una classe che non esiste: Ingress creato, e servito da nessuno. E'
# LO STESSO identico guasto di prima, con un nome diverso — per questo la
# corrispondenza sta scritta qui una volta sola invece di essere data per
# scontata. Un controller non elencato qui usa il proprio nome come classe.
rke2_ingress_class_names:
  ingress-nginx: nginx
  traefik: traefik

# IngressClass scritta sull'Ingress della console Rancher.
#
# DERIVATA, non scritta a mano, e per una ragione precisa: e' la coppia
# "quale ingress installo" / "quale classe chiedo" che deve restare d'accordo.
# Tenerle allineate a mano vuol dire dimenticarsene una volta, e quella volta la
# console non risponde senza che niente fallisca.
#
# Vuota quando l'ingress non e' stato scelto (l'Ingress nasce senza classe e
# segue quella di default del cluster) o quando e' "none" (non c'e' nessuno a
# servirla).
rancher_ingress_class: >-
  {{ rke2_ingress_class_names.get(rke2_ingress_controller | first,
                                  rke2_ingress_controller | first)
  if (rke2_ingress_controller | default([]) | length > 0
      and (rke2_ingress_controller | first) != 'none')
  else '' }}

# Indirizzo del nodo Rancher, usato da kubectl_setup per gli hostAliases dei
# pod agent del cluster downstream. Derivato dall'inventario.
master_node_ip: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}"
master_node_user: "root"

# IP a cui far puntare rancher_domain in /etc/hosts su tutti i nodi.
#
# QUI C'ERA UN IP SCRITTO A MANO, e non era una scelta: era l'indirizzo del
# primo master di UN inventario preciso, rimasto scolpito qui. Cambiando gli IP
# nell'inventario, /etc/hosts continuava a far puntare il dominio alla macchina
# vecchia — su tutti i nodi e sul control node. Il playbook non se ne accorgeva:
# scriveva la riga, nslookup la confermava, e il primo a caderci era "ping", che
# pero' e' un task con ignore_errors. Il guasto vero arrivava mezz'ora dopo, con
# le chiamate all'API di Rancher che finivano su un indirizzo di un'altra rete.
#
# Adesso deriva dall'inventario: e' l'indirizzo del PRIMO host di [masters].
# Cambiando l'inventario, cambia da se'.
#
# CON PIU' MASTER conviene valorizzarla a mano con l'IP del bilanciatore nginx:
# cosi' com'e', il dominio punta al primo master e la caduta di quello lascia
# la console irraggiungibile anche se gli altri due sono su.
#
# L'if/else invece di "| default(...)" perche' il filtro default() di Jinja NON
# e' pigro: valuta sempre il ripiego, e con [masters] vuoto quel [0] farebbe
# fallire chiunque legga questa variabile.
rancher_endpoint_ip: >-
  {{ hostvars[groups['masters'][0]]['ansible_host']
  if (groups['masters'] | default([]) | length > 0) else '' }}

# Variabili blocco Rancher
nginx_server_name: "kikko.app.inail-svil.almaviva.it"
nginx_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
nginx_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Variabili blocco Multi-Servizi
multi_services_server_names:
  - "kibana.app.inail-svil.almaviva.it"
  - "grafana.app.inail-svil.almaviva.it"
  - "pgadmin.app.inail-svil.almaviva.it"

# Alternativa all'elenco: una regex che intercetta tutti gli host di un
# dominio, come nella configurazione di produzione. Se valorizzata prevale su
# multi_services_server_names. Esempio: "~^.*\\.istitutotumori\\.na\\.it$"
multi_services_server_name_regex: ""

multi_services_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
multi_services_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Upstream servers
# L'upstream verso Rancher non e' piu' una lista fissa: il template nginx lo
# genera dal gruppo [masters] dell'inventario, cosi' passando da 1 a 3 master
# il bilanciatore si aggiorna da solo.
rancher_https_port: 443
nginx_upstream_max_fails: 3
nginx_upstream_fail_timeout: "5s"

# Anche l'upstream verso gli ingress deriva dal gruppo [ingress]. Se il gruppo
# e' vuoto, il ruolo nginx non genera quell'upstream e non installa il server
# block multi-servizi: il bilanciatore resta valido per la sola console Rancher.
# Quando si aggiungono nodi ingress dedicati, il secondo e i successivi entrano
# automaticamente nel bilanciamento.
ingress_https_port: 443

# Configurazione Nginx
nginx_user: "www-data"
nginx_worker_processes: 4
nginx_worker_rlimit_nofile: 40000
nginx_worker_connections: 8192
nginx_client_max_body_size: "2G"
nginx_proxy_read_timeout: 900

# I server block stanno in file separati dentro questa directory, inclusa da
# nginx.conf all'interno del blocco http.
nginx_conf_http_dir: "/etc/nginx/conf-http.d"

# La configurazione generata usa solo http{}, quindi il modulo stream non serve
# e non viene caricato. Metterlo a true solo se si aggiunge un blocco stream{},
# e verificando che il modulo esista sul pacchetto nginx installato.
nginx_load_stream_module: false
nginx_stream_module_path: "/usr/lib/nginx/modules/ngx_stream_module.so"

# Path directory certificati
nginx_cert_dir: "/etc/nginx/cert"

# ---------------------------------------------------------------------------
# RADICE DEL REPOSITORY
# ---------------------------------------------------------------------------
# Serve a dare un punto fisso ai file che stanno nel repository e che i ruoli
# copiano sui nodi.
#
# Un percorso relativo NON funziona. Il modulo copy risolve un src relativo
# nella cartella files/ del RUOLO e in quella del PLAYBOOK, e da quando i play
# stanno in playbooks/ quella cartella e' playbooks/, non la radice. Il
# risultato e' l'errore
#
#   Could not find or access 'files/fullchain.pem'
#     Searched in: .../roles/nginx_install/files/fullchain.pem
#                  .../playbooks/files/fullchain.pem
#
# con il file che intanto sta tranquillo in files/ nella radice.
#
# inventory_dir e non playbook_dir: playbook_dir cambia a seconda di come si
# lancia (la radice con site.yml, playbooks/ con un playbook singolo), mentre
# l'inventario sta sempre nella radice, ed e' anche quello che ansible.cfg
# dichiara come "inventory = ./inventory.ini".
repo_dir: "{{ inventory_dir }}"

# Path locali dei certificati, sul CONTROLLER.
local_ssl_cert_path: "{{ repo_dir }}/files/fullchain.pem"
local_ssl_key_path: "{{ repo_dir }}/files/privkey.pem"

# ---------------------------------------------------------------------------
# BILANCIATORI (gruppo [nginx_servers]): nginx + haproxy + keepalived
# ---------------------------------------------------------------------------
# Due nodi in HA con due VIP distinti, ciascuno gestito da una propria istanza
# VRRP:
#   - vip_rancher_ip  -> lo tiene nginx, espone la console Rancher e i servizi
#   - vip_patroni_ip  -> lo tiene haproxy, espone Patroni/PgBouncer

# >>> VERIFICA CHE QUESTI DUE INDIRIZZI SIANO LIBERI NELLA TUA VLAN <<<
#
# E che stiano DENTRO alla rete dei nodi, non solo vicini guardando il terzo
# ottetto. Con prefisso 28 la rete e' di sedici indirizzi: nodi in
# 10.205.166.208/28 vuol dire da .209 a .222, e un VIP a .231 o a .253 e' su
# un'altra rete. keepalived se lo prende comunque e nessuno protesta, ma il VIP
# non e' raggiungibile da fuori; IPaddr2 di Pacemaker invece rifiuta di partire
# e lascia "[findif] failed", che non spiega niente.
#
# Il controllo si fa a mano prima di lanciare: "ip -br addr" su un nodo dice
# indirizzo e prefisso, e "ip route get <vip>" risponde senza fare aritmetica —
# se nella risposta compare " via " il VIP e' su un'altra rete. Il ruolo
# pacemaker_nfs_ha lo verifica anche da solo prima di creare la risorsa.
#
# DUE COSE ANCORA DA SISTEMARE, prima di installare i bilanciatori:
#
#   vip_rancher_ip e' lo STESSO indirizzo di balancer01c nell inventario. Un VIP
#   deve essere libero: se coincide con una macchina viva, keepalived se lo
#   prende sul nodo che in quel momento e' MASTER e i due se lo contendono.
#
#   vip_patroni_ip e' fuori dalla rete dei bilanciatori: .231 sta in
#   10.205.166.224/28, i bilanciatori in 10.205.166.208/28. keepalived non
#   protestera', ma da fuori quel VIP non lo raggiunge nessuno.
#
# Servono due indirizzi liberi fra .209 e .222, diversi da nfs_vip_ip.
vip_rancher_ip: "10.205.166.221"
vip_rancher_prefix: 28
vip_patroni_ip: "10.205.166.231"

# Interfaccia su cui keepalived annuncia i VIP. Deve esistere sui bilanciatori:
# verificala con "ip -br addr" prima di lanciare.
keepalived_interface: "ens5"

# I VRID devono essere unici nella VLAN: due cluster keepalived con lo stesso
# VRID sullo stesso dominio di broadcast si disturbano a vicenda.
keepalived_vrid_rancher: 151
keepalived_vrid_patroni: 51

# Nomi delle istanze VRRP, uguali su tutti i bilanciatori.
keepalived_rancher_instance: "VI_NGINX"
keepalived_patroni_instance: "vrrp_1"

# Priorita' del primo bilanciatore dell'inventario; gli altri scalano di step.
# Il primo host di [nginx_servers] e' MASTER, gli altri BACKUP.
keepalived_priority_master: 101
keepalived_priority_step: 1

keepalived_advert_int: 1

# Peso che il check di nginx aggiunge alla priorita' quando nginx e' sano.
# Deve superare il divario di priorita' fra i nodi, altrimenti la caduta di
# nginx sul MASTER non basta a spostare il VIP.
keepalived_nginx_check_weight: 50
keepalived_nginx_check_interval: 3

# Schema attivo/passivo: nginx e' avviato e fermato da nginx-ha-notify di
# keepalived, quindi gira solo sul nodo che tiene vip_rancher_ip. Ansible non
# lo avvia e non lo abilita al boot, per non lasciarlo acceso sul nodo passivo.
#
# Mettendolo a false, nginx gira su TUTTI i bilanciatori e keepalived si limita
# a controllarlo: in quel caso il failover scatta anche quando cade il solo
# nginx, cosa che con lo schema attivo/passivo non avviene (vedi README).
nginx_managed_by_keepalived: true

# Porta su cui lo script verifica che nginx sia davvero in ascolto. La 80 e'
# il server di redirect verso https, presente in nginx.conf su ogni nodo.
nginx_health_check_port: 80

# HAProxy: front-end Patroni/PgBouncer
haproxy_stats_port: 7000
haproxy_primary_port: 5000
haproxy_standby_port: 5001
# Porta di PgBouncer sui nodi database.
haproxy_backend_port: 6432
# Porta della REST API di Patroni, usata per gli health check /primary e /replica.
haproxy_patroni_api_port: 8008
haproxy_maxconn_global: 4000
haproxy_maxconn_default: 3000
# Connessioni per singolo backend, come sui bilanciatori in esercizio. E' un
# tetto per server, non globale: alzarlo oltre max_client_conn di PgBouncer non
# serve a niente, perche' a quel punto e' PgBouncer a mettere in coda.
haproxy_maxconn_server: 300

# Timeout di client e server. 10m, non il minuto scarso di prima: sotto ci sono
# query analitiche e dump che durano piu' di un minuto, e con un timeout basso
# haproxy chiude la connessione a meta' lavoro.
haproxy_timeout_client: "10m"
haproxy_timeout_server: "10m"

haproxy_chroot: "/var/lib/haproxy"
haproxy_user: "haproxy"
haproxy_group: "haproxy"

# ---------------------------------------------------------------------------
# DATABASE (gruppo [db_servers]): PostgreSQL + Patroni + etcd + PgBouncer
# ---------------------------------------------------------------------------
# I nodi, i peer etcd e le voci di /etc/hosts derivano dal gruppo
# [db_servers]: il primo host bootstrappa il cluster.

postgres_version: "17"

# Sui tre nodi DB il disco dati di PostgreSQL e' dedicato e montato A MANO su
# questo percorso. Il play si ferma con un errore se il mount non c'e',
# invece di lasciare che il database venga inizializzato sul disco di sistema.
# La directory dati effettiva e' <mount>/<major>/main.
postgres_mount_point: "/var/lib/postgresql"

# Il repo Percona e i nomi dei pacchetti seguono la versione. Verificali sul
# nodo dopo "percona-release setup ppg-17", in particolare
# percona-pgaudit17-set-user e percona-postgresql-17-wal2json.
# Da qui il repo Percona non e' raggiungibile e non ho potuto controllarli.

# Versione etcd dal repo Percona: nell'archivio Ubuntu Noble il pacchetto
# "etcd" non esiste (ci sono etcd-server ed etcd-client, fermi alla 3.4.30).
#
# VUOTA (default) = l'ultima disponibile nel repo Percona. Il repo rimuove le
# versioni vecchie dall'indice quando pubblica le nuove, quindi un pin fisso
# prima o poi smette di esistere: e' successo con 1:3.5.18-1.noble. Per fissare
# comunque una versione, leggi quelle reali con "apt-cache madison etcd" sui
# nodi (a repo abilitato) e mettila qui: il ruolo verifica che esista prima di
# installare e, se non c'e' piu', elenca quelle disponibili.
etcd_version: ""

# Con false il ruolo non cancella nulla: e' idempotente e rilanciabile.
# Con true AZZERA la directory dati di PostgreSQL e il datastore etcd su tutti
# i nodi, per ripartire da un cluster nuovo. Da passare a mano quando serve:
#   ansible-playbook -i inventory.ini site.yml -e postgres_force_reinit=true
postgres_force_reinit: false

# "upgrade: dist" a ogni esecuzione, come nel playbook di partenza.
postgres_dist_upgrade: true

# Pretende che postgres_mount_point sia un mountpoint prima di inizializzare il
# cluster, e si ferma se non lo e'.
#
# FALSE di default perche' i dischi si predispongono a mano: create_disk non e'
# piu' invocato da nessun playbook, quindi un playbook che pretende un mount che
# non crea piu' bloccherebbe ogni esecuzione su una macchina senza disco
# dedicato. Con false il playbook crea la directory, avvisa che i dati vanno sul
# filesystem di sistema, e prosegue.
#
# METTERLO A TRUE IN PRODUZIONE, dove il disco dedicato c'e' e un database
# finito per sbaglio sulla partizione di root e' un guaio:
#   ansible-playbook ... -e postgres_require_dedicated_disk=true
postgres_require_dedicated_disk: false

# CAMBIA QUESTE PASSWORD prima di andare in produzione: con
# "host all all 0.0.0.0/0 md5" nel pg_hba, chiunque raggiunga la 5432 puo'
# provarle.
patroni_users:
  superuser:
    username: postgres
    password: postgres
  replication:
    username: replicator
    password: replicator
  rewind:
    username: pgrewind
    password: pgrewind
  admin:
    password: admin


# ---------------------------------------------------------------------------
# STORAGE (gruppo [gluster_servers]): GlusterFS + Ganesha NFS + Pacemaker
# ---------------------------------------------------------------------------

# Radice dei brick. Gluster rifiuta di creare un brick sulla partizione di root
# a meno di passare "force": tenere gluster_brick_force a true se questa
# directory non e' un filesystem dedicato. Meglio comunque montarci sopra un
# volume a parte, come fa create_disk per /var/lib/rancher.
gluster_brick_root: "/bricks"
gluster_brick_force: true

# replica 3 arbiter 1 su tre nodi: due copie dei dati piu' un arbitro che
# tiene solo i metadati ed evita lo split-brain. Con gluster_arbiter_count a 0
# si ottiene una replica 3 piena, che richiede il triplo dello spazio.
gluster_replica_count: 3
gluster_arbiter_count: 1

# Un volume per riga: name e' il nome Gluster, brick la sottodirectory sotto
# gluster_brick_root.
#
# NFS e' solo per Kubernetes: l'unico volume esportato da Ganesha e' quello che
# montano i nodi del cluster. Si dichiara con nfs_export: true e allora servono
# anche pseudo (il percorso con cui il client monta la share) ed export_name
# (il nome del file in ganesha_export_dir).
# Gli altri volumi esistono solo come volumi Gluster con i loro brick, senza
# alcun export. PostgreSQL non passa di qui: scrive sul disco locale che
# create_disk prepara come vg_data/lv_data su {{ postgres_mount_point }}.
# Aggiungere nfs_export ad altri volumi vuol dire esporre dati di database via
# NFS: farlo solo di proposito.
#
# options sono le "Options Reconfigured" da applicare al volume dopo la
# creazione, con "gluster volume set". Le opzioni che Gluster imposta da solo
# alla creazione (transport.address-family, storage.fips-mode-rchecksum,
# cluster.granular-entry-heal, performance.client-io-threads) non vanno ripetute.
gluster_volumes:
  - name: "INFRA"
    brick: "infra"
    nfs_export: true
    pseudo: "/infra"
    export_name: "k8s"
    # Accelerano il listing di directory con molti file, tipico delle share
    # Kubernetes: i pod ci tengono dentro migliaia di piccoli oggetti.
    options:
      performance.parallel-readdir: "on"
      performance.readdir-ahead: "on"
      performance.md-cache-timeout: "600"
  - name: "POSTGRESQL"
    brick: "postgresql"
  - name: "ELASTIC"
    brick: "elastic"

# Ganesha
ganesha_config_path: "/etc/ganesha/ganesha.conf"
ganesha_export_dir: "/etc/ganesha/exports"

# Percorso ESPORTATO, relativo alla radice del volume Gluster: "/" espone il
# volume intero. Da non confondere con il percorso del brick su disco.
ganesha_export_path: "/"

# Protocolli e sicurezza degli export.
ganesha_protocols: "3,4"
ganesha_sectype: "sys"
# Access_Type a livello di export. Con RO gli accessi in scrittura restano
# possibili solo ai CLIENT elencati sotto, che lo sovrascrivono con RW.
ganesha_default_access: "RO"
ganesha_client_access: "RW"
ganesha_client_squash: "no_root_squash"

# Client autorizzati in scrittura. Di default tutti i nodi Kubernetes
# dell'inventario, che sono quelli che montano le share.
ganesha_client_groups:
  - masters
  - new_managers
  - workers
  - ingress
# Indirizzi aggiuntivi, in notazione CIDR (es. "10.200.60.194/32").
ganesha_extra_clients: []

# VIP NFS, gestito da Pacemaker e spostato sul nodo che serve Ganesha.
#
# >>> VERIFICA CHE SIA LIBERO E DENTRO ALLA RETE DEI NODI GLUSTER <<<
#
# Deve stare nella stessa rete degli indirizzi dei nodi, non solo nella stessa
# VLAN a occhio: IPaddr2 ricava l'interfaccia dalla tabella di instradamento e,
# se per arrivare al VIP si passa dal gateway, non ne trova nessuna e la risorsa
# resta Stopped con "[findif] failed". Il ruolo pacemaker_nfs_ha se ne accorge
# prima e si ferma dicendo perche'.
#
# I nodi Gluster stanno in 10.205.166.208/28, cioe' da .209 a .222: era .253 a
# essere sbagliato, non il prefisso. .253 sta in 10.205.166.240/28, un'altra
# rete, e Pacemaker non riusciva a pubblicarlo.
# Libero e verificato all ARP c e anche .222, se questo servisse altrove.
nfs_vip_ip: "10.205.166.212"
nfs_vip_prefix: 28

# Pacemaker
pcs_cluster_name: "nfs_export"

# Nodi del cluster Pacemaker: i due che tengono i dati, come i cluster in
# esercizio. L'arbitro Gluster, cioe' l'ULTIMO host di [gluster_servers], resta
# fuori: e' un nodo di soli metadati e non deve servire NFS.
#
# Conseguenza da conoscere: con due nodi "pcs cluster setup" scrive da solo
# two_node: 1 in corosync.conf, che tiene il cluster sempre in quorum. Il
# failover per caduta di un nodo funziona; a non essere coperto e' il caso in
# cui i due nodi restano vivi ma smettono di vedersi, perche' entrambi
# prenderebbero VIP e Ganesha. Il rimedio previsto e' lo stonith, qui disattivo.
#
# Mettendo qui tutti e tre gli host si ottiene il quorum per maggioranza; in
# quel caso conviene aggiungere un vincolo che tenga le risorse lontane
# dall'arbitro.
pcs_cluster_nodes: "{{ groups['gluster_servers'][:2] }}"

pcs_cluster_user: "hacluster"
# CAMBIA QUESTA PASSWORD. Serve a pcs per autenticare i nodi fra loro.
pcs_cluster_password: "CambiaMiSubito-hacluster"
# stonith disabilitato come nella procedura di riferimento. In produzione, con
# un meccanismo di fencing disponibile, andrebbe abilitato.
pcs_stonith_enabled: false
pcs_resource_monitor_interval: "10s"

# Prometheus/Monitoring configuration
prometheus_namespace: "monitoring"
grafana_password: "SecureGrafanaPassword123!"  # CAMBIA QUESTA PASSWORD
prometheus_retention: "15d"
prometheus_storage_size: "5Gi"
grafana_storage_size: "3Gi"
alertmanager_storage_size: "2Gi"

# Ingress configuration
prometheus_create_ingress: true
grafana_domain: "grafana.app.iac-svil.almaviva.it"
prometheus_domain: "prometheus.app.iac-svil.almaviva.it"

# Resource configurations (optional overrides)
prometheus_cpu_requests: "1000m"
prometheus_memory_requests: "2Gi"
prometheus_cpu_limits: "2000m"
prometheus_memory_limits: "4Gi"

# Timeout configurations
helm_timeout: "15m"
pod_wait_timeout: "5m"  # Ridotto per evitare blocchi lunghi


# ===========================================================================
# CLUSTER KAFKA KRAFT A 3 NODI, SASL_SSL  ->  gruppo [kafka_servers]
# ===========================================================================
# Automatizza la guida "Cluster Kafka KRaft a 3 Nodi con Sicurezza SASL_SSL".
# Tre nodi, ognuno broker E controller: maggioranza due, il cluster sopravvive
# alla perdita di un nodo. Il numero di nodi deve restare DISPARI.
#
#   ansible-playbook -i inventory.ini playbooks/50-kafka.yml
#
# Il disco dati NON viene toccato: si monta a mano su kafka_data_dir. Il ruolo
# crea la directory, la assegna all'utente kafka e dice se sotto c'e' un disco
# dedicato o la partizione di sistema.
#
# node.id e indirizzi NON si scrivono qui: derivano dall'inventario. Il primo
# host del gruppo [kafka_servers] e' node.id 1, il secondo 2, il terzo 3, e
# ansible_host di ciascuno finisce in listeners, advertised.listeners e
# controller.quorum.voters. Per questo l'ORDINE DELLE RIGHE NELL'INVENTARIO NON
# VA CAMBIATO a cluster formattato: node.id resta scritto in
# data/meta.properties e il ruolo si ferma segnalando la divergenza.

# Gruppo di inventario che ospita il cluster.
kafka_cluster_group: "kafka_servers"

# node.id e indirizzo di ciascun nodo. STANNO QUI, e non nei defaults del
# ruolo, perche' server.properties ha bisogno di leggerli anche per GLI ALTRI
# due nodi (controller.quorum.voters li elenca tutti e tre): un ruolo vede i
# propri defaults solo sull'host su cui sta girando, mentre le variabili di
# inventario sono visibili da hostvars[altro_nodo].
#
# Per fissare un node.id a mano, dichiaralo nell'inventario sull'host:
#   pu-kfk-stg-01 ansible_host=172.29.83.74 ... kafka_node_id=1
kafka_node_id: >-
  {{ ((groups[kafka_cluster_group] | default([])).index(inventory_hostname) + 1)
     if inventory_hostname in (groups[kafka_cluster_group] | default([]))
     else 0 }}
kafka_node_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default(inventory_hostname)) }}"

# ---------------------------------------------------------------------------
# VERSIONI
# ---------------------------------------------------------------------------
# La guida indica Kafka 4.3.0, che non e' piu' l'ultima patch della serie 4.3:
# 4.3.1 l'ha sostituita e downloads.apache.org, che tiene SOLO le release
# correnti, ha smesso di pubblicare la 4.3.0 (da li' il 404 sul tarball).
#
# VERIFICA su https://kafka.apache.org/downloads che questa sia ancora l'ultima
# patch della serie. Il ruolo prova prima downloads.apache.org e poi
# archive.apache.org (che tiene tutte le release ritirate), e se non la trova da
# nessuna parte si ferma dicendolo.
kafka_version: "4.3.1"
kafka_scala_version: "2.13"

# Rete chiusa: percorso del tarball SUL CONTROLLER, e non viene scaricato
# niente da internet. Es. "{{ repo_dir }}/files/kafka_2.13-4.3.1.tgz"
kafka_tarball_local_path: ""

# Riscarica e riscompatta la distribuzione anche se il marcatore di versione
# scritto dal ruolo dice che c'e' gia' quella giusta: bin/ e libs/ vengono
# rifatti da zero. Serve quando in /opt/kafka ci sono i resti di un'altra
# versione — tipicamente un'installazione fatta a mano prima di usare Ansible —
# e i comandi di Kafka falliscono con "multiple SLF4J bindings" o
# NoSuchMethodError. Non tocca data/, config/ ne' i certificati: non cancella
# dati e non riformatta niente.
#
#   ansible-playbook playbooks/50-kafka.yml -e kafka_force_reinstall=true
kafka_force_reinstall: false

# ---------------------------------------------------------------------------
# JAVA
# ---------------------------------------------------------------------------
# Kafka 4.x NON parte con Java 11: servono almeno le 17. La JVM viene imposta a
# Kafka con JAVA_HOME nel service systemd, quindi un aggiornamento di sistema
# che cambia la java di default non puo' far ripartire il broker con quella
# sbagliata.
#
#   zulu = tarball Azul Zulu, come nella guida
#   apt  = openjdk-17 dai repository Ubuntu. Stessa versione di Java, nessun
#          download da internet: e' la scelta giusta se cdn.azul.com non e'
#          raggiungibile o se la build Zulu indicata non esiste piu'.
kafka_java_install_method: "zulu"
kafka_zulu_release: "zulu17.52.17-ca-jdk17.0.12-linux_x64"
# Rete chiusa: percorso del tarball della Zulu sul controller.
kafka_zulu_local_tarball: ""

# Heap della JVM. 4G presuppone gli 8 GB richiesti dalla guida: su un nodo da
# 4 GB ABBASSALO a "-Xmx2G -Xms2G". Non e' tutta la memoria che serve al
# broker: il resto del lavoro lo fa il page cache del kernel, quindi lasciane
# libera almeno altrettanta. Vuoto = default di Kafka, 1 GB.
kafka_heap_opts: "-Xmx4G -Xms4G"

# ---------------------------------------------------------------------------
# PERCORSI E PORTE
# ---------------------------------------------------------------------------
kafka_home: "/opt/kafka"
# Qui va montato il disco dedicato, a mano. Sotto ci finiscono i segmenti dei
# topic: e' la directory che cresce.
kafka_data_dir: "/opt/kafka/data"

# true = il ruolo si ferma se kafka_data_dir non e' un mountpoint, invece di
# riempire la partizione di sistema. Da mettere a true in produzione.
kafka_require_dedicated_disk: false

kafka_broker_port: 9092
kafka_controller_port: 9093

# ---------------------------------------------------------------------------
# SICUREZZA: TLS
# ---------------------------------------------------------------------------
# Una CA interna firma i certificati dei tre nodi. Ogni nodo ha il proprio
# keystore (chiave privata + certificato), tutti condividono il truststore (la
# sola CA). CA e keystore nascono sul PRIMO nodo del gruppo e ca.key non si
# muove da li'.
#
# CAMBIA QUESTE PASSWORD prima della produzione, e valuta ansible-vault:
# finiscono in chiaro dentro server.properties sui nodi (0640 kafka:kafka) e,
# se restano qui, dentro il repository.
kafka_keystore_password: "RASUNICOcoll.2026"

# Vuoto = verifica del hostname DISATTIVATA, come nella guida. I certificati
# generati dal ruolo hanno pero' sia l'IP sia il nome nel SAN: per attivarla
# basta mettere "https" qui e riavviare, senza rigenerare niente. Va cambiata
# anche nei client.
kafka_ssl_endpoint_identification_algorithm: ""

# Durata dei certificati, dieci anni come nella guida. Segnati la scadenza:
# quando i certificati scadono i nodi smettono di parlarsi e l'errore
# (SSLHandshakeException) non dice che sono scaduti.
kafka_cert_validity_days: 3650

# ---------------------------------------------------------------------------
# SICUREZZA: SASL/PLAIN
# ---------------------------------------------------------------------------
# Gli utenti PLAIN esistono SOLO qui dentro: con questo meccanismo NON si
# creano con kafka-configs.sh. Aggiungerne o cambiarne uno significa modificare
# questa mappa e rilanciare il playbook, che riscrive server.properties e
# riavvia i nodi UNO ALLA VOLTA.
#
# admin      = gestione, super user, esente dalle ACL
# appclient  = client applicativo, senza ACL non puo' fare niente
#
# CAMBIA QUESTE PASSWORD.
kafka_sasl_users:
  admin: "RASUNICOcoll.2026"
  appclient: "RASUNICOcoll.2026"

# Utente con cui i nodi parlano fra loro e con cui girano i comandi di
# gestione. Deve essere uno di quelli sopra.
kafka_admin_user: "admin"
kafka_inter_broker_user: "admin"

# Chi puo' presentarsi sul listener del quorum (porta 9093). Solo utenti di
# servizio: i client applicativi non hanno niente da fare li'.
kafka_controller_users:
  - "admin"

# Esenti dalle ACL. Un super user puo' fare tutto su tutto.
kafka_super_users:
  - "User:admin"

# ---------------------------------------------------------------------------
# ACL
# ---------------------------------------------------------------------------
# Con l'authorizer attivo, appclient non ha ALCUN permesso: ogni accesso va
# concesso. Le regole qui sotto sono quelle della guida e parlano del topic di
# prova test-3node.
#
# SPENTO di default: si accende dopo aver sostituito test-3node con i topic
# veri, altrimenti si applicano permessi su un topic che non serve a nessuno.
kafka_manage_acls: false
kafka_acls:
  # Tutte le operazioni sul topic (produttori)
  - principal: "User:appclient"
    operations: ["All"]
    topic: "test-3node"
    group: "*"

  # Lettura con un consumer group specifico
  - principal: "User:appclient"
    operations: ["Read"]
    topic: "test-3node"
    group: "test-group"

  # Topic interni: senza questi il client si autentica, vede il topic e poi
  # fallisce al primo commit degli offset con un errore che sembra un altro
  # problema.
  - principal: "User:appclient"
    operations: ["Read", "Write"]
    topic: "__consumer_offsets"
    group: "*"

  - principal: "User:appclient"
    operations: ["Create", "Describe"]
    cluster: true

  - principal: "User:appclient"
    operations: ["Describe"]
    topic: "*"

# ---------------------------------------------------------------------------
# VERIFICA
# ---------------------------------------------------------------------------
# La verifica in sola lettura (stato del quorum, versioni API dei tre broker)
# gira sempre a fine installazione. Questa invece CREA UN TOPIC e ci scrive
# dentro, quindi si accende a mano:
#   ansible-playbook playbooks/50-kafka.yml -e kafka_smoke_test=true
kafka_smoke_test: false
kafka_smoke_topic: "test-3node"

# ---------------------------------------------------------------------------
# PARAMETRI DEL BROKER
# ---------------------------------------------------------------------------
# Valori della guida. replication factor 3 e min.insync.replicas 2 sono la
# coppia che rende il cluster resistente alla perdita di UN nodo: con tre
# copie e due richieste in sincrono, un nodo giu' non ferma le scritture.
# Alzare min.insync.replicas a 3 significa fermarsi appena cade un nodo.
kafka_num_partitions: 3
kafka_default_replication_factor: 3
kafka_offsets_topic_replication_factor: 3
kafka_transaction_state_log_replication_factor: 3
kafka_transaction_state_log_min_isr: 2
kafka_min_insync_replicas: 2
kafka_log_retention_hours: 168
kafka_num_network_threads: 8
kafka_num_io_threads: 16
# false: i topic si creano a mano. Un topic creato al volo da un client nasce
# con i default del broker e non con le repliche che gli servirebbero.
kafka_auto_create_topics_enable: false
kafka_delete_topic_enable: true

# Righe aggiuntive per server.properties che qui non hanno una variabile
# propria:  kafka_extra_server_properties: { "log.cleaner.threads": 2 }
kafka_extra_server_properties: {}

# ---------------------------------------------------------------------------
# CLUSTER ID
# ---------------------------------------------------------------------------
# Vuoto = generato al primo run e conservato, cosi' i run successivi non
# riformattano niente. Va valorizzato SOLO per far entrare nodi nuovi in un
# cluster gia' esistente di cui si conosce l'id
# (cat /opt/kafka/data/meta.properties su un nodo attivo).
kafka_cluster_id: ""

# ---------------------------------------------------------------------------
# DIAGNOSI
# ---------------------------------------------------------------------------
# ansible.cfg ha [diff] always = True: senza questo il contenuto di
# server.properties, password del JAAS comprese, finirebbe in chiaro dentro
# ansible.log. Mettilo a false solo per capire perche' un task fallisce.
kafka_hide_secrets: true


# ===========================================================================
# ELASTICSEARCH 9  ->  ruoli elasticsearch_node e elasticsearch_cluster
# ===========================================================================
# Automatizza l'installazione descritta nella procedura a mano: pacchetto deb
# dal repo Elastic, CA interna e certificati generati con
# elasticsearch-certutil, sicurezza e TLS accesi su entrambe le porte.
#
#   ansible-playbook -i inventory.ini playbooks/60-elasticsearch.yml          # nodo singolo
#   ansible-playbook -i inventory.ini playbooks/61-elasticsearch-cluster.yml  # cluster a 3
#
# DUE RUOLI, UNA SOLA SEZIONE DI VARIABILI. Le variabili es_* qui sotto valgono
# per tutti e due: versione, percorsi, certificati, password, heap sono gli
# stessi su un nodo solo e su tre. Quello che cambia per il cluster sta in
# fondo, con il prefisso esc_. NESSUNO DEI DUE RUOLI HA UNA CARTELLA defaults/:
# tutto quello che leggono e' scritto qui, una volta sola, e una variabile che
# manca qui fa fermare il ruolo con "undefined variable" invece di prendere un
# valore di ripiego che nessuno ha scelto.
#
# I due gruppi di inventario sono DISTINTI e un host non puo' stare in
# entrambi:
#   [elastic_servers]           un nodo solo, discovery.type=single-node
#   [elastic_cluster_servers]   tre nodi (o un numero dispari >= 3)
#
# Il disco dati NON viene toccato: si monta a mano su es_data_dir. Il ruolo
# crea la directory, la assegna all'utente elasticsearch e dice se sotto c'e'
# un disco dedicato o la partizione di sistema.

# Gruppo del NODO SINGOLO. Il ruolo elasticsearch_node configura
# discovery.type=single-node e si ferma se qui trova piu' di un host: con
# single-node ogni nodo si elegge master da solo, quindi tre righe in questo
# gruppo farebbero tre cluster separati con lo stesso nome, non un cluster a
# tre nodi. Per quello c'e' esc_group, in fondo.
es_group: "elastic_servers"

# --- Identita' --------------------------------------------------------------
# Nome del cluster e nome del nodo. Il nome del NODO decide anche il percorso
# dei certificati (/etc/elasticsearch/cert/<nodo>/<nodo>.crt): cambiarlo dopo
# l'installazione vuol dire rigenerarli.
# cluster.name. Va deciso PRIMA del primo avvio: dopo, cambiarlo vuol dire
# fermare tutti i nodi insieme (un nodo con un cluster.name diverso non si
# unisce agli altri). Derivato dal DN della CA qui sotto, in minuscolo con i
# trattini come vuole Elasticsearch: se preferisci un altro nome, questo e' il
# momento.
es_cluster_name: "sintesi2-puglia-prod"
es_node_name: "{{ inventory_hostname }}"

# master serve comunque (senza, il nodo non elegge se stesso e non parte);
# data e ingest sono i ruoli del file di configurazione fornito. Nel cluster
# sono i ruoli di TUTTI i nodi: per farne uno diverso, si dichiara
# es_node_roles su quell'host nell'inventario, e cluster.initial_master_nodes
# ne tiene conto da solo (elenca solo chi ha "master").
es_node_roles:
  - master
  - data
  - ingest

# Indirizzo su cui il nodo ascolta (network.host) e che finisce nel SAN del
# certificato. Deriva dall'inventario: network.host vuole un IP, non un nome.
es_node_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default(inventory_hostname)) }}"

# Stringa (un indirizzo) oppure lista. Per ascoltare anche su 127.0.0.1:
#   es_network_host: ["_site_", "_local_"]
es_network_host: "{{ es_node_ip }}"
es_http_port: 9200
es_transport_port: 9300

# single-node = il nodo si elegge master da solo e non cerca nessuno. E' la
# ragione per cui il nodo singolo NON scrive cluster.initial_master_nodes: con
# discovery.type=single-node Elasticsearch rifiuta di partire se lo trova.
# Vale SOLO per elasticsearch_node: il cluster non usa discovery.type.
es_discovery_type: "single-node"

# --- Versione e provenienza del pacchetto -----------------------------------
# Serie 9.x dal repo artifacts.elastic.co.
#
# FISSATA a 9.5.2: e' la versione con cui il cluster sintesi2-puglia-prod e'
# stato installato e con cui gira. Prima era vuota, cioe' "l'ultima 9.x del
# momento", e quello e' un problema solo apparentemente teorico: con tre nodi
# ogni macchina prende l'ultima NEL MOMENTO IN CUI GLI TOCCA, quindi un nodo
# rifatto o aggiunto fra un mese entrerebbe con una versione diversa dalle
# altre due. Un cluster a versioni miste e' supportato solo durante un
# aggiornamento, non come stato normale — e la verifica del ruolo se ne
# accorge e si ferma.
#
# PER AGGIORNARE, di proposito: si alza questo numero e si rilancia il
# playbook, che toglie il blocco di apt, aggiorna e riavvia i nodi UNO ALLA
# VOLTA aspettando che ognuno rientri nel cluster. Le versioni che esistono
# davvero si leggono sui nodi con "apt-cache madison elasticsearch" a repo
# abilitato; il ruolo verifica comunque che quella richiesta ci sia prima di
# installare, e se non c'e' elenca le disponibili.
#
# Vuota = ultima 9.x disponibile. Ha senso solo per una prima installazione su
# macchine nuove, dove nessuno ha ancora una versione da rispettare.
es_major: "9"
es_version: "9.5.2"

es_package: "elasticsearch"
es_apt_repo_url: "https://artifacts.elastic.co/packages/{{ es_major }}.x/apt"
es_apt_repo_file: "elastic-{{ es_major }}.x"
es_apt_key_url: "https://artifacts.elastic.co/GPG-KEY-elasticsearch"

# Portachiavi con cui apt verifica le firme del repo Elastic, nelle due forme
# che apt accetta:
#
#   .gpg  binario, prodotto da "gpg --dearmor". E' la forma preferita, ed e'
#         quella che il ruolo installa quando gpg c'e' sul nodo.
#   .asc  la chiave come la pubblica Elastic, in armatura ASCII. Non richiede
#         gpg, e serve come ripiego: su un nodo con apt rotto gnupg non si puo'
#         installare, e senza alternativa il ruolo resterebbe in un giro chiuso.
#
# La scelta e' appiccicosa: se ne esiste gia' uno valido, si usa quello e il
# file del repository non cambia a ogni esecuzione.
es_apt_keyring: "/usr/share/keyrings/elasticsearch-keyring.gpg"
es_apt_keyring_asc: "/usr/share/keyrings/elasticsearch-keyring.asc"

# Rete chiusa: percorsi SUL CONTROLLER. Valorizzando es_deb_local_path il repo
# apt non viene nemmeno aggiunto e non si contatta artifacts.elastic.co.
#   es_deb_local_path: "{{ repo_dir }}/files/elasticsearch-9.1.3-amd64.deb"
es_deb_local_path: ""
es_apt_key_local_path: ""

# apt-mark hold sul pacchetto: con il repo Elastic abilitato, un "apt upgrade"
# qualsiasi porterebbe Elasticsearch a una versione nuova riavviando il nodo
# quando capita. Gli aggiornamenti si fanno alzando es_version e rilanciando il
# playbook, che toglie il blocco, aggiorna e lo rimette.
es_apt_hold: true

# Aggiornamento della cache di apt prima di installare i pacchetti di appoggio.
#
# A false su un nodo dove "apt-get update" non puo' funzionare — rete chiusa
# senza mirror interno, macchina con i pacchetti gia' dentro all'immagine — e
# dove Elasticsearch arriva da es_deb_local_path. Il ruolo si ferma comunque
# con un messaggio leggibile se gli strumenti che gli servono non ci sono.
es_apt_update_cache: true

es_utility_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  # elasticsearch-certutil scrive un file .zip e basta: senza unzip i
  # certificati resterebbero dentro l'archivio.
  - unzip

# --- Percorsi ---------------------------------------------------------------
es_home: "/usr/share/elasticsearch"
es_bin_dir: "{{ es_home }}/bin"
es_conf_dir: "/etc/elasticsearch"

# path.data. QUI VA MONTATO IL DISCO DEDICATO, a mano.
es_data_dir: "/opt/esdata"
es_log_dir: "/var/log/elasticsearch"

# true = il ruolo si ferma se es_data_dir non e' un mountpoint, invece di
# riempire la partizione di sistema con gli indici. Da mettere a true in
# produzione.
es_require_dedicated_disk: false

# path.repo: le uniche directory in cui si potra' registrare un repository di
# snapshot. Se sono share NFS vanno montate PRIMA di lanciare: il ruolo crea la
# directory e la assegna a elasticsearch, ma non monta niente, e su una
# directory locale gli snapshot finirebbero sul disco della macchina.
#
# IN CLUSTER DEVE ESSERE UNA SHARE CONDIVISA fra i tre nodi: un repository di
# snapshot di tipo "fs" pretende che tutti i nodi vedano lo STESSO filesystem
# sotto lo stesso percorso. Con una directory locale per nodo la registrazione
# fallisce con "[repository] location doesn't match" o produce snapshot
# spezzati in tre.
es_repo_dirs:
  - /backups
  - /backups_8
es_create_repo_dirs: true

es_user: "elasticsearch"
es_group_unix: "elasticsearch"
es_service_name: "elasticsearch"

# --- Memoria ----------------------------------------------------------------
# Heap della JVM, scritta in jvm.options.d/heap.options (e non in jvm.options,
# che il pacchetto riscrive a ogni aggiornamento). VUOTA = dimensionamento
# automatico di Elasticsearch (meta' della RAM fino a circa 31 GB), che va bene
# quasi sempre. Valorizzandola (es. "8g") si scrivono -Xms e -Xmx uguali a quel
# valore: mai piu' di meta' della RAM, mai piu' di 31 GB (oltre, la JVM perde i
# puntatori compressi e un heap piu' grande rende di meno).
es_heap_size: ""

# Blocca l'heap in RAM impedendo lo swap. Con true il ruolo aggiunge anche
# LimitMEMLOCK=infinity alla unit: senza, il nodo NON parte.
es_memory_lock: false

# Elasticsearch mappa in memoria gli indici e ne apre molti: 262144 e' il
# minimo che il controllo di avvio pretende in produzione. Il pacchetto deb lo
# imposta gia', questo lo rende esplicito e lo applica subito.
es_max_map_count: 262144

# --- Sicurezza e certificati ------------------------------------------------
# I certificati nascono con elasticsearch-certutil, come nella procedura a
# mano, e restano nel layout che elasticsearch.yml si aspetta:
#   /etc/elasticsearch/cert/ca/ca.crt           CA interna (e ca.key accanto)
#   /etc/elasticsearch/cert/<nodo>/<nodo>.crt   certificato del nodo
#   /etc/elasticsearch/cert/<nodo>/<nodo>.key   chiave privata del nodo
#
# Sul nodo singolo nascono sul nodo. Nel cluster nascono TUTTI sul primo nodo
# del gruppo, che tiene la CA, e ogni altro nodo riceve solo i propri: e' la
# procedura a mano (ca.zip e allcert.zip generati su elasticinfra01 e copiati
# sugli altri), con la differenza che ca.key resta sul primo nodo invece di
# viaggiare dentro ca.zip su tutti.
es_security_enabled: true
es_transport_ssl_enabled: true
es_http_ssl_enabled: true

es_cert_dir: "{{ es_conf_dir }}/cert"
es_ca_dir: "{{ es_cert_dir }}/ca"
es_ca_crt: "{{ es_ca_dir }}/ca.crt"
es_ca_key: "{{ es_ca_dir }}/ca.key"
es_node_cert_dir: "{{ es_cert_dir }}/{{ es_node_name }}"
es_node_crt: "{{ es_node_cert_dir }}/{{ es_node_name }}.crt"
es_node_key: "{{ es_node_cert_dir }}/{{ es_node_name }}.key"

# elasticsearch-certutil produce archivi .zip: questi sono i due file di
# transito, cancellati appena scompattati (ca.zip contiene anche ca.key).
es_ca_zip: "{{ es_cert_dir }}/ca.zip"
es_certs_zip: "{{ es_cert_dir }}/allcert.zip"

# Il file "instances" che elasticsearch-certutil legge per sapere quali nomi e
# quali indirizzi mettere nel SAN. E' lo stesso /root/cert.yml della procedura
# a mano, qui generato dall'inventario.
es_cert_instances_file: "/root/cert.yml"

# Distinguished name della CA interna. CAMBIALO: e' quello che comparira' come
# emittente su ogni certificato di questa infrastruttura.
es_ca_dn: "CN=SINTESI2 PUGLIA PROD"
es_cert_validity_days: 3650
es_cert_key_size: 4096

# Nomi e indirizzi che finiscono nel SAN del certificato del nodo. localhost e
# 127.0.0.1 servono a chi collauda dalla macchina stessa: senza, "curl
# https://localhost:9200" fallisce la verifica del certificato anche quando
# tutto e' a posto. Sono per-nodo: nel cluster ogni istanza di cert.yml li
# prende dal proprio host.
#
# elk-svc E' OBBLIGATORIO, su OGNI nodo: e' il nome con cui i client
# raggiungono Elasticsearch (il servizio, non il singolo nodo), e chi verifica
# il certificato lo confronta con quel nome. Un nodo senza elk-svc nel SAN
# risponde con un certificato "sbagliato" a chiunque lo chiami cosi' — e con
# tre nodi dietro lo stesso nome, un client su tre fallirebbe a caso. Non e'
# un nome per nodo, e' lo stesso su tutti e tre.
#
# Cambiare questa lista a certificati gia' generati non li tocca: servono
# es_force_regenerate_certs=true e la nuova CA nei client.
es_cert_dns_names:
  - "{{ es_node_name }}"
  - "{{ inventory_hostname }}"
  - "elk-svc"
  - "localhost"
es_cert_ip_addresses:
  - "{{ es_node_ip }}"
  - "127.0.0.1"

# CA aziendale invece di quella generata qui: directory SUL CONTROLLER con
# dentro ca.crt, <nodo>.crt e <nodo>.key gia' pronti (i nomi contano). Vuota =
# il ruolo genera tutto da solo. Nel cluster serve un <nodo>.crt/.key per
# ciascun nodo del gruppo.
es_tls_local_dir: ""

# certificate = si verifica che il certificato sia firmato dalla CA, non che
# il nome corrisponda. E' quello che serve fra nodi identificati per IP. Con
# "full" si verifica anche il nome: i certificati generati qui hanno IP e nome
# nel SAN, quindi si puo' alzare senza rigenerarli.
es_transport_ssl_verification_mode: "certificate"

# Rigenera CA e certificati anche se ci sono gia'. DISTRUTTIVO: i client che
# hanno importato la vecchia CA smettono di collegarsi finche' non ricevono la
# nuova. Nel cluster rigenera tutto su tutti i nodi.
es_force_regenerate_certs: false

# --- Utente elastic ---------------------------------------------------------
# CAMBIA QUESTA PASSWORD, e valuta ansible-vault: e' quella del superuser.
#
# Viene scritta nel keystore come bootstrap.password PRIMA del primo avvio, che
# e' l'unico momento in cui Elasticsearch la legge. Su un nodo gia' avviato non
# ha piu' effetto: per riallinearla si rilancia con
#   ansible-playbook playbooks/60-elasticsearch.yml -e es_force_reset_elastic_password=true
# (o il playbook del cluster: la' il reset gira sul primo nodo e vale per tutti,
# le password stanno nell'indice di sicurezza che e' del cluster).
es_elastic_password: "El4S7iCsin7s12026"
es_force_reset_elastic_password: false

# Password dell'utente integrato kibana_system. CAMBIALA.
#
# Non e' la password con cui si entra nella console web — quella e' di elastic,
# perche' l'autenticazione la fa Elasticsearch — ma quella che il processo
# Kibana usa per parlare con Elasticsearch, e che va in kibana.yml sotto
# elasticsearch.username / elasticsearch.password.
#
# Viene impostata a cluster acceso, e solo se non e' gia' quella dichiarata:
# per gli utenti integrati bootstrap.password non vale, vale solo per elastic.
es_kibana_system_password: "kIB4naSinTs12026"
es_manage_kibana_system: true

# Copia delle credenziali sul nodo, nello stesso percorso e nello stesso
# formato della procedura a mano:
#
#   /etc/elasticsearch/cert/elk_credentials.txt, 0600 root:root
#   Password for the [elastic] user successfully reset.
#   New value: ...
#   Password for the [kibana_system] user successfully reset.
#   New value: ...
#
# Differenza rispetto al "elasticsearch-reset-password --auto -b >> file" della
# procedura: le password non sono generate a caso e conoscibili solo da li',
# ma vengono da qui sopra. Il file e' una COPIA — si riscrive a ogni
# esecuzione, cancellarlo non fa perdere l'accesso, modificarlo a mano non
# cambia niente sul cluster. Nel cluster viene scritto sul primo nodo, dove la
# procedura lancia i due reset-password.
es_credentials_file: "{{ es_cert_dir }}/elk_credentials.txt"
es_write_credentials_file: true

# --- Impostazioni varie -----------------------------------------------------
# true (default di Elasticsearch) = "DELETE /*" e gli altri caratteri jolly
# sono rifiutati.
es_action_destructive_requires_name: true

# Il downloader dei database GeoIP chiama geoip.elastic.co ogni pochi minuti:
# su rete chiusa non ci arriva e riempie i log di errori che sembrano guasti.
# Mettilo a true solo se il nodo esce su internet e i processori geoip servono.
es_geoip_downloader_enabled: false

# Righe aggiuntive per elasticsearch.yml che qui non hanno una variabile
# propria:  es_extra_settings: { "indices.query.bool.max_clause_count": 4096 }
es_extra_settings: {}

# --- Avvio, attese, verifica ------------------------------------------------
# Indirizzo con cui il ruolo (e chi collauda a mano) interroga il nodo. https
# solo se la sicurezza e il TLS sull'HTTP sono accesi davvero: cosi' spegnendo
# es_http_ssl_enabled la verifica continua a funzionare invece di fallire
# l'handshake. E' per-nodo: ogni nodo viene interrogato sul proprio indirizzo.
es_url: >-
  {{ 'https' if (es_security_enabled | bool and es_http_ssl_enabled | bool) else 'http' }}://{{ es_node_ip }}:{{ es_http_port }}

es_port_wait_timeout: 300
es_health_retries: 30
es_health_delay: 10

# Stati accettati dalla verifica finale del NODO SINGOLO. Su un nodo solo gli
# indici con repliche restano yellow per costruzione (la replica non ha un
# altro nodo su cui stare), quindi pretendere green significherebbe fallire a
# ogni run. Per il cluster vedi esc_health_accepted.
es_health_accepted:
  - green
  - yellow

# --- Diagnosi ---------------------------------------------------------------
# ansible.cfg ha [diff] always = True: senza questo il diff dei file che
# contengono password finirebbe in chiaro dentro ansible.log. Mettilo a false
# solo per capire perche' un task fallisce.
es_hide_secrets: true


# ---------------------------------------------------------------------------
# CLUSTER A TRE NODI  ->  ruolo elasticsearch_cluster, gruppo [elastic_cluster_servers]
# ---------------------------------------------------------------------------
# Stessa procedura del nodo singolo — stesso pacchetto, stessi percorsi, stessi
# certificati, stesse password, quindi le stesse variabili es_* qui sopra —
# con quello che cambia perche' i nodi sono tre:
#
#   discovery      niente discovery.type: discovery.seed_hosts con i tre
#                  indirizzi, e cluster.initial_master_nodes SOLO al bootstrap
#                  (vedi esc_bootstrap_marker)
#   certificati    CA e certificati di tutti i nodi generati sul PRIMO nodo del
#                  gruppo, con un solo cert.yml che elenca le tre istanze;
#                  ogni nodo riceve poi solo i propri file piu' ca.crt
#   avvio          il primo avvio e' di tutti insieme, perche' il cluster si
#                  forma solo quando i master si vedono; i riavvii successivi
#                  sono UNO ALLA VOLTA, aspettando che il nodo rientri
#   credenziali    reset e file elk_credentials.txt sul primo nodo, una volta:
#                  le password stanno nell'indice di sicurezza, che e' del
#                  cluster, non del nodo
#   verifica       tre nodi visti da _cluster/health, e lo STESSO cluster_uuid
#                  su tutti e tre — e' la prova che sono un cluster e non tre
#                  nodi singoli con lo stesso nome
#
# L'ORDINE DELLE RIGHE NELL'INVENTARIO CONTA: il primo host del gruppo e'
# quello che genera e conserva la CA (ca.key sta solo li'). Riordinarle dopo
# l'installazione non rompe il cluster, ma sposta il "primo nodo" su una
# macchina che la CA non ce l'ha: il prossimo nodo da aggiungere non avrebbe
# chi gli firma il certificato.

# Gruppo del cluster. Distinto da es_group, e un host non puo' stare in
# entrambi: il ruolo si ferma se ne trova uno.
esc_group: "elastic_cluster_servers"

# Numero minimo di nodi, e dev'essere DISPARI: l'elezione del master e' a
# maggioranza, e con un numero pari la perdita di meta' dei nodi ferma il
# cluster invece di lasciarlo in piedi. Tre e' il minimo che sopravvive alla
# perdita di un nodo.
esc_min_nodes: 3

# Il primo host del gruppo: genera la CA, firma i certificati di tutti, e' dove
# girano il reset delle password e il file delle credenziali.
#
# if/else e non default(): default() di Jinja NON e' pigro, valuta sempre il
# ripiego, e con il gruppo vuoto quel [0] farebbe fallire chiunque legga questa
# variabile — anche un playbook che del cluster non sa niente.
esc_first_node: >-
  {{ groups[esc_group][0] if (groups[esc_group] | default([]) | length > 0) else '' }}

# discovery.seed_hosts: gli indirizzi con cui ogni nodo trova gli altri, sulla
# porta di trasporto. Derivati dall'inventario, cosi' non possono divergere da
# quelli su cui i nodi ascoltano davvero.
esc_seed_hosts: >-
  {{ groups[esc_group] | default([])
     | map('extract', hostvars, 'es_node_ip')
     | map('regex_replace', '$', ':' ~ (es_transport_port | string))
     | list }}

# cluster.initial_master_nodes: i node.name dei nodi che hanno "master" fra i
# ruoli. Elencare un nodo che master non e' fa aspettare il bootstrap per
# sempre, quindi il filtro non e' facoltativo.
esc_initial_master_nodes: >-
  {{ groups[esc_group] | default([])
     | map('extract', hostvars)
     | selectattr('es_node_roles', 'contains', 'master')
     | map(attribute='es_node_name')
     | list }}

# cluster.initial_master_nodes SI SCRIVE SOLO AL BOOTSTRAP, e questo file e' il
# modo in cui il ruolo se lo ricorda.
#
# La documentazione Elastic e' esplicita: una volta che il cluster si e'
# formato, quella riga va TOLTA e mai piu' rimessa. Lasciandola, un nodo che un
# giorno perde i dati e riparte potrebbe — se ne trova altri nello stesso
# stato — formare un cluster NUOVO invece di rientrare in quello vecchio.
#
# Il ruolo la scrive quando il nodo non ha ancora un cluster alle spalle, e la
# toglie da elasticsearch.yml appena la verifica finale ha visto tutti i nodi
# insieme (senza riavviare: la riga viene letta solo all'avvio). Questo marker
# dice che quella verifica e' passata. Non e' sufficiente da solo: se la
# directory dati e' vuota — nodo rifatto, disco cambiato — la riga torna, e il
# nodo la usa solo se anche gli altri sono da bootstrappare; altrimenti si
# aggancia al cluster esistente e la ignora.
#
# Per rifare il cluster DA ZERO: fermare i nodi, svuotare es_data_dir su tutti,
# cancellare questo file su tutti, rilanciare.
esc_bootstrap_marker: "{{ es_conf_dir }}/.cluster_bootstrapped"

# Attesa che il cluster si formi dopo il primo avvio: i tre nodi devono
# vedersi e eleggere un master, e ci vuole qualche decina di secondi. 30 x 10s
# e' largo; se scade, il messaggio dice cosa guardare.
esc_form_retries: 30
esc_form_delay: 10

# Stati accettati dalla verifica del CLUSTER. green e' quello atteso: con tre
# nodi ogni replica ha un posto dove stare. yellow e' tollerato perche' un
# indice con piu' repliche di quanti sono i nodi meno uno resta yellow per
# costruzione, e non e' un guasto del cluster; il ruolo lo segnala e dice come
# guardare quali shard. red ferma il playbook.
esc_health_accepted:
  - green
  - yellow


# ===========================================================================
# LOGGING ELASTIC: DAI NAMESPACE DI KUBERNETES AGLI INDICI  ->  ruolo loggingElastic
# ===========================================================================
# Automatizza i due script che oggi si lanciano a mano dal nodo manager:
#
#   namespace-listing.sh   divide i namespace fra infrastrutturali (progetto
#                          "system" di Rancher) e applicativi
#   create-index.sh        per ognuno crea index template, indice -000001 e
#                          alias di scrittura su Elasticsearch
#
#   ansible-playbook -i inventory.ini playbooks/70-logging.yml
#
# DOVE GIRA: sul PRIMO host di logging_group ([new_managers]), perche' e' li'
# che c'e' kubectl con un kubeconfig valido. Solo il primo: creare template e
# indici e' un'operazione sul cluster Elasticsearch, non sul nodo, e ripeterla
# da tre manager vorrebbe dire farla tre volte in parallelo sugli stessi
# oggetti.
#
# NON installa Elasticsearch (quello e' 60- o 61-elasticsearch), NON configura
# il collector: prepara il posto dove il collector scrivera'. Perche' i log ci
# arrivino davvero, il nome dell'indice che il collector compone deve
# coincidere con l'alias creato qui. E' l'unica cosa che questo playbook non
# puo' verificare da solo.
#
# NIENTE defaults/ NEL RUOLO: tutto quello che loggingElastic legge sta qui, e
# una variabile che manca fa fermare il playbook con "undefined variable"
# invece di prendere un valore di ripiego che nessuno ha scelto.

# Gruppo di inventario da cui si parla con Kubernetes e con Elasticsearch. E'
# il nodo manager, lo stesso da cui oggi si lanciano gli script a mano.
# Il playbook prende SOLO il primo host del gruppo.
logging_group: "new_managers"


# --- 1. Elenco dei namespace (quello che faceva namespace-listing.sh) --------

# projectId del progetto "system" di Rancher. OBBLIGATORIO, e non ha un default
# sensato: e' l'unica cosa che distingue i namespace infrastrutturali dagli
# applicativi.
#
# Si legge dalla LABEL di un namespace che sta in quel progetto:
#   kubectl get ns cattle-system \
#     -o jsonpath='{.metadata.labels.field\.cattle\.io/projectId}'
#
# NELLA SCHERMATA "Edit YAML" DI RANCHER SI VEDE ALTRO. Il campo piu' visibile
# e' l'ANNOTAZIONE con lo stesso nome, che vale "<clusterId>:<projectId>"
# (c-m-4kzrlq7x:p-dkknq): qui va SOLO la seconda meta'.
#
# Copiando la stringa intera, lo script a mano non se ne accorge — i ":" non
# sono ammessi nel valore di una label, kubectl fallisce, lui non guarda il
# codice di uscita e prosegue — e il risultato e' infra_namespaces.txt con
# dentro una RIGA VUOTA e TUTTI i namespace fra gli applicativi. Quella riga
# vuota diventa poi un template jolly "<prefisso>-*" a priorita' 500, che si
# mette davanti a tutti gli altri. Il ruolo si ferma prima.
logging_system_project_id: ""

# Label con cui Rancher marca i namespace di un progetto. Si cambia solo se
# cambia Rancher.
logging_project_label: "field.cattle.io/projectId"

# kubectl e kubeconfig sul manager: sono i percorsi che ci lascia kubectl_setup.
logging_kubectl: "/usr/local/bin/kubectl"
logging_kubeconfig: "/root/.kube/config"

# Namespace da NON indicizzare, come espressioni regolari sul nome vero (prima
# che i trattini vengano tolti). Vuoto = nessuna esclusione.
#   logging_ns_exclude: [ '^kube-', '^default$' ]
logging_ns_exclude: []

# --- Dal nome del namespace al nome dell'indice -----------------------------
# true = i trattini vengono tolti: "cattle-system" -> "cattlesystem", indice
# "k8s-coll-infra-cattlesystem". E' quello che fa lo script a mano.
#
# DEVE COINCIDERE CON QUELLO CHE SCRIVE IL COLLECTOR: se il collector tiene i
# trattini, i template creati qui non governano nessun indice.
#
# Ed e' anche la causa della prima delle due "collisioni" che si vedono
# lanciando lo script: "my-app" e "myapp" diventano lo stesso "myapp", quindi
# lo stesso indice, e i log dei due namespace si mescolano. Lo script non lo
# segnala — la seconda PUT sovrascrive la prima e risponde "acknowledged":
# true.
logging_strip_dashes: true

# true = il ruolo si ferma elencando le collisioni. false = tiene il primo in
# ordine alfabetico, come fa lo script.
logging_fail_on_collision: true

# --- I due file sul nodo ----------------------------------------------------
# Gli elenchi dei namespace, negli stessi percorsi dello script a mano. Il ruolo
# non li rilegge (lavora sui dati che ha in memoria): sono l'input dei lanci
# manuali e la prima cosa da guardare quando il risultato non torna.
logging_script_dir: "/root/logging-script"
logging_infra_ns_file: "{{ logging_script_dir }}/infra_namespaces.txt"
logging_app_ns_file: "{{ logging_script_dir }}/app_namespaces.txt"
logging_write_ns_files: true


# --- 2. Elasticsearch -------------------------------------------------------
# I primi quattro parametri di create-index.sh.
#
# ATTENZIONE: sono l'indirizzo del cluster ELASTICSEARCH, non del manager. Se
# usi 61-elasticsearch-cluster.yml, logging_es_host e' uno dei nodi di
# [elastic_cluster_servers] e logging_es_password e' es_elastic_password.
logging_es_scheme: "https"
logging_es_host: ""                      # OBBLIGATORIO, es. "10.109.15.134"
logging_es_port: 9200
logging_es_user: "elastic"
logging_es_password: ""                  # OBBLIGATORIA. Valuta ansible-vault

# Derivata: e' l'indirizzo a cui vanno tutte le chiamate del ruolo.
logging_es_url: "{{ logging_es_scheme }}://{{ logging_es_host }}:{{ logging_es_port }}"

# Secondi di attesa per ogni chiamata HTTP a Elasticsearch. Alzalo se il
# cluster e' lontano o carico: una PUT di template che scade a meta' elenco
# lascia il lavoro incompleto.
logging_es_timeout: 30

# Lo script usa "curl -k": non verifica il certificato. Valorizzando
# logging_es_ca_file con il percorso della CA SUL MANAGER (la
# /etc/elasticsearch/cert/ca/ca.crt del cluster Elasticsearch, copiata qui) la
# verifica si accende da sola.
logging_es_validate_certs: false
logging_es_ca_file: ""


# --- 3. Insiemi di indici (quello che faceva create-index.sh) ---------------
# Un elemento per ogni lancio di create-index.sh. Il primo e' quello della
# guida:
#
#   ./create-index.sh https 10.10.111.24 elastic '<password>' k8s-coll-app \
#       /root/logging-script/app_namespaces.txt 500 1 1 logs
#
# Campi: nome (etichetta leggibile), prefisso (l'indice e'
# <prefisso>-<namespace>), sorgente ("app" o "infra"), priorita (la priorita'
# BASE del template), shards, replicas, lifecycle (la policy si chiama
# <prefisso>-<lifecycle>).
#
# IL SECONDO BLOCCO E' UN'IPOTESI: negli script forniti create-index.sh viene
# lanciato solo sull'elenco applicativo, quindi "k8s-coll-infra" e' il prefisso
# coerente con "k8s-coll-app" ma non e' scritto da nessuna parte. Verificalo
# nella configurazione del collector, oppure togli il blocco.
logging_sets:
  - nome: "applicativi"
    prefisso: "k8s-coll-app"
    sorgente: "app"
    priorita: 500
    shards: 1
    replicas: 1
    lifecycle: "logs"

  - nome: "infrastrutturali"
    prefisso: "k8s-coll-infra"
    sorgente: "infra"
    priorita: 500
    shards: 1
    replicas: 1
    lifecycle: "logs"

# Coda del pattern del template, dopo <prefisso>-<namespace>.
#
# "*"  e' quella dello script, ed e' l'origine della SECONDA collisione: il
#      pattern "k8s-coll-app-foo*" matcha anche "k8s-coll-app-foobar-000001",
#      quindi due namespace di cui uno e' prefisso dell'altro si contendono gli
#      stessi indici. Elasticsearch rifiuta il secondo template
#      ("...that have the same priority..."), lo script scrive il namespace in
#      k8s-coll-app-template-priority-600 e VA RILANCIATO A MANO su quel file.
#
#      Il ruolo non ha bisogno di nessun rilancio: calcola prima quali nomi sono
#      prefisso di quali altri e fa nascere il piu' specifico gia' alla
#      priorita' giusta.
#
# "-*" fa sparire il problema alla radice: "k8s-coll-app-foo-*" non matcha
#      "k8s-coll-app-foobar-000001", e gli indici del rollover si chiamano
#      sempre <alias>-00000N, quindi il trattino c'e'. E' la scelta migliore, ma
#      cambia quali indici il template governa: prima controlla che il collector
#      non crei indici attaccati al prefisso senza trattino.
logging_pattern_suffix: "*"
logging_priority_step: 100


# --- 4. Policy ILM ----------------------------------------------------------
# GLI SCRIPT NON LA CREANO. Il template la nomina
# (index.lifecycle.name: k8s-coll-app-logs) ma se quella policy non esiste
# Elasticsearch accetta il template lo stesso, l'indice viene creato lo stesso,
# e il rollover non avviene MAI: il -000001 cresce finche' non finisce il disco.
# E' l'unico difetto degli script che non da' nessun sintomo il giorno del
# lancio.
#
# Qui la policy si crea se manca. Se c'e' gia' non si tocca, a meno di
# logging_ilm_force_update=true: una policy tarata a mano dopo mesi di esercizio
# non va sovrascritta dal default di un ruolo.
logging_manage_ilm: true
logging_ilm_force_update: false

# Rotazione conservativa: si ruota a 50 GB di shard primario o dopo 30 giorni,
# si cancella 90 giorni DOPO la rotazione (quindi un documento vive fra 90 e 120
# giorni). max_primary_shard_size e' la condizione che conta: tiene gli shard in
# una taglia sana comunque logghi il namespace. max_age serve a quelli che
# loggano poco, altrimenti il loro indice non ruoterebbe mai.
#
# La fase hot DEVE avere l'azione rollover: ogni template scrive
# index.lifecycle.rollover_alias, e senza rollover l'alias di scrittura resta
# agganciato al -000001 per sempre. Il ruolo si ferma se manca.
logging_ilm_phases:
  hot:
    actions:
      rollover:
        max_primary_shard_size: "50gb"
        max_age: "30d"
  delete:
    min_age: "90d"
    actions:
      delete: {}


# --- 5. Script sul nodo -----------------------------------------------------
# Il ruolo fa tutto da solo con l'API e non lancia nessuno script. Deposita
# comunque in logging_script_dir le due versioni CORRETTE degli script a mano,
# piu' un LEGGIMI con i comandi gia' compilati: il lavoro a mano continua a
# servire, e avere accanto lo script giusto e' meglio che averne accanto uno che
# sbaglia in silenzio.
logging_deploy_scripts: true


# --- 6. Verifica ------------------------------------------------------------
# Verifica finale in sola lettura: rilegge template, alias e indici di scrittura
# da Elasticsearch invece di fidarsi delle risposte alle PUT.
logging_verify: true

# NOTA SULLE PASSWORD, che qui non hanno bisogno del no_log che hanno
# elasticsearch_node e kafka_cluster: logging_es_password viaggia solo come
# url_password del modulo uri, che il modulo dichiara no_log da se' — quindi
# resta oscurata anche con -vvv — e nessuno dei file scritti sul nodo la
# contiene (il LEGGIMI ha un segnaposto). L'unico posto dove sta in chiaro e'
# questo file, come es_elastic_password.
