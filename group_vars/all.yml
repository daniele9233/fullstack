---
# Variabili comuni per tutti gli host

# Dominio e credenziali
rancher_domain: "kikko.app.inail-svil.almaviva.it"
rancher_password: "DanielE9233???"

# Versioni software
helm_version: "v3.11.0"
rancher_version: "2.14.2"

# Configurazione disco
vg_name: "vg_rancher"
lv_name: "lv_rancher"
rancher_mount_point: "/var/lib/rancher"
filesystem_type: "xfs"
mount_options: "defaults,noatime"

# Certificati
fullchain_pem_file: "fullchain.pem"
privkey_pem_file: "privkey.pem"
cacerts_pem_file: "cacerts.pem"
remote_cert_path: "/root"

# Cluster configuration (cluster DOWNSTREAM creato via API Rancher)
cluster_name: "iacdevops"
cluster_k8s_version: "v1.33.11+rke2r1"
cluster_cni: "canal"
ansibleSshHost: "localhost"

# ---------------------------------------------------------------------------
# Cluster RKE2 LOCALE (i nodi del gruppo [masters], quelli che ospitano Rancher)
# ---------------------------------------------------------------------------
# Segreto condiviso dai server del cluster locale.
#
# VUOTO (default) = completamente automatico: il primo master bootstrappa e
# genera il proprio token, i master successivi lo leggono da lui in
# /var/lib/rancher/rke2/server/node-token e se lo mettono nel config.yaml.
# Nessun segreto committato nel repository.
#
# VALORIZZATO = token pre-condiviso, scritto uguale sul config.yaml di tutti i
# master prima del primo avvio. Serve solo se il token deve essere noto in
# anticipo (ad esempio per aggiungere nodi da un altro playbook).
# In quel caso generalo con: openssl rand -hex 32
rke2_token: ""

# Porta del supervisor RKE2, quella su cui i server aggiuntivi si registrano.
# NON e' 6443 (API server): usare 6443 qui e' l'errore piu' comune su RKE2.
rke2_supervisor_port: 9345

# Versione RKE2 del cluster locale. Vuoto = ultima disponibile da get.rke2.io.
# Valorizzare (es. "v1.33.11+rke2r1") per fissarla e rendere i run ripetibili.
rke2_version: ""

# CNI del cluster locale. Deve essere identico su tutti i master: se diverge,
# in /etc/cni/net.d convivono conflist di CNI diversi e i pod restano bloccati
# in ContainerCreating. Lista vuota = default RKE2 (canal).
rke2_cni:
  - canal

# Componenti packaged da disabilitare. Con rke2_cni: [calico] va valorizzato
# con [rke2-canal, cilium], come nel cluster di produzione di riferimento.
rke2_disable: []

# SAN aggiuntivi nel certificato dell'API server. Il dominio Rancher e gli IP
# di tutti i master sono gia' inclusi automaticamente dal template: qui vanno
# solo eventuali VIP o FQDN del load balancer davanti ai master.
rke2_extra_tls_san: []

# Permessi di /etc/rancher/rke2/rke2.yaml. Vuoto = default RKE2 (0600).
rke2_write_kubeconfig_mode: ""

# Attesa che ogni master sia entrato nel cluster prima di avviare il successivo.
rke2_ready_retries: 60
rke2_ready_delay: 10

# Margine per la promozione del nodo da learner etcd a membro votante, applicato
# tra un master e il successivo. Alzarlo se l'avvio del terzo master fallisce.
rke2_settle_seconds: 45

# Master node configuration (per kubectl setup sui new_managers)
# Derivato dall'inventario: e' il primo host del gruppo [masters].
master_node_ip: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}"
master_node_user: "root"
# master_node_name usa rancher_domain (evita duplicazioni)

# IP a cui far puntare rancher_domain in /etc/hosts su tutti i nodi.
# Di default il primo master. Con 3 master in HA conviene puntarlo all'IP del
# bilanciatore nginx, altrimenti la caduta del primo master isola tutti gli altri.
# rancher_endpoint_ip: "10.205.166.221"

# Variabili blocco Rancher
nginx_server_name: "kikko.app.inail-svil.almaviva.it"
nginx_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
nginx_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Variabili blocco Multi-Servizi
multi_services_server_names:
  - "kibana.app.inail-svil.almaviva.it"
  - "grafana.app.inail-svil.almaviva.it"
  - "pgadmin.app.inail-svil.almaviva.it"

multi_services_ssl_cert_path: "/etc/nginx/cert/fullchain.pem"
multi_services_ssl_key_path: "/etc/nginx/cert/privkey.pem"

# Upstream servers
# L'upstream verso Rancher non e' piu' una lista fissa: il template nginx lo
# genera dal gruppo [masters] dell'inventario, cosi' passando da 1 a 3 master
# il bilanciatore si aggiorna da solo.
rancher_https_port: 443
nginx_upstream_max_fails: 3
nginx_upstream_fail_timeout: "5s"

# Anche l'upstream verso gli ingress deriva dal gruppo [ingress]. Prima erano
# tre variabili separate (rancher_ingress_https, _1, _2) con un solo server
# ciascuna, e una sola veniva referenziata da proxy_pass: il secondo nodo
# ingress non riceveva traffico.
ingress_https_port: 443

# Configurazione Nginx
nginx_user: "www-data"
nginx_worker_processes: 2
nginx_worker_rlimit_nofile: 40000
nginx_worker_connections: 8192
nginx_client_max_body_size: "2G"
nginx_server_names_hash_bucket_size: 128
nginx_server_names_hash_max_size: 512
nginx_proxy_read_timeout: 900

# I server block stanno in file separati dentro questa directory, inclusa da
# nginx.conf all'interno del blocco http.
nginx_conf_http_dir: "/etc/nginx/conf-http.d"

# La configurazione generata usa solo http{}, quindi il modulo stream non serve
# e non viene caricato. Metterlo a true solo se si aggiunge un blocco stream{},
# e verificando che il modulo esista sul pacchetto nginx installato.
nginx_load_stream_module: false
nginx_stream_module_path: "/usr/lib/nginx/modules/ngx_stream_module.so"

# Path directory certificati
nginx_cert_dir: "/etc/nginx/cert"

# Path locali certificati
local_ssl_cert_path: "files/fullchain.pem"
local_ssl_key_path: "files/privkey.pem"

# ---------------------------------------------------------------------------
# BILANCIATORI (gruppo [nginx_servers]): nginx + haproxy + keepalived
# ---------------------------------------------------------------------------
# Due nodi in HA con due VIP distinti, ciascuno gestito da una propria istanza
# VRRP:
#   - vip_rancher_ip  -> lo tiene nginx, espone la console Rancher e i servizi
#   - vip_patroni_ip  -> lo tiene haproxy, espone Patroni/PgBouncer

# >>> VERIFICA CHE QUESTI DUE INDIRIZZI SIANO LIBERI NELLA TUA VLAN <<<
vip_rancher_ip: "10.205.166.230"
vip_rancher_prefix: 24
vip_patroni_ip: "10.205.166.231"

# Interfaccia su cui keepalived annuncia i VIP. Deve esistere sui bilanciatori:
# verificala con "ip -br addr" prima di lanciare.
keepalived_interface: "ens160"

# I VRID devono essere unici nella VLAN: due cluster keepalived con lo stesso
# VRID sullo stesso dominio di broadcast si disturbano a vicenda.
keepalived_vrid_rancher: 151
keepalived_vrid_patroni: 51

# Nomi delle istanze VRRP, uguali su tutti i bilanciatori.
keepalived_rancher_instance: "VI_1"
keepalived_patroni_instance: "vrrp_1"

# Priorita' del primo bilanciatore dell'inventario; gli altri scalano di step.
# Il primo host di [nginx_servers] e' MASTER, gli altri BACKUP.
keepalived_priority_master: 101
keepalived_priority_step: 1

keepalived_advert_int: 1
keepalived_garp_master_refresh: 5
keepalived_garp_master_refresh_repeat: 1

# Peso che il check di nginx aggiunge alla priorita' quando nginx e' sano.
# Deve superare il divario di priorita' fra i nodi, altrimenti la caduta di
# nginx sul MASTER non basta a spostare il VIP.
keepalived_nginx_check_weight: 50
keepalived_nginx_check_interval: 3

# Porta su cui lo script verifica che nginx sia davvero in ascolto. La 80 e'
# il server di redirect verso https, presente in nginx.conf su ogni nodo.
nginx_health_check_port: 80

# HAProxy: front-end Patroni/PgBouncer
haproxy_stats_port: 7000
haproxy_primary_port: 5000
haproxy_standby_port: 5001
# Porta di PgBouncer sui nodi database.
haproxy_backend_port: 6432
# Porta della REST API di Patroni, usata per gli health check /primary e /replica.
haproxy_patroni_api_port: 8008
haproxy_maxconn_global: 4000
haproxy_maxconn_default: 3000
haproxy_maxconn_server: 100
haproxy_chroot: "/var/lib/haproxy"
haproxy_user: "haproxy"
haproxy_group: "haproxy"

# ---------------------------------------------------------------------------
# STORAGE (gruppo [gluster_servers]): GlusterFS + Ganesha NFS + Pacemaker
# ---------------------------------------------------------------------------

# Radice dei brick. Gluster rifiuta di creare un brick sulla partizione di root
# a meno di passare "force": tenere gluster_brick_force a true se questa
# directory non e' un filesystem dedicato. Meglio comunque montarci sopra un
# volume a parte, come fa create_disk per /var/lib/rancher.
gluster_brick_root: "/bricks"
gluster_brick_force: true

# replica 3 arbiter 1 su tre nodi: due copie dei dati piu' un arbitro che
# tiene solo i metadati ed evita lo split-brain. Con gluster_arbiter_count a 0
# si ottiene una replica 3 piena, che richiede il triplo dello spazio.
gluster_replica_count: 3
gluster_arbiter_count: 1

# Un volume per riga: name e' il nome Gluster, brick la sottodirectory sotto
# gluster_brick_root, pseudo il percorso con cui il client NFS lo monta.
gluster_volumes:
  - name: "INFRA"
    brick: "infra"
    pseudo: "/infra"
  - name: "POSTGRESQL"
    brick: "postgresql"
    pseudo: "/postgresql"
  - name: "ELASTIC"
    brick: "elastic"
    pseudo: "/elastic"

# Ganesha
ganesha_config_path: "/etc/ganesha/ganesha.conf"
ganesha_export_dir: "/etc/ganesha/exports"

# Percorso ESPORTATO, relativo alla radice del volume Gluster: "/" espone il
# volume intero. Da non confondere con il percorso del brick su disco.
ganesha_export_path: "/"

# Protocolli e sicurezza degli export.
ganesha_protocols: "3,4"
ganesha_sectype: "sys"
# Access_Type a livello di export. Con RO gli accessi in scrittura restano
# possibili solo ai CLIENT elencati sotto, che lo sovrascrivono con RW.
ganesha_default_access: "RO"
ganesha_client_access: "RW"
ganesha_client_squash: "no_root_squash"

# Client autorizzati in scrittura. Di default tutti i nodi Kubernetes
# dell'inventario, che sono quelli che montano le share.
ganesha_client_groups:
  - masters
  - new_managers
  - workers
  - ingress
# Indirizzi aggiuntivi, in notazione CIDR (es. "10.200.60.194/32").
ganesha_extra_clients: []

# VIP NFS, gestito da Pacemaker e spostato sul nodo che serve Ganesha.
# >>> VERIFICA CHE SIA LIBERO NELLA TUA VLAN <<<
nfs_vip_ip: "10.205.166.253"
nfs_vip_prefix: 24

# Pacemaker
pcs_cluster_name: "nfs_export"
pcs_cluster_user: "hacluster"
# CAMBIA QUESTA PASSWORD. Serve a pcs per autenticare i nodi fra loro.
pcs_cluster_password: "CambiaMiSubito-hacluster"
# stonith disabilitato come nella procedura di riferimento. In produzione, con
# un meccanismo di fencing disponibile, andrebbe abilitato.
pcs_stonith_enabled: false
pcs_resource_monitor_interval: "10s"

# Prometheus/Monitoring configuration
prometheus_namespace: "monitoring"
grafana_password: "SecureGrafanaPassword123!"  # CAMBIA QUESTA PASSWORD
prometheus_retention: "15d"
prometheus_storage_size: "5Gi"
grafana_storage_size: "3Gi"
alertmanager_storage_size: "2Gi"

# Ingress configuration
prometheus_create_ingress: true
grafana_domain: "grafana.app.iac-svil.almaviva.it"
prometheus_domain: "prometheus.app.iac-svil.almaviva.it"

# Resource configurations (optional overrides)
prometheus_cpu_requests: "1000m"
prometheus_memory_requests: "2Gi"
prometheus_cpu_limits: "2000m"
prometheus_memory_limits: "4Gi"

# Timeout configurations
helm_timeout: "15m"
pod_wait_timeout: "5m"  # Ridotto per evitare blocchi lunghi
