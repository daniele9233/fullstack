[defaults]
# Interprete Python predefinito
interpreter_python = /usr/bin/python3
inventory = ./inventory.ini

# Directory dei ruoli personalizzati
roles_path = ./roles

# File di log per tracciare le operazioni
log_path = ./ansible.log

# Timeout per le connessioni SSH (secondi)
timeout = 30

[inventory]
# Plugin abilitati per inventory dinamico
enable_plugins = yaml, ini, auto


[ssh_connection]
# Numero di tentativi di riconnessione
retries = 3

# StrictHostKeyChecking=accept-new: accetta la chiave di un host MAI VISTO e la
# scrive in known_hosts, ma RIFIUTA se la chiave di un host noto e' cambiata.
#
# Serve perche' questo playbook installa macchine appena create, la cui chiave
# per definizione non e' ancora in known_hosts: senza, ssh proverebbe a chiedere
# conferma all'utente, non essendoci un terminale ripiegherebbe su ssh-askpass, e
# fallirebbe con
#   ssh_askpass: exec(/usr/bin/ssh-askpass): No such file or directory
#   Host key verification failed.
#
# NON e' "StrictHostKeyChecking=no": quello accetta anche una chiave cambiata,
# cioe' proprio il caso che segnala una macchina sostituita o un attacco. Qui la
# protezione che conta resta attiva.
#
# In alternativa, per popolare known_hosts prima di partire:
#   ssh-keyscan -H 172.29.83.71 172.29.83.72 172.29.83.73 >> ~/.ssh/known_hosts
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[diff]
# Mostra sempre le differenze nei cambiamenti
always = True
context = 3
