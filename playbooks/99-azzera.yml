---
# AZZERAMENTO DEI NODI — riporta una macchina allo stato precedente alla prima
# installazione, qualunque ruolo abbia avuto.
#
# Esiste per il laboratorio, dove gli stessi server vengono riusati per
# installazioni diverse: il nodo che ieri era un brick Gluster oggi deve poter
# fare il database, e i residui della vita precedente si scoprono tardi — un
# UUID Gluster che gli altri peer rifiutano, un meta.properties di Kafka che
# lega quel disco a un node.id, una configurazione CNI di un cluster morto che
# blocca ogni pod in ContainerCreating.
#
# TOGLIE: Rancher, RKE2, kubectl, helm, PostgreSQL, Patroni, etcd, GlusterFS,
# Ganesha, Pacemaker, Corosync, nginx, haproxy, keepalived, Kafka. Con
# azzera_dati (default true) svuota anche PGDATA, i brick e i dati di Kafka.
#
# NON TOCCA i dischi: niente umount, niente mkfs, niente fstab. I punti di
# mount restano dove sono, vuoti. In questo repository i dischi si preparano a
# mano, e disfarli non e' compito di un playbook.
#
# SERVONO DUE COSE, INSIEME:
#
#   ansible-playbook playbooks/99-azzera.yml \
#     --limit dbserver01 \
#     -e azzera_conferma=AZZERA
#
# --limit dice su chi, azzera_conferma dice che sai cosa stai facendo. Senza la
# conferma il ruolo si ferma al primo task.
#
# PER AZZERARE TUTTO L'INVENTARIO il filtro e' "all", e va scritto:
#
#   ansible-playbook playbooks/99-azzera.yml --limit all -e azzera_conferma=AZZERA
#
# Non e' la stessa cosa che ometterlo. Omettendolo si ottiene lo stesso
# risultato, ma per distrazione — la riga di comando piu' corta non puo' essere
# quella che tocca piu' macchine. La dashboard non lo accetta nemmeno: nella
# tendina "Limita a" bisogna scegliere, e "tutti i nodi dell'inventario" e' una
# delle scelte.
#
# IL CONTROL NODE E' ESCLUSO DAL PLAY, non solo rifiutato dal ruolo: e' la
# ragione di "hosts: all:!local" qui sotto. Prima il gruppo [local] rientrava in
# "all", e con --limit all il ruolo ci sbatteva contro a meta' elenco: l'assert
# faceva FALLIRE quell'host, e con serial: 1 un batch tutto fallito chiude il
# play ("NO MORE HOSTS LEFT"). Risultato: gli host prima di [local]
# nell'inventario azzerati, quelli dopo intatti, e nessuno che se ne accorgesse
# se non leggendo il riepilogo. L'assert nel ruolo resta come seconda rete, per
# chi lancia da fuori con un pattern che [local] se lo tira dentro.
#
# SE UN NODO NON RISPONDE il play si ferma li': serial: 1 vuol dire un batch per
# host, e un batch tutto fallito chiude il play. Voluto quando si azzera un
# nodo solo, meno comodo con --limit all su un laboratorio dove qualche macchina
# e' spenta. In quel caso si spengono i nodi irraggiungibili dall'inventario,
# oppure si lancia per gruppi.
#
# VARIANTI
#
#   # solo un pezzo, invece di tutto
#   -e azzera_database=true -e azzera_rancher=false -e azzera_storage=false \
#   -e azzera_bilanciatori=false -e azzera_kafka=false
#
#   # lascia i dati sul disco: toglie servizi e configurazioni, non PGDATA
#   -e azzera_dati=false
#
#   # non disinstallare i pacchetti, fermati a servizi e configurazioni
#   -e azzera_pacchetti=false
#
#   # riavvia alla fine, per liberare quello che resta appeso
#   -e azzera_riavvia=true
#
# Prima di rilanciare un'installazione conviene guardare il riepilogo finale:
# dice quali servizi, porte e directory sono sopravvissuti.

- name: Azzera i nodi selezionati
  # all:!local = tutti gli host dell'inventario TRANNE il control node. Vedi
  # sopra: con "all" e basta, --limit all si fermava a meta' elenco.
  hosts: all:!local
  become: yes
  # I fatti servono al modulo apt e al riavvio finale.
  gather_facts: yes
  # Un nodo alla volta: se qualcosa va storto ci si accorge al primo, non dopo
  # aver smontato otto macchine. Con --limit su un gruppo la differenza si
  # sente, ed e' la differenza che serve.
  serial: 1
  order: inventory
  roles:
    - azzera_nodo
