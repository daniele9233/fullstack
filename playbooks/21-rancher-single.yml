---
# RANCHER SU UN NODO SOLO: RKE2 + Traefik + Rancher su una macchina sola.
#
#   ansible-playbook playbooks/21-rancher-single.yml
#
# E' l'ALTERNATIVA a playbooks/20-rancher.yml, non un suo complemento: quello
# mette Rancher su 3 master, questo su una macchina sola. NON vanno lanciati e
# non vanno tenuti insieme: sarebbero due Rancher che si contendono lo stesso
# dominio.
#
# Il CLUSTER DOWNSTREAM invece c'e' in tutti e due, ed e' lo stesso ruolo:
# master1_create_cluster crea il cluster in Rancher e ci aggancia i nodi di
# [new_managers], [workers] e [ingress]. Cambia solo dove gira Rancher.
# Con rsn_crea_cluster_downstream=false si installa il solo Rancher.
#
# Per questo site.yml importa il 20 e non il 21: chi vuole il nodo singolo lo
# lancia da solo.
#
# CHE COSA SERVE PRIMA:
#
#   inventory.ini    un host in [rancher_single], con ansible_host
#   rancher_domain   il nome con cui si aprira' la console
#   rancher_password la password di bootstrap dell'utente admin
#
# E BASTA. In particolare NON serve compilare /etc/hosts sulle macchine: il
# nodo e' uno, la riga e' una, e la scrive il ruolo — sul nodo, dentro ai pod
# che ne hanno bisogno (hostAliases) e sul control node Ansible. Vedi
# roles/rancher_single_node/tasks/nomi.yml.
#
# IL DISCO si prepara e si monta A MANO su /var/lib/rancher, come in tutto il
# resto di questo repository: create_disk esiste ma non lo invoca nessuno.
#
# VARIANTI UTILI
#
#   # senza certificati propri: Rancher si firma da solo (il browser avvisa)
#   ansible-playbook playbooks/21-rancher-single.yml -e rsn_tls_source=rancher
#
#   # canal invece di calico: un chart in meno, e su un nodo solo il CNI non
#   # deve far passare niente fra macchine
#   ansible-playbook playbooks/21-rancher-single.yml -e '{"rsn_cni":[]}'
#
#   # non toccare /etc/hosts del control node (postazione senza sudo)
#   ansible-playbook playbooks/21-rancher-single.yml -e rsn_update_control_node_hosts=false
#
#   # versione RKE2 fissata invece dell'ultima
#   ansible-playbook playbooks/21-rancher-single.yml -e rsn_rke2_version=v1.33.11+rke2r1

- name: Prepara il nodo
  hosts: "{{ rsn_group | default('rancher_single') }}"
  become: yes
  gather_facts: no
  roles:
    - role: host_prep


# gather_facts: yes serve per la distribuzione rilevata e per l'indirizzo di
# ripiego quando ansible_host non e' dichiarato.
- name: RKE2 e Rancher su un nodo solo
  hosts: "{{ rsn_group | default('rancher_single') }}"
  become: yes
  gather_facts: yes
  roles:
    # Tutto: RKE2, kubectl, helm, la risoluzione del nome, Traefik, Rancher.
    #
    # Traefik NON sta qui accanto come secondo ruolo, ed e' voluto: i ruoli di
    # un play girano in blocco, quindi messo qui girerebbe DOPO l'intero
    # rancher_single_node — verifica finale compresa, che chiede all'Ingress di
    # Rancher se risponde. L'Ingress lo serve Traefik. Va invocato nel mezzo, e
    # lo fa il ruolo stesso (tasks/main.yml).
    - role: rancher_single_node

    # L'AGGANCIO DEL CLUSTER DOWNSTREAM: lo STESSO ruolo del percorso a 3 nodi.
    # Crea il cluster in Rancher via API, si fa dare il token di registrazione e
    # ci aggancia i nodi di [new_managers], [workers] e [ingress] con
    # system-agent-install.sh.
    #
    # Questo SI' come secondo ruolo, e non e' in contraddizione con Traefik: qui
    # girare per ultimo e' esattamente quello che serve. Prima di creare un
    # cluster in Rancher, Rancher deve essere in piedi e la console deve
    # rispondere — cioe' tutto rancher_single_node, verifica compresa, deve
    # essere finito.
    #
    # Per la stessa ragione la pausa cieca di assestamento qui vale 0: nel
    # percorso a 3 nodi serve perche' quel ruolo parte subito dopo "helm install
    # rancher", qui la console e' gia' stata interrogata e ha risposto.
    #
    # Con i tre gruppi vuoti il cluster viene creato in Rancher e resta li' ad
    # aspettare nodi: e' il comportamento voluto, ed e' lo stesso dei 3 nodi.
    - role: master1_create_cluster
      when: rsn_crea_cluster_downstream | bool
      vars:
        cluster_pausa_iniziale: 0

  post_tasks:
    - name: Riepilogo
      debug:
        msg:
          - "Console: https://{{ rancher_domain }}  (utente admin, password in rancher_password)"
          - "Nodo Rancher: {{ rsn_node_name }} ({{ rsn_node_ip }}) — uno solo"
          - >-
            Cluster downstream:
            {{ (cluster_name ~ ', ' ~ (nodi_agganciati | string) ~ ' nodi agganciati')
               if rsn_crea_cluster_downstream | bool
               else 'non creato (rsn_crea_cluster_downstream=false)' }}
          - "CNI: {{ rsn_cni | join(', ') | default('canal (default RKE2)', true) }} — Ingress: Traefik, IngressClass {{ rsn_ingress_class }}"
          - "Certificato: {{ 'i .pem forniti (tls-rancher-ingress)' if rsn_tls_source == 'secret' else 'autofirmato da Rancher via cert-manager — il browser avvisera' }}"
          - "kubectl e helm sono sul nodo, con KUBECONFIG gia' nel profilo di root: entra in ssh e usali."
          - >-
            /etc/hosts: la riga "{{ rsn_node_ip }} {{ rancher_domain }}" e' stata scritta
            sul nodo{{ ' e sul control node' if rsn_update_control_node_hosts | bool else '' }}.
            Se apri il browser da un'ALTRA macchina, quella riga serve anche li':
            e' l'unica cosa da fare a mano.
          - "Dentro ai pod il nome lo risolvono gli hostAliases sugli agent: nessun DNS da configurare."
      vars:
        nodi_agganciati: >-
          {{ (groups['new_managers'] | default([]) | length)
             + (groups['workers'] | default([]) | length)
             + (groups['ingress'] | default([]) | length) }}
