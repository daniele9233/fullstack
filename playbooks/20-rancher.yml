---
# RANCHER E CLUSTER DOWNSTREAM.
#
#   ansible-playbook playbooks/20-rancher.yml
#
# QUESTO PLAYBOOK E' LA SEQUENZA DEL site.yml CHE FUNZIONA, quello del Rancher
# gia' in esercizio, adattata all'inventario e alle variabili di questo
# repository. Quello che c'era prima al suo posto — 20-rancher.yml e
# 21-rancher-single.yml — e' stato tolto insieme ai ruoli che serviva:
# calico_config, calico_vxlan_port, traefik_install, rete_pod_verifica,
# rancher_single_node.
#
# DUE CLUSTER, E NON HANNO LA STESSA RETE. Non e' una svista:
#
#   il cluster RANCHER (i [masters])   CNI canal, ingress traefik.
#   il cluster DOWNSTREAM (gli altri)  CNI calico, ingress traefik.
#
# Il CNI non si cambia a caldo, e il cluster Rancher e' installato e funziona:
# portarlo a Calico vorrebbe dire rifare il cluster che ospita la console. Il
# downstream invece nasce adesso, quindi la' Calico si sceglie subito.
#
# QUELLO CHE IL PLAYBOOK NON FA PIU', ed e' il punto:
#
#   - non scarica niente da Internet mentre i cluster si costruiscono. Traefik
#     e' il chart rke2-traefik, IMPACCHETTATO dentro RKE2: non c'e' piu' un
#     download da traefik.github.io che va in timeout ogni volta che qualcosa
#     non va DENTRO al cluster, mandando la diagnosi fuori.
#   - non lascia divergere l'ingress installato e la IngressClass chiesta.
#     rancher_ingress_class e cluster_ingress_class DERIVANO dal controller
#     scelto: prima erano scritte a mano e una volta si sono contraddette, con
#     l'Ingress della console che chiedeva una classe inesistente.
#   - non scrive "ingress-controller" senza sapere se quel RKE2 la conosca.
#     master1_config lo chiede al binario, master1_create_cluster lo deduce
#     dalla versione dichiarata: su un RKE2 che non la conosce, rke2-server
#     rifiuta la configurazione e non parte affatto.
#
# La storia per esteso — cosa si e' rotto, in che ordine, e perche' sembrava
# ogni volta un problema di rete — e' nel README, sezione RANCHER.
#
# IL NUMERO DI MASTER NON C'ENTRAVA. Era stato tolto anche il cluster a piu'
# server, ed era troppo: tre server RKE2 con canal sono una configurazione
# standard. Tre master avevano solo reso VISIBILE il guasto del CNI — con un
# nodo solo il traffico fra pod di nodi diversi non esiste, quindi non poteva
# rompersi.
#
# [masters] PUO' AVERE 1 O 3 HOST, mai 2: etcd ha bisogno di un numero dispari
# per il quorum. Con 3 il primo host bootstrappa e gli altri si uniscono a lui,
# uno alla volta. RANCHER RESTA UNO: il chart si installa solo sul primo master
# e Kubernetes distribuisce le sue repliche sui tre nodi. Tre Rancher separati
# sullo stesso dominio sarebbero un'altra cosa, e sbagliata.
#
# CHE COSA SERVE PRIMA:
#
#   inventory.ini      1 o 3 host in [masters]. Se serve anche il cluster
#                      downstream, i suoi nodi in [new_managers], [workers] e
#                      [ingress]; lasciandoli vuoti si installa il solo Rancher.
#                      In [new_managers] ci vuole ALMENO UN host: e' li' che
#                      gira kubectl_setup, senza il quale il cluster downstream
#                      non si aggancia mai a Rancher
#   rancher_domain     il nome con cui si apre la console
#   rancher_password   la password di bootstrap dell'utente admin
#   i tre .pem         in roles/master1_helm_cert_manager_install/files/
#
# IL DISCO DATI (/var/lib/rancher) si predispone A MANO: il ruolo create_disk
# esiste ancora in roles/ ma non lo invoca nessuno.


# Preparazione dei nodi: firewall, AppArmor, interfacce del CNI sottratte a
# NetworkManager, lock di apt. Non c'e' nel playbook di riferimento, ma non
# tocca ne' la rete dei pod ne' l'ingress: e' la stessa preparazione che usano
# gli altri playbook di questo repository.
- name: Prepara i nodi
  hosts: masters,new_managers,workers,ingress
  become: yes
  gather_facts: no
  roles:
    - role: host_prep


# Risoluzione del dominio Rancher in /etc/hosts.
#
# [local] c'e' perche' master1_create_cluster delega al control node le chiamate
# all'API di Rancher, e deve risolvere il dominio anche lui. I nodi del cluster
# downstream ci sono perche' l'agent di Rancher parla con il server PER NOME, e
# continua a farlo per sempre: senza risoluzione il join fallisce subito con
# "curl: (6) Could not resolve host".
#
# I bilanciatori non ci sono: nginx genera gli upstream per IP, il dominio lo
# usa solo come server_name e non ha bisogno di risolverlo.
- name: Risoluzione del dominio Rancher
  hosts: masters,new_managers,workers,ingress,local
  become: yes
  gather_facts: no
  roles:
    - role: update_hosts_file


# PULIZIA OPZIONALE: azzera lo stato di una precedente installazione di RKE2.
# Deve girare PRIMA del play del master, perche' anche il master va ripulito:
# "helm install rancher" e "kubectl create namespace cattle-system" trovano
# roba gia' fatta se Rancher e' gia' installato.
#
# Disattivata di default perche' distruttiva. Serve quando si riparte da capo su
# macchine gia' usate:
#   ansible-playbook playbooks/20-rancher.yml -e clean_nodes_before_join=true
#
# Per azzerare una macchina davvero a fondo — non solo RKE2 — c'e'
# playbooks/99-azzera.yml.
- name: Azzeramento dello stato RKE2 precedente (opzionale)
  hosts: masters,new_managers,workers,ingress
  become: yes
  gather_facts: no
  roles:
    - role: clean_node_state
      when: clean_nodes_before_join | default(false) | bool


# IL CLUSTER RKE2, UN SERVER ALLA VOLTA.
#
# serial: 1 non e' un'ottimizzazione, e' un requisito: i server etcd vanno
# aggiunti in sequenza, e il primo host deve aver finito il bootstrap prima che
# il secondo provi a unirsi. master1_config contiene la barriera che aspetta che
# il nodo sia davvero ENTRATO nel cluster prima di liberare il successivo.
#
# order: inventory e' il default di Ansible, scritto esplicito perche' qui la
# correttezza ci dipende: il PRIMO host dell'inventario e' quello che
# bootstrappa, e gli altri si registrano sul suo supervisor.
- name: Cluster RKE2 sui master
  hosts: masters
  become: yes
  gather_facts: no
  serial: 1
  order: inventory
  pre_tasks:
    # 1 o 3, mai 2 e mai piu' di 3: etcd decide a maggioranza, e con un numero
    # pari non c'e' maggioranza. Con 2 server la caduta di uno blocca il
    # cluster invece di lasciarlo in piedi — e' PEGGIO di un nodo solo.
    - name: Il numero di master dev'essere dispari
      assert:
        that:
          - groups['masters'] | default([]) | length in [1, 3]
        fail_msg: >-
          [masters] contiene {{ groups['masters'] | default([]) | length }} host
          ({{ groups['masters'] | default([]) | join(', ') }}). I server etcd
          devono essere in numero DISPARI, perche' il quorum e' una
          maggioranza: 1 o 3. Con 2 la caduta di un nodo ferma il cluster
          invece di lasciarlo in piedi, quindi due server sono peggio di uno.
          I nodi in piu' vanno in [new_managers], [workers] o [ingress], dove
          entrano nel cluster downstream.
        quiet: yes
      run_once: true
  roles:
    - role: master1_install
    - role: master1_config
    - role: master1_kubectl


# RANCHER, SOLO SUL PRIMO MASTER.
#
# Helm agisce sul CLUSTER, non sul nodo: "helm install rancher" e "kubectl
# create namespace cattle-system" ripetuti sugli altri due master lavorerebbero
# sullo stesso cluster una seconda e una terza volta. Le repliche di Rancher le
# distribuisce Kubernetes sui nodi disponibili.
#
# Play separato dal precedente anche per un'altra ragione: quello gira con
# serial: 1, e installare Rancher mentre il cluster ha ancora un nodo solo
# significherebbe farlo con due terzi del cluster ancora da venire. Qui i master
# ci sono tutti.
- name: Rancher sul primo master
  hosts: masters[0]
  become: yes
  gather_facts: no
  roles:
    - role: master1_helm_cert_manager_install


# CREAZIONE DEL CLUSTER DOWNSTREAM, solo dal primo master.
#
# Chiamate all'API di Rancher delegate al control node, poi
# system-agent-install.sh sui nodi di [new_managers], [workers] e [ingress].
#
# SI SALTA DA SE' se quei tre gruppi sono vuoti: e' il caso di chi vuole il solo
# Rancher. Prima veniva creato lo stesso un cluster vuoto in Rancher, che poi
# restava cinque minuti ad aspettare macchine che non sarebbero mai arrivate.
# STATO RKE2 RESIDUO SUI NODI DOWNSTREAM: SI GUARDA PRIMA DI AGGANCIARLI.
#
# Costa uno stat per nodo, e chiude un vicolo cieco da quaranta minuti.
#
# Che cosa succede senza. Il nodo si aggancia, Rancher gli installa RKE2, e
# rke2-server muore all'avvio con
#
#   failed to bootstrap cluster data: failed to reconcile with local datastore:
#   bootstrap data already found and encrypted with different token
#
# perche' in /var/lib/rancher/rke2/server/db c'e' ancora l'etcd di
# un'installazione precedente, che il token nuovo non apre. Da qui in poi non
# fallisce piu' niente in modo utile: "Verify nodes are registered" gira trenta
# volte contando zero nodi, poi kubectl_setup ne gira altre sessanta aspettando
# un API server che non arrivera' mai, e l'unica riga che spiega tutto sta nel
# journal di un'ALTRA macchina.
#
# Il residuo non e' un caso raro: e' la norma su una macchina riusata, e
# sopravvive alla cancellazione del cluster in Rancher — quella tocca Rancher,
# non i dischi dei nodi.
#
# NON e' un controllo sui master: quelli il loro stato ce l'hanno di diritto,
# e a questo punto del playbook sono un cluster in esercizio.
- name: Stato RKE2 residuo sui nodi del cluster downstream
  hosts: new_managers,workers,ingress
  become: yes
  gather_facts: no
  tasks:
    # Con la pulizia richiesta non c'e' niente da controllare: il play
    # clean_node_state e' gia' passato su questi stessi nodi poco fa.
    - name: Stato residuo di RKE2 sui nodi downstream
      when: not (clean_nodes_before_join | default(false) | bool)
      block:

        - name: Cerca lo stato di un'installazione RKE2 precedente
          stat:
            path: "{{ item }}"
          register: rke2_residuo
          loop:
            # L'etcd di un server. E' questo che produce l'errore sul token: il
            # datastore c'e', ed e' cifrato con un segreto che non abbiamo piu'.
            - /var/lib/rancher/rke2/server/db
            # L'identita' agent di un Rancher precedente. Il nodo si ripresenta
            # con il vecchio Cattle ID e prende 401 mentre scarica la
            # connection info.
            - /var/lib/rancher/agent

        - name: Elenca quello che si e' trovato
          set_fact:
            rke2_residuo_trovato: >-
              {{ rke2_residuo.results | default([])
                 | selectattr('stat.exists', 'defined')
                 | selectattr('stat.exists') | map(attribute='item') | list }}

        # QUELLO STATO PUO' ESSERE LEGITTIMO, ed e' la differenza che questo
        # controllo deve saper fare: su un cluster downstream GIA' IN PIEDI il
        # datastore etcd esiste di diritto: e' il suo. Un controllo che guarda
        # solo il disco bloccherebbe ogni ri-esecuzione del playbook su un
        # cluster sano — cioe' romperebbe l'idempotenza per prevenire un
        # guasto.
        #
        # A distinguere e' il SERVIZIO: se rke2-server o rke2-agent sono attivi,
        # quello stato appartiene a un'installazione viva e non si tocca. Se non
        # lo e' nessuno dei due, sul disco c'e' il residuo di un'installazione
        # morta, ed e' la trappola.
        #
        # Con retry, perche' "activating" e' lo stato normale di un rke2-server
        # riavviato un istante fa: senza attesa, un nodo sano ricontrollato nel
        # momento sbagliato risulterebbe morto. Un minuto di margine — che e'
        # comunque un quarantesimo di quello che costa scoprirlo dopo.
        - name: Verifica se su questi nodi RKE2 e' vivo
          shell: |
            for u in rke2-server rke2-agent; do
              if [ "$(systemctl is-active "$u" 2>/dev/null)" = "active" ]; then
                echo "$u"; exit 0
              fi
            done
            exit 1
          args:
            executable: /bin/bash
          register: rke2_unit_viva
          until: rke2_unit_viva.rc == 0
          retries: 6
          delay: 10
          changed_when: false
          failed_when: false
          when: rke2_residuo_trovato | length > 0

        - name: Il nodo fa gia' parte di un cluster RKE2 attivo
          debug:
            msg: >-
              {{ inventory_hostname }}: {{ rke2_unit_viva.stdout | trim }} e'
              attivo, quindi lo stato in
              {{ rke2_residuo_trovato | join(' e ') }} e' suo e non si tocca.
              Il playbook prosegue: sui pezzi gia' fatti e' idempotente.
          when:
            - rke2_residuo_trovato | length > 0
            - rke2_unit_viva.rc | default(1) == 0

        - name: Fermati se il nodo porta il residuo di un'installazione morta
          fail:
            msg: |
              {{ inventory_hostname }} ({{ ansible_host }}) porta lo stato di
              un'installazione RKE2 precedente, e nessun RKE2 e' in esecuzione
              qui adesso:

              {% for p in rke2_residuo_trovato %}
                {{ p }}
              {% endfor %}

              Agganciandolo cosi', Rancher gli installa RKE2 e rke2-server muore
              all'avvio — "bootstrap data already found and encrypted with
              different token" per il datastore, 401 sulla connection info per
              l'identita' agent. Il playbook non se ne accorgerebbe subito:
              continuerebbe a contare zero nodi per mezz'ora prima di arrendersi,
              e l'unica riga che lo spiega resterebbe nel journal di quel nodo.

              CANCELLARE IL CLUSTER IN RANCHER NON BASTA: quello cancella
              l'oggetto in Rancher, non i dischi di questa macchina.

              Ripulisci i nodi downstream e poi rilancia:

                ansible-playbook -i inventory.ini playbooks/20-rancher.yml \
                  -e clean_nodes_before_join=true --limit new_managers,workers,ingress
                ansible-playbook -i inventory.ini playbooks/20-rancher.yml

              IL --limit NON E' FACOLTATIVO: clean_node_state gira su [masters]
              piu' i gruppi downstream, quindi senza limite la pulizia
              azzererebbe anche i tre master che ospitano Rancher.
          when:
            - rke2_residuo_trovato | length > 0
            - rke2_unit_viva.rc | default(1) != 0


- name: Cluster downstream
  hosts: masters[0]
  become: yes
  gather_facts: no
  pre_tasks:
    # SENZA MANAGER NON C'E' CLUSTER, e il modo in cui la cosa fallisce non lo
    # dice: i worker si agganciano, Rancher li vede, e il cluster resta per
    # sempre in "Waiting for Cluster control plane to be initialized" perche'
    # non c'e' un nodo etcd/controlplane. In piu' kubectl_setup gira sui
    # [new_managers], quindi senza nessuno li' gli hostAliases non vengono
    # scritti da nessuna parte e l'agent non risolverebbe comunque il dominio.
    - name: Con dei nodi downstream ci vuole almeno un manager
      assert:
        that:
          - (groups['new_managers'] | default([]) | length) > 0
        fail_msg: >-
          [new_managers] e' vuoto, ma in [workers] e [ingress] ci sono
          {{ (groups['workers'] | default([]) | length)
             + (groups['ingress'] | default([]) | length) }} host. Un cluster di
          soli worker non si costruisce: manca il piano di controllo, e le
          macchine resterebbero appese in Rancher a "waiting for cluster agent
          to connect". Metti almeno un host in [new_managers] — meglio uno o
          tre, mai due: anche qui etcd vuole un numero dispari.
        quiet: yes
      run_once: true
      when: >-
        ((groups['workers'] | default([]) | length)
         + (groups['ingress'] | default([]) | length)) > 0
  roles:
    - role: master1_create_cluster
      when: >-
        ((groups['new_managers'] | default([]) | length)
         + (groups['workers'] | default([]) | length)
         + (groups['ingress'] | default([]) | length)) > 0


# IL DNS DELL'AGENT DENTRO AL CLUSTER DOWNSTREAM.
#
# Sono DUE cluster con DUE CoreDNS. Il cattle-cluster-agent del cluster
# downstream risolve i nomi con il CoreDNS di QUEL cluster, che di
# rancher_domain non sa niente: /etc/hosts del nodo non lo copre, un pod non lo
# legge. Senza questo play l'agent resta in CrashLoopBackOff con
#   ERROR: https://<dominio>/ping is not accessible (Could not resolve host)
# e il cluster non esce mai da "waiting for cluster agent to connect".
#
# La cura sono gli hostAliases sul deployment, e li scrive kubectl_setup — che
# prima pero' aspetta: quando questo play parte, su quei nodi e' appena passato
# system-agent-install.sh, il rancher-system-agent si e' registrato ma RKE2 lo
# scarica e lo installa DOPO, e ci mette minuti. Il ruolo aspetta kubectl, il
# kubeconfig e l'API server invece di darli per scontati.
#
# Si puo' rilanciare da solo, se serve rimettere a posto solo questo:
#   ansible-playbook playbooks/20-rancher.yml --limit new_managers
- name: DNS dell'agent nel cluster downstream
  hosts: new_managers
  become: yes
  gather_facts: no
  roles:
    - role: kubectl_setup


- name: Riepilogo
  hosts: masters[0]
  become: no
  gather_facts: no
  tasks:
    - name: Riepilogo
      debug:
        msg:
          - "Console: https://{{ rancher_domain }} (utente admin, password in rancher_password)"
          - >-
            Cluster RKE2: {{ groups['masters'] | length }} server
            ({{ groups['masters'] | join(', ') }}) — un solo Rancher, con le
            repliche distribuite da Kubernetes.
          - >-
            Cluster Rancher: CNI canal (default RKE2) — Ingress
            {{ (rke2_ingress_controller | join(', ') ~ ', IngressClass "' ~ rancher_ingress_class ~ '"')
               if (rke2_ingress_controller | default([]) | length > 0)
               else 'default RKE2 (ingress-nginx)' }}
          - >-
            Cluster downstream:
            {{ (cluster_name ~ ' (' ~ cluster_k8s_version ~ '): CNI ' ~ cluster_cni
                ~ ', Ingress ' ~ (cluster_ingress_controller ~ ' (IngressClass "' ~ cluster_ingress_class ~ '")'
                                  if (cluster_ingress_controller | default('') | length > 0)
                                  else 'default RKE2 (ingress-nginx)')
                ~ ' — ' ~ (nodi_attesi | int | string) ~ ' macchine agganciate fra [new_managers],'
                ~ ' [workers] e [ingress]. Il provisioning prosegue da solo in Rancher.')
               if (nodi_attesi | int) > 0
               else 'non creato — i gruppi [new_managers], [workers] e [ingress] sono vuoti.' }}
          - >-
            {{ 'ATTENZIONE: quella qui sopra e la configurazione CHIESTA. Se il cluster
                ' ~ cluster_name ~ ' esisteva gia, ha tenuto la propria: il confronto fra
                le due lo ha stampato master1_create_cluster, piu su in questo stesso
                playbook.'
               if (nodi_attesi | int) > 0 else '' }}
          - >-
            /etc/hosts: la riga "{{ rancher_endpoint_ip | trim }} {{ rancher_domain }}"
            e' stata scritta sui nodi e sul control node. Se apri la console da
            un'ALTRA macchina, quella riga serve anche li'.
          - >-
            {{ 'Con piu di un master il dominio punta al PRIMO: se cade quello, la
                console non risponde anche se gli altri due sono su. Per una console
                davvero ridondante, rancher_endpoint_ip va portata sul bilanciatore
                nginx ([nginx_servers], playbooks/10-bilanciatori.yml).'
               if (groups['masters'] | length > 1) else
               'Un solo master: il dominio punta a lui.' }}
      vars:
        nodi_attesi: >-
          {{ (groups['new_managers'] | default([]) | length)
             + (groups['workers'] | default([]) | length)
             + (groups['ingress'] | default([]) | length) }}
