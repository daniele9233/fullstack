---
# CLUSTER RANCHER E CLUSTER DOWNSTREAM.
#
# Copre i gruppi [masters], [new_managers], [workers] e [ingress]: installa
# RKE2 sui master, Traefik, Rancher via Helm, e crea il cluster downstream
# agganciandoci manager, worker e nodi ingress.
#
# Eseguibile da solo:
#   ansible-playbook playbooks/20-rancher.yml
#
# E' l'unico dei quattro playbook che usa update_hosts_file: il dominio Rancher
# serve a chi parla con Rancher. I nodi database e Gluster si scrivono
# /etc/hosts da soli, dentro ai rispettivi ruoli.
#
# IL CNI DI ENTRAMBI I CLUSTER E' CANAL. Il perche' per esteso sta in
# group_vars/all.yml (cluster_cni e rke2_cni); in breve: con Calico la console a
# 3 nodi non viene su perche' il traffico fra pod di nodi diversi sparisce senza
# un errore, e ne' la porta VXLAN ne' l'autodetection dell'indirizzo hanno
# spiegato il perche'. Canal e' la configurazione con cui questo ambiente ha
# sempre girato: incapsula sulla 8472, che qui passa, e segue il node-ip che
# scriviamo noi. Se con canal viene su, il guasto non e' della rete: e' di Calico.
#
# Quello che cambia in questo playbook, e cambia da se' leggendo quelle due
# variabili: calico_config non posa piu' niente prima dell'avvio, il play della
# porta VXLAN non gira, e rke2_disable smette di disabilitare rke2-canal — che
# adesso e' il CNI, e disabilitarlo lascerebbe i nodi senza rete. Il resto,
# rete_pod_verifica compreso, e' identico: quella verifica non guarda il CNI, ma
# se un pod raggiunge CoreDNS su un altro nodo.
#
# ATTENZIONE sulle macchine che hanno gia' girato con Calico: il CNI non si
# cambia a caldo. I nodi vanno azzerati, altrimenti in /etc/cni/net.d restano
# due conflist e i pod non partono. master1_config se ne accorge e si ferma
# dicendolo, ma la cura e' partire gia' con:
#   ansible-playbook playbooks/20-rancher.yml -e clean_nodes_before_join=true

- name: Prepara i nodi del cluster Rancher
  hosts: masters,new_managers,workers,ingress
  become: yes
  gather_facts: no
  roles:
    - role: host_prep


# Il disco dati (/var/lib/rancher) si predispone A MANO: il ruolo create_disk
# esiste ancora in roles/ ma non viene invocato. Per riattivarlo, rimettere qui
# questo play prima della risoluzione del dominio:
#
#   - name: Disco dati dei nodi RKE2
#     hosts: masters,new_managers,workers,ingress
#     become: yes
#     gather_facts: yes
#     roles:
#       - role: create_disk


# Risoluzione del dominio Rancher in /etc/hosts.
#
# [local] c'e' perche' master1_create_cluster delega al control node le
# chiamate all'API di Rancher, e deve risolvere il dominio anche lui.
# I bilanciatori non ci sono: nginx genera gli upstream per IP, il dominio lo
# usa solo come server_name e non ha bisogno di risolverlo.
- name: Risoluzione del dominio Rancher
  hosts: masters,new_managers,workers,ingress,local
  become: yes
  gather_facts: no
  roles:
    - role: update_hosts_file


# PULIZIA OPZIONALE: azzera lo stato di una precedente installazione.
# Deve girare PRIMA del play dei master, perche' anche il master va ripulito: su
# rancher01c "helm install rancher" e "kubectl create namespace cattle-system"
# falliscono se Rancher e' gia' installato.
# Disattivata di default perche' distruttiva: su un nodo sano smonta RKE2.
# Abilitare solo quando si riparte da capo su macchine gia' usate:
#   ansible-playbook playbooks/20-rancher.yml -e clean_nodes_before_join=true
- hosts: masters,new_managers,workers
  become: yes
  gather_facts: no
  roles:
    - role: clean_node_state
      when: clean_nodes_before_join | bool


# Cluster RKE2 locale sui master, UN NODO ALLA VOLTA.
# serial: 1 non e' un'ottimizzazione, e' un requisito: i server etcd vanno
# aggiunti in sequenza e il primo host del gruppo deve completare il bootstrap
# prima che il secondo provi a unirsi. master1_config contiene la barriera che
# attende /readyz prima di liberare il nodo successivo.
- hosts: masters
  become: yes
  gather_facts: no
  serial: 1
  # Default di Ansible, reso esplicito perche' qui la correttezza ci dipende:
  # il primo host dell'inventario deve bootstrappare prima che gli altri
  # provino a registrarsi sul suo supervisor.
  order: inventory
  roles:
    - role: master1_install
    # Fra install e config, e non altrove: posa la configurazione di Calico
    # nella directory dei manifest PRIMA che master1_config avvii rke2-server.
    # E' l'unico momento in cui si puo' dire a Calico come annunciarsi — dopo,
    # il chart e' gia' installato e la rete del cluster gia' formata.
    #
    # CON CANAL NON C'E' NIENTE DA POSARE, ed e' il motivo per cui questo ruolo
    # adesso e' condizionato: flannel prende l'indirizzo del nodo dall'InternalIP
    # del Node (il node-ip che master1_config scrive in config.yaml) e la MTU dal
    # chart rke2-canal, che la fissa a 1450. I due valori che a Calico vanno
    # imposti a mano, con canal arrivano gia' giusti.
    #
    # Il "when" guarda rke2_cni: rimettendo "- calico" li', il ruolo torna a
    # girare da solo senza toccare questo file.
    - role: calico_config
      when: "'calico' in (rke2_cni | default([]))"
    - role: master1_config
    - role: master1_kubectl


# PORTA VXLAN DI CALICO, prima di Traefik e per una ragione precisa.
#
# Calico incapsula il traffico fra i pod di nodi diversi in VXLAN sulla porta
# UDP 4789. Canal usa la 8472. Su questa rete e' aperta la 8472 e non la 4789 —
# nessuno l'ha mai chiusa, semplicemente non e' mai servita.
#
# Il guasto che ne segue non somiglia a un problema di rete: Calico si installa,
# i tre master diventano Ready, e il primo a rompersi e' il job che scarica il
# chart di Traefik, con un "i/o timeout" su traefik.github.io. Sembra Internet.
# Invece e' che quel pod e' finito su un nodo e CoreDNS sta su un altro.
#
# CON CANAL QUESTO PLAY NON HA NIENTE DA FARE: il tunnel e' gia' sulla porta che
# questa rete lascia passare, e non c'e' nessuna FelixConfiguration da correggere.
# Il "when" lo spegne finche' rke2_cni non torna a calico.
#
# Va qui perche' Traefik e' il primo a dipendere dalla rete fra i nodi: prima
# non serve a niente, dopo e' troppo tardi.
- name: Porta VXLAN di Calico
  hosts: masters[0]
  become: yes
  gather_facts: no
  roles:
    - role: calico_vxlan_port
      when: "'calico' in (rke2_cni | default([]))"


# LA RETE FRA I NODI PASSA? Si chiede QUI, prima di Traefik.
#
# Traefik e' il primo componente che dipende dal traffico fra pod di nodi
# diversi: il job che scarica il suo chart interroga CoreDNS, che sta su un
# altro nodo. Quando quella rete non passa, il cluster non lo dice — nodi tutti
# Ready, nessun errore — e il guasto salta fuori cinque minuti dopo con un
# messaggio su traefik.github.io che manda la diagnosi verso Internet.
#
# Questo play trasforma quel fallimento in una diagnosi giusta in un minuto. Su
# un cluster a un nodo non ha niente da verificare e si salta da se'.
- name: Verifica della rete fra i nodi
  hosts: masters[0]
  become: yes
  gather_facts: no
  roles:
    - role: rete_pod_verifica


# PLAY INGRESS: Traefik sul cluster locale.
#
# Deve stare fra il play dei master e quello di Rancher, non dentro al primo:
# il play dei master gira con serial: 1, e installare l'ingress mentre il
# cluster ha ancora un nodo solo significa farlo ripartire a ogni master che si
# aggiunge. Qui i tre master ci sono tutti.
#
# E prima di Rancher perche' il chart Rancher crea il proprio Ingress: se la
# IngressClass traefik non esiste ancora, quell'Ingress resta senza nessuno che
# lo serva e la console non risponde.
- name: Ingress Traefik sul cluster locale
  hosts: masters
  become: yes
  gather_facts: no
  roles:
    - role: traefik_install


# Rancher via Helm, SOLO sul primo master.
# Helm agisce sul cluster, non sul nodo: ripetere "helm install rancher" e
# "kubectl create namespace cattle-system" sugli altri due master fallirebbe
# con "already exists". I 3 replica di Rancher li distribuisce Kubernetes.
- hosts: masters[0]
  become: yes
  gather_facts: no
  roles:
    - role: master1_helm_cert_manager_install


# Creazione del cluster downstream, SOLO dal primo master.
# Sono chiamate all'API di Rancher delegate al control node: eseguirle da tutti
# e tre i master creerebbe tre volte lo stesso cluster.
- hosts: masters[0]
  become: yes
  gather_facts: no
  roles:
    - role: master1_create_cluster

# Setup kubectl e fix DNS Cattle-System sui nuovi manager.
# Il ruolo kubectl_setup esegue gia' sia il setup di kubectl sia il patch
# hostAliases su cattle-cluster-agent: eseguirlo due volte riapplicava lo
# stesso patch e faceva scadere una seconda volta il rollout (~10 min persi).
#
# QUI C'ERA UNA PAUSA CIECA DI 180 SECONDI, ed e' stata tolta.
#
# Serviva perche' quando questo play parte i nodi downstream hanno appena
# eseguito system-agent-install.sh: il rancher-system-agent si e' registrato,
# ma RKE2 lo scarica e lo installa DOPO. kubectl_setup copiava
# /var/lib/rancher/rke2/bin/kubectl dandolo per scontato, e quei 180 secondi
# erano la speranza che nel frattempo comparisse. Quando bastavano andava,
# quando non bastavano il playbook moriva sul primo task con
# "Source /var/lib/rancher/rke2/bin/kubectl not found" — e senza quel ruolo il
# patch degli hostAliases non veniva applicato, quindi il cluster downstream
# non si agganciava mai.
#
# Adesso l'attesa sta dentro al ruolo, che aspetta il file finche' arriva
# (ks_attesa_timeout) invece di sperarci: chi ci mette meno non perde 3 minuti,
# chi ci mette di piu' non si rompe.
- hosts: new_managers
  become: yes
  gather_facts: no
  roles:
    - role: kubectl_setup
    # Con cluster_cni: calico il downstream avrebbe lo stesso problema di porta
    # VXLAN del cluster locale, e la stessa cura. Adesso nasce con canal, che
    # incapsula gia' sulla 8472: il ruolo resta condizionato a cluster_cni e
    # torna a girare da solo se si rimette calico.
    #
    # Va comunque PRIMA di traefik_install, quando serve: Traefik e' il primo
    # componente che dipende dalla rete fra i nodi.
    - role: calico_vxlan_port
      when: cluster_cni | default('') == 'calico'
    # Stessa verifica fatta sul cluster locale, qui sul downstream: il CNI non
    # c'entra — si chiede se un pod raggiunge CoreDNS su un ALTRO nodo, che e'
    # quello che serve sapere con canal esattamente come con Calico. Anche qui
    # Traefik e' il primo a dipenderne, e anche qui il guasto sarebbe silenzioso.
    - role: rete_pod_verifica
    # Ingress del cluster downstream. Gira qui e non sui nodi [ingress] perche'
    # il manifest va nella directory dei server RKE2: sono questi i nodi
    # control plane. Dove girano i pod lo decide traefik_node_selector, in
    # group_vars/new_managers.yml.
    - role: traefik_install
