---
# DIAGNOSTICA DELLA RETE FRA I NODI. Non cambia niente: legge e stampa.
#
#   ansible-playbook playbooks/diagnostica-rete.yml
#
# Si lancia quando rete_pod_verifica si ferma dicendo che il traffico fra pod di
# nodi diversi non passa. Raccoglie in un colpo solo quello che serve a capire
# di chi e' la colpa, e che preso una cosa alla volta costa mezz'ora di ssh:
#
#   1. Con quale indirizzo ogni nodo annuncia il proprio tunnel (il "local"), e
#      se coincide con l'InternalIP che il nodo ha in Kubernetes. Se divergono,
#      il tunnel punta dove non risponde nessuno.
#   2. Se le rotte verso i blocchi pod DEGLI ALTRI nodi esistono, se il tunnel ha
#      i vicini programmati e se ha visto passare traffico (TX/RX).
#   3. Le cose che NON dipendono dal CNI e che fanno sparire il traffico lo
#      stesso: le "ip rule" e le tabelle di routing aggiuntive (nm-cloud-setup
#      ne installa una, e sopravvive finche' il nodo non viene riavviato),
#      rp_filter, ip_forward, il firewall del nodo.
#   4. Che cosa sta girando davvero: con Calico l'Installation e gli IPPool, con
#      canal il DaemonSet rke2-canal e la sua net-conf.
#   5. LA PROVA DECISIVA: dal primo master si pinga l'indirizzo di tunnel degli
#      altri. Passa dallo stesso incapsulamento del traffico fra i pod, ma non
#      dipende ne' da kube-proxy ne' da CoreDNS — quindi separa "l'overlay non
#      consegna" da "l'overlay consegna e il guasto e' piu' su".
#
# Se la rete fisica passa e il tunnel no, il passo dopo e' un tcpdump sulla
# porta del tunnel fra due nodi: UDP 8472 con canal, UDP 4789 con Calico.
#
#   nodo che riceve:  tcpdump -ni any udp port 8472
#   nodo che manda:   ping -c5 <indirizzo di tunnel del primo>
#
# Niente in arrivo = i pacchetti non escono dal mittente o la rete li scarta.
#
# SI ADATTA AL CNI IN USO leggendo rke2_cni da group_vars: oggi e' canal, quindi
# guarda flannel.1 e i pod di rke2-canal; rimettendo calico torna a guardare
# vxlan.calico, l'Installation e il namespace calico-system.

- name: Cosa dice ogni nodo di se stesso
  hosts: masters
  become: yes
  gather_facts: no
  vars:
    cni_e_calico: "{{ 'calico' in (rke2_cni | default([]) | join(',')) }}"
    tunnel_iface: "{{ 'vxlan.calico' if cni_e_calico | bool else 'flannel.1' }}"
    tunnel_porta: "{{ 4789 if cni_e_calico | bool else 8472 }}"
  tasks:
    # Serve al play successivo, che da un nodo prova a raggiungere il tunnel
    # degli altri: l'indirizzo si legge qui e viaggia negli hostvars.
    - name: Leggi l'indirizzo del tunnel di questo nodo
      shell: >-
        set -o pipefail;
        ip -4 -o addr show {{ tunnel_iface }} 2>/dev/null
        | awk '{print $4}' | cut -d/ -f1
      args:
        executable: /bin/bash
      register: dr_tunnel
      changed_when: false
      failed_when: false

    - name: Tienilo a disposizione degli altri play
      set_fact:
        dr_tunnel_ip: "{{ dr_tunnel.stdout | default('') | trim }}"

    - name: Interfacce, tunnel e rotte
      shell: |
        echo "hostname            : $(hostname)"
        echo "indirizzi           : $(hostname -I)"
        echo "CNI atteso          : {{ rke2_cni | default([]) | join(', ') | default('canal (default RKE2)', true) }}"
        echo "tunnel atteso       : {{ tunnel_iface }} su UDP {{ tunnel_porta }}"
        echo "--- rke2-server ---"
        systemctl is-active rke2-server 2>&1
        systemctl is-enabled rke2-server 2>&1
        echo "avviato: $(systemctl show rke2-server -p ActiveEnterTimestamp --value 2>/dev/null)"
        echo "--- ultime righe del journal di rke2-server ---"
        journalctl -u rke2-server -n 12 --no-pager -o cat 2>&1 | tail -12
        echo "--- interfacce ---"
        ip -br addr show | grep -v '^lo'
        echo "--- tunnel {{ tunnel_iface }} ---"
        if ip link show {{ tunnel_iface }} >/dev/null 2>&1; then
          ip -d link show {{ tunnel_iface }} | sed -n '2,3p'
          ip -br addr show {{ tunnel_iface }}
        else
          echo "{{ tunnel_iface }} ASSENTE"
        fi
        echo "--- configurazione CNI sul disco ---"
        ls -l /etc/cni/net.d/ 2>&1
        echo "--- rotte verso le reti pod ---"
        ip route | grep -E '10\.42\.' || echo "NESSUNA ROTTA verso 10.42.0.0/16"
        echo "--- chi ascolta sulla porta del tunnel ({{ tunnel_porta }}/udp) ---"
        ss -lunp 2>/dev/null | awk 'NR==1 || $4 ~ /:{{ tunnel_porta }}$/'
        echo "--- il tunnel ha visto passare qualcosa? (TX/RX) ---"
        ip -s link show {{ tunnel_iface }} 2>&1 | tail -5
        echo "--- vicini e FDB del tunnel: gli altri nodi sono programmati? ---"
        bridge fdb show dev {{ tunnel_iface }} 2>&1 | head -10
        ip neigh show dev {{ tunnel_iface }} 2>&1 | head -10

        # DA QUI IN GIU' NON DIPENDE DAL CNI: sono le cose che fanno sparire il
        # traffico fra i nodi qualunque CNI sia installato, cioe' quelle da
        # guardare quando il guasto si presenta identico con Calico e con canal.
        echo
        echo "=== REGOLE DI ROUTING (ip rule): qualcuno devia il traffico? ==="
        ip rule show 2>&1
        echo "--- tabelle di routing OLTRE main e local ---"
        ip route show table all 2>/dev/null \
          | grep ' table ' | grep -v 'table local' | grep -v 'table main' | head -30 \
          || echo "nessuna tabella aggiuntiva"
        echo
        echo "=== nm-cloud-setup: aggiunge tabelle che dirottano il traffico ==="
        echo "service: $(systemctl is-active nm-cloud-setup.service 2>&1) / $(systemctl is-enabled nm-cloud-setup.service 2>&1)"
        echo "timer  : $(systemctl is-active nm-cloud-setup.timer 2>&1) / $(systemctl is-enabled nm-cloud-setup.timer 2>&1)"
        echo "acceso l'ultima volta il: $(uptime -s 2>/dev/null)"
        echo "(host_prep lo disattiva, ma le tabelle gia' installate spariscono"
        echo " solo con un RIAVVIO del nodo: se il boot qui sopra e' precedente"
        echo " alla prima esecuzione del playbook, quelle tabelle sono ancora li')"
        echo
        echo "=== rp_filter: con 1 il kernel scarta il traffico del tunnel ==="
        echo "all     : $(cat /proc/sys/net/ipv4/conf/all/rp_filter 2>/dev/null)"
        echo "default : $(cat /proc/sys/net/ipv4/conf/default/rp_filter 2>/dev/null)"
        echo "{{ tunnel_iface }}: $(cat /proc/sys/net/ipv4/conf/{{ tunnel_iface }}/rp_filter 2>/dev/null)"
        echo "ip_forward: $(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null)"
        echo
        echo "=== FIREWALL SUL NODO ==="
        (ufw status 2>/dev/null || echo "ufw non installato")
        echo "policy FORWARD e prime regole:"
        iptables -S FORWARD 2>&1 | head -6
      args:
        executable: /bin/bash
      register: nodo
      changed_when: false

    - name: Referto del nodo
      debug:
        msg: "{{ nodo.stdout_lines }}"


# IL TUNNEL CONSEGNA DAVVERO? E' la domanda che separa due guasti diversi, e
# non richiede ne' pod ne' kubectl: si pinga l'indirizzo che l'altro nodo ha
# SULL'INTERFACCIA DEL TUNNEL. Quel pacchetto viene incapsulato e attraversa la
# rete fisica esattamente come il traffico fra i pod.
#
#   underlay OK + tunnel OK -> l'overlay consegna. Il guasto e' piu' su:
#                              kube-proxy, CoreDNS, le NetworkPolicy.
#   underlay OK + tunnel KO -> i pacchetti incapsulati non arrivano. O la rete
#                              non lascia passare la porta del tunnel, o una
#                              tabella di routing dell'host li devia (le "ip
#                              rule" del referto qui sopra).
#   underlay KO             -> non e' Kubernetes: i nodi non si parlano proprio.
#
# La MTU non c'entra in nessuno di questi casi: un ping corto e una query DNS
# sono pacchetti piccoli, e una MTU sbagliata fa sparire solo quelli grandi.
- name: Il tunnel consegna davvero?
  hosts: masters[0]
  become: yes
  gather_facts: no
  vars:
    cni_e_calico: "{{ 'calico' in (rke2_cni | default([]) | join(',')) }}"
    tunnel_iface: "{{ 'vxlan.calico' if cni_e_calico | bool else 'flannel.1' }}"
    tunnel_porta: "{{ 4789 if cni_e_calico | bool else 8472 }}"
  tasks:
    - name: Prova la rete fisica e il tunnel verso gli altri master
      shell: |
        echo "da {{ inventory_hostname }} ({{ ansible_host }}), tunnel locale {{ dr_tunnel_ip | default('ASSENTE', true) }}"
        {% for h in groups['masters'] if h != inventory_hostname %}
        echo
        echo "=== verso {{ h }} ==="
        echo "-- rete fisica, {{ hostvars[h].ansible_host }} --"
        ping -c 3 -W 2 {{ hostvars[h].ansible_host }} 2>&1 | tail -2
        {% if hostvars[h].dr_tunnel_ip | default('') | length > 0 %}
        echo "-- dentro il tunnel, {{ hostvars[h].dr_tunnel_ip }} --"
        ping -c 3 -W 2 {{ hostvars[h].dr_tunnel_ip }} 2>&1 | tail -2
        {% else %}
        echo "-- tunnel: su {{ h }} l'interfaccia {{ tunnel_iface }} non c'e', niente da provare --"
        {% endif %}
        {% endfor %}
      args:
        executable: /bin/bash
      register: dr_prova
      changed_when: false
      failed_when: false

    - name: Referto delle prove
      debug:
        msg: "{{ dr_prova.stdout_lines }}"

    - name: Come si legge
      debug:
        msg:
          - "rete fisica OK + tunnel OK -> l'overlay consegna: guarda kube-proxy, CoreDNS, le policy"
          - "rete fisica OK + tunnel KO -> i pacchetti incapsulati non arrivano: UDP {{ tunnel_porta }} fra i nodi, oppure una ip rule dell'host che li devia"
          - "rete fisica KO             -> non e' Kubernetes: i nodi non si raggiungono nemmeno fra loro"


- name: Cosa dice il cluster
  hosts: masters[0]
  become: yes
  gather_facts: no
  vars:
    k: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    cni_e_calico: "{{ 'calico' in (rke2_cni | default([]) | join(',')) }}"
  tasks:
    # 2>&1 OVUNQUE, e nessun "|| echo": la volta scorsa questo blocco e' tornato
    # vuoto su tutto e non si capiva perche' — gli errori di kubectl finivano su
    # stderr, che il debug qui sotto non stampava. Un referto che nasconde il
    # motivo per cui non ha dati e' peggio di nessun referto.
    - name: Nodi, CNI e configurazione effettiva
      shell: |
        echo "=== MANIFEST POSATI SUL DISCO ==="
        ls -l /var/lib/rancher/rke2/server/manifests/ 2>&1
        echo
        echo "=== kubectl RISPONDE? ==="
        {{ k }} version --request-timeout=10s 2>&1 | tail -3
        echo
        echo "=== INTERNAL-IP DI OGNI NODO (quello che il tunnel deve usare) ==="
        {{ k }} get nodes -o wide --request-timeout=15s 2>&1
        echo
        {% if cni_e_calico | bool %}
        echo "=== CONFIGURAZIONE CALICO EFFETTIVA (Installation) ==="
        {{ k }} get installation default -o yaml --request-timeout=15s 2>&1 | sed -n '1,60p'
        echo
        echo "=== IPPool ==="
        {{ k }} get ippools.crd.projectcalico.org -o yaml --request-timeout=15s 2>&1 \
          | grep -E 'cidr:|ipipMode:|vxlanMode:|blockSize:|natOutgoing:|error|Error'
        echo
        echo "=== HelmChartConfig rke2-calico ==="
        {{ k }} -n kube-system get helmchartconfig --request-timeout=15s 2>&1
        echo
        echo "=== POD DI CALICO (calico-system e kube-system) ==="
        {{ k }} -n calico-system get pods -o wide --request-timeout=15s 2>&1
        {{ k }} -n kube-system get pods -o wide --request-timeout=15s 2>&1 | grep -Ei 'NAME|calico|coredns|helm-install'
        {% else %}
        echo "=== CONFIGURAZIONE DI FLANNEL (net-conf.json del ConfigMap di canal) ==="
        {{ k }} -n kube-system get configmap rke2-canal-config -o 'jsonpath={.data.net-conf\.json}' --request-timeout=15s 2>&1
        echo
        echo "=== SUBNET POD ASSEGNATA A OGNI NODO ==="
        {{ k }} get nodes -o custom-columns='NODO:.metadata.name,PODCIDR:.spec.podCIDR,PUBLIC-IP:.metadata.annotations.flannel\.alpha\.coreos\.com/public-ip' --request-timeout=15s 2>&1
        echo
        echo "=== HelmChartConfig (valori aggiunti ai chart packaged) ==="
        {{ k }} -n kube-system get helmchartconfig --request-timeout=15s 2>&1
        echo
        echo "=== POD DI CANAL E COREDNS ==="
        {{ k }} -n kube-system get pods -o wide --request-timeout=15s 2>&1 | grep -Ei 'NAME|canal|coredns|helm-install'
        {% endif %}
        echo
        echo "=== JOB DI INSTALLAZIONE DEI CHART: qualcuno e' fallito? ==="
        {{ k }} -n kube-system get jobs --request-timeout=15s 2>&1
      args:
        executable: /bin/bash
      register: cluster
      changed_when: false
      failed_when: false

    - name: Referto del cluster
      debug:
        msg: "{{ cluster.stdout_lines + (['--- stderr ---'] + cluster.stderr_lines if cluster.stderr_lines | length > 0 else []) }}"
