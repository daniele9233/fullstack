---
# DIAGNOSTICA DELLA RETE FRA I NODI. Non cambia niente: legge e stampa.
#
#   ansible-playbook playbooks/diagnostica-rete.yml
#
# Si lancia quando rete_pod_verifica si ferma dicendo che il traffico fra pod di
# nodi diversi non passa. Raccoglie in un colpo solo le quattro cose che
# servono a capire di chi e' la colpa, e che prese una alla volta costano
# mezz'ora di ssh:
#
#   1. Con quale indirizzo Calico annuncia ogni nodo (il "local" del tunnel), e
#      se coincide con l'InternalIP che il nodo ha in Kubernetes. Se divergono,
#      il tunnel punta dove non risponde nessuno.
#   2. Se le rotte verso i blocchi pod DEGLI ALTRI nodi esistono. Se mancano, il
#      problema e' nella configurazione di Calico e non nella rete fisica.
#   3. Se la configurazione che calico_config posa e' arrivata davvero
#      nell'Installation, o se Calico sta ancora usando i propri default.
#   4. Su che porta e a che MTU sta incapsulando.
#
# Con 1 e 2 a posto ma il traffico che non arriva, la colpa e' della rete fisica
# e il passo dopo e' un tcpdump sulla porta del tunnel fra due nodi.

- name: Cosa dice ogni nodo di se stesso
  hosts: masters
  become: yes
  gather_facts: no
  tasks:
    - name: Interfacce, tunnel e rotte
      shell: |
        echo "hostname            : $(hostname)"
        echo "indirizzi           : $(hostname -I)"
        echo "--- rke2-server ---"
        systemctl is-active rke2-server 2>&1
        systemctl is-enabled rke2-server 2>&1
        echo "avviato: $(systemctl show rke2-server -p ActiveEnterTimestamp --value 2>/dev/null)"
        echo "--- ultime righe del journal di rke2-server ---"
        journalctl -u rke2-server -n 12 --no-pager -o cat 2>&1 | tail -12
        echo "--- interfacce ---"
        ip -br addr show | grep -v '^lo'
        echo "--- tunnel Calico ---"
        if ip link show vxlan.calico >/dev/null 2>&1; then
          ip -d link show vxlan.calico | sed -n '2,3p'
          ip -br addr show vxlan.calico
        else
          echo "vxlan.calico ASSENTE"
        fi
        echo "--- rotte verso le reti pod ---"
        ip route | grep -E '10\.42\.' || echo "NESSUNA ROTTA verso 10.42.0.0/16"
      args:
        executable: /bin/bash
      register: nodo
      changed_when: false

    - name: Referto del nodo
      debug:
        msg: "{{ nodo.stdout_lines }}"


- name: Cosa dice il cluster
  hosts: masters[0]
  become: yes
  gather_facts: no
  vars:
    k: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
  tasks:
    # 2>&1 OVUNQUE, e nessun "|| echo": la volta scorsa questo blocco e' tornato
    # vuoto su tutto e non si capiva perche' — gli errori di kubectl finivano su
    # stderr, che il debug qui sotto non stampava. Un referto che nasconde il
    # motivo per cui non ha dati e' peggio di nessun referto.
    - name: Nodi, Calico e configurazione effettiva
      shell: |
        echo "=== IL FILE DI CALICO E' SUL DISCO? ==="
        ls -l /var/lib/rancher/rke2/server/manifests/ 2>&1
        echo
        echo "=== kubectl RISPONDE? ==="
        {{ k }} version --request-timeout=10s 2>&1 | tail -3
        echo
        echo "=== INTERNAL-IP DI OGNI NODO (quello che Calico dovrebbe usare) ==="
        {{ k }} get nodes -o wide --request-timeout=15s 2>&1
        echo
        echo "=== CONFIGURAZIONE CALICO EFFETTIVA (Installation) ==="
        {{ k }} get installation default -o yaml --request-timeout=15s 2>&1 | sed -n '1,60p'
        echo
        echo "=== IPPool ==="
        {{ k }} get ippools.crd.projectcalico.org -o yaml --request-timeout=15s 2>&1 \
          | grep -E 'cidr:|ipipMode:|vxlanMode:|blockSize:|natOutgoing:|error|Error'
        echo
        echo "=== HelmChartConfig rke2-calico ==="
        {{ k }} -n kube-system get helmchartconfig --request-timeout=15s 2>&1
        echo
        echo "=== POD DI CALICO (calico-system e kube-system) ==="
        {{ k }} -n calico-system get pods -o wide --request-timeout=15s 2>&1
        {{ k }} -n kube-system get pods -o wide --request-timeout=15s 2>&1 | grep -Ei 'NAME|calico|coredns|helm-install'
        echo
        echo "=== JOB DI INSTALLAZIONE DEI CHART: qualcuno e' fallito? ==="
        {{ k }} -n kube-system get jobs --request-timeout=15s 2>&1
      args:
        executable: /bin/bash
      register: cluster
      changed_when: false
      failed_when: false

    - name: Referto del cluster
      debug:
        msg: "{{ cluster.stdout_lines + (['--- stderr ---'] + cluster.stderr_lines if cluster.stderr_lines | length > 0 else []) }}"
