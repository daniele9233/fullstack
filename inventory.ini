# Cluster RKE2 locale che ospita Rancher.
# Il PRIMO host di questo gruppo bootstrappa il cluster, gli altri si uniscono
# a lui: l'ordine conta, non riordinare le righe a cluster gia' creato.
# Il gruppo puo' avere 1 o 3 nodi (mai 2: il quorum etcd richiede un numero
# dispari). Tutto il resto del playbook si adatta da solo al numero di host.
#
# >>> SOSTITUISCI GLI IP DI rancher02c E rancher03c CON QUELLI REALI <<<
# .222 e .223 sono ipotesi basate sulla progressione degli altri host.
[masters]
#rancher01c ansible_host=10.205.166.214 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#rancher02c ansible_host=10.205.166.217 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#rancher03c ansible_host=10.205.166.218 ansible_user=root ansible_python_interpreter=/usr/bin/python3

[new_managers]
k8smanager01c ansible_host=10.205.166.215 ansible_user=root ansible_python_interpreter=/usr/bin/python3

[workers]
k8sworker01c ansible_host=10.205.166.216 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#k8sworker02c ansible_host=10.205.166.217 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#k8sworker03c ansible_host=10.205.166.218 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#k8sworker04c ansible_host=10.109.10.73 ansible_user=root ansible_python_interpreter=/usr/bin/python3

[ingress]
k8sIngres01c ansible_host=10.205.166.219 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#k8sIngres02c ansible_host=10.205.166.220 ansible_user=root ansible_python_interpreter=/usr/bin/python3

[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Bilanciatori: nginx + haproxy + keepalived.
# Il PRIMO host e' MASTER per entrambe le istanze VRRP, gli altri BACKUP con
# priorita' decrescente. Il gruppo si chiama ancora [nginx_servers] per non
# rompere i riferimenti esistenti, ma ospita tutti e tre i servizi.
#
# >>> SOSTITUISCI L'IP DI balancer02c CON QUELLO REALE <<<
[nginx_servers]
balancer01c ansible_host=10.205.166.221 ansible_user=root ansible_python_interpreter=/usr/bin/python3
balancer02c ansible_host=10.205.166.220 ansible_user=root ansible_python_interpreter=/usr/bin/python3

# Storage: GlusterFS replicato + Ganesha NFS in HA con Pacemaker.
# Servono esattamente 3 nodi per "replica 3 arbiter 1": i primi due tengono i
# dati, il TERZO fa da arbitro e conserva solo i metadati. L'ordine conta.
# Il nome di inventario e' anche il nome del peer Gluster e finisce in /etc/hosts.
#
# >>> SOSTITUISCI QUESTI IP CON QUELLI REALI <<<
[gluster_servers]
#glusterfs01 ansible_host=10.205.166.250 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#glusterfs02 ansible_host=10.205.166.251 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#glusterfs03 ansible_host=10.205.166.252 ansible_user=root ansible_python_interpreter=/usr/bin/python3

# Cluster PostgreSQL con Patroni ed etcd, dietro haproxy tramite PgBouncer.
# Servono esattamente 3 nodi: etcd e Patroni hanno bisogno di un numero dispari
# per il quorum. Il PRIMO host bootstrappa il cluster.
# Questi stessi host popolano le sezioni primary e standby di haproxy.cfg.
#
# >>> SOSTITUISCI GLI IP CON QUELLI REALI <<<
[db_servers]
dbserver01 ansible_host=10.205.166.214 ansible_user=root ansible_python_interpreter=/usr/bin/python3
dbserver02 ansible_host=10.205.166.217 ansible_user=root ansible_python_interpreter=/usr/bin/python3
dbserver03 ansible_host=10.205.166.218 ansible_user=root ansible_python_interpreter=/usr/bin/python3

# Cluster Kafka in modalita' KRaft: tre nodi, ognuno broker E controller.
# Servono esattamente 3 nodi (o comunque un numero DISPARI): la maggioranza del
# quorum e' 2, quindi il cluster sopravvive alla perdita di uno solo.
#
# L'ORDINE DELLE RIGHE CONTA e non va cambiato a cluster gia' formattato: il
# primo host e' node.id 1, il secondo 2, il terzo 3, e quel numero finisce
# dentro /opt/kafka/data/meta.properties dove non cambia piu'. Riordinandole,
# il playbook si ferma segnalando la divergenza fra configurazione e disco
# invece di produrre un quorum che non si forma.
#
# ansible_host e' l'indirizzo che finisce in listeners, advertised.listeners e
# controller.quorum.voters: deve essere quello con cui i nodi si raggiungono
# fra loro E quello con cui li raggiungono i client.
#
# Il PRIMO host fa anche da CA: li' nascono ca.key, ca.crt, il truststore e i
# tre keystore, e ca.key non si muove da li'.
#
# >>> QUESTI SONO GLI IP DELLA GUIDA: SOSTITUISCILI CON QUELLI REALI <<<
[kafka_servers]
#pu-kfk-stg-01 ansible_host=172.29.83.74 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#pu-kfk-stg-02 ansible_host=172.29.83.75 ansible_user=root ansible_python_interpreter=/usr/bin/python3
#pu-kfk-stg-03 ansible_host=172.29.83.76 ansible_user=root ansible_python_interpreter=/usr/bin/python3
